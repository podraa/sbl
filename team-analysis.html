function speedKey(name){
  let raw=String(name||'').trim().toLowerCase();

  // Normalize punctuation while preserving the hyphen as a form separator.
  raw=raw
    .replace(/[’']/g,'')
    .replace(/[♀]/g,'-f')
    .replace(/[♂]/g,'-m')
    .replace(/[.:]/g,'')
    .replace(/\s+/g,'-')
    .replace(/-+/g,'-')
    .replace(/^-|-$/g,'');

  const aliases={
    'mr-mime':'mrmime',
    'mr-rime':'mrrime',
    'mime-jr':'mimejr',
    'type-null':'typenull',
    'farfetchd':'farfetchd',
    'sirfetchd':'sirfetchd',
    'nidoran-f':'nidoranf',
    'nidoran-m':'nidoranm',
    'landorus-therian':'landorus',
    'landorus-incarnate':'landorus',
    'tornadus-therian':'tornadus',
    'tornadus-incarnate':'tornadus',
    'thundurus-therian':'thundurus',
    'thundurus-incarnate':'thundurus',
    'enamorus-therian':'enamorus',
    'enamorus-incarnate':'enamorus',
    'keldeo-resolute':'keldeo',
    'keldeo-ordinary':'keldeo',
    'meloetta-pirouette':'meloetta',
    'meloetta-aria':'meloetta',
    'hoopa-unbound':'hoopa',
    'hoopa-confined':'hoopa',
    'lycanroc-midday':'lycanroc',
    'lycanroc-midnight':'lycanroc',
    'lycanroc-dusk':'lycanroc',
    'oricorio-baile':'oricorio',
    'oricorio-pom-pom':'oricorio',
    'oricorio-pau':'oricorio',
    'oricorio-sensu':'oricorio',
    'basculin-red-striped':'basculin',
    'basculin-blue-striped':'basculin',
    'basculin-white-striped':'basculin',
    'darmanitan-standard':'darmanitan',
    'darmanitan-zen':'darmanitan',
    'zygarde-10':'zygarde',
    'zygarde-50':'zygarde',
    'zygarde-complete':'zygarde',
    'necrozma-dusk-mane':'necrozma',
    'necrozma-dawn-wings':'necrozma',
    'necrozma-ultra':'necrozma',
    'calyrex-ice-rider':'calyrex',
    'calyrex-shadow-rider':'calyrex',
    'urshifu-single-strike':'urshifu',
    'urshifu-rapid-strike':'urshifu',
    'indeedee-female':'indeedee',
    'indeedee-male':'indeedee',
    'meowstic-female':'meowstic',
    'meowstic-male':'meowstic'
  };

  if(aliases[raw]) return aliases[raw];
  const compact=raw.replace(/-/g,'');
  if(BASE_SPEED[compact]!==undefined) return compact;

  // First try the complete hyphenated form, then progressively remove
  // form suffixes until a base species remains.
  const parts=raw.split('-');
  for(let i=parts.length;i>=1;i--){
    const candidate=parts.slice(0,i).join('').replace(/[^a-z0-9]/g,'');

}
function baseSpeedForSpecies(species){
  const k=speedKey(species);
  if(BASE_SPEED[k]!==undefined)return BASE_SPEED[k];

  const raw=String(species||'').trim().toLowerCase()
    .replace(/[’']/g,'')
    .replace(/[♀]/g,'-f')
    .replace(/[♂]/g,'-m')
    .replace(/[.:]/g,'')
    .replace(/\s+/g,'-')
    .replace(/-+/g,'-')
    .replace(/^-|-$/g,'');

  // Try compacting the full hyphenated name.
  const compact=raw.replace(/[^a-z0-9]/g,'');
  if(BASE_SPEED[compact]!==undefined)return BASE_SPEED[compact];

  // Try the species portion before a form suffix.
  const parts=raw.split('-');
  for(let i=parts.length-1;i>=1;i--){
    const candidate=parts.slice(0,i).join('').replace(/[^a-z0-9]/g,'');
    if(BASE_SPEED[candidate]!==undefined)return BASE_SPEED[candidate];
  }

  // Final prefix fallback for uncommon form labels.
  for(const base of Object.keys(BASE_SPEED)){
    if(compact.startsWith(base) && base.length>=5)return BASE_SPEED[base];
  }

function showdownDexCandidates(species){

    .replace(/[.:]/g,'')

    'tornadus-incarnate':'tornadus','tornadus-therian':'tornadus-therian','tornadus-t':'tornadus-therian',
    'thundurus-incarnate':'thundurus','thundurus-therian':'thundurus-therian','thundurus-t':'thundurus-therian',
    'enamorus-incarnate':'enamorus','enamorus-therian':'enamorus-therian','enamorus-t':'enamorus-therian',
    'squawkabilly-blue-plumage':'squawkabilly-blue-plumage','squawkabilly-yellow-plumage':'squawkabilly-yellow-plumage',

    'nidoran-f':'nidoran-f','nidoran-m':'nidoran-m','indeedee-f':'indeedee-f','indeedee-m':'indeedee-m',
    'meowstic-f':'meowstic-f','meowstic-m':'meowstic-m'

  const parts=original.split('-'); for(let i=parts.length-1;i>=1;i--) add(parts.slice(0,i).join('-'));

async function loadShowdownDex(){
  if(SHOWDOWN_DEX_PROMISE)return SHOWDOWN_DEX_PROMISE;
  SHOWDOWN_DEX_PROMISE=fetch('https://play.pokemonshowdown.com/data/pokedex.json',{cache:'force-cache'})
    .then(r=>r.ok?r.json():null).catch(()=>null);
  return SHOWDOWN_DEX_PROMISE;
}

async function fetchBaseSpeed(species){
  const cacheKey=String(species||'').trim().toLowerCase();
  if(SPEED_CACHE.has(cacheKey))return SPEED_CACHE.get(cacheKey);

  const embedded=baseSpeedForSpecies(species);
  if(embedded!==null){SPEED_CACHE.set(cacheKey,embedded);return embedded;}

  // Use the same canonical Pokédex data that Showdown itself uses. This is
  // much more complete than maintaining a hand-written speed table.
  const dex=await loadShowdownDex();
  if(dex){
    for(const slug of showdownDexCandidates(species)){
      const d=dex[slug];
      const value=Number(d?.baseStats?.spe);
      if(Number.isFinite(value)){
        SPEED_CACHE.set(cacheKey,value); return value;
      }
    }
  }

  // Final fallback for anything not present in the Showdown data.
  for(const slug of speciesCandidates(species)){
    try{
      const r=await fetch('https://pokeapi.co/api/v2/pokemon/'+encodeURIComponent(slug));
      if(!r.ok)continue;
      const d=await r.json();
      const st=(d.stats||[]).find(x=>x.stat?.name==='speed');
      const value=Number(st?.base_stat);
      if(Number.isFinite(value)){SPEED_CACHE.set(cacheKey,value);return value;}
    }catch(e){}
  }
  SPEED_CACHE.set(cacheKey,null); return null;
}

async function speedTableForTeam(team){
  const a=aggregate(team);
  const list=Object.values(a.mons);
  if(!list.length)return `<section class="panel"><h2>Speed</h2><p class="panel-desc">No Pokémon have been recorded for this franchise.</p></section>`;

  const entries=await Promise.all(list.map(async m=>{
    const base=await fetchBaseSpeed(m.species);
    if(base===null)return {...m,baseSpeed:null,minSpeed:null,maxSpeed:null,scarfSpeed:null,names:[m.species]};
    const min=minSpeedFromBase(base,100);
    const max=maxSpeedFromBase(base,100);
    return {...m,baseSpeed:base,minSpeed:min,maxSpeed:max,scarfSpeed:scarfSpeedFromMax(max),names:[m.species]};
  }));
  const grouped=groupEquivalentVariants(entries);

  const sortMode=$('speedOrderSelect')?.value||'speed-desc';
  const nameOf=x=>displaySpecies(x);
  if(sortMode==='speed-asc') grouped.sort((a,b)=>(a.maxSpeed??Infinity)-(b.maxSpeed??Infinity)||nameOf(a).localeCompare(nameOf(b)));
  else if(sortMode==='name') grouped.sort((a,b)=>nameOf(a).localeCompare(nameOf(b)));
  else grouped.sort((a,b)=>(b.maxSpeed??-Infinity)-(a.maxSpeed??-Infinity)||nameOf(a).localeCompare(nameOf(b)));

  const renderRow=x=>`<tr><td><div class="speed-tab-mon">${sprite(x.names?.[0]||x.species,'sprite-small')}<span>${esc(nameOf(x))}</span></div></td><td class="num">${x.minSpeed===null?'—':x.minSpeed}</td><td class="num">${x.maxSpeed===null?'—':x.maxSpeed}</td><td class="num">${x.scarfSpeed===null?'—':x.scarfSpeed}</td></tr>`;

  return `<section class="panel">
    <div class="speed-header"><div><h2>Speed</h2><p class="panel-desc">Level 100 Speed benchmarks. Min Speed assumes 0 IVs, 0 Speed EVs and a hindering nature. Max Speed assumes 31 IVs, 252 Speed EVs and a beneficial Speed nature. Choice Scarf is 1.5× maximum Speed.</p></div><div class="speed-order"><label for="speedOrderSelect">Order by</label><select id="speedOrderSelect"><option value="speed-desc" ${sortMode==='speed-desc'?'selected':''}>Speed descending</option><option value="speed-asc" ${sortMode==='speed-asc'?'selected':''}>Speed ascending</option><option value="name" ${sortMode==='name'?'selected':''}>Name</option></select></div></div>
    <table class="speed-table"><thead><tr><th>Pokémon</th><th class="num">Min Speed</th><th class="num">Max Speed</th><th class="num">Max Speed with Scarf</th></tr></thead>
    <tbody>${grouped.map(renderRow).join('')}</tbody></table>
  </section>`;
}

function teamNames(){

  return [...new Map([...replayTeams,...rosterTeams].map(t=>[teamKey(t),t])).values()].sort((a,b)=>a.localeCompare(b));

async function franchiseMons(team){
  // Team Comparison must operate on one row per current-roster species.
  // Do not use groupEquivalentVariants here: that function intentionally groups
  // Pokémon with identical speed signatures, which can incorrectly merge two
  // completely different species (and makes matchup rows disappear).
  const source=aggregate(team).mons;
  const merged=new Map();
  for(const m of Object.values(source)){
    const species=canonicalSpecies(m.species);
    const key=norm(species);
    if(!key) continue;
    if(!merged.has(key)){
      merged.set(key,{...m,species,replays:m.replays instanceof Set?new Set(m.replays):new Set(),gameSets:Array.isArray(m.gameSets)?m.gameSets.slice():[]});
    }else{
      const x=merged.get(key);
      x.appearances=(Number(x.appearances)||0)+(Number(m.appearances)||0);
      x.kills=(Number(x.kills)||0)+(Number(m.kills)||0);
      x.deaths=(Number(x.deaths)||0)+(Number(m.deaths)||0);
      x.dealt=(Number(x.dealt)||0)+(Number(m.dealt)||0);
      x.taken=(Number(x.taken)||0)+(Number(m.taken)||0);
      if(m.replays instanceof Set)m.replays.forEach(r=>x.replays.add(r));
      if(Array.isArray(m.gameSets))x.gameSets.push(...m.gameSets);
    }
  }
  const enriched=await Promise.all([...merged.values()].map(async m=>{
    const base=await fetchBaseSpeed(m.species);
    const max=base===null?null:maxSpeedFromBase(base,100);
    return {...m,baseSpeed:base,minSpeed:base===null?null:minSpeedFromBase(base,100),maxSpeed:max,scarfSpeed:max===null?null:scarfSpeedFromMax(max),names:[m.species]};
  }));
  enriched.sort((a,b)=>b.appearances-a.appearances||a.species.localeCompare(b.species));
  return enriched;
}

const TYPE_CACHE=new Map();
async function fetchTypes(species){
  const key=String(species||'').trim().toLowerCase();
  if(TYPE_CACHE.has(key))return TYPE_CACHE.get(key);

  // Prefer Showdown's own canonical Pokédex so unusual names/forms and
  // aliases don't depend on guessing a third-party URL slug.
  const dex=await loadShowdownDex();
  if(dex){
    for(const slug of showdownDexCandidates(species)){
      const types=(dex[slug]?.types||[]).map(String).filter(Boolean);
      if(types.length){TYPE_CACHE.set(key,types);return types;}
    }
  }

  for(const slug of typeSlugCandidates(species)){
    try{
      const r=await fetch('https://pokeapi.co/api/v2/pokemon/'+encodeURIComponent(slug));
      if(!r.ok)continue;
      const d=await r.json();
      const types=(d.types||[]).sort((a,b)=>a.slot-b.slot).map(x=>x.type?.name).filter(Boolean).map(x=>x[0].toUpperCase()+x.slice(1));
      if(types.length){TYPE_CACHE.set(key,types);return types}
    }catch(e){}
  }
  TYPE_CACHE.set(key,[]);return [];
}

function typePills(types){return types.length?`<div class="type-row">${types.map(t=>`<span class="type-pill type-${esc(t)}">${esc(t)}</span>`).join('')}</div>`:'<div class="type-row"><span class="type-pill type-unknown">Type unknown</span></div>'}
function combinedMultiplier(attackingTypes,defendingTypes){if(!attackingTypes.length||!defendingTypes.length)return null;return Math.max(...attackingTypes.map(a=>defendingTypes.reduce((m,d)=>m*typeChartMultiplier(a,d),1)))}
function defensiveMultiplier(attackingType,defendingTypes){if(!defendingTypes.length)return null;return defendingTypes.reduce((m,d)=>m*typeChartMultiplier(attackingType,d),1)}
function matchupLabel(mult){if(mult===null)return ['Unknown','matchup-neutral'];if(mult>=4)return ['Extremely effective','matchup-good'];if(mult>=2)return ['Super effective','matchup-good'];if(mult===0)return ['Immune','matchup-bad'];if(mult<=.25)return ['Highly resisted','matchup-bad'];if(mult<=.5)return ['Resisted','matchup-bad'];return ['Neutral','matchup-neutral']}
function scoutingEffectiveness(mult){if(mult===null)return 'Unknown';if(mult>=4)return 'Extremely effective';if(mult>=2)return 'Super effective';if(mult===0)return 'Immune';if(mult<=.25)return 'Highly resisted';if(mult<=.5)return 'Resisted';return 'Neutral'}
function fmtMult(v){if(v===null)return '?';if(v===0)return '0×';if(v===.25)return '¼×';if(v===.5)return '½×';return Number.isInteger(v)?v+'×':v.toFixed(2)+'×'}
function moveKey(s){return norm(s).replace(/[^a-z0-9]/g,'')}
const ROLE_RULES=[
  ['Hazard setter',['stealthrock','spikes','toxicspikes','stickyweb']],
  ['Hazard remover',['rapidspin','defog','mortalspin']],
  ['Setup sweeper',['swordsdance','nastyplot','dragondance','quiverdance','calmmind','bulkup','agility','shellsmash','shiftgear','autotomize','curse','workup','tailglow','filletaway']],
  ['Speed control',['tailwind','trickroom','electroweb','icywind','stringshot']],
  ['Status spreader',['willowisp','thunderwave','toxic','spore','sleeppowder','stunspore','glare','yawn']],
  ['Pivot',['uturn','voltswitch','flipturn','partingshot','teleport']],
  ['Screens',['reflect','lightscreen','auroraveil']],
  ['Recovery',['recover','roost','slackoff','softboiled','wish','moonlight','morningsun','synthesis','shoreup','rest']],
  ['Physical attacker',['closecombat','earthquake','flareblitz','bravebird','stoneedge','knockoff','crunch','ironhead','playrough','liquidation','drainpunch','machpunch','suckerpunch','bulletpunch']],
  ['Special attacker',['fireblast','flamethrower','hydropump','surf','icebeam','thunderbolt','thunder','shadowball','darkpulse','psychic','psychic','moonblast','energyball','gigadrain','makeitrain','dracometeor','dragonpulse']],
];
function inferRoles(m){const moves=new Set((m.gameSets||[]).flatMap(g=>g.moves||[]).map(moveKey));const roles=[];for(const [role,keys] of ROLE_RULES){if(keys.some(k=>moves.has(k)))roles.push(role)}return roles.length?roles:['Unclassified'];}
function aggregateMoveCounts(mons){const counts={};for(const m of mons)for(const g of m.gameSets||[])for(const move of g.moves||[]){const k=String(move).trim();if(!k)continue;counts[k]=(counts[k]||0)+1}return counts}
function leadFromReplay(r,side){const candidates=[r.leads?.[side],r.lead?.[side],r.firstPokemon?.[side],r.firstSwitch?.[side]];for(const c of candidates){if(typeof c==='string'&&c)return c;if(c?.species)return c.species}return null}
function teamLeads(team){const counts={};for(const r of rowsForTeam(team)){const side=sideForTeam(r,team);const lead=side?leadFromReplay(r,side):null;if(lead)counts[lead]=(counts[lead]||0)+1}return counts}
function weaknessSummary(typesByMon){const out={};for(const t of TYPE_NAMES)out[t]={weak:0,resist:0,immune:0};for(const types of Object.values(typesByMon)){for(const atk of TYPE_NAMES){const m=defensiveMultiplier(atk,types);if(m>=2)out[atk].weak++;else if(m===0)out[atk].immune++;else if(m<=.5)out[atk].resist++}}return out}
function pct(n,d){return d?Math.round(n/d*100):0}

function roleDescription(role){
  return {
    'Hazard setter':'Likely focused on establishing entry hazards and forcing switches.',
    'Hazard remover':'Likely focused on removing hazards while preserving momentum.',
    'Setup sweeper':'Likely focused on boosting and converting a free turn into a sweep.',
    'Speed control':'Likely focused on controlling Speed for the team.',
    'Status spreader':'Likely focused on spreading debilitating status conditions.',
    'Pivot':'Likely focused on gaining momentum through forced switches.',
    'Screens':'Likely focused on team support through screen effects.',
    'Recovery':'Likely built to stay healthy and repeatedly enter the field.',
    'Physical attacker':'Likely uses physical damage as its main offensive route.',
    'Special attacker':'Likely uses special damage as its main offensive route.',
    'Unclassified':'No clear role could be inferred from the recorded moves.'
  }[role]||'Role inferred from the Pokémon’s recorded moves.';
}
function observedMoves(m){return [...new Set((m.gameSets||[]).flatMap(g=>g.moves||[]).map(x=>String(x).trim()).filter(Boolean))]}
function roleMoves(m,role){
  const observed=observedMoves(m);const keys=new Set((ROLE_RULES.find(x=>x[0]===role)?.[1]||[]));
  const primary=observed.filter(x=>keys.has(moveKey(x)));
  const secondary=observed.filter(x=>!primary.includes(x));
  return [...primary,...secondary];
}
function canonicalMoveSet(moves){
  return [...new Set((moves||[]).map(x=>String(x||'').trim().toLowerCase()).filter(Boolean))].sort().join('|');
}
function observedSetKeys(m){
  return new Set((m.gameSets||[]).map(g=>canonicalMoveSet(g.moves||[])).filter(Boolean));
}
function suggestedSetsForMon(m){
  const roles=inferRoles(m);const observed=observedMoves(m);const existing=observedSetKeys(m);
  return roles.map(role=>{
    const candidates=roleMoves(m,role);
    const moves=candidates.slice(0,4);
    return {role,moves,observedCount:observed.length};
  }).filter(s=>{
    const key=canonicalMoveSet(s.moves);
    return !key || !existing.has(key);
  });
}
function setSuggestionsMarkup(m){
  const sets=suggestedSetsForMon(m);

async function comparisonTypes(species){
  // Type data is supplementary to the comparison. A slow/unavailable PokéAPI
  // request must never prevent the comparison UI from rendering.
  try{
    return await Promise.race([
      fetchTypes(species),
      new Promise(resolve=>setTimeout(()=>resolve([]),2500))
    ]);
  }catch(e){
    console.warn('Type lookup failed for',species,e);
    return [];
  }
}

  const setMon=opp.find(m=>m.species===setDefault)||opp[0];
  const renderSetDetail=(species)=>{const m=opp.find(x=>x.species===species)||opp[0];if(!m)return '<div class="empty">No Pokémon selected.</div>';return `<div class="set-detail-head">${sprite(m.species)}<div><h3 style="margin:0">${esc(displaySpecies(m))}</h3>${typePills(oppTypes[m.species]||[])}<div class="small">${m.replays.size} recorded replay${m.replays.size===1?'':'s'} · ${observedMoves(m).length} unique observed moves · ${inferRoles(m).length} inferred role${inferRoles(m).length===1?'':'s'}</div></div></div>${setSuggestionsMarkup(m)}`};
  const setSection=`<section class="panel"><h2>Likely Sets</h2><p class="panel-desc">Select an opposing Pokémon to see role-based set concepts inferred from its observed moves. If a Pokémon has multiple observed roles, each role gets its own separate set concept.</p><div class="set-layout"><div class="set-selector"><label>Opponent Pokémon</label><select id="setPokemonSelect">${opp.map(m=>`<option value="${esc(displaySpecies(m))}" ${m.species===setMon?.species?'selected':''}>${esc(displaySpecies(m))}</option>`).join('')}</select><div class="set-mon-list">${opp.map(m=>`<button type="button" class="set-mon-option ${m.species===setMon?.species?'active':''}" data-set-mon="${esc(displaySpecies(m))}">${sprite(m.species)}<span><strong>${esc(displaySpecies(m))}</strong><br>${typePills(oppTypes[m.species]||[])}</span></button>`).join('')}</div></div><div class="set-detail" id="setDetail">${renderSetDetail(setDefault)}</div></div></section>`;

  return controls+offense+speedSection+setSection;
}

async function render(){
  const sel=$('teamSelect');const team=sel.value;
  if(!team){$('main').innerHTML='<div class="panel"><div class="empty">No franchise data available.</div></div>';return}
  if($('viewSelect') && $('viewSelect').value==='speed'){
    $('main').innerHTML='<div class="panel"><div class="empty">Loading Speed Tiers…</div></div>';
    $('main').innerHTML=await speedTableForTeam(team);
    const speedOrder=$('speedOrderSelect');
    if(speedOrder) speedOrder.addEventListener('change',()=>render());
    return;
  }
  if($('viewSelect') && $('viewSelect').value==='comparison'){
    // When opening Team Comparison, default Your Team to the logged-in user's
    // franchise. Once the user changes it, keep that selection until they leave
    // the comparison view; it remains a normal, changeable selector.
    if(!STATE.compareYourTeam || !teamNames().some(n=>sameTeam(n,STATE.compareYourTeam))){
      STATE.compareYourTeam=STATE.profileTeam||team;
    }
    const yourTeam=STATE.compareYourTeam;
    let selectedOpponent=STATE.compareOpponent||team;
    if(!selectedOpponent || sameTeam(selectedOpponent,yourTeam)){
      selectedOpponent=teamNames().find(n=>!sameTeam(n,yourTeam))||'';
    }
    STATE.compareOpponent=selectedOpponent;
    $('main').innerHTML='<div class="panel"><div class="empty">Loading Team Comparison…</div></div>';
    try{
      $('main').innerHTML=await renderComparison(yourTeam,selectedOpponent);
    }catch(e){
      console.error('Team Comparison render failed:',e);
      $('main').innerHTML=`<section class="panel"><div class="empty">Team Comparison could not load: ${esc(e.message||e)}</div></section>`;
    }
    $('compareYourTeam')?.addEventListener('change',async(e)=>{
      const nextTeam=e.target.value;
      STATE.compareYourTeam=nextTeam;
      STATE.comparePokemon='';
      STATE.setPokemon='';
      // Your Team is independent of the page-level Franchise selector.
      // If the newly selected team is also the opponent, move the opponent to
      // the first other franchise so the comparison can never compare a team
      // against itself.
      if(sameTeam(STATE.compareOpponent,nextTeam)){
        STATE.compareOpponent=teamNames().find(n=>!sameTeam(n,nextTeam))||'';
        if(STATE.compareOpponent && $('teamSelect'))$('teamSelect').value=STATE.compareOpponent;
      }
      await render();
    });
    $('compareOpponent')?.addEventListener('change',async(e)=>{
      STATE.compareOpponent=e.target.value;
      STATE.comparePokemon='';
      STATE.setPokemon='';
      // Keep the page-level Franchise selector synchronized with the opponent.
      if($('teamSelect'))$('teamSelect').value=e.target.value;
      const u=new URL(location.href);
      u.searchParams.set('team',e.target.value);
      history.replaceState(null,'',u);
      await render();
    });
    $('offensePokemon')?.addEventListener('change',async(e)=>{
      const species=e.target.value;
      STATE.comparePokemon=species;
      const selected=e.target.options[e.target.selectedIndex];
      const label=$('offenseSelectedName');
      const selectedSprite=$('offenseSelectedSprite');
      const targetTeam=STATE.profileTeam||$('teamSelect').value;
      const opponentTeam=STATE.compareOpponent||$('teamSelect').value;
      const [y,oppMons]=await Promise.all([franchiseMons(targetTeam),franchiseMons(opponentTeam)]);
      const target=y.find(m=>m.species===species)||y[0];
      const results=$('offenseResults');
      if(!target||!results)return;
      if(selectedSprite){
        selectedSprite.src=`https://play.pokemonshowdown.com/sprites/gen5/${spriteId(target.species)}.png`;
        selectedSprite.alt=target.species;
        selectedSprite.style.opacity='1';
        selectedSprite.onerror=function(){this.onerror=null;this.style.opacity='.2'};
      }
      if(label) label.textContent=displaySpecies(target);
      const selectedTypes=await fetchTypes(target.species);
      const selectedTypeMount=$('offenseSelectedTypes');
      if(selectedTypeMount) selectedTypeMount.innerHTML=typePills(selectedTypes);
      results.innerHTML='<div class="empty">Loading matchup data…</div>';
      const typePairs=await Promise.all([...y,...oppMons].map(async m=>[m.species,await fetchTypes(m.species)]));
      const typeMap=Object.fromEntries(typePairs);
      results.innerHTML=oppMons.map(o=>{
        const mult=combinedMultiplier(typeMap[target.species]||[],typeMap[o.species]||[]);
        const [tl,tc]=matchupLabel(mult);
        const baseY=baseSpeedForSpecies(target.species);
        const baseO=baseSpeedForSpecies(o.species);
        const ymax=baseY==null?null:maxSpeedFromBase(baseY,100);
        const omax=baseO==null?null:maxSpeedFromBase(baseO,100);
        const [sl,sc]=speedText(ymax,omax);
        return `<article class="opponent-card"><div class="top"><div class="mon-inline">${sprite(o.species,'sprite-small')}<div><div class="name">${esc(o.species)}</div>${typePills(typeMap[o.species]||[])}</div></div><span class="speed-badge ${sc}">${sl}</span></div><div class="matchup-result"><div><div class="mult">${scoutingEffectiveness(mult)}</div><div class="small">type matchup</div></div><div class="label">${tl}<br><span class="small">${ymax!=null&&omax!=null?'Speed tier comparison':'Speed tier unavailable'}</span></div></div></article>`;
      }).join('');
    });
$('setPokemonSelect')?.addEventListener('change',async(e)=>{
      STATE.setPokemon=e.target.value;
      await render();
    });
    document.querySelectorAll('[data-set-mon]').forEach(btn=>btn.addEventListener('click',async()=>{
      STATE.setPokemon=btn.dataset.setMon||'';
      await render();
    }));
    return;
  }
  const a=aggregate(team);
  const list=Object.values(a.mons).sort((x,y)=>y.appearances-x.appearances||y.kills-x.kills);
  const pairs=Object.entries(a.pairCounts).sort((x,y)=>y[1]-x[1]).slice(0,8);
  $('main').innerHTML=`<section class="panel"><h2>${esc(team)}</h2><p class="panel-desc">This is the scouting workspace for <strong>${esc(team)}</strong>. It uses the same shared replay data as the dashboard, but keeps opponent-prep analysis separate from league statistics.</p><div class="grid overview"><div class="statbox"><div class="k">Games analyzed</div><div class="v">${a.games.length}</div></div><div class="statbox"><div class="k">Record</div><div class="v">${a.wins}-${a.losses}</div></div><div class="statbox"><div class="k">Unique Pokémon</div><div class="v">${list.length}</div></div><div class="statbox"><div class="k">Pokémon appearances</div><div class="v">${list.reduce((n,m)=>n+m.appearances,0)}</div></div></div></section>
  <section class="panel"><h2>Pokémon scouting</h2><p class="panel-desc">Select a Pokémon to inspect the exact moves it brought in each individual replay, along with performance.</p><div class="grid pokemon-grid">${list.map(m=>`<div class="mon-card" data-mon="${esc(norm(m.species))}"><div class="mon-head">${sprite(m.species)}<div><div class="mon-name">${esc(displaySpecies(m))}</div><div class="muted">${m.replays.size} replay${m.replays.size===1?'':'s'} · ${m.appearances} appearances</div></div></div><div class="chips"><span class="chip"><b>${m.kills}</b> K</span><span class="chip"><b>${m.deaths}</b> D</span><span class="chip"><b>${m.dealt.toFixed(0)}</b> dmg</span><span class="chip"><b>${m.gameSets.filter(g=>g.moves.length).length}</b> sets recorded</span></div></div>`).join('')}</div></section>
  <section class="panel"><h2>Common Pokémon pairs</h2><p class="panel-desc">Pairs are counted when both Pokémon appeared for the selected franchise in the same replay.</p>${pairs.length?`<table><thead><tr><th>Pair</th><th class="num">Games</th></tr></thead><tbody>${pairs.map(([key,n])=>{const [x,y]=key.split('|');const names=list.filter(m=>norm(m.species)===x||norm(m.species)===y).map(m=>m.species);return `<tr><td>${names.join(' + ')||key.replace('|',' + ')}</td><td class="num">${n}</td></tr>`}).join('')}</tbody></table>`:'<div class="empty">Not enough roster data.</div>'}</section>
  <div id="detail"></div>`;
  document.querySelectorAll('.mon-card').forEach(c=>c.addEventListener('click',()=>openMon(team,c.dataset.mon)));
}
function openMon(team,key){
  const a=aggregate(team);const m=a.mons[key];if(!m)return;const detail=$('detail');
  const sets=m.gameSets.slice();
  detail.innerHTML=`<section class="panel detail open"><div class="detail-head"><div class="detail-title">${sprite(m.species)}<div><h2>${esc(displaySpecies(m))}</h2><div class="muted">${m.replays.size} replays · ${m.appearances} appearances · ${m.kills} K · ${m.deaths} D</div></div></div><button id="closeDetail">Close</button></div><div style="height:18px"></div>
  <section class="panel" style="padding:16px;margin:0 0 14px"><h2 style="font-size:17px">Sets</h2><p class="panel-desc">The individual move sets captured for <strong>${esc(displaySpecies(m))}</strong>. Each set represents one recorded instance of the Pokémon.</p>${sets.length?`<div class="set-list">${sets.map((g,i)=>`<div class="set-card"><div class="muted">Set ${i+1}</div><div class="chips">${g.moves.length?g.moves.map(x=>`<span class="chip">${esc(x)}</span>`).join(''):'<span class="small">No move lines captured</span>'}</div></div>`).join('')}</div>`:'<div class="empty">No sets are available.</div>'}</section>
  <section class="panel" style="padding:16px;margin:0"><div class="section-title">Performance</div><table><tbody><tr><td>Appearances</td><td class="num">${m.appearances}</td></tr><tr><td>Kills</td><td class="num">${m.kills}</td></tr><tr><td>Deaths</td><td class="num">${m.deaths}</td></tr><tr><td>Damage dealt</td><td class="num">${m.dealt.toFixed(0)}</td></tr><tr><td>Damage taken</td><td class="num">${m.taken.toFixed(0)}</td></tr></tbody></table></section></section>`;
  detail.scrollIntoView({behavior:'smooth',block:'start'});
  $('closeDetail').addEventListener('click',()=>{detail.innerHTML='';window.scrollTo({top:0,behavior:'smooth'})});
}
async function load(){
  try{
    const {data:authData}=await supabase.auth.getUser();
    const user=authData?.user||null;
    if(user){
      const {data:profile}=await supabase.from('profiles').select('team_name').eq('id',user.id).maybeSingle();
      STATE.profileTeam=profile?.team_name||'';
    }
    const {data,error}=await supabase.from('replays').select('replay_id,replay_data');
    if(error)throw error;
    for(const row of data||[]){
      if(row.replay_id===STATE_ID){
        const shared=row.replay_data||{};
        const snap=installSeasonPicker(shared);
        STATE.teamMap=snap.teamMap;
        STATE.settings=Object.assign(STATE.settings,snap.settings||{});
        STATE.settings.rosters=STATE.settings.rosters||{};
        const seasonReplays=snap.archived ? snap.replays : shared.replays;
        if(seasonReplays && typeof seasonReplays==='object'){
          for(const [id,replay] of Object.entries(seasonReplays)) if(id && replay) STATE.replays[id]=replay;
        }
      }else if(row.replay_id==='__rosters__'){
        const published=row.replay_data?.rosters;
        if(published && typeof published==='object' && Object.keys(STATE.settings.rosters||{}).length===0){
          STATE.settings.rosters=published;
        }
      }else if(row.replay_id){
        STATE.replays[row.replay_id]=row.replay_data||{};
      }
    }
  }catch(e){
    $('main').innerHTML=`<div class="panel"><div class="empty">Could not load shared replay data: ${esc(e.message)}</div></div>`;
    return;
  }

  const replayTeams=allRows()
    .flatMap(r=>[teamFor(r.players?.p1),teamFor(r.players?.p2)])
    .filter(Boolean);
  const rosterTeams=Object.keys(STATE.settings?.rosters||{});
  const teams=[...new Set([...replayTeams,...rosterTeams])]
    .sort((a,b)=>a.localeCompare(b));

  const qs=new URLSearchParams(location.search);
  const requested=qs.get('team');

  $('teamSelect').innerHTML=teams.length
    ? teams.map(t=>`<option value="${esc(t)}">${esc(t)}</option>`).join('')
    : '<option value="">No teams found</option>';

  if(requested&&teams.includes(requested))$('teamSelect').value=requested;
  else if(STATE.profileTeam){
    const firstOpponent=teams.find(t=>!sameTeam(t,STATE.profileTeam));
    if(firstOpponent)$('teamSelect').value=firstOpponent;
  }
  await render();
}

$('teamSelect').addEventListener('change',async()=>{
  const u=new URL(location.href);
  u.searchParams.set('team',$('teamSelect').value);
  history.replaceState(null,'',u);
  await render();
});

$('viewSelect').addEventListener('change',async()=>{
  await render();
});

document.addEventListener('change',async(e)=>{
  if(e.target?.id==='speedOrderSelect'){
    STATE.speedSort=e.target.value;
    const team=$('teamSelect')?.value;
    if(team && $('viewSelect')?.value==='speed')$('main').innerHTML=await speedTableForTeam(team);
  }
});

$('backDashboard').addEventListener('click',()=>{
  location.href='index.html';
});

load();
})();
</script>

<script>

  const select=document.getElementById('pageNavSelect');
  if(!select) return;
  const ADMIN='admin.html';
  const current=(location.pathname.split('/').pop()||'index.html').toLowerCase();
  if(current===ADMIN) select.value=ADMIN;
  else if(Array.from(select.options).some(o=>o.value===current)) select.value=current;

  async function setupCommissionerNav(){
    try{
      const client=window.supabase?.createClient(
        'https://dfxdkkemltukxaklhcpo.supabase.co',
        'sb_publishable_H7iIBiJTxY77lBAcpJn2VQ_u2hAG2CN'
      );
      if(!client) return;
      const {data:{session}}=await client.auth.getSession();
      if(!session?.user) return;
      const {data:profile,error}=await client.from('profiles').select('is_commissioner').eq('id',session.user.id).maybeSingle();
      if(error) throw error;
      if(profile?.is_commissioner){
        select.querySelectorAll('option[data-admin-only]').forEach(opt=>{ opt.hidden=false; });

      if(current===ADMIN) select.value=ADMIN;

})();
</script>
