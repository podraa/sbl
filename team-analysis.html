  // This handles Showdown hyphenated forme names instead of guessing by
  // string prefix alone.
  for(const slug of speciesCandidates(species)){
    try{
      const r=await fetch('https://pokeapi.co/api/v2/pokemon/'+encodeURIComponent(slug));
      if(!r.ok)continue;
      const d=await r.json();
      const st=(d.stats||[]).find(x=>x.stat?.name==='speed');
      if(st){
        const value=Number(st.base_stat);
        if(Number.isFinite(value)){
          SPEED_CACHE.set(cacheKey,value);
          return value;
        }
      }
    }catch(e){}
  }

  SPEED_CACHE.set(cacheKey,null);
  return null;
}

function maxSpeedFromBase(base,level=100){
  const raw=Math.floor(((2*Number(base)+31+63)*level)/100)+5;
  return Math.floor(raw*1.1);
}
function scarfSpeedFromMax(max){ return Math.floor(max*1.5); }

function typeCandidates(species){
  const raw=String(species||'').trim().toLowerCase()
    .replace(/[’']/g,'').replace(/[♀]/g,'-f').replace(/[♂]/g,'-m')
    .replace(/\./g,'').replace(/\s+/g,'-').replace(/-+/g,'-')
    .replace(/^-|-$/g,'');

  const out=[];
  const add=x=>{
    if(!x)return;
    x=x.toLowerCase().replace(/[^a-z0-9-]/g,'').replace(/-+/g,'-');
    if(x&&!out.includes(x))out.push(x);
  };

  add(FORM_ALIASES[raw]||raw);
  add(raw);

  // Try base species after removing form suffixes.
  const parts=raw.split('-');
  for(let i=parts.length-1;i>=1;i--)add(parts.slice(0,i).join('-'));

  return out;
}

async function pokemonTypes(species){
  const key=String(species||'').trim().toLowerCase();
  if(TYPE_CACHE.has(key))return TYPE_CACHE.get(key);

  for(const slug of typeCandidates(species)){
    try{
      const r=await fetch('https://pokeapi.co/api/v2/pokemon/'+encodeURIComponent(slug));
      if(!r.ok)continue;
      const d=await r.json();
      const types=(d.types||[])
        .sort((a,b)=>a.slot-b.slot)
        .map(x=>String(x.type?.name||'').toLowerCase())
        .filter(Boolean);
      if(types.length){
        TYPE_CACHE.set(key,types);
        return types;
      }
    }catch(e){}
  }

  TYPE_CACHE.set(key,[]);
  return [];
}

async function typeMultiplier(attacker,defender){
  const [at,dt]=await Promise.all([pokemonTypes(attacker),pokemonTypes(defender)]);
  if(!at.length||!dt.length)return null;

  // Best STAB attacking type against the defender's actual typing.
  let best=0;
  for(const a of at){
    let mult=1;
    for(const d of dt)mult*=TYPE_CHART[a]?.[d]??1;
    best=Math.max(best,mult);
  }
  return best;
}

async function broadMatchup(attacker,defender){
  return typeMultiplier(attacker,defender);
}

function matchupLabel(mult){
  if(mult===null)return ['Unknown','matchup-neutral'];
  if(mult>=2)return ['Favorable','matchup-good'];
  if(mult<=.5)return ['Unfavorable','matchup-bad'];
  return ['Neutral','matchup-neutral'];
}

      y:o?y:null,o,

    };
  })));

  const speedFor=(y,o)=>speedPairs.find(x=>x.y.species===y.species&&x.o.species===o.species);

      <tbody>${matrixRows.join('')}</tbody>
    </table></div>
  </section>`;

  const answerData=await Promise.all(opp.map(async o=>{
    const scored=await Promise.all(your.map(async y=>{
      const mult=await broadMatchup(y.species,o.species);
      const s=speedFor(y,o);
      return {m:y,v:mult,faster:s?.ymax!=null&&s?.omax!=null&&s.ymax>s.omax};
    }));
    scored.sort((a,b)=>(b.v??-1)-(a.v??-1)||(b.faster?1:0)-(a.faster?1:0));
    return {o,scored};
  }));

  const answers=`<section class="panel">
    <h2>Best Answers</h2>
    <p class="panel-desc">Your strongest candidates into each opponent Pokémon, prioritizing type advantage and then Speed.</p>

    </div>`).join('')}</div>
  </section>`;

  const summaryPairs=[];
  for(const x of answerData){
    const best=x.scored[0];
    if(best)summaryPairs.push({opp:x.o,y:best.m,mult:best.v,faster:best.faster});
  }
  summaryPairs.sort((a,b)=>(b.mult??-1)-(a.mult??-1)||(b.faster?1:0)-(a.faster?1:0));

  const summary=`<section class="panel">
    <h2>Matchup Summary</h2>
    <p class="panel-desc">Quick preparation snapshot of the clearest answers and threats between the two rosters.</p>
    <div class="compare-columns">

      </div>
      <div class="answer-card"><h3>Opponent threats</h3>
        ${summaryPairs.slice().reverse().slice(0,6).map(z=>`<div class="threat-row"><span>${esc(z.opp.species)} → ${esc(z.y.species)}</span><strong>${z.mult===null?'?':z.mult+'×'} · ${z.faster?'Opponent slower':'Opponent faster'}</strong></div>`).join('')}
      </div>
    </div>
  </section>`;

  return controls+summary+answers+matrix;
}

async function load(){
  const showError=(msg)=>{
    console.error('Team Analysis:',msg);
    $('teamSelect').innerHTML='<option value="">Unable to load teams</option>';
    $('main').innerHTML=`<div class="panel"><div class="empty">${esc(msg)}</div></div>`;
  };

  try{
    // Give the Supabase SDK a moment to initialize on GitHub Pages.
    if(!window.supabase){
      await new Promise(resolve=>setTimeout(resolve,500));
    }

    let rows=null;

    // Primary path: Supabase JS client.
    if(window.supabase?.createClient){
      const client=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
      const result=await client.from('replays').select('replay_id,replay_data');
      if(result.error)throw result.error;
      rows=result.data||[];
    }else{
      // Fallback path: direct REST request. This makes the page independent
      // of whether the CDN UMD bundle was initialized by the browser.
      const response=await fetch(
        SUPABASE_URL+'/rest/v1/replays?select=replay_id%2Creplay_data',
        {headers:{
          apikey:SUPABASE_KEY,
          Authorization:'Bearer '+SUPABASE_KEY
        },
        cache:'no-store'}
      );
      if(!response.ok)throw new Error('Supabase request failed ('+response.status+')');
      rows=await response.json();
    }

    for(const row of rows){
      if(row.replay_id===STATE_ID){
        const rd=row.replay_data||{};
        STATE.teamMap=rd.teamMap||{};
        STATE.settings=Object.assign(STATE.settings,rd.settings||{});
      }else if(row.replay_id){
        STATE.replays[row.replay_id]=row.replay_data||{};
      }
    }

    const teams=[...new Set(allRows().flatMap(r=>[
      teamFor(r.players?.p1),
      teamFor(r.players?.p2),
      r.team1,r.team2,r.player1Team,r.player2Team,
      r.teams?.p1,r.teams?.p2
    ]).filter(x=>typeof x==='string'&&x.trim()&&x.trim()!=='Unknown'))]
      .map(x=>x.trim())
      .sort((a,b)=>a.localeCompare(b));

    const qs=new URLSearchParams(location.search);
    const requested=qs.get('team');

    $('teamSelect').innerHTML=teams.length
      ? teams.map(t=>`<option value="${esc(t)}">${esc(t)}</option>`).join('')
      : '<option value="">No teams found</option>';

    if(requested&&teams.includes(requested))$('teamSelect').value=requested;

    if(!teams.length){
      showError('Replay data loaded, but no team names were found. Check the replay data/team mapping in Supabase.');
      return;
    }

    await render();
  }catch(e){
    showError('Could not load replay data from Supabase: '+(e.message||e));
  }
}

$('teamSelect').addEventListener('change',async()=>{
  const u=new URL(location.href);
  u.searchParams.set('team',$('teamSelect').value);
  history.replaceState(null,'',u);
  await render();
});

$('viewSelect').addEventListener('change',async()=>{
  await render();
});

$('backDashboard').addEventListener('click',()=>{
  location.href='index.html';
});

load();
})();
</script>
</body>
</html>
