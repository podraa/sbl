<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Team Analysis</title>
<style>
:root{--bg:#160308;--panel:#24060d;--panel-alt:#310a14;--border:#4a1421;--text:#f7eef0;--text-dim:#b99da5;--amber:#c56880;--teal:#a9566d;--red:#e87891;--mono:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;--sans:'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased}
#app{width:min(1500px,calc(100% - 32px));margin:0 auto;padding:26px 0 64px} header{margin-bottom:24px} h1{font-size:clamp(24px,2vw,30px);margin:0 0 4px}.sub{color:var(--text-dim);font-size:14px;line-height:1.5;margin:0 0 22px}
.toolbar{display:flex;gap:12px;align-items:end;flex-wrap:wrap;margin-bottom:20px}.toolbar>div{min-width:220px;flex:1}.toolbar .fixed{flex:0 0 auto;min-width:auto} label{display:block;font-size:12px;color:var(--text-dim);margin-bottom:6px} select,input{width:100%;background:var(--panel-alt);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:10px 12px;font-family:var(--sans);font-size:13px}button{border:1px solid var(--border);background:none;color:var(--text);border-radius:8px;padding:10px 14px;font-weight:650;cursor:pointer}button:hover{border-color:var(--amber)}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:22px}.panel+.panel{margin-top:14px}.panel h2{font-size:20px;margin:0 0 8px}.panel-desc{color:var(--text-dim);font-size:13px;line-height:1.55;margin:0 0 20px}.grid{display:grid;gap:14px}.overview{grid-template-columns:repeat(4,minmax(0,1fr))}.statbox{background:var(--panel-alt);border:1px solid var(--border);border-radius:8px;padding:14px}.statbox .k{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-dim)}.statbox .v{font-family:var(--mono);font-size:20px;margin-top:4px;color:var(--amber)}
.pokemon-grid{grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}.mon-card{background:var(--panel-alt);border:1px solid var(--border);border-radius:10px;padding:16px;cursor:pointer}.mon-card:hover{border-color:var(--amber)}.mon-head{display:flex;align-items:center;gap:12px}.sprite{width:64px;height:64px;object-fit:contain;image-rendering:pixelated}.mon-name{font-size:17px;font-weight:800}.muted{color:var(--text-dim);font-size:12px}.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}.chip{border:1px solid var(--border);background:var(--panel);border-radius:999px;padding:5px 8px;font-size:11px}.chip b{color:var(--text)}
table{width:100%;border-collapse:collapse;font-size:13px}th{text-align:left;color:var(--text-dim);font-size:10px;text-transform:uppercase;letter-spacing:.07em;border-bottom:1px solid var(--border);padding:9px 8px}td{padding:10px 8px;border-bottom:1px solid var(--border)}td.num{text-align:right;font-family:var(--mono)}tr:last-child td{border-bottom:none}.two{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.notice{border:1px solid var(--border);background:var(--panel-alt);border-radius:8px;padding:12px 14px;color:var(--text-dim);font-size:12px;line-height:1.55}.notice strong{color:var(--text)}
.detail{display:none}.detail.open{display:block}.back{margin-bottom:14px}.detail-head{display:flex;align-items:center;justify-content:space-between;gap:18px}.detail-title{display:flex;align-items:center;gap:14px}.detail-title img{width:82px;height:82px}.speed-option{margin-bottom:10px}.scarf-toggle{display:inline-flex;align-items:center;gap:8px;color:var(--text);font-size:12px;cursor:pointer}.scarf-toggle input{width:auto;margin:0}.section-title{font-size:14px;text-transform:uppercase;letter-spacing:.07em;color:var(--text-dim);margin:0 0 10px}.bar{height:8px;background:var(--panel);border:1px solid var(--border);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--amber)}.range-grid{display:grid;gap:10px}.range-row{display:grid;grid-template-columns:90px 1fr 80px;gap:10px;align-items:center;font-size:12px}.range-row .val{text-align:right;font-family:var(--mono)}
.set-list{display:grid;gap:10px}.set-card{background:var(--panel-alt);border:1px solid var(--border);border-radius:8px;padding:12px}.set-card .chips{margin-top:8px}.empty{padding:26px;text-align:center;color:var(--text-dim);border:1px dashed var(--border);border-radius:8px}.small{font-size:11px;color:var(--text-dim)}
@media(max-width:850px){.overview,.two{grid-template-columns:1fr 1fr}}@media(max-width:600px){#app{width:min(100% - 20px,1500px)}.overview,.two{grid-template-columns:1fr}.panel{padding:16px}.detail-head{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<div id="app">
<header>
  <h1>Team Analysis</h1>
  <p class="sub">Scout a franchise in depth. Review Pokémon usage, moves, observed battle patterns and available stat evidence without adding scouting logic to the main Stats Dashboard.</p>
  <div class="toolbar">
    <div><label>Franchise</label><select id="teamSelect"><option value="">Loading teams…</option></select></div>
    <div class="fixed"><button id="backDashboard">← Stats Dashboard</button></div>
  </div>
</header>
<div id="main"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
const SUPABASE_URL='https://dfxdkkemltukxaklhcpo.supabase.co';
const SUPABASE_KEY='sb_publishable_H7iIBiJTxY77lBAcpJn2VQ_u2hAG2CN';
const STATE_ID='__dashboard_state__';
const supabase=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let STATE={replays:{},teamMap:{},settings:{caseInsensitiveNames:true}};
const $=id=>document.getElementById(id);
function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
function norm(s){return String(s||'').trim().toLowerCase().replace(/[-_]/g,' ')}
function teamFor(u){const k=String(u||'').trim().toLowerCase();return STATE.teamMap[k]||String(u||'').trim()||'Unknown'}
function spriteId(s){return String(s||'').split('-').map(x=>x.toLowerCase().replace(/[^a-z0-9]/g,'')).filter(Boolean).join('-')}
function sprite(s,cls='sprite'){return `<img class="${cls}" src="https://play.pokemonshowdown.com/sprites/gen5/${spriteId(s)}.png" alt="${esc(s)}" loading="lazy" onerror="this.onerror=null;this.style.opacity='.2'">`}
function allRows(){return Object.values(STATE.replays)}
function rowsForTeam(team){return allRows().filter(r=>teamFor(r.players?.p1)===team||teamFor(r.players?.p2)===team)}
function sideForTeam(r,team){if(teamFor(r.players?.p1)===team)return 'p1';if(teamFor(r.players?.p2)===team)return 'p2';return null}
function monsForSide(r,side){const out={};for(const m of Object.values(r.mons||{})){if(m.side===side)out[norm(m.species)]=m}for(const sp of (r.teamRoster?.[side]||[])){const k=norm(sp);if(!out[k])out[k]={species:sp,appearances:0,kills:0,deaths:0,damageDealt:0,damageTaken:0,moves:{}}}return Object.values(out)}
function aggregate(team){
  const games=rowsForTeam(team);const mons={};let wins=0;const pairCounts={};
  for(const r of games){
    const side=sideForTeam(r,team);if(!side)continue;
    const winner=String(r.winner||'').trim();const player=r.players?.[side]||'';
    if(winner&&winner.toLowerCase()===player.toLowerCase())wins++;
    const seen=[];
    for(const m of monsForSide(r,side)){
      const k=norm(m.species);
      if(!mons[k])mons[k]={species:m.species,appearances:0,kills:0,deaths:0,dealt:0,taken:0,replays:new Set(),gameSets:[]};
      const a=mons[k];
      a.appearances+=Number(m.appearances||0)||1;a.kills+=Number(m.kills||0);a.deaths+=Number(m.deaths||0);
      a.dealt+=Number(m.damageDealt||0);a.taken+=Number(m.damageTaken||0);a.replays.add(r.id);
      const moves=Object.keys(m.moves||{}).filter(Boolean);
      a.gameSets.push({
        moves
      });
      seen.push(k)
    }
    seen.sort();for(let i=0;i<seen.length;i++)for(let j=i+1;j<seen.length;j++){const key=seen[i]+'|'+seen[j];pairCounts[key]=(pairCounts[key]||0)+1}
  }
  return {games,wins,losses:Math.max(0,games.length-wins),mons,pairCounts}
}
function formatGameDate(v){if(!v)return '—';const d=new Date(v);return Number.isNaN(d.getTime())?'—':d.toLocaleDateString()}
function maxSpeedFromBase(base,level=100){
  const raw=Math.floor(((2*Number(base)+31+63)*level)/100)+5;
  return Math.floor(raw*1.1);
}
function scarfSpeedFromMax(max){ return Math.floor(max*1.5); }

/* Base Speed data is embedded from Pokémon Database's published Gen 9
   Pokédex values. Team Analysis never depends on a live third-party request. */
const BASE_SPEED={
  abomasnow:60,absol:75,aerodactyl:130,alakazam:120,altaria:80,ambipom:115,amoonguss:30,arcanine:95,azelf:115,azumarill:50,
  baxcalibur:87,blastoise:78,blaziken:80,breloom:70,bellibolt:45,bronzong:33,bulbasaur:45,
  charizard:100,chienpao:135,clodsire:45,cloyster:70,corviknight:67,crobat:130,cyclizar:121,
  decidueye:70,delphox:104,ditto:48,dragonite:80,dragapult:142,drifblim:80,drifloon:70,
  dugtrio:120,dusclops:25,dusknoir:45,eelektross:40,espathra:105,excadrill:88,exeggutor:55,
  feraligatr:78,flamigo:90,florges:75,flygon:100,forretress:30,furret:90,garchomp:102,gardevoir:80,
  gengar:110,gholdengo:84,gigalith:25,glaceon:65,gliscor:95,golduck:85,golurk:55,gothitelle:65,
  greninja:122,gyarados:81,hatterene:29,hawlucha:118,heatran:77,heracross:85,hippowdon:47,
  honchkrow:71,hydreigon:98,indeedee:85,ironbundle:136,ironhands:50,ironjugulis:108,ironmoth:110,
  ironthorns:72,ironvaliant:116,ivysaur:60,jellicent:60,jolteon:130,kingambit:50,kingdra:85,
  klefki:75,kommoo:85,krookodile:92,lapras:60,latias:110,latios:110,leafeon:95,lickilicky:50,
  lopunny:105,lucario:90,ludicolo:70,lunatone:70,lycanroc:112,magcargo:30,mawile:50,medicham:80,
  meganium:80,meowstic:104,metagross:70,milotic:81,mimikyu:96,mienshao:105,moltres:90,
  mrmime:90,mudsdale:35,muk:50,murkrow:91,nacli:35,naclstack:35,nihilego:103,ninetales:100,
  noivern:123,orthworm:65,oranguru:60,oricorio:93,palafin:100,pawmot:105,pecharunt:88,
  pelipper:65,perrserker:50,pidgeot:101,pikachu:90,pincurchin:15,politoed:70,polteageist:70,
  porygonz:79,primeape:95,probopass:40,pyroar:106,quagsire:35,quaquaval:85,raichu:110,
  rapidash:105,rayquaza:95,regieleki:200,regidrago:80,regirock:50,registeel:50,relicanth:55,
  roaringmoon:119,roserade:90,rotom:86,sableye:50,salazzle:117,samurott:70,sandslash:65,
  sceptile:120,scizor:65,scovillain:75,sharpedo:95,shaymin:100,shedinja:40,shiftry:80,
  shinx:45,skarmory:70,slaking:100,slowbro:30,slowking:30,smeargle:75,sneasler:120,snorlax:30,
  solgaleo:97,spectrier:130,starmie:115,staraptor:100,steelix:30,sudowoodo:30,suicune:85,sylveon:60,
  talonflame:126,tauros:100,tentacruel:100,terapagos:71,toxapex:35,toxtricity:75,toedscruel:100,torkoal:20,
  torterra:56,trapinch:10,tsareena:72,tyranitar:61,tyrantrum:71,umbreon:65,urshifu:97,ursaluna:50,
  veluza:75,venomoth:90,venusaur:80,vileplume:50,volcarona:100,walkingwake:109,watchog:77,weepinbell:55,
  whimsicott:116,wiglett:95,wigglytuff:45,wochien:85,wooper:15,xatu:95,xerneas:99,yamask:30,yveltal:99,zapdos:100,zygarde:95,
  mewtwo:130,mew:100,rayquaza:95,kyogre:90,groudon:90,arceus:120,greninja:122
};
const SPEED_ALIASES={
  'mr mime':'mrmime','mr. mime':'mrmime','farfetchd':'farfetchd',
  'nidoran female':'nidoranf','nidoran male':'nidoranm',
  'landorus therian':'landorus','tornadus therian':'tornadus','thundurus therian':'thundurus'
};
function speedKey(name){
  let k=norm(name).replace(/[^a-z0-9]/g,'');
  if(BASE_SPEED[k]!==undefined)return k;
  const n=norm(name);
  if(SPEED_ALIASES[n]!==undefined)return SPEED_ALIASES[n];
  return k;
}
  return null;
}
function baseSpeedForSpecies(species){
  const k=speedKey(species);
  if(BASE_SPEED[k]!==undefined)return BASE_SPEED[k];
  const compact=String(species||'').toLowerCase().replace(/[^a-z0-9]/g,'');
  if(BASE_SPEED[compact]!==undefined)return BASE_SPEED[compact];
  // Last-resort match for a canonical species name contained at the start of a form name.
  let best=null;
  for(const base of Object.keys(BASE_SPEED)){
    if(base.length>=5 && compact.startsWith(base) && (!best || base.length>best.length))best=base;
  }
  return best?BASE_SPEED[best]:null;
}
function speedTableForTeam(team){
  const a=aggregate(team);
  const list=Object.values(a.mons).sort((x,y)=>x.species.localeCompare(y.species));
  return `<section class="panel"><h2>Speed Tiers</h2>
    <p class="panel-desc">Maximum Level 100 Speed for every Pokémon recorded for <strong>${esc(team)}</strong>. Maximum assumes 31 IVs, 252 Speed EVs and a beneficial Speed nature. Choice Scarf applies the 1.5× multiplier. Base Speed values are from Pokémon Database's Gen 9 Pokédex data. citeturn0search3turn0search4</p>
    ${list.length?`<div class="notice" style="margin-bottom:14px">All values below are Level 100. Base Speed is the species value; Max Speed is the maximum normal stat; Max + Choice Scarf is the maximum while holding Choice Scarf.</div>
    <table><thead><tr><th>Pokémon</th><th class="num">Base Speed</th><th class="num">Max Speed</th><th class="num">Max + Choice Scarf</th></tr></thead>
    <tbody>${list.map(m=>{
      const base=baseSpeedForSpecies(m.species);
      if(base===null)return `<tr><td>${esc(m.species)}</td><td class="num">—</td><td class="num">—</td><td class="num">—</td></tr>`;
      const max=maxSpeedFromBase(base,100);
      return `<tr><td>${esc(m.species)}</td><td class="num">${base}</td><td class="num">${max}</td><td class="num">${scarfSpeedFromMax(max)}</td></tr>`;
    }).join('')}</tbody></table>`:'<div class="empty">No Pokémon have been recorded for this franchise.</div>'}
  </section>`;
}

function render(){
  const sel=$('teamSelect');const team=sel.value;
  if(!team){$('main').innerHTML='<div class="panel"><div class="empty">No franchise data available.</div></div>';return}
  if($('viewSelect')?.value==='speed'){
    $('main').innerHTML=speedTableForTeam(team);
    return;
  }
  const a=aggregate(team);const list=Object.values(a.mons).sort((x,y)=>y.appearances-x.appearances||y.kills-x.kills);const pairs=Object.entries(a.pairCounts).sort((x,y)=>y[1]-x[1]).slice(0,8);
  $('main').innerHTML=`<section class="panel"><h2>${esc(team)}</h2><p class="panel-desc">This is the scouting workspace for <strong>${esc(team)}</strong>. It uses the same shared replay data as the dashboard, but keeps opponent-prep analysis separate from league statistics.</p><div class="grid overview"><div class="statbox"><div class="k">Games analyzed</div><div class="v">${a.games.length}</div></div><div class="statbox"><div class="k">Record</div><div class="v">${a.wins}-${a.losses}</div></div><div class="statbox"><div class="k">Unique Pokémon</div><div class="v">${list.length}</div></div><div class="statbox"><div class="k">Pokémon appearances</div><div class="v">${list.reduce((n,m)=>n+m.appearances,0)}</div></div></div></section>
  <section class="panel"><h2>Pokémon scouting</h2><p class="panel-desc">Select a Pokémon to inspect the exact moves it brought in each individual replay, along with performance.</p><div class="grid pokemon-grid">${list.map(m=>`<div class="mon-card" data-mon="${esc(norm(m.species))}"><div class="mon-head">${sprite(m.species)}<div><div class="mon-name">${esc(m.species)}</div><div class="muted">${m.replays.size} replay${m.replays.size===1?'':'s'} · ${m.appearances} appearances</div></div></div><div class="chips"><span class="chip"><b>${m.kills}</b> K</span><span class="chip"><b>${m.deaths}</b> D</span><span class="chip"><b>${m.dealt.toFixed(0)}</b> dmg</span><span class="chip"><b>${m.gameSets.filter(g=>g.moves.length).length}</b> sets recorded</span></div></div>`).join('')}</div></section>
  <section class="panel"><h2>Common Pokémon pairs</h2><p class="panel-desc">Pairs are counted when both Pokémon appeared for the selected franchise in the same replay.</p>${pairs.length?`<table><thead><tr><th>Pair</th><th class="num">Games</th></tr></thead><tbody>${pairs.map(([key,n])=>{const [x,y]=key.split('|');const names=list.filter(m=>norm(m.species)===x||norm(m.species)===y).map(m=>m.species);return `<tr><td>${names.join(' + ')||key.replace('|',' + ')}</td><td class="num">${n}</td></tr>`}).join('')}</tbody></table>`:'<div class="empty">Not enough roster data.</div>'}</section>
  <div id="detail"></div>`;
  document.querySelectorAll('.mon-card').forEach(c=>c.addEventListener('click',()=>openMon(team,c.dataset.mon)));
}
function openMon(team,key){
  const a=aggregate(team);const m=a.mons[key];if(!m)return;const detail=$('detail');
  const sets=m.gameSets.slice();
  detail.innerHTML=`<section class="panel detail open"><div class="detail-head"><div class="detail-title">${sprite(m.species)}<div><h2>${esc(m.species)}</h2><div class="muted">${m.replays.size} replays · ${m.appearances} appearances · ${m.kills} K · ${m.deaths} D</div></div></div><button id="closeDetail">Close</button></div><div style="height:18px"></div>
  <section class="panel" style="padding:16px;margin:0 0 14px"><h2 style="font-size:17px">Sets</h2><p class="panel-desc">The individual move sets captured for <strong>${esc(m.species)}</strong>. Each set represents one recorded instance of the Pokémon.</p>${sets.length?`<div class="set-list">${sets.map((g,i)=>`<div class="set-card"><div class="muted">Set ${i+1}</div><div class="chips">${g.moves.length?g.moves.map(x=>`<span class="chip">${esc(x)}</span>`).join(''):'<span class="small">No move lines captured</span>'}</div></div>`).join('')}</div>`:'<div class="empty">No sets are available.</div>'}</section>
  <section class="panel" style="padding:16px;margin:0"><div class="section-title">Performance</div><table><tbody><tr><td>Appearances</td><td class="num">${m.appearances}</td></tr><tr><td>Kills</td><td class="num">${m.kills}</td></tr><tr><td>Deaths</td><td class="num">${m.deaths}</td></tr><tr><td>Damage dealt</td><td class="num">${m.dealt.toFixed(0)}</td></tr><tr><td>Damage taken</td><td class="num">${m.taken.toFixed(0)}</td></tr></tbody></table></section></section>`;
  detail.scrollIntoView({behavior:'smooth',block:'start'});
  $('closeDetail').addEventListener('click',()=>{detail.innerHTML='';window.scrollTo({top:0,behavior:'smooth'})});
}
async function load(){try{const {data,error}=await supabase.from('replays').select('replay_id,replay_data');if(error)throw error;for(const row of data||[]){if(row.replay_id===STATE_ID){STATE.teamMap=row.replay_data?.teamMap||{};STATE.settings=Object.assign(STATE.settings,row.replay_data?.settings||{})}else if(row.replay_id)STATE.replays[row.replay_id]=row.replay_data||{}}}catch(e){$('main').innerHTML=`<div class="panel"><div class="empty">Could not load shared replay data: ${esc(e.message)}</div></div>`;return}const teams=[...new Set(allRows().flatMap(r=>[teamFor(r.players?.p1),teamFor(r.players?.p2)]).filter(Boolean))].sort((a,b)=>a.localeCompare(b));const qs=new URLSearchParams(location.search);const requested=qs.get('team');$('teamSelect').innerHTML=teams.length?teams.map(t=>`<option value="${esc(t)}">${esc(t)}</option>`).join(''):'<option value="">No teams found</option>';if(requested&&teams.includes(requested))$('teamSelect').value=requested;render()}
$('teamSelect').addEventListener('change',()=>{const u=new URL(location.href);u.searchParams.set('team',$('teamSelect').value);history.replaceState(null,'',u);render()});
$('viewSelect').addEventListener('change',()=>render());$('backDashboard').addEventListener('click',()=>location.href='index.html');(async()=>{await load()})();
})();
</script>
</body>
</html>
