<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Team Analysis</title>
<style>
:root{--bg:#160308;--panel:#24060d;--panel-alt:#310a14;--border:#4a1421;--text:#f7eef0;--text-dim:#b99da5;--amber:#c56880;--teal:#a9566d;--red:#e87891;--mono:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;--sans:'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased}
#app{width:min(1500px,calc(100% - 32px));margin:0 auto;padding:26px 0 64px} header{margin-bottom:24px} h1{font-size:clamp(24px,2vw,30px);margin:0 0 4px}.sub{color:var(--text-dim);font-size:14px;line-height:1.5;margin:0 0 22px}
.toolbar{display:flex;gap:12px;align-items:end;flex-wrap:wrap;margin-bottom:20px}.toolbar>div{min-width:220px;flex:1}.toolbar .fixed{flex:0 0 auto;min-width:auto} label{display:block;font-size:12px;color:var(--text-dim);margin-bottom:6px} select,input{width:100%;background:var(--panel-alt);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:10px 12px;font-family:var(--sans);font-size:13px}button{border:1px solid var(--border);background:none;color:var(--text);border-radius:8px;padding:10px 14px;font-weight:650;cursor:pointer}button:hover{border-color:var(--amber)}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:22px}.panel+.panel{margin-top:14px}.panel h2{font-size:20px;margin:0 0 8px}.panel-desc{color:var(--text-dim);font-size:13px;line-height:1.55;margin:0 0 20px}.grid{display:grid;gap:14px}.overview{grid-template-columns:repeat(4,minmax(0,1fr))}.statbox{background:var(--panel-alt);border:1px solid var(--border);border-radius:8px;padding:14px}.statbox .k{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-dim)}.statbox .v{font-family:var(--mono);font-size:20px;margin-top:4px;color:var(--amber)}
.pokemon-grid{grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}.mon-card{background:var(--panel-alt);border:1px solid var(--border);border-radius:10px;padding:16px;cursor:pointer}.mon-card:hover{border-color:var(--amber)}.mon-head{display:flex;align-items:center;gap:12px}.sprite{width:64px;height:64px;object-fit:contain;image-rendering:pixelated}.mon-name{font-size:17px;font-weight:800}.muted{color:var(--text-dim);font-size:12px}.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}.chip{border:1px solid var(--border);background:var(--panel);border-radius:999px;padding:5px 8px;font-size:11px}.chip b{color:var(--text)}
table{width:100%;border-collapse:collapse;font-size:13px}th{text-align:left;color:var(--text-dim);font-size:10px;text-transform:uppercase;letter-spacing:.07em;border-bottom:1px solid var(--border);padding:9px 8px}td{padding:10px 8px;border-bottom:1px solid var(--border)}td.num{text-align:right;font-family:var(--mono)}tr:last-child td{border-bottom:none}.two{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.notice{border:1px solid var(--border);background:var(--panel-alt);border-radius:8px;padding:12px 14px;color:var(--text-dim);font-size:12px;line-height:1.55}.notice strong{color:var(--text)}
.detail{display:none}.detail.open{display:block}.back{margin-bottom:14px}.detail-head{display:flex;align-items:center;justify-content:space-between;gap:18px}.detail-title{display:flex;align-items:center;gap:14px}.detail-title img{width:82px;height:82px}.section-title{font-size:14px;text-transform:uppercase;letter-spacing:.07em;color:var(--text-dim);margin:0 0 10px}.bar{height:8px;background:var(--panel);border:1px solid var(--border);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--amber)}.range-grid{display:grid;gap:10px}.range-row{display:grid;grid-template-columns:90px 1fr 80px;gap:10px;align-items:center;font-size:12px}.range-row .val{text-align:right;font-family:var(--mono)}
.empty{padding:26px;text-align:center;color:var(--text-dim);border:1px dashed var(--border);border-radius:8px}.small{font-size:11px;color:var(--text-dim)}
@media(max-width:850px){.overview,.two{grid-template-columns:1fr 1fr}}@media(max-width:600px){#app{width:min(100% - 20px,1500px)}.overview,.two{grid-template-columns:1fr}.panel{padding:16px}.detail-head{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<div id="app">
<header>
  <h1>Team Analysis</h1>
  <p class="sub">Scout a franchise in depth. Review Pokémon usage, moves, observed battle patterns and available stat evidence without adding scouting logic to the main Stats Dashboard.</p>
  <div class="toolbar">
    <div><label>Franchise</label><select id="teamSelect"><option value="">Loading teams…</option></select></div>
    <div class="fixed"><button id="backDashboard">← Stats Dashboard</button></div>
  </div>
</header>
<div id="main"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
const SUPABASE_URL='https://dfxdkkemltukxaklhcpo.supabase.co';
const SUPABASE_KEY='sb_publishable_H7iIBiJTxY77lBAcpJn2VQ_u2hAG2CN';
const STATE_ID='__dashboard_state__';
const supabase=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let STATE={replays:{},teamMap:{},settings:{caseInsensitiveNames:true}};
const $=id=>document.getElementById(id);
function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
function norm(s){return String(s||'').trim().toLowerCase().replace(/[-_]/g,' ')}
function teamFor(u){const k=String(u||'').trim().toLowerCase();return STATE.teamMap[k]||String(u||'').trim()||'Unknown'}
function spriteId(s){return String(s||'').split('-').map(x=>x.toLowerCase().replace(/[^a-z0-9]/g,'')).filter(Boolean).join('-')}
function sprite(s,cls='sprite'){return `<img class="${cls}" src="https://play.pokemonshowdown.com/sprites/gen5/${spriteId(s)}.png" alt="${esc(s)}" loading="lazy" onerror="this.onerror=null;this.style.opacity='.2'">`}
function allRows(){return Object.values(STATE.replays)}
function rowsForTeam(team){return allRows().filter(r=>teamFor(r.players?.p1)===team||teamFor(r.players?.p2)===team)}
function sideForTeam(r,team){if(teamFor(r.players?.p1)===team)return 'p1';if(teamFor(r.players?.p2)===team)return 'p2';return null}
function monsForSide(r,side){const out={};for(const m of Object.values(r.mons||{})){if(m.side===side)out[norm(m.species)]=m}for(const sp of (r.teamRoster?.[side]||[])){const k=norm(sp);if(!out[k])out[k]={species:sp,appearances:0,kills:0,deaths:0,damageDealt:0,damageTaken:0,moves:{}}}return Object.values(out)}
function aggregate(team){const games=rowsForTeam(team);const mons={};let wins=0;const moveTotals={};const pairCounts={};let totalGames=games.length;
for(const r of games){const side=sideForTeam(r,team);if(!side)continue;const winner=String(r.winner||'').trim();const player=r.players?.[side]||'';if(winner&&winner.toLowerCase()===player.toLowerCase())wins++;const seen=[];
for(const m of monsForSide(r,side)){const k=norm(m.species);if(!mons[k])mons[k]={species:m.species,appearances:0,kills:0,deaths:0,dealt:0,taken:0,moves:{},replays:new Set(),maxHp:null};const a=mons[k];a.appearances+=Number(m.appearances||0)||1;a.kills+=Number(m.kills||0);a.deaths+=Number(m.deaths||0);a.dealt+=Number(m.damageDealt||0);a.taken+=Number(m.damageTaken||0);a.replays.add(r.id);if(m.maxHpObserved)a.maxHp=Math.max(a.maxHp||0,m.maxHpObserved);for(const [mv,n] of Object.entries(m.moves||{})){a.moves[mv]=(a.moves[mv]||0)+Number(n||0);moveTotals[mv]=(moveTotals[mv]||0)+Number(n||0)}seen.push(k)}seen.sort();for(let i=0;i<seen.length;i++)for(let j=i+1;j<seen.length;j++){const key=seen[i]+'|'+seen[j];pairCounts[key]=(pairCounts[key]||0)+1}}
return {games,wins,losses:Math.max(0,games.length-wins),mons,moveTotals,pairCounts,totalGames}}
function render(){const sel=$('teamSelect');const team=sel.value;if(!team){$('main').innerHTML='<div class="panel"><div class="empty">No franchise data available.</div></div>';return}const a=aggregate(team);const list=Object.values(a.mons).sort((x,y)=>y.appearances-x.appearances||y.kills-x.kills);const topMoves=Object.entries(a.moveTotals).sort((x,y)=>y[1]-x[1]).slice(0,12);const pairs=Object.entries(a.pairCounts).sort((x,y)=>y[1]-x[1]).slice(0,8);
$('main').innerHTML=`<section class="panel"><h2>${esc(team)}</h2><p class="panel-desc">This is the scouting workspace for <strong>${esc(team)}</strong>. It uses the same shared replay data as the dashboard, but keeps opponent-prep analysis separate from league statistics.</p><div class="grid overview"><div class="statbox"><div class="k">Games analyzed</div><div class="v">${a.games.length}</div></div><div class="statbox"><div class="k">Record</div><div class="v">${a.wins}-${a.losses}</div></div><div class="statbox"><div class="k">Unique Pokémon</div><div class="v">${list.length}</div></div><div class="statbox"><div class="k">Moves observed</div><div class="v">${topMoves.length}</div></div></div></section>
<section class="panel"><h2>Pokémon scouting</h2><p class="panel-desc">Select a Pokémon to inspect usage, move history, performance and the stat evidence currently available from stored replay data.</p><div class="grid pokemon-grid">${list.map(m=>`<div class="mon-card" data-mon="${esc(norm(m.species))}"><div class="mon-head">${sprite(m.species)}<div><div class="mon-name">${esc(m.species)}</div><div class="muted">${m.replays.size} replay${m.replays.size===1?'':'s'} · ${m.appearances} appearances</div></div></div><div class="chips"><span class="chip"><b>${m.kills}</b> K</span><span class="chip"><b>${m.deaths}</b> D</span><span class="chip"><b>${m.dealt.toFixed(0)}</b> dmg</span><span class="chip"><b>${Object.keys(m.moves).length}</b> moves</span></div></div>`).join('')}</div></section>
<section class="grid two"><div class="panel"><h2>Most used moves</h2><p class="panel-desc">Move counts are based on move lines captured while processing the replays.</p>${topMoves.length?`<table><thead><tr><th>Move</th><th class="num">Uses</th></tr></thead><tbody>${topMoves.map(([mv,n])=>`<tr><td>${esc(mv)}</td><td class="num">${n}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">No move history has been captured yet. Reprocess the replays with the updated Admin file.</div>'}</div><div class="panel"><h2>Common Pokémon pairs</h2><p class="panel-desc">Pairs are counted when both Pokémon appeared for the selected franchise in the same replay.</p>${pairs.length?`<table><thead><tr><th>Pair</th><th class="num">Games</th></tr></thead><tbody>${pairs.map(([key,n])=>{const [x,y]=key.split('|');const names=list.filter(m=>norm(m.species)===x||norm(m.species)===y).map(m=>m.species);return `<tr><td>${names.join(' + ')||key.replace('|',' + ')}</td><td class="num">${n}</td></tr>`}).join('')}</tbody></table>`:'<div class="empty">Not enough roster data.</div>'}</div></section>
<div id="detail"></div>`;
document.querySelectorAll('.mon-card').forEach(c=>c.addEventListener('click',()=>openMon(team,c.dataset.mon)));}
function openMon(team,key){const a=aggregate(team);const m=a.mons[key];if(!m)return;const moves=Object.entries(m.moves).sort((x,y)=>y[1]-x[1]);const detail=$('detail');const maxHp=m.maxHp;detail.innerHTML=`<section class="panel detail open"><div class="detail-head"><div class="detail-title">${sprite(m.species)}<div><h2>${esc(m.species)}</h2><div class="muted">${m.replays.size} replays · ${m.appearances} appearances · ${m.kills} K · ${m.deaths} D</div></div></div><button id="closeDetail">Close</button></div><div style="height:18px"></div><div class="grid two"><div><div class="section-title">Moves seen</div>${moves.length?`<table><thead><tr><th>Move</th><th class="num">Uses</th><th class="num">Share</th></tr></thead><tbody>${moves.map(([mv,n])=>`<tr><td>${esc(mv)}</td><td class="num">${n}</td><td class="num">${((n/moves.reduce((s,x)=>s+x[1],0))*100).toFixed(1)}%</td></tr>`).join('')}</tbody></table>`:'<div class="empty">No move history captured. Reprocess this replay set with the updated Admin file.</div>'}</div><div><div class="section-title">Stat spread evidence</div><div class="notice"><strong>Important:</strong> exact EV/nature/stat values are not present in the replay data currently stored by this project. The updated Admin captures move usage and observed max HP, but a Showdown replay log does not expose a complete six-stat spread. I have deliberately not invented min/max tiers.</div><div style="height:12px"></div><div class="range-grid"><div class="range-row"><span>HP</span><div class="bar"><i style="width:${maxHp?100:0}%"></i></div><span class="val">${maxHp||'—'}</span></div>${['Atk','Def','SpA','SpD','Spe'].map(x=>`<div class="range-row"><span>${x}</span><div class="bar"></div><span class="val">—</span></div>`).join('')}</div></div></div></section>`;detail.scrollIntoView({behavior:'smooth',block:'start'});$('closeDetail').addEventListener('click',()=>{detail.innerHTML='';window.scrollTo({top:0,behavior:'smooth'})})}
async function load(){try{const {data,error}=await supabase.from('replays').select('replay_id,replay_data');if(error)throw error;for(const row of data||[]){if(row.replay_id===STATE_ID){STATE.teamMap=row.replay_data?.teamMap||{};STATE.settings=Object.assign(STATE.settings,row.replay_data?.settings||{})}else if(row.replay_id)STATE.replays[row.replay_id]=row.replay_data||{}}}catch(e){$('main').innerHTML=`<div class="panel"><div class="empty">Could not load shared replay data: ${esc(e.message)}</div></div>`;return}const teams=[...new Set(allRows().flatMap(r=>[teamFor(r.players?.p1),teamFor(r.players?.p2)]).filter(Boolean))].sort((a,b)=>a.localeCompare(b));const qs=new URLSearchParams(location.search);const requested=qs.get('team');$('teamSelect').innerHTML=teams.length?teams.map(t=>`<option value="${esc(t)}">${esc(t)}</option>`).join(''):'<option value="">No teams found</option>';if(requested&&teams.includes(requested))$('teamSelect').value=requested;render()}
$('teamSelect').addEventListener('change',()=>{const u=new URL(location.href);u.searchParams.set('team',$('teamSelect').value);history.replaceState(null,'',u);render()});$('backDashboard').addEventListener('click',()=>location.href='index.html');load();
})();
</script>
</body>
</html>
