  function tradeManagerRows(){
    const season = new Date().getFullYear();
    const teams = [...new Set((COMM_PROFILES||[]).filter(p=>p.status==='approved' && p.team_name).map(p=>p.team_name))].sort();
    const rows = teams.map(team=>{
      const row = COMM_TRADE_LIMITS.find(x=>x.team_name===team) || {team_name:team, team_trade_limit:8, free_agency_trade_limit:8};
      const teamUsed = COMM_TRADES.filter(t=>t.status==='accepted' || t.status==='reverted').filter(t=>t.target_team!==null && (t.proposer_team===team || t.target_team===team) && new Date(t.created_at).getFullYear()===season).length;
      const faUsed = COMM_TRADES.filter(t=>t.status==='accepted' || t.status==='reverted').filter(t=>t.target_team===null && t.proposer_team===team && new Date(t.created_at).getFullYear()===season).length;
      const teamLimit = Math.max(0, Number(row.team_trade_limit) || 0);
      const faLimit = Math.max(0, Number(row.free_agency_trade_limit) || 0);
      return `<tr>
        <td><strong>${escapeHtml(team)}</strong><div class="note">${escapeHtml(((COMM_PROFILES||[]).find(p=>p.team_name===team)?.email)||'')}</div></td>
        <td class="num"><span>${teamUsed} used</span></td>
        <td class="num"><input class="trade-limit-input" type="number" min="0" step="1" id="teamRemaining-${encodeURIComponent(team)}" value="${Math.max(0,teamLimit-teamUsed)}" aria-label="${escapeHtml(team)} team trades remaining"></td>
        <td class="num"><span>${faUsed} used</span></td>
        <td class="num"><input class="trade-limit-input" type="number" min="0" step="1" id="faRemaining-${encodeURIComponent(team)}" value="${Math.max(0,faLimit-faUsed)}" aria-label="${escapeHtml(team)} Free Agency trades remaining"></td>
        <td><button class="primary small" data-save-trade-limits="${escapeHtml(team)}">Save</button><div class="note danger" id="tradeLimitErr-${encodeURIComponent(team)}"></div></td>
      </tr>`;
    }).join('');
    return `<div class="panel">
      <h2>Trade Manager</h2>
      <div class="note">Each franchise has <strong>two separate allowances</strong>: 8 team-to-team trades and 8 Free Agency trades by default. Edit the <strong>trades remaining</strong> directly below for each player/franchise; the underlying total allowance is adjusted automatically to preserve that remaining number after trades already used.</div>
      <div style="overflow:auto;margin-top:14px;">
        ${rows ? `<table><thead><tr><th>Player / Franchise</th><th class="num">Team trades used</th><th class="num">Team trades remaining</th><th class="num">FA trades used</th><th class="num">FA trades remaining</th><th></th></tr></thead><tbody>${rows}</tbody></table>` : '<div class="empty-state">No approved franchises yet.</div>'}
      </div>
    </div>`;
  }

  function drawTrades(){
    const filteredTrades = COMM_TRADES.filter(t=>{
      if(COMM_TRADE_FILTER === 'pending') return t.status === 'pending';
      if(COMM_TRADE_FILTER === 'completed') return t.status !== 'pending';
      if(COMM_TRADE_FILTER === 'freeagency') return t.target_team === null;
      return true;
    });
    const pendingFA = COMM_TRADES.filter(t=>t.target_team === null && t.status === 'pending').length;

    contentEl.innerHTML = `
      ${drawManualTradeCredits()}
      ${tradeManagerRows()}
      <div class="panel">
        <div class="trade-tab-head">
          <div>
            <h2>Trade Management <span class="badge">${COMM_TRADES.length}</span></h2>
            <div class="note">All trade actions live here. “Credit trade to players” manually applies a pending trade on behalf of the teams.</div>
          </div>
          <div>
            <label for="commTradeFilter">View</label>
            <select id="commTradeFilter" style="min-width:180px;">
              <option value="pending" ${COMM_TRADE_FILTER==='pending'?'selected':''}>Pending${pendingFA ? ` (${pendingFA} FA)` : ''}</option>
              <option value="completed" ${COMM_TRADE_FILTER==='completed'?'selected':''}>Completed</option>
              <option value="freeagency" ${COMM_TRADE_FILTER==='freeagency'?'selected':''}>Free Agency</option>
            </select>
          </div>
        </div>
        <div style="margin-top:14px;">
          ${filteredTrades.length ? filteredTrades.map(commTradeRow).join('') : '<div class="empty-state">No trades in this view.</div>'}
        </div>
      </div>`;

    document.getElementById('creditManualTrades')?.addEventListener('click', async ()=>{
      const playerId = document.getElementById('manualTradePlayer')?.value;
      const amount = Number(document.getElementById('manualTradeAmount')?.value);
      const statusEl = document.getElementById('manualTradeCreditStatus');
      if(statusEl){ statusEl.className='note'; statusEl.textContent=''; }
      if(!playerId){ if(statusEl){statusEl.className='note danger';statusEl.textContent='Select a player first.';} return; }
      if(!Number.isInteger(amount) || amount < 1){ if(statusEl){statusEl.className='note danger';statusEl.textContent='Enter a whole number of trades to credit.';} return; }
      const player = (COMM_PROFILES || []).find(p => String(p.id) === String(playerId));
      if(!player) throw new Error('Player not found.');
      const btn=document.getElementById('creditManualTrades');
      btn.disabled=true;
      try{
        STATE.settings = STATE.settings || {};
        STATE.settings.tradeCredits = STATE.settings.tradeCredits || {};
        const before = manualTradeCreditsFor(playerId);
        STATE.settings.tradeCredits[playerId] = before + amount;
        await saveManualTradeCredits();
        const after = STATE.settings.tradeCredits[playerId];
        await logAdminAction('manual_trade_credit', `Credited ${amount} trade${amount===1?'':'s'} to ${player.team_name || player.email}. Total manual credits: ${after}.`, {profileId:playerId, team:player.team_name || null, amount, total:after});
        if(statusEl){statusEl.className='note';statusEl.textContent=`Credited ${amount} trade${amount===1?'':'s'} to ${player.team_name || player.email}. Total manual credits: ${after}.`;}
        drawTrades();
      }catch(e){
        if(statusEl){statusEl.className='note danger';statusEl.textContent='Could not credit trades: ' + e.message;}
      }finally{
        const b=document.getElementById('creditManualTrades'); if(b) b.disabled=false;
      }
    });

    contentEl.querySelectorAll('button[data-save-trade-limits]').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        const team = btn.dataset.saveTradeLimits;
        const key = encodeURIComponent(team);
        const teamRemaining = Number(document.getElementById(`teamRemaining-${key}`)?.value);
        const faRemaining = Number(document.getElementById(`faRemaining-${key}`)?.value);
        const teamUsed = COMM_TRADES.filter(t=>
          (t.status==='accepted' || t.status==='reverted') &&
          t.target_team!==null &&
          (t.proposer_team===team || t.target_team===team) &&
          new Date(t.created_at).getFullYear()===new Date().getFullYear()
        ).length;
        const faUsed = COMM_TRADES.filter(t=>
          (t.status==='accepted' || t.status==='reverted') &&
          t.target_team===null &&
          t.proposer_team===team &&
          new Date(t.created_at).getFullYear()===new Date().getFullYear()
        ).length;
        const teamLimit = teamUsed + teamRemaining;
        const faLimit = faUsed + faRemaining;
        const errEl = document.getElementById(`tradeLimitErr-${key}`);
        if(errEl){errEl.textContent='';errEl.className='note danger';}
        if(!Number.isInteger(teamRemaining)||teamRemaining<0||!Number.isInteger(faRemaining)||faRemaining<0){if(errEl)errEl.textContent='Enter whole numbers 0 or greater for trades remaining.';return;}
        btn.disabled=true;
        try{
          const {error}=await supabase.rpc('commissioner_set_trade_limits',{p_team_name:team,p_team_trade_limit:teamLimit,p_free_agency_trade_limit:faLimit});
          if(error) throw error;
          await logAdminAction('set_trade_limits', `Set trade limits for ${team}: ${teamLimit} team trades, ${faLimit} Free Agency trades.`, {team, teamLimit, freeAgencyLimit:faLimit});
          await loadCommissionerData();
          if(activeTab==='trades') drawTrades();
        }catch(e){if(errEl)errEl.textContent=e.message;btn.disabled=false;}
      });
    });

    document.getElementById('commTradeFilter')?.addEventListener('change', e=>{
      COMM_TRADE_FILTER = e.target.value;
      drawTrades();
    });

    contentEl.querySelectorAll('button[data-trade-action]').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        const id = Number(btn.dataset.tradeId);
        const action = btn.dataset.tradeAction;
        const errEl = document.getElementById(`tradeCommErr-${id}`);
        if(errEl){ errEl.className='note'; errEl.textContent=''; }
        if(action === 'revert' && !confirm('This undoes the roster swap from this accepted trade and ends it — it will NOT go back to pending. Continue?')) return;
        if(action === 'credit' && !confirm('Credit this trade to the players now? This will apply the roster swap on their behalf.')) return;
        btn.disabled = true;
        try{
          if(action === 'credit'){
            const trade = COMM_TRADES.find(t => Number(t.id) === id);
            if(!trade) throw new Error('Trade not found.');
            if(trade.target_team === null){
              const {error} = await supabase.rpc('commissioner_accept_free_agency_trade', { trade_id:id });
              if(error) throw error;
            }else{
              // Team-to-team trades normally use accept_trade() from the receiving
              // player's dashboard. The admin can trigger the same server-side
              // operation here when a player needs the trade credited manually.
              const {error} = await supabase.rpc('accept_trade', { trade_id:id });
              if(error) throw error;
            }
          } else if(action === 'reject-fa'){
            const {error} = await supabase.from('trade_requests')
              .update({ status:'rejected', responded_at:new Date().toISOString(), responded_by:adminUser.id })
              .eq('id', id);
            if(error) throw error;
          } else if(action === 'revoke'){
            const {error} = await supabase.from('trade_requests')
              .update({ status:'pending', responded_at:null, responded_by:null })
              .eq('id', id);
            if(error) throw error;
          } else if(action === 'revert'){
            const {error} = await supabase.rpc('commissioner_revert_trade', { trade_id:id });
            if(error) throw error;
          }
          const trade = COMM_TRADES.find(t => Number(t.id) === id);
          await logAdminAction('commissioner_trade_action', `Commissioner ${action} action on trade #${id}.`, {
            tradeId:id, action, proposerTeam:trade?.proposer_team || null, targetTeam:trade?.target_team || null
          });

          if(activeTab === 'trades') drawTrades();

          if(errEl){ errEl.className='note danger'; errEl.textContent=e.message; }
          else showAdminError(e.message);
          btn.disabled=false;
        }
      });
    });
  }

  async function logAdminAction(actionType, message, metadata={}){
    const user = adminUser || (await supabase.auth.getUser()).data?.user;
    const entry = {
      admin_id: user?.id || null,
      admin_email: user?.email || null,
      action_type: actionType,
      message,
      metadata: Object.assign({
        season: STATE.settings?.activeSeason || DEFAULT_SEASON,
        page: 'admin.html'
      }, metadata || {})
    };

    // Primary audit store. Do not silently swallow this failure: if the insert
    // is rejected by Supabase (for example, an RLS policy), keep a local/shared
    // fallback so the action is still visible in the Admin Log.
    try{
      const {error} = await supabase.from('admin_logs').insert(entry);
      if(!error) return true;
      console.warn('Admin log write failed:', error);
    }catch(e){
      console.warn('Admin log write failed:', e);
    }

    try{
      STATE.settings = STATE.settings || {};
      const fallback = Array.isArray(STATE.settings.adminLogFallback)
        ? STATE.settings.adminLogFallback
        : [];
      fallback.unshift({
        ...entry,
        created_at: new Date().toISOString(),
        id: `fallback-${Date.now()}-${Math.random().toString(36).slice(2,8)}`
      });
      STATE.settings.adminLogFallback = fallback.slice(0, 500);
      await saveSharedState();
      return false;
    }catch(e){
      console.warn('Admin log fallback write failed:', e);
      return false;
    }
  }

  async function drawAdminLog(){
    let logs = [];
    let loadError = '';
    try{
      const {data, error} = await supabase.from('admin_logs')
        .select('*').order('created_at', {ascending:false}).limit(500);
      if(error) throw error;
      logs = data || [];
    }catch(e){ loadError = e.message || 'Could not load admin log.'; }

    // Include any entries that could not be written to admin_logs (for example
    // while the table's INSERT policy is being fixed).
    const fallback = Array.isArray(STATE.settings?.adminLogFallback)
      ? STATE.settings.adminLogFallback : [];
    if(fallback.length){
      const seen = new Set(logs.map(x => `${x.created_at}|${x.action_type}|${x.message}`));
      fallback.forEach(x => {
        const key = `${x.created_at}|${x.action_type}|${x.message}`;
        if(!seen.has(key)) logs.push(x);
      });
      logs.sort((a,b) => new Date(b.created_at || 0) - new Date(a.created_at || 0));
    }
    const actions = [...new Set(logs.map(log => String(log.action_type || 'action')).filter(Boolean))].sort();
    contentEl.innerHTML = `
      <div class="panel">
        <div class="section-head-row">
          <div><h2>Admin Log</h2><div class="note">Commissioner and administrative actions.</div></div>
          <div class="foot-actions">
            <select id="adminLogActionFilter" class="input">
              <option value="all">All actions</option>
              ${actions.map(a => `<option value="${escapeHtml(a)}">${escapeHtml(a)}</option>`).join('')}
            </select>
            <button class="ghost" id="refreshAdminLogBtn">Refresh</button>
          </div>
        </div>
        ${loadError ? `<div class="note danger">${escapeHtml(loadError)}</div>` : ''}
        ${!loadError && !logs.length ? '<div class="empty-state">No admin actions have been logged yet.</div>' : ''}
        ${logs.length ? `<div class="admin-log-list">${logs.map(log => `
          <div class="admin-log-row" data-action="${escapeHtml(log.action_type || 'action')}">
            <div class="admin-log-time">${escapeHtml(new Date(log.created_at).toLocaleString())}</div>
            <div class="admin-log-action"><strong>${escapeHtml(log.action_type || 'action')}</strong></div>
            <div class="admin-log-message">${escapeHtml(log.message || '')}</div>
            <div class="admin-log-admin"><span class="admin-log-admin-label">Admin</span><strong>${escapeHtml(log.admin_email || log.admin_id || 'Unknown admin')}</strong></div>
          </div>`).join('')}</div>` : ''}
      </div>`;
    document.getElementById('refreshAdminLogBtn')?.addEventListener('click', drawAdminLog);
    document.getElementById('adminLogActionFilter')?.addEventListener('change', e => {
      const selected=e.target.value;
      document.querySelectorAll('.admin-log-row').forEach(row => row.style.display = selected==='all'||row.dataset.action===selected ? '' : 'none');
    });
  }

  function drawCommissioner(){
    const pending = COMM_PROFILES.filter(p=>p.status==='pending');
    const approved = COMM_PROFILES.filter(p=>p.status==='approved');
    const rejected = COMM_PROFILES.filter(p=>p.status==='rejected');
    const draft = normalizeDraftState(STATE.settings.draft);
    const franchises = draftFranchises();
    const spentByTeam = {};
    draft.picks.forEach(p => {
      spentByTeam[p.team] = (spentByTeam[p.team] || 0) + (Number(p.points) || 0);
    });

    // Scale the budget cards as the league grows.  The cards remain readable,
    // but large leagues do not consume the entire commissioner page.
    const budgetScale = Math.max(0.72, Math.min(1, 1 - Math.max(0, franchises.length - 8) * 0.035));

    contentEl.innerHTML = `
      <div class="panel">
        <h2>Commissioner / Admin</h2>
        <div class="note">Commissioner controls only. Franchise rosters are not displayed on this page; budgets remain visible for every franchise. Trade management has its own tab.</div>
      </div>

      <div class="panel commissioner-only-ui" data-commissioner-ui="budgets-no-rosters">
        <div class="section-head-row">
          <h2>Franchise Budgets <span class="badge">${franchises.length}</span></h2>
          <span class="badge">${escapeHtml(STATE.settings.activeSeason || DEFAULT_SEASON)}</span>
        </div>
        ${franchises.length ? `
          <div class="commissioner-budget-grid" style="--budget-scale:${budgetScale}">
            ${franchises.map(team => {
              const cap = Number.isFinite(Number(draft.budgets[team]))
                ? Number(draft.budgets[team])
                : Number(draft.defaultBudget) || 0;
              const spent = spentByTeam[team] || 0;
              const remaining = cap - spent;
              return `<div class="commissioner-budget-card">
                <div class="commissioner-budget-team" title="${escapeHtml(team)}">${escapeHtml(team)}</div>
                <div class="commissioner-budget-main">${cap}</div>
                <div class="commissioner-budget-meta">
                  <span>Spent <strong>${spent}</strong></span>
                  <span class="${remaining < 0 ? 'budget-over' : ''}">Remaining <strong>${remaining}</strong></span>
                </div>
                ${draft.budgets[team] != null ? '<div class="commissioner-budget-override">Custom budget</div>' : '<div class="commissioner-budget-override">League default</div>'}
              </div>`;
            }).join('')}
          </div>
          <div class="note">Each franchise shows its full budget, amount spent, and amount remaining. Custom franchise budgets are marked separately.</div>
        ` : '<div class="empty-state">No approved franchises yet.</div>'}
      </div>

      <div class="panel">
        <h2>Pending Team Claims <span class="badge">${pending.length}</span></h2>
        ${pending.length ? pending.map(p=>commClaimRow(p,true)).join('') : '<div class="empty-state">No pending claims.</div>'}
      </div>
      <div class="panel">
        <h2>Approved Teams <span class="badge">${approved.length}</span></h2>
        ${approved.length ? approved.map(p=>commClaimRow(p,false)).join('') : '<div class="empty-state">No approved teams yet.</div>'}
      </div>
      ${rejected.length ? `<div class="panel">
        <h2>Rejected Claims <span class="badge">${rejected.length}</span></h2>
        ${rejected.map(p=>commClaimRow(p,false)).join('')}
      </div>` : ''}`;

    contentEl.querySelectorAll('button[data-comm-action]').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        const id = btn.dataset.id;
        const action = btn.dataset.commAction;
        const errEl = document.getElementById(`commErr-${id}`);
        if(errEl) errEl.textContent='';
        btn.disabled=true;
        try{
          let patch=null;
          if(action==='edit-profile'){
            const profile = (COMM_PROFILES || []).find(p => String(p.id) === String(id));
            if(!profile) throw new Error('Profile not found.');
            const username = prompt('Username:', profile.username || '');
            if(username === null){ btn.disabled=false; return; }
            const clean = username.trim();
            if(!/^[A-Za-z0-9_-]{2,24}$/.test(clean)) throw new Error('Username must be 2–24 characters and use only letters, numbers, underscores or hyphens.');
            const team = prompt('Franchise name:', profile.team_name || '');
            if(team === null){ btn.disabled=false; return; }
            const cleanTeam = team.trim();
            if(!cleanTeam) throw new Error('Franchise name cannot be empty.');
            const {error}=await supabase.from('profiles').update({username:clean, team_name:cleanTeam}).eq('id',id);
            if(error) throw error;
            await logAdminAction('edit_profile', `Edited profile ${profile.email || id}: username/franchise changed.`, {profileId:id, username:clean, team:cleanTeam});
            await loadCommissionerData();
            if(activeTab==='commissioner') drawCommissioner();
            return;
          }
          if(action==='approve') patch={status:'approved'};
          else if(action==='reject') patch={status:'rejected'};
          else if(action==='revoke') patch={status:'pending'};
          else if(action==='make-commissioner') patch={is_commissioner:true};
          else if(action==='remove-commissioner') patch={is_commissioner:false};
          if(patch){
            const {error}=await supabase.from('profiles').update(patch).eq('id',id);
            if(error) throw error;
            const profile = (COMM_PROFILES || []).find(p => String(p.id) === String(id));
            await logAdminAction('commissioner_profile_action', `Changed ${profile?.email || id}: ${action}.`, {
              profileId:id, action, team:profile?.team_name || null
            });
          }
          await loadCommissionerData();
          if(activeTab==='commissioner') drawCommissioner();
        }catch(e){
          if(errEl){ errEl.className='note danger'; errEl.textContent=e.message; }
          else showAdminError(e.message);
          btn.disabled=false;
        }
      });
    });
  }

  // Franchise names are derived from the Player -> Team name mapping.
  // The value on the right side of each mapping is the canonical franchise name.
  // This keeps Draft Setup, budgets, ordering, and Commissioner views in sync
  // with the league's existing player/team mapping instead of maintaining a
  // second franchise list in Settings.
  function configuredFranchises(){
    const names = [...new Set(
      Object.values(STATE.teamMap || {})
        .map(v => String(v || '').trim())
        .filter(Boolean)
    )].sort((a,b)=>a.localeCompare(b, undefined, {sensitivity:'base'}));

    const configured = STATE.settings.franchises && typeof STATE.settings.franchises === 'object'
      ? STATE.settings.franchises
      : {};

    return names.map(name => ({ name, conference: configured[name] || '' }));
  }

    });
    document.getElementById('exportBackup').addEventListener('click', ()=>{
      const blob = new Blob([JSON.stringify(STATE, null, 2)], {type:'application/json'});
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = `league-dashboard-backup-${new Date().toISOString().slice(0,10)}.json`;
      link.click();
    });
    document.getElementById('importBackupBtn').addEventListener('click', ()=>{
      document.getElementById('importBackupFile').click();
    });
    document.getElementById('importBackupFile').addEventListener('change', async (e)=>{
      const file = e.target.files[0];
      if(!file) return;
      try{
        const text = await file.text();
        const data = JSON.parse(text);
        if(!data.replays) throw new Error('not a valid backup file');
        if(!confirm(`This will replace your current data with the backup (${Object.keys(data.replays).length} replays). Continue?`)) return;
        STATE.replays = data.replays || {};
        STATE.teamMap = data.teamMap || {};
        STATE.settings = Object.assign({caseInsensitiveNames:true, rosters:{}}, data.settings || {});
        STATE.settings.rosters = STATE.settings.rosters || {};
        STATE.settings.draft = normalizeDraftState(STATE.settings.draft);
        await deleteRemoteRowsNotInState();
        await saveReplays();
        await saveTeamMap();
        await saveSettings();
        await logAdminAction('restore_backup', `Restored dashboard state from backup with ${Object.keys(STATE.replays).length} replays.`, {replayCount:Object.keys(STATE.replays).length});
        renderTicker();
        render();
      }catch(err){
        alert('Could not read that backup file: ' + err.message);
      }
      e.target.value = '';
    });
  }

  // ---------- init ----------
  document.addEventListener('click', (e)=>{
    const cell = e.target.closest('[data-audit]');
    if(!cell) return;
    try{
      const {species, type, list, showLink} = JSON.parse(cell.dataset.audit);
      openAudit(species, type, list, showLink);
    }catch(err){ /* malformed payload, ignore */ }
  });
  (async function init(){
    try{
      const authenticated = await initAdminAuth();
      if(!authenticated) return;
      await loadState();
      renderTicker();
      render();
    }catch(e){
      console.error(e);
      showAdminError('Admin initialization failed: ' + e.message);
    }
  })();

})();
</script>

<script>
(function(){
  const select=document.getElementById('pageNavSelect');
  if(!select) return;
  const lockHint=document.getElementById('pageNavLockHint');
  const ADMIN='admin.html';
  const current=(location.pathname.split('/').pop()||'index.html').toLowerCase();
  if(current===ADMIN) select.value=ADMIN;
  else if(Array.from(select.options).some(o=>o.value===current)) select.value=current;

  function lockNav(locked){
    select.disabled=locked;
    select.title=locked ? 'Log in to switch pages' : '';
    if(lockHint) lockHint.hidden=!locked;
  }

  const client=window.supabase?.createClient(
    'https://dfxdkkemltukxaklhcpo.supabase.co',
    'sb_publishable_H7iIBiJTxY77lBAcpJn2VQ_u2hAG2CN'
  );

  async function setupCommissionerNav(){
    try{
      if(!client){ lockNav(true); return; }
      const {data:{session}}=await client.auth.getSession();
      lockNav(!session?.user);
      if(!session?.user) return;
      const {data:profile,error}=await client.from('profiles').select('is_commissioner').eq('id',session.user.id).maybeSingle();
      if(error) throw error;
      if(profile?.is_commissioner){
        select.querySelectorAll('option[data-admin-only]').forEach(opt=>{ opt.hidden=false; });
      }
      // "Draft Room" is shown to any logged-in team owner, but only while a
      // draft is actually in progress -- independent of commissioner status.
      try{
        const {data:stateRow}=await client.from('replays').select('replay_data').eq('replay_id','__dashboard_state__').maybeSingle();
        const draftStatus=stateRow?.replay_data?.settings?.draft?.status;
        if(draftStatus==='live'){
          select.querySelectorAll('option[data-draft-live-only]').forEach(opt=>{ opt.hidden=false; });
        }
      }catch(draftErr){ console.warn('Draft status check failed:',draftErr); }
      if(current===ADMIN) select.value=ADMIN;
    }catch(err){ console.warn('Commissioner navigation check failed:',err); lockNav(true); }
  }

  select.addEventListener('change',e=>{
    if(e.target.value) location.href=e.target.value;
  });
  setupCommissionerNav();
  client?.auth.onAuthStateChange((_event,session)=>{ lockNav(!session?.user); });
})();
</script>
