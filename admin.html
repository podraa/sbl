<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>League Damage Dashboard</title>
<style>
  :root{
    --bg:#0e1218;
    --panel:#161c26;
    --panel-alt:#1c2432;
    --border:#2a3444;
    --text:#e8edf5;
    --text-dim:#8996a8;
    --amber:#ffb454;
    --amber-text:#1a1206;
    --teal:#5eead4;
    --red:#ff7a7a;
    --mono:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;
    --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:var(--sans); -webkit-font-smoothing:antialiased;
  }
  #app{max-width:1080px; margin:0 auto; padding:24px 20px 60px;}

  /* header + ticker */
  header{margin-bottom:20px;}
  h1{font-size:22px; margin:0 0 2px; letter-spacing:.2px;}
  .sub{color:var(--text-dim); font-size:13px; margin-bottom:16px;}
  .ticker{
    display:flex; gap:0; overflow-x:auto; border:1px solid var(--border);
    border-radius:10px; background:linear-gradient(180deg,var(--panel-alt),var(--panel));
  }
  .tick{
    flex:1 0 140px; padding:12px 16px; border-right:1px solid var(--border);
    min-width:140px;
  }
  .tick:last-child{border-right:none;}
  .tick .lbl{font-size:10px; text-transform:uppercase; letter-spacing:.08em; color:var(--text-dim);}
  .tick .name{font-size:13px; margin:2px 0 4px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .tick .val{font-family:var(--mono); font-size:19px; color:var(--amber);}
  .tick.empty .val{color:var(--text-dim); font-size:13px;}

  /* tabs */
  nav.tabs{display:flex; gap:4px; margin:20px 0 16px; border-bottom:1px solid var(--border); flex-wrap:wrap;}
  nav.tabs button{
    background:none; border:none; color:var(--text-dim); padding:10px 14px;
    font-size:13px; font-weight:600; cursor:pointer; border-bottom:2px solid transparent;
    font-family:var(--sans);
  }
  nav.tabs button.active{color:var(--text); border-bottom-color:var(--amber);}
  nav.tabs button:hover{color:var(--text);}

  .panel{
    background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:18px;
  }
  .panel + .panel{margin-top:14px;}
  .panel h2{font-size:14px; margin:0 0 12px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-dim);}

  label{display:block; font-size:12px; color:var(--text-dim); margin-bottom:6px;}
  textarea, input[type=text]{
    width:100%; background:var(--panel-alt); border:1px solid var(--border); border-radius:8px;
    color:var(--text); padding:10px 12px; font-family:var(--mono); font-size:13px;
  }
  textarea{min-height:90px; resize:vertical;}
  .row{display:flex; gap:12px; flex-wrap:wrap; margin-bottom:12px;}
  .row > div{flex:1; min-width:160px;}

  button.primary{
    background:var(--amber); color:var(--amber-text); border:none; border-radius:8px;
    padding:10px 18px; font-weight:700; font-size:13px; cursor:pointer; font-family:var(--sans);
  }
  button.primary:disabled{opacity:.5; cursor:default;}
  button.ghost{
    background:none; border:1px solid var(--border); color:var(--text); border-radius:8px;
    padding:9px 14px; font-size:12px; cursor:pointer; font-family:var(--sans);
  }
  button.ghost:hover{border-color:var(--amber);}
  button.small{padding:5px 10px; font-size:11px;}
  .danger-btn{border-color:var(--red); color:var(--red);}

  .log{font-family:var(--mono); font-size:12px; white-space:pre-wrap; color:var(--text-dim); margin-top:10px; line-height:1.6;}
  .log .ok{color:var(--teal);}
  .log .err{color:var(--red);}

  table{width:100%; border-collapse:collapse; font-size:13px;}
  th{
    text-align:left; font-size:10px; text-transform:uppercase; letter-spacing:.06em;
    color:var(--text-dim); padding:8px 10px; border-bottom:1px solid var(--border);
  }
  td{padding:8px 10px; border-bottom:1px solid var(--border);}
  tr:last-child td{border-bottom:none;}
  td.num, th.num{text-align:right; font-family:var(--mono);}
  .trade-limit-input{width:72px;background:var(--panel-alt);border:1px solid var(--border);border-radius:6px;color:var(--text);padding:5px 7px;font-family:var(--mono);}
  .rank{color:var(--text-dim); font-family:var(--mono); width:26px;}
  .pname{font-weight:600;}
  .dealt{color:var(--amber);}
  .taken{color:var(--red);}
  .kills{color:var(--teal);}

  select{
    background:var(--panel-alt); border:1px solid var(--border); color:var(--text);
    padding:8px 10px; border-radius:8px; font-family:var(--sans); font-size:13px;
  }
  .empty-state{color:var(--text-dim); font-size:13px; padding:20px 0; text-align:center;}
  .foot-actions{display:flex; gap:10px; margin-top:14px; flex-wrap:wrap;}
  .note{font-size:12px; color:var(--text-dim); margin-top:10px; line-height:1.5;}
  .map-row{display:flex; gap:10px; align-items:center; margin-bottom:8px;}
  .map-row input{flex:1;}
  .badge{
    display:inline-block; font-size:10px; padding:2px 7px; border-radius:20px;
    background:var(--panel-alt); border:1px solid var(--border); color:var(--text-dim); margin-left:6px;
  }

  /* sprites */
  .sprite{
    width:48px; height:48px; object-fit:contain; vertical-align:middle;
    image-rendering:pixelated; background:var(--panel-alt); border-radius:8px; margin-right:10px;
  }
  .sprite-xl{
    width:64px; height:64px; object-fit:contain; vertical-align:middle;
    image-rendering:pixelated; background:var(--panel-alt); border-radius:10px; margin-right:12px;
  }
  .pname-cell{display:flex; align-items:center;}

  /* wide layout (Leaderboards / Golden Fist / Franchise Stats) */
  #app.wide{max-width:1440px;}
  .wide .panel{padding:26px;}
  .wide table{font-size:15px;}
  .wide th{font-size:11px; padding:10px 12px;}
  .wide td{padding:12px;}

  .nav-link{
    display:inline-block; color:var(--teal); text-decoration:none; font-size:13px;
    font-weight:600; cursor:pointer; margin-top:4px;
  }
  .nav-link:hover{text-decoration:underline;}
  .section-divider{height:1px; background:var(--border); margin:18px 0;}

  #globalTable{overflow-x:auto;}
  #globalTable table{min-width:620px;}

  /* golden fist */
  .gf-list{display:flex; flex-direction:column; gap:8px;}
  .gf-row{
    display:flex; align-items:center; gap:14px; padding:10px 14px; border-radius:10px;
    background:var(--panel-alt); border:1px solid var(--border);
  }
  .gf-row.top1{border-color:#ffd166; box-shadow:0 0 0 1px #ffd16655 inset;}
  .gf-row.top2{border-color:#c9c9c9;}
  .gf-row.top3{border-color:#cd7f32;}
  .gf-row.auditable-row{cursor:pointer;}
  .gf-row.auditable-row:hover{border-color:var(--amber);}
  .gf-rank{font-family:var(--mono); font-size:16px; width:28px; color:var(--text-dim); text-align:center;}
  .gf-row.top1 .gf-rank{color:#ffd166;}
  .gf-row.top2 .gf-rank{color:#c9c9c9;}
  .gf-row.top3 .gf-rank{color:#cd7f32;}
  .gf-sprite{width:64px; height:64px; object-fit:contain; image-rendering:pixelated; background:var(--panel); border-radius:10px;}
  .gf-info{flex:1;}
  .gf-name{font-weight:700; font-size:14px;}
  .gf-coach{font-size:11px; color:var(--teal); margin-top:1px;}
  .gf-sub{font-size:11px; color:var(--text-dim); margin-top:2px;}
  .gf-diff{font-family:var(--mono); font-size:20px; color:var(--teal); min-width:60px; text-align:right;}
  .gf-diff.neg{color:var(--red);}

  /* audit modal */
  td.auditable{cursor:pointer; text-decoration:underline dotted var(--text-dim); text-underline-offset:3px;}
  td.auditable:hover{color:var(--amber);}
  .audit-overlay{
    position:fixed; inset:0; background:rgba(6,9,14,.7); display:flex; align-items:flex-start;
    justify-content:center; padding:40px 16px; z-index:50; overflow-y:auto;
  }
  .audit-box{
    background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:18px;
    max-width:560px; width:100%;
  }
  .audit-box h3{margin:0 0 2px; font-size:15px;}
  .audit-box .audit-sub{font-size:12px; color:var(--text-dim); margin-bottom:12px;}
  .audit-list{list-style:none; margin:0; padding:0; max-height:50vh; overflow-y:auto;}
  .audit-list li{
    padding:8px 0; border-bottom:1px solid var(--border); font-size:12px; display:flex;
    justify-content:space-between; gap:10px;
  }
  .audit-list li:last-child{border-bottom:none;}
  .audit-list a{color:var(--teal); text-decoration:none;}
  .audit-list a:hover{text-decoration:underline;}
  .audit-cause{color:var(--text-dim);}

  /* replays by player */
  .player-group{
    border:1px solid var(--border); border-radius:8px; margin-bottom:10px; overflow:hidden;
  }
  .player-group summary{
    cursor:pointer; padding:10px 14px; background:var(--panel-alt);
    display:flex; align-items:center; gap:8px; list-style:none; font-size:13px;
  }
  .player-group summary::-webkit-details-marker{display:none;}
  .player-group summary::before{content:'▸'; color:var(--text-dim); font-size:11px; transition:transform .1s;}
  .player-group[open] summary::before{transform:rotate(90deg);}
  .player-group summary .pg-name{font-weight:700;}
  .player-group summary .pg-team{color:var(--text-dim); font-weight:400; font-size:12px;}
  .player-group .player-table-wrap{padding:4px 14px 12px;}
  .player-group table{margin-top:6px;}
  .player-filter{max-width:320px; margin-bottom:14px;}
.roster-admin-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}.roster-admin-card{border:1px solid var(--border);background:var(--panel-alt);border-radius:10px;padding:12px}.roster-admin-card h3{margin:0 0 7px;font-size:14px}.roster-admin-mons{margin-top:10px;font-size:12px;line-height:1.6;color:var(--text-dim)}

  /* commissioner budget overview */
  .commissioner-budget-grid{
    display:grid;
    width:100%;
    box-sizing:border-box;
    grid-template-columns:repeat(auto-fill,minmax(clamp(145px,calc(175px * var(--budget-scale)),200px),1fr));
    gap:calc(10px * var(--budget-scale));
    margin-top:12px;
    overflow:visible;
  }
  .commissioner-budget-grid > .commissioner-budget-card{
    width:100%;
    box-sizing:border-box;
  }
  .commissioner-budget-card{
    min-width:0;
    padding:calc(12px * var(--budget-scale));
    border:1px solid var(--border);
    border-radius:10px;
    background:var(--panel-alt);
    overflow:hidden;
  }
  .commissioner-budget-team{
    font-size:calc(13px * var(--budget-scale));
    font-weight:700;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    margin-bottom:5px;
  }
  .commissioner-budget-main{
    font-family:var(--mono);
    font-size:calc(22px * var(--budget-scale));
    color:var(--amber);
    line-height:1.1;
  }
  .commissioner-budget-meta{
    display:flex;
    justify-content:space-between;
    gap:8px;
    margin-top:7px;
    font-family:var(--mono);
    font-size:calc(10px * var(--budget-scale));
    color:var(--text-dim);
  }
  .commissioner-budget-meta strong{color:var(--text);}
  .commissioner-budget-meta .budget-over,
  .commissioner-budget-meta .budget-over strong{color:var(--red);}
  .commissioner-budget-override{
    margin-top:6px;
    font-size:calc(9px * var(--budget-scale));
    color:var(--text-dim);
  }

  /* commissioner tab */
  .status-pill{display:inline-block; font-size:11px; font-weight:700; padding:3px 10px; border-radius:20px; text-transform:uppercase; letter-spacing:.04em;}
  .status-pill.pending{color:var(--amber); background:#3a2c12; border:1px solid #5a4620;}
  .status-pill.approved{color:var(--teal); background:#0f2b27; border:1px solid #1c4a43;}
  .status-pill.rejected{color:var(--red); background:#3a1414; border:1px solid #5a2020;}
  .status-pill.accepted{color:var(--teal); background:#0f2b27; border:1px solid #1c4a43;}
  .status-pill.withdrawn{color:var(--text-dim); background:var(--panel-alt); border:1px solid var(--border);}
  .status-pill.reverted{color:var(--text-dim); background:var(--panel-alt); border:1px solid var(--border);}
  .trade-card{border:1px solid var(--border); border-radius:10px; background:var(--panel-alt); padding:14px; margin-bottom:10px;}
  .trade-head{display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:8px;}
  .trade-teams{font-weight:700; font-size:13px;}
  .trade-sub{font-size:11px; color:var(--text-dim); margin-top:2px;}
  .trade-cols{display:flex; gap:16px; flex-wrap:wrap; margin-top:6px;}
  .trade-col{flex:1; min-width:180px;}
  .trade-col h4{font-size:10px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-dim); margin:0 0 4px;}
  button.danger{border:1px solid var(--red); color:var(--red); background:none; border-radius:8px; padding:5px 10px; font-size:11px; cursor:pointer;}
  button.teal{background:var(--teal); color:#062521; border:none; border-radius:8px; padding:5px 10px; font-size:11px; font-weight:700; cursor:pointer;}
  
  .admin-log-list{display:flex;flex-direction:column;gap:8px;margin-top:14px}
  .admin-log-row{display:grid;grid-template-columns:170px 150px 1fr 220px;gap:12px;align-items:start;padding:12px;border:1px solid var(--border);border-radius:10px;background:var(--panel-alt)}
  .admin-log-time,.admin-log-admin{font-size:12px;color:var(--text-dim)}
  .admin-log-action{font-size:13px}
  .admin-log-message{font-size:13px;overflow-wrap:anywhere}
  @media(max-width:800px){.admin-log-row{grid-template-columns:1fr;gap:5px}}

.admin-log-admin-label{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-dim);margin-bottom:2px}
</style>
<script>
// Site-wide theme: picked on the My Team page's Account tab, saved to
// localStorage, and applied here so every page matches once a choice is made.
// If nothing has been explicitly chosen yet, this page keeps its own default colors.
(function(){
  var THEMES={
    amber:  {bg:'#0e1218',panel:'#161c26',panelAlt:'#1c2432',border:'#2a3444',text:'#e8edf5',textDim:'#8996a8',accent:'#ffb454',accentText:'#1a1206'},
    teal:   {bg:'#071614',panel:'#0d2220',panelAlt:'#122d2a',border:'#1f4a44',text:'#eafffa',textDim:'#8fc7bb',accent:'#5eead4',accentText:'#062521'},
    sky:    {bg:'#071426',panel:'#0d2038',panelAlt:'#142b47',border:'#2b4c70',text:'#eef6ff',textDim:'#9db4cc',accent:'#60a5fa',accentText:'#0b1a33'},
    violet: {bg:'#171224',panel:'#241b38',panelAlt:'#302448',border:'#51406f',text:'#f7f2ff',textDim:'#b9aecf',accent:'#a78bfa',accentText:'#1e1033'},
    rose:   {bg:'#1c0510',panel:'#2c0a1c',panelAlt:'#3a0f26',border:'#5a1c3c',text:'#fdeef4',textDim:'#c99cb2',accent:'#f472b6',accentText:'#3b0a24'},
    emerald:{bg:'#071410',panel:'#0d2119',panelAlt:'#122c22',border:'#1f4a37',text:'#eafff3',textDim:'#8fc7a8',accent:'#4ade80',accentText:'#052e12'},
    orange: {bg:'#1a0f05',panel:'#2a1a0a',panelAlt:'#38220e',border:'#5a3a1a',text:'#fdf3e8',textDim:'#cbab84',accent:'#fb923c',accentText:'#341102'},
    yellow: {bg:'#17150a',panel:'#26220f',panelAlt:'#332d14',border:'#544b1f',text:'#fdfaea',textDim:'#c9c08a',accent:'#facc15',accentText:'#332600'},
    cyan:   {bg:'#051519',panel:'#0a2129',panelAlt:'#0f2c35',border:'#1c4a57',text:'#eafcff',textDim:'#8bc2cf',accent:'#22d3ee',accentText:'#032a30'},
    indigo: {bg:'#0e0f1f',panel:'#171a30',panelAlt:'#1f2340',border:'#38406a',text:'#eef0ff',textDim:'#a3a8cf',accent:'#818cf8',accentText:'#141033'}
  };
  var id; try{ id = localStorage.getItem('sbl_dashboard_theme'); }catch(e){}
  var t = THEMES[id];
  if(!t) return;
  var root = document.documentElement.style;
  root.setProperty('--bg', t.bg);
  root.setProperty('--panel', t.panel);
  root.setProperty('--panel-alt', t.panelAlt);
  root.setProperty('--border', t.border);
  root.setProperty('--text', t.text);
  root.setProperty('--text-dim', t.textDim);
  root.setProperty('--amber', t.accent);
  root.setProperty('--amber-text', t.accentText);
  root.setProperty('--teal', '#5eead4');
  root.setProperty('--red', '#ff7a7a');
})();
</script>

<script>
(function(){
  const SHARED = true; // league data shared with anyone viewing this dashboard (cloud mode only)
  let STATE = { replays:{}, teamMap:{}, settings:{ caseInsensitiveNames:true } };
  let loaded = false;

  // ---------- shared Supabase storage ----------
  // Admin and public dashboard use the same shared Supabase database.
  const SUPABASE_URL = 'https://dfxdkkemltukxaklhcpo.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_H7iIBiJTxY77lBAcpJn2VQ_u2hAG2CN';
  const SUPABASE_STATE_ID = '__dashboard_state__';
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  const IS_ADMIN_PAGE = true;
  // ---------- seasons ----------
  // Matches the DEFAULT_SEASON / seasonKey / seasonArchives contract that
  // index.html, stats.html, rosters.html, free-agency.html and
  // team-analysis.html already read from (see installSeasonPicker there).
  // Admin is the only page that ever writes a season archive.
  const DEFAULT_SEASON = 'Season 15';
  function seasonKey(name){ return String(name||'').trim().toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'') || 'season'; }
  let adminUser = null;
  let loadingFromRemote = false;

  function requireAdmin(){
    if(!adminUser) throw new Error('Admin login required to change shared data.');
  }

  // ---------- Draft ----------
  // Draft state lives inside the same shared settings blob as rosters/free
  // agency (see saveSharedState). Nothing here creates new Supabase tables.
  function defaultDraftState(){
    return {
      status: 'setup',       // 'setup' | 'live' | 'complete'
      mode: 'manual',        // 'manual' | 'ordered'
      defaultBudget: 120,
      budgets: {},            // per-franchise override: {teamName: number}
      pool: [],                // [{id,name,points,types,drafted,draftedBy,pickNumber}]
      order: [],               // [teamName, teamName, ...] one entry per pick slot
      currentPick: 0,
      picks: [],                // [{poolId,name,points,team,pickNumber,ts}]
      updatedAt: null
    };
  }

  function normalizeDraftState(draft){
    const d = Object.assign(defaultDraftState(), draft || {});
    d.budgets = d.budgets && typeof d.budgets === 'object' ? d.budgets : {};
    d.pool = Array.isArray(d.pool) ? d.pool.map(m => ({
      id: String(m?.id ?? ''),
      name: String(m?.name ?? '').trim(),
      points: Number(m?.points) || 0,
      types: Array.isArray(m?.types) ? m.types.map(t => String(t).trim()).filter(Boolean) : [],
      drafted: !!m?.drafted,
      draftedBy: m?.draftedBy || null,
      pickNumber: m?.pickNumber ?? null
    })).filter(m => m.id && m.name) : [];
    d.order = Array.isArray(d.order) ? d.order.map(String) : [];
    d.picks = Array.isArray(d.picks) ? d.picks : [];
    d.currentPick = Number.isFinite(Number(d.currentPick)) ? Number(d.currentPick) : 0;
    if(d.status !== 'live' && d.status !== 'complete') d.status = 'setup';
    if(d.mode !== 'ordered') d.mode = 'manual';
    return d;
  }

  async function loadState(){
    loadingFromRemote = true;
    try{
      const {data, error} = await supabase.from('replays').select('replay_id,replay_data');
      if(error) throw error;
      const replays = {};
      let sharedState = null;
      for(const row of (data || [])){
        if(row.replay_id === SUPABASE_STATE_ID){
          sharedState = row.replay_data || {};
          continue;
        }
        // __rosters__ is a separate published-roster record, not a replay.
        // Never load it into STATE.replays or the dashboard aggregation will
        // try to treat its roster payload as replay data.
        if(row.replay_id === '__rosters__') continue;
        if(row.replay_id && row.replay_data && row.replay_data.mons && row.replay_data.players){
          replays[row.replay_id] = row.replay_data;
        }
      }
      STATE.replays = replays;
      STATE.teamMap = (sharedState && sharedState.teamMap) || {};
      STATE.settings = Object.assign({caseInsensitiveNames:true, rosters:{}, franchises:{}, conferenceNames:{a:'Conference A',b:'Conference B'}}, (sharedState && sharedState.settings) || {}); STATE.settings.rosters=STATE.settings.rosters||{}; STATE.settings.franchises=STATE.settings.franchises||{}; STATE.settings.conferenceNames=STATE.settings.conferenceNames||{a:'Conference A',b:'Conference B'};
      STATE.settings.draft = normalizeDraftState(STATE.settings.draft);
      STATE.settings.activeSeason = STATE.settings.activeSeason || DEFAULT_SEASON;
      STATE.settings.seasonArchives = (STATE.settings.seasonArchives && typeof STATE.settings.seasonArchives === 'object') ? STATE.settings.seasonArchives : {};
      loaded = true;
    }catch(e){
      console.error('Supabase load failed:', e);
      STATE.replays = {};
      STATE.teamMap = {};
      STATE.settings = {caseInsensitiveNames:true, rosters:{}, franchises:{}, conferenceNames:{a:'Conference A',b:'Conference B'}, draft:defaultDraftState(), activeSeason:DEFAULT_SEASON, seasonArchives:{}};
      loaded = true;
      throw e;
    }finally{
      loadingFromRemote = false;
    }
  }

  async function saveReplays(){
    requireAdmin();
    const rows = Object.values(STATE.replays).map(r => ({
      replay_id: r.id,
      replay_data: r,
      updated_at: new Date().toISOString()
    }));
    if(rows.length){
      const {error} = await supabase.from('replays').upsert(rows, {onConflict:'replay_id'});
      if(error) throw error;
    }
    await saveSharedState();
  }

  async function deleteAllRemote(){

  // ---------- season archiving ----------
  // A season archive is a full snapshot of everything that's specific to a
  // season: the processed replays, the team map, and the season-scoped part
  // of settings (rosters, draft, free agency, franchises, trade credits,
  // week tracking). It's stored inside the shared settings blob itself, at
  // settings.seasonArchives[key], in the exact shape index.html / stats.html
  // / rosters.html / free-agency.html / team-analysis.html already expect
  // when they resolve a `?season=` link (see installSeasonPicker on those
  // pages) — so archived seasons are viewable there immediately.
  //
  // Fields that carry forward into a new season untouched: teamMap,
  // caseInsensitiveNames, conferenceNames, seasonArchives itself. Everything
  // else is season-scoped and gets reset when a new season starts.
  function uniqueArchiveKey(name, archives, avoidKey){
    const base = seasonKey(name);
    if(!archives[base] || base === avoidKey) return base;
    let n = 2, candidate = `${base}-${n}`;
    while(archives[candidate] && candidate !== avoidKey){ candidate = `${base}-${(++n)}`; }
    return candidate;
  }
  // Snapshot everything about the *current* live season, in the shape an
  // archive entry needs. Excludes seasonArchives/activeSeason themselves so
  // archives never nest inside archives.
  function snapshotCurrentSeason(){
    const { seasonArchives, activeSeason, ...seasonSettings } = STATE.settings;
    return {
      name: STATE.settings.activeSeason || DEFAULT_SEASON,
      archivedAt: new Date().toISOString(),
      teamMap: JSON.parse(JSON.stringify(STATE.teamMap || {})),
      settings: JSON.parse(JSON.stringify(seasonSettings || {})),
      replays: JSON.parse(JSON.stringify(STATE.replays || {}))
    };
  }
  async function startNewSeason(){
    requireAdmin();
    const currentName = STATE.settings.activeSeason || DEFAULT_SEASON;
    const replayCount = Object.keys(STATE.replays||{}).length;
    const suggested = (()=>{
      const m = currentName.match(/^(.*?)(\d+)\s*$/);
      return m ? `${m[1]}${Number(m[2])+1}` : '';
    })();
    const nextName = prompt(
      `Start a new season?\n\nThis archives "${currentName}" (${replayCount} replay${replayCount===1?'':'s'}, rosters, draft, and free agency as they stand right now) and clears the board for a fresh season. The archived season stays viewable and can be restored as current at any time from Settings.\n\nName the new season:`,
      suggested
    );
    if(nextName === null) return;
    const newName = nextName.trim() || currentName;
    if(!confirm(`Archive "${currentName}" and start "${newName}"? This cannot be undone automatically for replay data still sitting unsaved in the browser — make sure everything you want kept is already saved.`)) return;

    const archives = {...(STATE.settings.seasonArchives||{})};
    const key = uniqueArchiveKey(currentName, archives);
    archives[key] = snapshotCurrentSeason();

    STATE.replays = {};
    STATE.teamMap = {...STATE.teamMap}; // carried forward as-is
    STATE.settings = {
      caseInsensitiveNames: STATE.settings.caseInsensitiveNames,
      conferenceNames: STATE.settings.conferenceNames || {a:'Conference A',b:'Conference B'},
      franchises: {},
      rosters: {},
      draft: defaultDraftState(),
      freeAgency: {mons:[]},
      tradeCredits: {},
      activeSeason: newName,
      seasonArchives: archives
    };

    await deleteAllRemote();          // clear old live replay rows (safely preserved in the archive above)
    await savePublishedRosters({});   // clear legacy published-roster fallback so it can't leak stale rosters
    await saveReplays();              // upserts STATE.replays (empty) + saves shared state (teamMap/settings/archives)
    await logAdminAction('start_new_season', `Started new season "${newName}" after archiving "${currentName}".`, {from:currentName, to:newName, archivedReplayCount:replayCount});
  }
  async function restoreSeasonArchive(key){
    requireAdmin();
    const archives = STATE.settings.seasonArchives || {};
    const archive = archives[key];
    if(!archive) return;
    const currentName = STATE.settings.activeSeason || DEFAULT_SEASON;
    if(!confirm(`Make "${archive.name || key}" the current season again? Whatever is currently live ("${currentName}") will itself be archived first, so nothing is lost and this can be reversed the same way.`)) return;

    const newArchives = {...archives};
    delete newArchives[key];
    const saveKey = uniqueArchiveKey(currentName, newArchives, key);
    newArchives[saveKey] = snapshotCurrentSeason();

    STATE.replays = JSON.parse(JSON.stringify(archive.replays || {}));
    STATE.teamMap = JSON.parse(JSON.stringify(archive.teamMap || {}));
    STATE.settings = Object.assign(
      {caseInsensitiveNames:true, rosters:{}, franchises:{}, conferenceNames:{a:'Conference A',b:'Conference B'}, freeAgency:{mons:[]}, tradeCredits:{}},
      JSON.parse(JSON.stringify(archive.settings || {}))
    );
    STATE.settings.rosters = STATE.settings.rosters || {};
    STATE.settings.draft = normalizeDraftState(STATE.settings.draft);
    STATE.settings.activeSeason = archive.name || key;
    STATE.settings.seasonArchives = newArchives;

    await deleteAllRemote();                         // clear current live replay rows
    await savePublishedRosters(STATE.settings.rosters||{}); // keep legacy fallback in sync with the restored season
    await saveReplays();                             // upserts restored replays + saves shared state
    await logAdminAction('restore_season', `Restored archived season "${archive.name || key}" as the current season.`, {archiveKey:key, season:archive.name || key, previousSeason:currentName});
  }
  async function deleteSeasonArchive(key){
    requireAdmin();
    const archives = STATE.settings.seasonArchives || {};
    const archive = archives[key];
    if(!archive) return;
    if(!confirm(`Permanently delete the "${archive.name || key}" archive? This cannot be undone.`)) return;
    const newArchives = {...archives};
    delete newArchives[key];
    STATE.settings.seasonArchives = newArchives;
    await saveSharedState();
    await logAdminAction('delete_season_archive', `Permanently deleted season archive "${archive.name || key}".`, {archiveKey:key, season:archive.name || key});
  }

  // ---------- helpers ----------
  function normName(n){ return n.trim().toLowerCase().replace(/-/g,' ').replace(/_/g,' '); }
  // ---------- robust Pokémon sprites ----------
  // Keep the Showdown forme separator (`-`), normalize common league names,
  // and try a small candidate list before giving up.  This matters because
  // the league data contains alternate-form names that do not always map
  // 1:1 to a Showdown gen5 filename.
  const SPRITE_ALIASES = {
    'aegislash':'aegislash-shield',
    'darmanitan':'darmanitan',
    'darmanitan-galar':'darmanitan-galar',
    'darmanitan-galar-zen':'darmanitan-galar-zen',
    'terapagos-middle':'terapagos-terastal',
    'terapagos':'terapagos',
    'keldeo':'keldeo-ordinary',
    'zygarde':'zygarde-50',
    'meloetta':'meloetta-aria',
    'shaymin':'shaymin-land',
    'maushold':'maushold-four',
    'dudunsparce':'dudunsparce-two-segment',
    'oricorio':'oricorio-baile',
    'minior':'minior-red-meteor',
    'tatsugiri':'tatsugiri-curly',
    'wishiwashi':'wishiwashi-solo',
    'eiscue':'eiscue-ice',
    'morpeko':'morpeko-full-belly',
    'palafin':'palafin-zero',
    'basculegion':'basculegion-male',
    'basculegion-m':'basculegion-male',
    'basculegion-f':'basculegion-female',
    'indeedee-m':'indeedee-male',
    'indeedee-f':'indeedee-female',
    'meowstic-m':'meowstic-male',

    'frillish-m':'frillish',
    'frillish-f':'frillish',
    'jellicent-m':'jellicent',
    'jellicent-f':'jellicent'
  };

  function toShowdownId(name){
    return String(name || '').trim().split('-')
      .map(seg => seg.toLowerCase().replace(/[^a-z0-9]/g,''))
      .filter(Boolean).join('-');
  }

  // Keep sprite resolution identical to the Free Agency page:
  // 1) normal Showdown id, 2) fully compact id, 3) Showdown's 0 fallback.
  // This is deliberately simple because Showdown's sprite filenames do not
  // always line up with our league/form aliases.
  function spriteImg(species, cls){
    const safe = escapeHtml(species);
    const id = toShowdownId(species);
    const compact = id.replace(/-/g,'');
    const urls = JSON.stringify([
      'https://play.pokemonshowdown.com/sprites/gen5/' + id + '.png',
      'https://play.pokemonshowdown.com/sprites/gen5/' + compact + '.png',
      'https://play.pokemonshowdown.com/sprites/gen5/0.png'
    ]);
    return `<img class="${cls}" src="https://play.pokemonshowdown.com/sprites/gen5/${id}.png" alt="${safe}" loading="lazy" `+
      `data-sprite-urls="${escapeHtml(urls)}" data-sprite-idx="0" `+
      `onerror="(function(i){var us=JSON.parse(i.dataset.spriteUrls||'[]');var nx=Number(i.dataset.spriteIdx||0)+1;if(nx<us.length){i.dataset.spriteIdx=nx;i.src=us[nx];}else{i.onerror=null;i.style.opacity='.25';}})(this)">`;
  }
  function usernameKey(username){
    return String(username || '')
      .trim()
      .toLowerCase()
      .replace(/\s+/g,'')
      .replace(/[_-]+/g,'');
  }
  function teamFor(username){
    const raw = String(username || '').trim();
    if(!raw) return 'Unknown';
    // First honor the exact lower-cased mapping used by existing saved data.
    const exact = STATE.teamMap[raw.toLowerCase()];
    if(exact) return exact;
    // Then support harmless Showdown username variations such as
    // Dossa_37 / dossa37 without requiring the mapping to be entered twice.
    const key = usernameKey(raw);
    for(const [mappedUser, team] of Object.entries(STATE.teamMap || {})){
      if(usernameKey(mappedUser) === key) return team;
    }
    return raw;
  }
  // groups values that only differ by case/whitespace under one canonical label
  // (the first-seen casing) when "case-insensitive names" is on in Settings —
  // this is what keeps e.g. "Team Fire" and "team fire" from splitting into
  // two separate teams just because they were typed differently at different times.
  function groupKey(value){
    return STATE.settings.caseInsensitiveNames ? value.trim().toLowerCase() : value.trim();
  }
  function extractReplayId(url){
    url = url.trim();
    if(!url) return null;
    url = url.replace(/\.json$/,'').replace(/\/$/,'');
    const m = url.match(/replay\.pokemonshowdown\.com\/([a-z0-9-]+)/i);
    if(m) return m[1];
    // allow bare id paste
    if(/^[a-z0-9-]+$/i.test(url)) return url;
    return null;
  }
  function parseHP(token){
    if(!token) return 0;
    token = token.split(' ')[0]; // strip status tags like "tox", "fnt"
    if(token.includes('/')){
      const [a,b] = token.split('/').map(Number);
      if(!b) return 0;
      return (a/b)*100;
    }
    const v = parseFloat(token);
    return isNaN(v) ? 0 : v;
  }
  function sideOf(slot){ return slot.slice(0,2); } // 'p1' / 'p2'

  // ---------- replay parsing ----------
  function parseLog(json, replayId){
    const lines = json.log.split('\n');
    const players = {p1:'', p2:''};
    const slots = {}; // slotId -> {species, hp, side}
    const mons = {}; // "p1|species" -> stats
    const appearedThisReplay = new Set();
    const teamRoster = {p1:[], p2:[]};
    let lastMove = null; // {source, target, move}
    let currentTurn = 0;
    let winner = null;
    // NOTE: these three all store direct references to a mon's *stats object*
    // (captured at the moment of the event via ensureMon), never a slot label.
    // A slot label like "p1a" gets reused by a different mon later in the game,
    // so resolving it lazily at credit-time would silently attribute damage/
    // kills to whoever happens to be standing there now instead of whoever
    // actually did it.
    let lastAttacker = {}; // targetSlot -> attacker's stats object (for kill credit)
    // Poison/burn (unlike confusion) persist through a switch — the same individual
    // keeps ticking for the same status after it returns to the field. So this is
    // keyed by the *individual mon* (monKey: side+species), not by slot, and is
    // deliberately NOT cleared on switch — only when the status actually ends.
    let statusSourceByMon = {}; // monKey -> stats object that inflicted brn/psn/tox on them
    let hazardSetter = {}; // side -> {hazardName: setter's stats object}
    // side (the side that GOT toxic-spiked) -> setter's stats object.
    // Toxic Spikes are a side-wide condition, so this survives switches/faints
    // and lets residual poison damage inherit kill credit from the setter.
    let toxicSpikesSetter = {};
    let delayedSetter = {}; // side -> {moveName: setter's stats object}, for Future Sight / Doom Desire
    let pendingDelayedHit = {}; // targetSlot -> {stats, cause}; Showdown emits the delayed hit as -end, then an untagged -damage
    const HAZARD_MOVES = ['Stealth Rock','Spikes'];
    const DELAYED_MOVES = ['Future Sight','Doom Desire'];
    const STATUS_TAGS = ['psn','tox','brn'];

    function ofSlotFromTag(tag){
      // tag like "[of] p2a: Ferrothorn" -> "p2a"
      const m = tag.match(/p[1-4][a-f]/);
      return m ? m[0] : null;
    }

    function monKey(slot){
      const s = slots[slot];
      if(!s) return null;
      return s.side + '|' + normName(s.species);
    }
    function ensureMon(slot){
      const s = slots[slot];
      if(!s) return null;
      const k = monKey(slot);
      if(!mons[k]) mons[k] = {
        side:s.side, species:s.species, damageDealt:0, damageTaken:0,
        kills:0, deaths:0, appearances:0, killLog:[], deathLog:[],
        moves: {},
        maxHpObserved: null
      };
      if(s.hp && Number.isFinite(s.hp.max)){
        mons[k].maxHpObserved = Math.max(mons[k].maxHpObserved || 0, s.hp.max);
      }
      if(!appearedThisReplay.has(k)){
        appearedThisReplay.add(k);
        mons[k].appearances += 1;
      }
      return mons[k];
    }


    for(const raw of lines){
      if(!raw.startsWith('|')) continue;
      const parts = raw.split('|');
      const cmd = parts[1];

      if(cmd === 'poke' && parts[3]){
        const side = parts[2];
        const species = parts[3].split(',')[0].trim();
        if((side==='p1'||side==='p2') && species && !teamRoster[side].some(x=>normName(x)===normName(species))) teamRoster[side].push(species);
      } else if(cmd === 'player' && parts[3]){
        const side = parts[2];
        if(side === 'p1' || side === 'p2') players[side] = parts[3];
      } else if(cmd === 'turn'){
        const t = parseInt(parts[2], 10);
        if(!isNaN(t)) currentTurn = t;
      } else if(cmd === 'win'){
        winner = (parts[2] || '').trim() || null;
      } else if(cmd === 'switch' || cmd === 'drag'){
        const slotFull = parts[2]; // "p1a: Nickname"
        const slot = slotFull.split(':')[0].trim();
        const side = sideOf(slot);
        const species = parts[3].split(',')[0].trim();
        const hp = parseHP(parts[4] || '100/100');
        slots[slot] = {species, hp, side};
        // A new mon now occupies this slot — any prior *direct-hit* attacker
        // credit for this slot belonged to the mon that just left, so that must
        // not carry over. Status-source credit (poison/burn) is intentionally
        // NOT cleared here — it lives in statusSourceByMon, keyed to the
        // individual mon rather than the slot, because poison/burn persist
        // through a switch and must keep crediting the original inflictor
        // when the same mon returns and the status keeps ticking.
        delete lastAttacker[slot];
        delete pendingDelayedHit[slot];
        ensureMon(slot);
      } else if(cmd === 'move'){
        const source = parts[2] ? parts[2].split(':')[0].trim() : null;
        const target = parts[4] ? parts[4].split(':')[0].trim() : null;
        const moveName = parts[3] ? parts[3].trim() : '';
        if(source) {
          lastMove = {source, target, move: moveName};
          const moveStats = ensureMon(source);
          if(moveStats && moveName){
            if(!moveStats.moves) moveStats.moves = {};
            moveStats.moves[moveName] = (moveStats.moves[moveName] || 0) + 1;
          }
        }
        if(source && HAZARD_MOVES.includes(moveName)){
          const oppSide = sideOf(source) === 'p1' ? 'p2' : 'p1';
          const setterStats = ensureMon(source);
          if(setterStats){
            if(!hazardSetter[oppSide]) hazardSetter[oppSide] = {};
            hazardSetter[oppSide][moveName] = setterStats;
          }
        }
        if(source && DELAYED_MOVES.includes(moveName)){
          const oppSide = sideOf(source) === 'p1' ? 'p2' : 'p1';
          const setterStats = ensureMon(source);
          if(setterStats){
            if(!delayedSetter[oppSide]) delayedSetter[oppSide] = {};
            delayedSetter[oppSide][moveName] = setterStats;
          }
        }
        if(source && moveName === 'Toxic Spikes'){
          // Toxic Spikes are a side-wide condition. Keep the Pokémon that most
          // recently established the Toxic Spikes on that side so a later
          // switch-in, poison tick, and eventual faint can all inherit the
          // setter's kill credit even if the setter has switched out or fainted.
          const oppSide = sideOf(source) === 'p1' ? 'p2' : 'p1';
          const setterStats = ensureMon(source);
          if(setterStats) toxicSpikesSetter[oppSide] = setterStats;
        }
      } else if(cmd === '-end'){
        // Future Sight / Doom Desire are represented by Showdown as:
        //   |-end|target|move: Future Sight
        //   |-damage|target|...
        // The -damage line is deliberately untagged, so looking for
        // 'Future Sight' in its tags will never work. Resolve the setter
        // at the -end event and carry it into the following damage event.
        const slotFull = parts[2];
        const effect = parts.slice(3).join('|');
        if(slotFull && (effect.includes('move: Future Sight') || effect.includes('move: Doom Desire'))){
          const slot = slotFull.split(':')[0].trim();
          const delayedHit = DELAYED_MOVES.find(m => effect.includes('move: ' + m));
          if(delayedHit && delayedSetter[sideOf(slot)] && delayedSetter[sideOf(slot)][delayedHit]){
            pendingDelayedHit[slot] = {
              stats: delayedSetter[sideOf(slot)][delayedHit],
              cause: delayedHit
            };
          }
        }
      } else if(cmd === '-status'){
        const slotFull = parts[2];
        if(!slotFull) continue;
        const slot = slotFull.split(':')[0].trim();
        const mk = monKey(slot);
        if(!mk) continue;
        const statusTags = parts.slice(3).join('|');
        let inflictorStats = null;
        if(statusTags.includes('Toxic Spikes') && toxicSpikesSetter[sideOf(slot)]){
          // Poisoned on switch-in by Toxic Spikes. There is no attacker's move
          // line for the later residual damage, so permanently associate this
          // individual Pokémon with the Toxic Spikes setter until its status
          // is cured. This is keyed by mon identity rather than slot because
          // the poisoned Pokémon can switch out and back in.
          inflictorStats = toxicSpikesSetter[sideOf(slot)];
        } else if(lastMove && lastMove.target === slot && sideOf(lastMove.source) !== sideOf(slot)){
          inflictorStats = ensureMon(lastMove.source);
        }
        if(inflictorStats) {
          statusSourceByMon[mk] = inflictorStats;
        }
      } else if(cmd === '-curestatus'){
        const slotFull = parts[2];
        if(!slotFull) continue;
        const slot = slotFull.split(':')[0].trim();
        const mk = monKey(slot);
        // status is gone — clear credit so it can't be reused if this individual
        // is somehow attributed residual status damage again later
        if(mk) delete statusSourceByMon[mk];
      } else if(cmd === '-damage'){
        const slotFull = parts[2];
        if(!slotFull) continue;
        const slot = slotFull.split(':')[0].trim();
        if(!slots[slot]) continue;
        const newHp = parseHP(parts[3]);
        const oldHp = slots[slot].hp;
        const dmg = Math.max(0, oldHp - newHp);
        slots[slot].hp = newHp;
        const targetStats = ensureMon(slot);
        if(targetStats) targetStats.damageTaken += dmg;
        if(dmg <= 0) continue;

        const tags = parts.slice(4).join('|');
        let attackerStats = null;
        let cause = null;

        // 1) explicit [of] source (Leech Seed, Rocky Helmet, Rough Skin, Iron Barbs, etc.)
        //    resolved immediately off the current battle state, so it's always accurate
        if(tags.includes('[of]')){
          const ofSlot = ofSlotFromTag(tags);
          if(ofSlot && slots[ofSlot]){
            attackerStats = ensureMon(ofSlot);
            const effectM = tags.match(/\[from\]\s*([^\|\[]+)/);
            cause = effectM ? effectM[1].trim() : 'contact/held-item effect';
          }
        }
        // 2) entry hazard chip (Stealth Rock / Spikes) -> credit whoever set it
        if(!attackerStats){
          const hazardHit = HAZARD_MOVES.find(h => tags.includes(h));
          if(hazardHit && hazardSetter[sideOf(slot)] && hazardSetter[sideOf(slot)][hazardHit]){
            attackerStats = hazardSetter[sideOf(slot)][hazardHit];
            cause = hazardHit;
          }
        }
        // 3) residual status damage (burn/poison/toxic) -> credit whoever inflicted the status.
        // Looked up by the mon's own identity (monKey), not the slot, since poison/burn
        // persist through a switch and must keep crediting the original inflictor even
        // after this individual left and came back to the same or a different slot.
        // This is also what gives a Toxic Spikes setter the kill when poison damage
        // is the final damage instance before fainting.
        if(!attackerStats){
          const statusHit = STATUS_TAGS.find(s => tags.includes('[from] ' + s));
          const mk = monKey(slot);
          if(statusHit && mk && statusSourceByMon[mk]){
            attackerStats = statusSourceByMon[mk];
            const sourceWasToxicSpikes = (
              toxicSpikesSetter[sideOf(slot)] &&
              toxicSpikesSetter[sideOf(slot)] === attackerStats
            );
            cause = sourceWasToxicSpikes
              ? 'Toxic Spikes'
              : 'residual ' + statusHit;
          }
        }
        // 3b) delayed hits (Future Sight / Doom Desire).
        // Showdown puts the move name on a preceding -end event, NOT on the
        // subsequent -damage line, so use the pending source captured there.
        if(!attackerStats && pendingDelayedHit[slot]){
          attackerStats = pendingDelayedHit[slot].stats;
          cause = pendingDelayedHit[slot].cause;
          delete pendingDelayedHit[slot];
        }
        // 4) fallback: direct hit from the most recent move, if it targeted this slot.
        //    Showdown only omits [from]/[of] entirely on a -damage line for a genuine
        //    direct move hit — weather chip, confusion self-hits, recoil, etc. always
        //    carry a tag (just not one of the specific ones matched above). So this
        //    fallback must only fire on a completely untagged line, or it ends up
        //    crediting stale "last real attacker" info to indirect damage it never dealt.
        if(!attackerStats && tags === '' && lastMove && lastMove.target === slot && sideOf(lastMove.source) !== sideOf(slot)){
          attackerStats = ensureMon(lastMove.source);
          cause = lastMove.move || 'direct hit';
        }

        if(attackerStats && attackerStats.side !== slots[slot].side){
          attackerStats.damageDealt += dmg;
          lastAttacker[slot] = {stats: attackerStats, cause, turn: currentTurn};
        } else {
          // This damage instance landed but couldn't be attributed to an opposing
          // mon (environmental chip we couldn't trace, self-inflicted damage, etc.).
          // Clear any earlier attacker on file for this slot — otherwise a mon that
          // survives a real hit and later dies to something untraceable still has
          // the kill wrongly credited to whoever landed that earlier real hit.
          lastAttacker[slot] = {stats:null, cause:'Other', turn:currentTurn};
        }
      } else if(cmd === '-heal' || cmd === '-sethp'){
        const slotFull = parts[2];
        if(!slotFull) continue;
        const slot = slotFull.split(':')[0].trim();
        if(!slots[slot]) continue;
        slots[slot].hp = parseHP(parts[3]);
      } else if(cmd === 'faint'){
        const slotFull = parts[2];
        if(!slotFull) continue;
        const slot = slotFull.split(':')[0].trim();
        if(!slots[slot]) continue;
        const deadStats = ensureMon(slot);
        const killerInfo = lastAttacker[slot];
        const killerStats = killerInfo ? killerInfo.stats : null;
        const credited = !!(killerStats && killerStats.side !== slots[slot].side);
        if(deadStats){
          deadStats.deaths += 1;
          deadStats.deathLog.push({
            replayId, turn: currentTurn,
            killer: credited ? killerStats.species : null,
            cause: credited ? killerInfo.cause : (killerInfo?.cause || 'Other')
          });
        }
        if(credited){
          killerStats.kills += 1;
          killerStats.killLog.push({
            replayId, turn: currentTurn,
            victim: deadStats ? deadStats.species : slots[slot].species,
            cause: killerInfo.cause
          });
        }
        delete lastAttacker[slot];
        delete pendingDelayedHit[slot];
      }
    }

    return { id: replayId, format: json.formatid || json.format || '', uploadtime: json.uploadtime || null,
      players, mons, winner, teamRoster,
      };
  }

  // ---------- processing ----------
  // Automatic season week assignment: weeks run Monday -> Sunday.
  // Week 1 begins on the Monday of the earliest replay in the season.
  // Manual overrides (weekOverride === true) are never touched by this logic.
  function replayTimestamp(replay){
    const raw = replay && replay.uploadtime;
    if(raw == null || raw === '') return NaN;
    const n = Number(raw);
    if(!Number.isNaN(n)){
      // Showdown uploadtime is normally Unix seconds; tolerate milliseconds too.
      return n < 1e12 ? n * 1000 : n;
    }
    const t = Date.parse(raw);
    return Number.isNaN(t) ? NaN : t;
  }

  function mondayStart(ts){
    const d = new Date(ts);
    if(Number.isNaN(d.getTime())) return null;
    d.setHours(0,0,0,0);
    const day = d.getDay(); // Sun=0, Mon=1
    const daysSinceMonday = (day + 6) % 7;
    d.setDate(d.getDate() - daysSinceMonday);
    return d;
  }

  function ensureWeekStart(){
    const dates = Object.values(STATE.replays)
      .map(replayTimestamp)
      .filter(Number.isFinite);
    if(!dates.length) return null;
    // Always derive the season start from the earliest replay. This matters when
    // a bulk import is pasted out of chronological order or an older replay is
    // added later: automatic week numbers must remain chronological.
    const start = mondayStart(Math.min(...dates));
    if(start){
      const iso = start.toISOString().slice(0,10);
      STATE.settings.weekStartDate = iso;
    }
    return start;
  }

  function automaticWeekForReplay(replay){
    const ts = replayTimestamp(replay);
    const start = ensureWeekStart();
    if(!Number.isFinite(ts) || !start) return 'Unassigned';
    const replayWeek = mondayStart(ts);
    const diffDays = Math.floor((replayWeek.getTime() - start.getTime()) / 86400000);
    const weekNum = Math.floor(diffDays / 7) + 1;
    return `Week ${Math.max(1, weekNum)}`;
  }

  function assignAutomaticWeeks(){
    // Manual overrides are sacred. Only automatic assignments are recalculated.
    ensureWeekStart();
    for(const replay of Object.values(STATE.replays)){
      if(!replay.weekOverride){
        replay.week = automaticWeekForReplay(replay);
      }
    }
  }

  async function fetchReplayForImport(id){
    const resp = await fetch(`https://replay.pokemonshowdown.com/${id}.json`);
    if(!resp.ok) throw new Error('replay not found (' + resp.status + ')');
    const json = await resp.json();
    const parsed = parseLog(json, id);
    parsed.uploadtime = json.uploadtime;
    parsed.weekOverride = false;
    parsed.processedAt = Date.now();
    return parsed;
  }

  async function processUrls(urlsRaw, logEl){
    const rawLines = urlsRaw.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
    if(rawLines.length === 0){ appendLog(logEl, 'No links provided.', true); return; }

    // De-duplicate IDs before fetching, while preserving the order in which the
    // user pasted them for the import log. Week assignment itself is based on
    // replay upload timestamps, not paste order.
    const ids = [];
    const seen = new Set();
    let invalid = 0, skipped = 0;
    for(const url of rawLines){
      const id = extractReplayId(url);
      if(!id){ appendLog(logEl, `Could not read a replay id from: ${url}`, true); invalid++; continue; }
      if(seen.has(id) || STATE.replays[id]){
        appendLog(logEl, `Already processed: ${id} — skipped`, false);
        skipped++;
        continue;
      }
      seen.add(id);
      ids.push(id);
    }
    if(!ids.length){
      appendLog(logEl, `Done. 0 added, ${skipped} already had, ${invalid} invalid, 0 failed.`, false);
      return;
    }

    let added = 0, failed = 0;
    const queue = ids.slice();
    const worker = async()=>{
      while(queue.length){
        const id = queue.shift();
        try{
          const parsed = await fetchReplayForImport(id);
          STATE.replays[id] = parsed;
          appendLog(logEl, `✓ ${id}  (${parsed.players.p1 || '?'} vs ${parsed.players.p2 || '?'})`, false, true);
          added++;
        }catch(e){
          appendLog(logEl, `✗ ${id} — ${e.message}`, true);
          failed++;
        }
      }
    };
    // Fetch several replays at once so a large bulk import does not take forever,
    // while avoiding an unbounded burst of requests.
    await Promise.all(Array.from({length: Math.min(6, ids.length)}, worker));

    // Assign ALL automatic weeks only after the complete bulk is loaded. This
    // makes the result deterministic regardless of paste order or fetch timing.
    if(added > 0){
      assignAutomaticWeeks();
      await saveSettings();
      await saveReplays();
    }
    await logAdminAction(
      'process_replays',
      `Processed replays: ${added} added, ${skipped} skipped, ${invalid} invalid, ${failed} failed.`,
      {added, skipped, invalid, failed}
    );
    appendLog(logEl, `Done. ${added} added, ${skipped} already had, ${invalid} invalid, ${failed} failed.`, false);
    renderTicker();
    render();
  }
  function appendLog(el, text, isErr, isOk){
    const line = document.createElement('div');
    line.className = isErr ? 'err' : (isOk ? 'ok' : '');
    line.textContent = text;
    el.appendChild(line);
    el.scrollTop = el.scrollHeight;
  }

  // ---------- aggregation ----------
  function allReplays(weekFilter){
    return Object.values(STATE.replays).filter(r => !weekFilter || weekFilter === 'ALL' || r.week === weekFilter);
  }
  function weeksList(){
    const set = new Set(Object.values(STATE.replays).map(r=>r.week || 'Unassigned'));
    return Array.from(set).sort();
  }
  function globalPokemonStats(weekFilter){
    const out = {}; // normSpecies -> {species, dealt, taken, kills, deaths, games, coaches}
    for(const r of allReplays(weekFilter)){
      if(!r || !r.mons || !r.players) continue;
      for(const k in r.mons){
        const m = r.mons[k];
        const nk = normName(m.species);
        if(!out[nk]) out[nk] = {species:m.species, dealt:0, taken:0, kills:0, deaths:0, games:0, killLog:[], deathLog:[], coaches:new Set()};
        out[nk].dealt += m.damageDealt;
        out[nk].taken += m.damageTaken;
        out[nk].kills += m.kills;
        out[nk].deaths += m.deaths;
        out[nk].games += m.appearances;
        if(m.killLog) out[nk].killLog.push(...m.killLog);
        if(m.deathLog) out[nk].deathLog.push(...m.deathLog);
        out[nk].coaches.add(teamFor(r.players[m.side]));
      }
    }
    return Object.values(out).sort((a,b)=>b.dealt-a.dealt);
  }
  function teamPokemonStats(weekFilter){
    const groups = {}; // groupKey -> { label, species: {normSpecies -> stats} }
    for(const r of allReplays(weekFilter)){
      if(!r || !r.mons || !r.players) continue;
      for(const side of ['p1','p2']){
        const team = teamFor(r.players[side]);
        const gk = groupKey(team);
        if(!groups[gk]) groups[gk] = { label: team, species: {} };
        const bucket = groups[gk].species;
        for(const k in r.mons){
          const m = r.mons[k];
          if(m.side !== side) continue;
          const nk = normName(m.species);
          if(!bucket[nk]) bucket[nk] = {species:m.species, dealt:0, taken:0, kills:0, deaths:0, games:0, killLog:[], deathLog:[]};
          bucket[nk].dealt += m.damageDealt;
          bucket[nk].taken += m.damageTaken;
          bucket[nk].kills += m.kills;
          bucket[nk].deaths += m.deaths;
          bucket[nk].games += m.appearances;
          if(m.killLog) bucket[nk].killLog.push(...m.killLog);
          if(m.deathLog) bucket[nk].deathLog.push(...m.deathLog);
        }
      }
    }
    const out = {};
    for(const gk in groups) out[groups[gk].label] = groups[gk].species;
    return out;
  }
  // ---------- duplicate detection (Settings) ----------
  // Normalizes a username so that things like "dossa37"/"dossa_37" (punctuation
  // difference) and "podraa"/"podrrraaa" (repeated-letter typo) collapse to the
  // same key: strip anything that isn't a letter/digit, then collapse any run of
  // the same character down to one (so "rrr"/"aaa" runs match a single r/a).
  function fuzzyKey(u){
    return (u||'').toLowerCase().replace(/[^a-z0-9]/g,'').replace(/(.)\1+/g,'$1');
  }
  function usernameGameCounts(){
    const counts = {};
    for(const r of Object.values(STATE.replays)){
      if(!r || !r.players) continue;
      for(const side of ['p1','p2']){
        const u = (r.players[side]||'').trim();
        if(!u) continue;
        const key = u.toLowerCase();
        counts[key] = (counts[key]||0) + 1;
      }
    }
    return counts;
  }
  // returns groups of raw usernames that look like the same person typed differently
  function findDuplicatePlayerGroups(){
    const seen = {}; // lowercase username -> raw display username (first seen casing)
    for(const r of Object.values(STATE.replays)){
      if(!r || !r.players) continue;
      for(const side of ['p1','p2']){
        const u = (r.players[side]||'').trim();
        if(!u) continue;
        const key = u.toLowerCase();
        if(!seen[key]) seen[key] = u;
      }
    }
    const counts = usernameGameCounts();
    const byFuzzy = {};
    for(const key in seen){
      const fk = fuzzyKey(key);
      if(!fk) continue;
      if(!byFuzzy[fk]) byFuzzy[fk] = [];
      byFuzzy[fk].push(seen[key]);
    }
    const groups = [];
    for(const fk in byFuzzy){
      const usernames = byFuzzy[fk];
      if(usernames.length < 2) continue;
      // skip groups that are already fully merged (all mapped to the same team)
      const teams = new Set(usernames.map(u=>teamFor(u)));
      if(teams.size <= 1) continue;
      const sorted = usernames.slice().sort((a,b)=> (counts[b.toLowerCase()]||0) - (counts[a.toLowerCase()]||0) || a.localeCompare(b));
      groups.push({ usernames: sorted, canonical: sorted[0], counts });
    }
    return groups.sort((a,b)=> a.canonical.localeCompare(b.canonical));
  }
  function mergePlayerGroup(usernames, canonicalLabel){
    for(const u of usernames){
      STATE.teamMap[u.trim().toLowerCase()] = canonicalLabel;
    }
  }
  // returns pairs of current team labels whose Pokémon rosters overlap heavily —
  // in a draft league each team's roster is fixed, so two "different" team tags
  // sharing most of the same mons are almost certainly the same team typed two ways
  function findDuplicateTeamPairs(){
    const teams = teamPokemonStats('ALL');
    const labels = Object.keys(teams);
    const rosterOf = {}; // label -> Set(normSpecies)
    const gamesOf = {}; // label -> total appearances (for picking the canonical tag)
    for(const label of labels){
      rosterOf[label] = new Set(Object.keys(teams[label]));
      gamesOf[label] = Object.values(teams[label]).reduce((sum,s)=>sum+s.games,0);
    }
    const pairs = [];
    for(let i=0;i<labels.length;i++){
      for(let j=i+1;j<labels.length;j++){
        const a = labels[i], b = labels[j];
        const ra = rosterOf[a], rb = rosterOf[b];
        if(ra.size < 2 || rb.size < 2) continue;
        let overlap = 0;
        for(const sp of ra) if(rb.has(sp)) overlap++;
        const ratio = overlap / Math.min(ra.size, rb.size);
        if(ratio >= 0.5 && overlap >= 2){
          const [bigger, smaller] = gamesOf[a] >= gamesOf[b] ? [a,b] : [b,a];
          pairs.push({ bigger, smaller, overlap, ratio, biggerGames: gamesOf[bigger], smallerGames: gamesOf[smaller] });
        }
      }
    }
    return pairs.sort((x,y)=> y.ratio - x.ratio);
  }
  // maps every raw username currently resolving to `label` back to that username,
  // so a team-roster merge can point all of them at the canonical label too
  function usernamesForTeamLabel(label){
    const out = new Set();
    for(const r of Object.values(STATE.replays)){
      if(!r || !r.players) continue;
      for(const side of ['p1','p2']){
        const u = (r.players[side]||'').trim();
        if(u && teamFor(u) === label) out.add(u);
      }
    }
    return Array.from(out);
  }

  // ---------- CSV export ----------
  function download(filename, text){
    const blob = new Blob([text], {type:'text/csv;charset=utf-8;'});
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = filename;
    link.click();
  }
  function toCSV(rows){
    return rows.map(r => r.map(v=>{
      const s = String(v);
      return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
    }).join(',')).join('\n');
  }
  function exportGlobalCSV(weekFilter, label){
    const stats = globalPokemonStats(weekFilter);
    const rows = [['Pokemon','Total Damage Dealt','Avg Damage Dealt per Game','Games Played']];
    stats.forEach(s => rows.push([s.species, s.dealt.toFixed(2), (s.games? (s.dealt/s.games):0).toFixed(2), s.games]));
    download(`Damage Leaderboard - ${label}.csv`, toCSV(rows));
  }
  function exportTeamCSVs(weekFilter, label){
    const teams = teamPokemonStats(weekFilter);
    for(const team in teams){
      const rows = [['Pokemon','Total Damage Dealt','Total Damage Taken','Total Kills','Total Deaths','Appearances']];
      const list = Object.values(teams[team]).sort((a,b)=>b.dealt-a.dealt);
      list.forEach(s => rows.push([s.species, s.dealt.toFixed(2), s.taken.toFixed(2), s.kills, s.deaths, s.games]));
      download(`${team} - ${label}.csv`, toCSV(rows));
    }
  }
  // ---------- rendering ----------
  const contentEl = document.getElementById('content');
  const tabsEl = document.getElementById('tabs');
  let activeTab = 'process';

  tabsEl.addEventListener('click', (e)=>{
    if(e.target.tagName !== 'BUTTON') return;
    activeTab = e.target.dataset.tab;
    [...tabsEl.children].forEach(b=>b.classList.toggle('active', b.dataset.tab===activeTab));
    render();
  });

  function renderTicker(){
    const ticker = document.getElementById('ticker');
    if(!ticker) return;
    const top = globalPokemonStats('ALL').slice(0,6);
    if(top.length === 0){
      ticker.innerHTML = `<div class="tick empty"><div class="lbl">Season</div><div class="val">No games processed yet</div></div>`;
      return;
    }
    ticker.innerHTML = top.map(s => `
      <div class="tick">
        <div class="lbl">Dmg Dealt</div>
        <div class="pname-cell">${spriteImg(s.species,'sprite')}<div>
          <div class="name">${escapeHtml(s.species)}</div>
          <div class="val">${s.dealt.toFixed(0)}%</div>
        </div></div>
      </div>`).join('');
  }

  function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  // ---------- kill/death audit trail ----------
  // Encodes a mon's kill or death log onto a table cell so it can be clicked open
  // to see exactly which replay/turn/cause each credited kill or death came from —
  // lets you trace a count against a hand-kept tally without me having to guess.
  function auditAttr(species, type, list, showLink){
    const payload = JSON.stringify({species, type, list: list || [], showLink: showLink !== false});
    return `class="num ${type==='kills'?'kills ':''}auditable" data-audit="${escapeHtml(payload)}"`;
  }
  // same payload as auditAttr but without the class="" — for elements (like the
  // Golden Fist row) that already carry their own class list
  function auditDataAttr(species, type, list, showLink){
    const payload = JSON.stringify({species, type, list: list || [], showLink: showLink !== false});
    return `data-audit="${escapeHtml(payload)}"`;
  }
  function closeAudit(){
    const el = document.getElementById('auditModal');
    if(el) el.innerHTML = '';
  }
  function openAudit(species, type, list, showLink){
    showLink = showLink !== false;
    const label = type === 'kills' ? 'Kills' : 'Deaths';
    const rows = (list || []).slice().sort((a,b)=> (a.replayId||'').localeCompare(b.replayId||'') || (a.turn-b.turn));
    document.getElementById('auditModal').innerHTML = `
      <div class="audit-overlay" id="auditOverlay">
        <div class="audit-box">
          <h3>${escapeHtml(species)} — ${label} (${rows.length})</h3>
          <div class="audit-sub">Every ${type==='kills'?'kill':'death'} credited to this Pokémon this scope, with the turn${showLink?', replay,':''} and why it was credited.</div>
          ${rows.length===0 ? `<div class="empty-state">No entries.</div>` : `<ul class="audit-list">

  async function reprocessAll(logEl){
    const ids = Object.keys(STATE.replays);
    let ok=0, failed=0;
    for(const id of ids){
      const oldReplay = STATE.replays[id];
      try{
        const resp = await fetch(`https://replay.pokemonshowdown.com/${id}.json`);
        if(!resp.ok) throw new Error('not found (' + resp.status + ')');
        const json = await resp.json();
        const parsed = parseLog(json, id);
        parsed.uploadtime = json.uploadtime;
        // Preserve a manual week exactly. Failed fetch/parse leaves oldReplay
        // untouched, so reprocessing can never destroy an existing replay.
        parsed.weekOverride = !!oldReplay.weekOverride;
        parsed.week = oldReplay.weekOverride
          ? (oldReplay.week || 'Unassigned')
          : automaticWeekForReplay(parsed);
        parsed.processedAt = oldReplay.processedAt;
        STATE.replays[id] = parsed;
        appendLog(logEl, `✓ reprocessed ${id}`, false, true);
        ok++;
      }catch(e){
        appendLog(logEl, `✗ ${id} — ${e.message} (existing replay preserved)`, true);
        failed++;
      }
    }
    if(ok > 0){
      assignAutomaticWeeks();
      await saveSettings();
      await saveReplays();
    }
    await logAdminAction(
      'reprocess_replays',
      `Reprocessed all replays: ${ok} updated, ${failed} failed.`,
      {updated: ok, failed}
    );
    appendLog(logEl, `Reprocess complete. ${ok} updated, ${failed} failed.`, false);
    renderTicker();
    render();
  }

  function rosterKey(s){
    return String(s||'').trim().toLowerCase().replace(/[\s_-]+/g,'');
  }

  function normalizeRosterName(name){
    return String(name || '').replace(/[_]+/g,' ').replace(/\s+/g,' ').trim();
  }

  function parseRosterWorkbook(wb){
    const out = {};
    const teamHeaders = ['team','franchise','team name','franchise name'];
    const monHeaders = ['pokemon','pokémon','species','pokemon species','pick','roster'];

    for(const sheetName of wb.SheetNames){
      const sheet = wb.Sheets[sheetName];
      if(!sheet) continue;

      const rows = XLSX.utils.sheet_to_json(sheet,{header:1,defval:''});
      if(!rows.length) continue;

      const headers = rows[0].map(v => String(v).trim().toLowerCase());
      const teamCol = headers.findIndex(h => teamHeaders.includes(h));
      const monCol = headers.findIndex(h => monHeaders.includes(h));

      // The attached Season 15 workbook uses one team per sheet, with
      // points in Column A and Pokémon in Column C. Preserve those points.
      const isPointAndNameLayout = rows.some(row =>
        !Number.isNaN(Number(row?.[0])) && String(row?.[2] ?? '').trim()
      );

      if(isPointAndNameLayout){
        const team = normalizeRosterName(sheetName);
        const mons = [];
        for(const row of rows){
          const name = normalizeRosterName(row?.[2]);
          const points = Number(row?.[0]);
          if(!name || Number.isNaN(points)) continue;
          if(!mons.some(x => rosterKey(x.name) === rosterKey(name))){
            mons.push({name, points});
          }
        }
        if(team && mons.length) out[team] = mons;
        continue;
      }

      // Also support the more generic Team/Franchise + Pokémon/Species format.
      const defaultTeam = normalizeRosterName(sheetName);
      for(let r=1;r<rows.length;r++){
        const row=rows[r];
        const team=normalizeRosterName(teamCol>=0 ? row[teamCol] : defaultTeam);
        if(!team) continue;

        const values=[];
        if(monCol>=0){
          const value=normalizeRosterName(row[monCol]);
          if(value) values.push({name:value, points:null});
        }else{
          for(let c=0;c<row.length;c++){
            if(c===teamCol) continue;
            const value=normalizeRosterName(row[c]);
            if(value) values.push({name:value, points:null});
          }
        }

        if(!out[team]) out[team]=[];
        values.forEach(mon=>{
          if(/^(pokemon|pokémon|species|name|pick|roster)$/i.test(mon.name)) return;
          if(!out[team].some(x=>rosterKey(x.name)===rosterKey(mon.name))){
            out[team].push(mon);
          }
        });
      }
    }

    Object.keys(out).forEach(team=>{
      out[team].sort((a,b)=>a.name.localeCompare(b.name));
      if(!out[team].length) delete out[team];
    });
    return out;
  }

  function normalizeStoredRosters(rosters){
    const out = {};
    for(const [team, list] of Object.entries(rosters || {})){
      out[team] = (Array.isArray(list) ? list : []).map(mon => {
        if(typeof mon === 'string') return {name:mon, points:null};
        return {name:String(mon?.name ?? ''), points:mon?.points ?? null};
      }).filter(mon => mon.name);
    }
    return out;
  }

  }

  async function publishRosters(rosters){
    const normalized = normalizeStoredRosters(rosters);
    if(!Object.keys(normalized).length) throw new Error('No rosters to publish.');

    STATE.settings = STATE.settings || {};
    STATE.settings.rosters = normalized;

    // These two writes intentionally remain separate: dashboard state contains
    // all admin settings, while __rosters__ is the public roster-page contract.
    await saveSharedState();
    await savePublishedRosters(normalized);
    await logAdminAction(
      'publish_rosters',
      `Published rosters for ${Object.keys(normalized).length} franchise${Object.keys(normalized).length===1?'':'s'}.`,
      {franchises:Object.keys(normalized), rosterCounts:Object.fromEntries(Object.entries(normalized).map(([team,list])=>[team,list.length]))}
    );
  }

  function draftTypeKey(name){
    return String(name || '')
      .trim().toLowerCase()
      .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
      .replace(/[’']/g,'')
      .replace(/[.]/g,'')
      .replace(/[♀]/g,'-f')
      .replace(/[♂]/g,'-m')
      .replace(/[_\s]+/g,'-')
      .replace(/-+/g,'-')
      .replace(/^-|-$/g,'');
  }

  function draftApiSlug(name){
    const key=draftTypeKey(name);
    return POKEMON_API_ALIASES[key] || key;
  }

  function loadDraftTypeCache(){
    try{
      const raw=localStorage.getItem(DRAFT_TYPE_CACHE_KEY);
      const parsed=raw ? JSON.parse(raw) : {};
      return parsed && typeof parsed==='object' ? parsed : {};
    }catch(e){
      return {};
    }
  }

  let DRAFT_TYPE_CACHE=loadDraftTypeCache();

  function saveDraftTypeCache(){
    try{
      localStorage.setItem(DRAFT_TYPE_CACHE_KEY, JSON.stringify(DRAFT_TYPE_CACHE));
    }catch(e){
      // localStorage can be unavailable/full; the draft still works.
    }
  }

  function cacheDraftTypes(name, types){
    const key=draftTypeKey(name);
    if(!key || !Array.isArray(types) || !types.length) return;
    DRAFT_TYPE_CACHE[key]=types.slice();
  }

  function seedDraftTypeCache(pool){
    let changed=false;
    for(const mon of (Array.isArray(pool) ? pool : [])){
      if(Array.isArray(mon?.types) && mon.types.length){
        const key=draftTypeKey(mon.name);
        if(key && !DRAFT_TYPE_CACHE[key]){
          DRAFT_TYPE_CACHE[key]=mon.types.slice();
          changed=true;
        }
      }
    }
    if(changed) saveDraftTypeCache();
  }

  function getCachedDraftTypes(name){
    const key=draftTypeKey(name);
    const cached=DRAFT_TYPE_CACHE[key];
    return Array.isArray(cached) && cached.length ? cached.slice() : null;
  }

  async function fetchPokemonTypesUncached(name){
    const original=String(name || '').trim();
    const key=draftTypeKey(original);

    if(POKEMON_TYPE_FALLBACKS[key]){
      return POKEMON_TYPE_FALLBACKS[key].slice();
    }

    const slug=draftApiSlug(original);
    if(!slug) throw new Error(`Could not determine typing for ${original}.`);

    const response=await fetch(
      `https://pokeapi.co/api/v2/pokemon/${encodeURIComponent(slug)}`
    );

    if(!response.ok){
      throw new Error(`Could not determine typing for ${original}.`);
    }

    const data=await response.json();
    const types=(data.types || [])
      .sort((a,b)=>Number(a.slot||0)-Number(b.slot||0))
      .map(t=>String(t.type?.name||''))
      .filter(Boolean)
      .map(t=>t.charAt(0).toUpperCase()+t.slice(1));

    if(!types.length){
      throw new Error(`Could not determine typing for ${original}.`);
    }

    return types;
  }

  async function resolveDraftTypes(names,statusEl){
    const unique=[];
    const seen=new Set();

    for(const name of names){
      const key=draftTypeKey(name);
      if(key && !seen.has(key)){
        seen.add(key);
        unique.push({name,key});
      }
    }

    const missing=unique.filter(x=>!getCachedDraftTypes(x.name));
    const cachedCount=unique.length-missing.length;

    if(statusEl){
      statusEl.innerHTML=`<div class="note">Typing cache: ${cachedCount} cached, ${missing.length} to look up…</div>`;
    }

    const failures=[];
    let completed=0;

    // Resolve missing entries concurrently, but cap concurrency so the API
    // isn't flooded. Cached entries never make a network request.
    let cursor=0;
    async function worker(){
      while(cursor<missing.length){
        const item=missing[cursor++];
        try{
          const types=await fetchPokemonTypesUncached(item.name);
          cacheDraftTypes(item.name,types);
        }catch(error){
          failures.push({name:item.name,error});
        }
        completed++;
        if(statusEl){
          statusEl.innerHTML=`<div class="note">Assigning typings… ${cachedCount+completed}/${unique.length} (${missing.length} new lookups)</div>`;
        }
      }
    }

    const workers=Array.from({length:Math.min(DRAFT_TYPE_LOOKUP_CONCURRENCY,missing.length)},()=>worker());
    await Promise.all(workers);

    saveDraftTypeCache();

    if(failures.length){
      throw new Error(`Could not determine typing for: ${failures.map(x=>x.name).join(', ')}`);
    }

    return new Map(unique.map(x=>[x.key,getCachedDraftTypes(x.name)]));
  }

  async function assignDraftTypes(pool,statusEl){
    seedDraftTypeCache(pool);

    const typeMap=await resolveDraftTypes(
      pool.map(m=>m.name),
      statusEl
    );

    return pool.map(mon=>({
      ...mon,
      types:typeMap.get(draftTypeKey(mon.name)) || []
    }));
  }

        d.status = 'complete';

        await saveDraft();
        // Publish the roster snapshot immediately so the public roster page is finalized.
        await savePublishedRosters(STATE.settings.rosters || {});

  // ---------- Free Agency ----------
  // Free Agency deliberately uses the same shared dashboard-state mechanism as
  // the existing roster importer. It does not create a replay row or alter any
  // replay/stat processing logic.
  function normalizeFreeAgencyName(name){
    return String(name ?? '')
      .replace(/[’']/g, '')
      .replace(/[_]+/g, ' ')
      .replace(/\s+/g, ' ')
      .trim();
  }

  function freeAgencyKey(name){
    return normalizeFreeAgencyName(name)
      .toLowerCase()
      .replace(/[^a-z0-9]+/g, '');
  }

  function parseFreeAgencyWorkbook(wb){
    if(!wb?.SheetNames?.length) throw new Error('The workbook has no worksheets.');

    const sheetName=wb.SheetNames.find(n=>String(n).trim().toLowerCase()==='draft board');
    if(!sheetName) throw new Error('Could not find a "DRAFT BOARD" sheet.');

    const rows=XLSX.utils.sheet_to_json(wb.Sheets[sheetName],{header:1,defval:''});
    let header=-1;
    for(let r=0;r<Math.min(rows.length,20);r++){
      if((rows[r]||[]).some(v=>/^\s*\d+\s*POINTS?\s*$/i.test(String(v??'')))){header=r;break;}
    }
    if(header<0) throw new Error('Could not find point columns such as "20 POINTS", "19 POINTS", etc.');

    const out=[]; const seen=new Set();
    for(let c=0;c<(rows[header]||[]).length;c++){
      const h=String(rows[header]?.[c]??'').trim();
      const match=h.match(/^\s*(\d+)\s*POINTS?\s*$/i);
      if(!match) continue;
      const points=Number(match[1]);
      for(let r=header+1;r<rows.length;r++){
        const name=normalizeFreeAgencyName(rows[r]?.[c]);
        if(!name || /^(pokemon|pokémon|species|name|pick|roster)$/i.test(name)) continue;
        const key=freeAgencyKey(name);
        if(!key || seen.has(key)) continue;
        seen.add(key); out.push({name,points});
      }
    }
    if(!out.length) throw new Error('No Pokémon were found on the DRAFT BOARD.');
    return out.sort((a,b)=>b.points-a.points||a.name.localeCompare(b.name));
  }

  async function publishFreeAgency(pool,sourceName){
    requireAdmin();
    const mons=pool.map(m=>({name:String(m.name||'').trim(),points:Number(m.points)||0})).filter(m=>m.name);
    if(!mons.length) throw new Error('Free Agency pool is empty.');
    STATE.settings=STATE.settings||{};
    STATE.settings.freeAgency={mons,source:String(sourceName||'DRAFT BOARD'),updatedAt:new Date().toISOString()};
    await saveSharedState();
    await logAdminAction('publish_free_agency', `Published Free Agency with ${mons.length} Pokémon from ${String(sourceName||'DRAFT BOARD')}.`, {count:mons.length, source:String(sourceName||'DRAFT BOARD')});
  }

  // ---------- Commissioner: team-claim approvals + trade oversight ----------
  // These read/write the `profiles` and `trade_requests` tables. Commissioners
  // can approve/reject Free Agency requests, reset resolved trades, and revert
  // accepted trades. Team-to-team acceptance remains handled by accept_trade().
  let COMM_PROFILES = null;
  let COMM_TRADES = null;
  let COMM_TRADE_FILTER = 'pending';
  let ADMIN_TRADE_SEASON = new Date().getFullYear();

  let COMM_TRADE_LIMITS = [];

  async function loadCommissionerData(){
    const [{data:profilesData, error:profErr}, {data:tradesData, error:tradeErr}, {data:limitsData, error:limitErr}] = await Promise.all([
      supabase.from('profiles').select('*').order('created_at', {ascending:false}),
      supabase.from('trade_requests').select('*').order('created_at', {ascending:false}),
      supabase.from('franchise_trade_limits').select('*').eq('season', ADMIN_TRADE_SEASON).order('team_name')
    ]);
    if(profErr) throw profErr;
    if(tradeErr) throw tradeErr;
    if(limitErr) throw limitErr;
    COMM_PROFILES = profilesData || [];
    COMM_TRADES = tradesData || [];
    COMM_TRADE_LIMITS = limitsData || [];
  }

  async function saveManualTradeCredits(){
    STATE.settings = STATE.settings || {};
    STATE.settings.tradeCredits = STATE.settings.tradeCredits || {};
    await saveSharedState();
  }

  function manualTradeCreditsFor(profileId){
    STATE.settings = STATE.settings || {};
    STATE.settings.tradeCredits = STATE.settings.tradeCredits || {};
    return Math.max(0, Number(STATE.settings.tradeCredits[profileId]) || 0);
  }

              ${profiles.map(p=>`<option value="${escapeHtml(p.id)}">${escapeHtml(p.team_name || p.email || p.id)}${p.email ? ` — ${escapeHtml(p.email)}` : ''}</option>`).join('')}
