<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Free Agency</title>
<style>
:root{--bg:#081525;--panel:#0e2138;--panel2:#132c48;--border:#2a4a69;--text:#eef6ff;--dim:#9eb4ca;--accent:#6fa8dc;--good:#8fdbb2;--taken:#72839a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px 'Segoe UI',Arial,sans-serif}#app{width:calc(100% - 40px);max-width:1800px;margin:auto;padding:70px 0 70px}.page-nav{position:fixed;top:14px;right:18px;z-index:1000;display:flex;align-items:center;gap:7px}.page-nav label{font-size:11px;color:var(--dim);font-weight:700}.page-nav select{font:inherit;font-size:12px;padding:7px 30px 7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--panel);color:var(--text)}header{margin-bottom:22px}h1{margin:0 0 5px;font-size:30px}.sub{color:var(--dim)}.toolbar{display:flex;gap:12px;align-items:end;flex-wrap:wrap;margin:18px 0}.toolbar>div{min-width:190px}.toolbar label{display:block;color:var(--dim);font-size:11px;text-transform:uppercase;font-weight:700;margin-bottom:6px}.toolbar select,.toolbar input{width:100%;padding:10px;border:1px solid var(--border);border-radius:8px;background:var(--panel);color:var(--text)}.panel{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:16px}.summary{display:flex;gap:14px;flex-wrap:wrap}.stat{background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:12px 16px}.stat b{font-size:20px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}.mon{border:1px solid var(--border);background:var(--panel2);border-radius:12px;padding:12px;cursor:pointer;transition:.12s;min-height:150px}.mon:hover{transform:translateY(-1px);border-color:var(--accent)}.mon.taken{opacity:.55;cursor:not-allowed;filter:grayscale(.5)}.mon.selected{border-color:var(--accent);box-shadow:0 0 0 2px rgba(111,168,220,.18)}.mon img{width:90px;height:90px;object-fit:contain;display:block;margin:auto}.name{text-align:center;font-weight:700}.meta{text-align:center;color:var(--dim);font-size:11px;margin-top:4px}.status{text-align:center;font-size:11px;margin-top:7px}.undrafted{color:var(--good)}.taken-label{color:var(--taken)}.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;padding:20px;z-index:2000}.modalbox{width:min(560px,100%);background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:20px}.modalbox h2{margin-top:0}.modalbox label{display:block;color:var(--dim);font-size:11px;text-transform:uppercase;font-weight:700;margin:12px 0 6px}.modalbox select{width:100%;padding:10px;background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:8px}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.btn{padding:9px 14px;border-radius:8px;border:1px solid var(--border);background:var(--panel2);color:var(--text);cursor:pointer}.btn.primary{background:var(--accent);color:#07111d;border-color:var(--accent);font-weight:700}.note{color:var(--dim);font-size:12px;line-height:1.5}@media(max-width:600px){#app{width:calc(100% - 20px);padding-top:60px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head><body>
<div class="page-nav"><label for="pageNavSelect">Page</label><select id="pageNavSelect"><option value="index.html">Stats Dashboard</option><option value="rosters.html">Rosters</option><option value="team-analysis.html">Team Analysis</option><option value="free-agency.html">Free Agency</option></select></div>
<div id="app"><header><h1>Free Agency</h1><div class="sub">Undrafted Pokémon are selectable. Pokémon currently on a roster are highlighted as taken.</div></header><div id="main"></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
(()=>{
const URL='https://dfxdkkemltukxaklhcpo.supabase.co',KEY='sb_publishable_H7iIBjJTxY77lBAcpJn2VQ_u2hAG2CN',db=window.supabase.createClient(URL,KEY);let settings={rosters:{},freeAgency:{mons:[]}};
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const key=s=>String(s||'').trim().toLowerCase().replace(/[^a-z0-9]+/g,'');
function entries(){const a=[];for(const [team,mons] of Object.entries(settings.rosters||{}))for(const raw of mons||[]){const m=typeof raw==='string'?{name:raw,points:0}:raw||{};if(m.name)a.push({team,name:String(m.name),points:Number(m.points)||0})}return a}
function owner(name){const k=key(name);return entries().find(x=>key(x.name)===k)||null}
function spriteCandidates(name){const n=String(name||'').trim().toLowerCase();const base=n.replace(/[♀♂]/g,'').replace(/['’]/g,'').replace(/\s+/g,'-');const compact=base.replace(/-/g,'');const special={'mr-mime-galar':'mrmime-galar','mr-mime':'mrmime','landorus-incarnate':'landorus','landorus-i':'landorus','landorus-t':'landorus-therian','gouging-fire':'gougingfire','scream-tail':'screamtail'};return [...new Set([special[base]||base,compact])].filter(Boolean)}
function sprite(name){const c=spriteCandidates(name);let i=0;return `<img src="https://play.pokemonshowdown.com/sprites/gen9/${c[0]}.png" alt="${esc(name)}" data-sprite-cands="${esc(c.join('|'))}" onerror="if(this.dataset.i==='1'){this.style.visibility='hidden'}else{this.dataset.i='1';this.src='https://play.pokemonshowdown.com/sprites/gen9/'+this.dataset.spriteCands.split('|')[1]+'.png'}">`}
function openPlanner(mon){const teams=Object.keys(settings.rosters||{}).sort();const modal=document.createElement('div');modal.className='modal';modal.innerHTML=`<div class="modalbox"><h2>${esc(mon.name)} — ${mon.points} points</h2><div class="note">This is a trade planner. Completing the actual trade is done from Admin → Trades, where the roster and all downstream pages are updated together.</div><label>Destination team</label><select id="planTeam"><option value="">Select team…</option>${teams.map(t=>`<option>${esc(t)}</option>`).join('')}</select><label>Replace Pokémon</label><select id="planReplace"><option value="">No replacement</option></select><div id="planBudget" class="note" style="margin-top:10px"></div><div class="actions"><button class="btn" id="closePlan">Cancel</button><button class="btn primary" id="openAdmin">Open Admin Trades</button></div></div>`;document.body.appendChild(modal);const ts=modal.querySelector('#planTeam'),rs=modal.querySelector('#planReplace'),bud=modal.querySelector('#planBudget');function upd(){const arr=(settings.rosters||{})[ts.value]||[];rs.innerHTML='<option value="">No replacement</option>'+arr.map(x=>{const m=typeof x==='string'?{name:x,points:0}:x;return `<option value="${esc(m.name)}">${esc(m.name)} — ${Number(m.points)||0} pts</option>`}).join('');const rep=arr.find(x=>key(typeof x==='string'?x:x.name)===key(rs.value));const spend=arr.reduce((a,x)=>a+(Number(typeof x==='string'?0:x.points)||0),0);const after=spend+mon.points-(rep?Number(rep.points)||0:0);bud.innerHTML=ts.value?`Current: ${spend} pts · After trade: ${after} pts · Remaining: ${120-after} pts`:''}ts.onchange=upd;rs.onchange=upd;modal.querySelector('#closePlan').onclick=()=>modal.remove();modal.querySelector('#openAdmin').onclick=()=>location.href='admin.html';}
async function load(){
  const {data,error}=await db
    .from('replays')
    .select('replay_data')
    .eq('replay_id','__free_agency__')
    .maybeSingle();

  if(error) throw error;

  const payload=data?.replay_data||{};
  const mons=Array.isArray(payload.mons)
    ? payload.mons
    : (Array.isArray(payload.pool) ? payload.pool : []);

  // Load roster data separately. A roster failure must never blank Free Agency.
  let rosters={};
  try{
    const rosterResult=await db
      .from('replays')
      .select('replay_data')
      .eq('replay_id','__rosters__')
      .maybeSingle();

    if(!rosterResult.error){
      rosters=rosterResult.data?.replay_data?.rosters||{};
    }
  }catch(e){
    console.warn('Free Agency roster lookup failed; continuing without roster ownership:',e);
  }

  settings={
    rosters,
    freeAgency:{
      mons
    },
    freeAgencySource:payload.source||''
  };

  render();
}

function render(){const mons=Array.isArray(settings.freeAgency?.mons)
  ? settings.freeAgency.mons
  : (Array.isArray(settings.freeAgency?.pool)
      ? settings.freeAgency.pool
      : []);const filter=window._filter||'';const visible=mons.filter(m=>String(m.name).toLowerCase().includes(filter.toLowerCase()));const taken=visible.filter(m=>owner(m.name)),free=visible.filter(m=>!owner(m.name));$('main').innerHTML=`<div class="panel"><div class="toolbar"><div><label>Search</label><input id="faSearch" value="${esc(filter)}" placeholder="Search Pokémon…"></div></div><div class="summary"><div class="stat"><div class="note">Available</div><b>${free.length}</b></div><div class="stat"><div class="note">Taken</div><b>${taken.length}</b></div><div class="stat"><div class="note">Total</div><b>${visible.length}</b></div></div></div><div class="panel"><h2>Free Agency</h2><div class="note" style="margin-bottom:14px">Undrafted Pokémon can be selected. Taken Pokémon remain visible so the draft pool is easy to audit.</div><div class="grid">${visible.map(m=>{const o=owner(m.name);return `<article class="mon ${o?'taken':''}" data-mon="${esc(m.name)}">${sprite(m.name)}<div class="name">${esc(m.name)}</div><div class="meta">${m.points} points</div><div class="status ${o?'taken-label':'undrafted'}">${o?'Taken — '+esc(o.team):'Undrafted · Select to plan trade'}</div></article>`}).join('')}</div></div>`;const si=$('faSearch');si.oninput=e=>{window._filter=e.target.value;render();si.focus();si.setSelectionRange(si.value.length,si.value.length)};document.querySelectorAll('.mon:not(.taken)').forEach(el=>el.onclick=()=>openPlanner(mons.find(m=>key(m.name)===key(el.dataset.mon))));}
$('pageNavSelect').value=location.pathname.split('/').pop()||'index.html';
$('pageNavSelect').onchange=e=>location.href=e.target.value;

async function refreshFreeAgency(){
  try{
    await load();
  }catch(e){
    console.error('Free Agency refresh failed:',e);
    $('main').innerHTML=`<div class="panel"><h2>Unable to load free agency</h2><div class="note">${esc(e.message)}</div></div>`;
  }
}

setInterval(refreshFreeAgency,5000);

document.addEventListener('visibilitychange',()=>{
  if(!document.hidden) refreshFreeAgency();
});

refreshFreeAgency();
})();
</script></body></html>
