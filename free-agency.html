<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Free Agency</title>
<style>
:root{
  --bg:#f6f7fb;--panel:#fff;--panel2:#f0f2f7;--border:#d9ddea;
  --text:#202433;--dim:#697083;--accent:#5367d8;--taken:#8a8f9d;--available:#3d8c62;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui,-apple-system,Segoe UI,sans-serif}

/* page nav */
.page-nav{position:fixed;top:14px;right:18px;z-index:20;display:flex;gap:7px;align-items:center}
.page-nav label{font-size:11px;font-weight:700;color:var(--dim)}
.page-nav select{padding:7px 30px 7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--panel);color:var(--text)}

#app{max-width:1500px;margin:auto;padding:70px 24px 40px}
header{margin-bottom:22px}
h1{margin:0 0 6px;font-size:28px}
.sub,.note{color:var(--dim);line-height:1.5}

/* toolbar */
.toolbar{
  display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;
  margin:18px 0 14px;padding:16px 18px;
  background:var(--panel);border:1px solid var(--border);border-radius:12px;
}
.toolbar>div{min-width:180px;flex:1}
.toolbar>div.toolbar-wide{min-width:260px;flex:2}
label{display:block;font-size:11px;font-weight:700;color:var(--dim);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px}
input[type=text],select.filter-select{
  width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:8px;
  background:var(--bg);color:var(--text);font:inherit;font-size:13px;
}
input[type=text]:focus,select.filter-select:focus{outline:2px solid var(--accent);outline-offset:-1px}

/* type chips */
.type-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.type-chip{
  padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700;
  cursor:pointer;border:2px solid transparent;transition:.1s;user-select:none;
  text-transform:capitalize;
}
.type-chip:hover{filter:brightness(.88)}
.type-chip.active{border-color:rgba(0,0,0,.35);filter:brightness(.82)}

/* type colours */
.type-normal{background:#A8A77A;color:#fff}
.type-fire{background:#EE8130;color:#fff}
.type-water{background:#6390F0;color:#fff}
.type-electric{background:#F7D02C;color:#333}
.type-grass{background:#7AC74C;color:#fff}
.type-ice{background:#96D9D6;color:#333}
.type-fighting{background:#C22E28;color:#fff}
.type-poison{background:#A33EA1;color:#fff}
.type-ground{background:#E2BF65;color:#333}
.type-flying{background:#A98FF3;color:#fff}
.type-psychic{background:#F95587;color:#fff}
.type-bug{background:#A6B91A;color:#fff}
.type-rock{background:#B6A136;color:#fff}
.type-ghost{background:#735797;color:#fff}
.type-dragon{background:#6F35FC;color:#fff}
.type-dark{background:#705746;color:#fff}
.type-steel{background:#B7B7CE;color:#333}
.type-fairy{background:#D685AD;color:#fff}

/* summary bar */
.summary{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 20px}
.stat{padding:10px 16px;background:var(--panel);border:1px solid var(--border);border-radius:10px;min-width:110px}
.stat b{display:block;font-size:20px;margin-top:2px}
.stat .note{margin:0;font-size:11px}

/* tiers */
.tier{margin:0 0 28px}
.tier-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.tier-head h2{margin:0;font-size:16px;font-weight:800}

/* grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.mon{
  position:relative;min-height:190px;padding:12px 10px;
  border:1px solid var(--border);border-radius:12px;background:var(--panel);
  cursor:pointer;transition:.12s;display:flex;flex-direction:column;align-items:center;
}
.mon:hover{transform:translateY(-2px);box-shadow:0 6px 18px #0001}
.mon.taken{opacity:.48;cursor:default;background:var(--panel2)}
.mon img{display:block;width:86px;height:86px;object-fit:contain;image-rendering:pixelated;margin-bottom:4px}
.mon-name{font-weight:800;font-size:13px;text-align:center;margin-top:2px}
.mon-points{text-align:center;margin-top:4px;color:var(--accent);font-weight:800;font-size:13px}
.mon-types{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;margin-top:6px}
.mon-type-badge{
  font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px;
  text-transform:capitalize;
}
.mon-status{text-align:center;margin-top:6px;font-size:11px;font-weight:700}
.mon-status.available{color:var(--available)}
.mon-status.taken-status{color:var(--taken)}

/* no results */
.empty{padding:34px;text-align:center;border:1px dashed var(--border);border-radius:12px;color:var(--dim);background:var(--panel)}

/* modal */
.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:20px;z-index:100}
.modalbox{width:min(480px,100%);background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:24px}
.modalbox h2{margin:0 0 6px}
.modal-types{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.btn{padding:9px 16px;border-radius:8px;border:1px solid var(--border);background:var(--panel2);cursor:pointer;font:inherit}
.btn:hover{border-color:var(--accent)}

/* availability toggle */
.avail-toggle{display:flex;gap:6px}
.avail-btn{
  padding:7px 13px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;
  border:1px solid var(--border);background:var(--panel2);color:var(--dim);transition:.1s;
}
.avail-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}

/* clear filters */
.clear-filters{
  padding:7px 12px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;
  border:1px solid var(--border);background:none;color:var(--dim);white-space:nowrap;
  align-self:flex-end;
}
.clear-filters:hover{color:var(--text);border-color:var(--text)}

@media(max-width:700px){
  #app{padding:60px 12px 30px}
  .page-nav{top:8px;right:8px}
  .page-nav label{display:none}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .toolbar{padding:12px}
  .toolbar>div,.toolbar>div.toolbar-wide{min-width:0;flex:1 1 140px}
}
</style>
</head>
<body>
<div class="page-nav">
  <label for="pageNavSelect">Page</label>
  <select id="pageNavSelect">
    <option value="index.html">Stats Dashboard</option>
    <option value="rosters.html">Rosters</option>
    <option value="team-analysis.html">Team Analysis</option>
    <option value="free-agency.html">Free Agency</option>
  </select>
</div>

<div id="app">
  <header>
    <h1>Free Agency</h1>
    <div class="sub">Draft board grouped by point tier. Search by name, filter by type or points. Taken = on a published roster.</div>
  </header>
  <div id="main"><div class="empty">Loading Free Agency…</div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(()=>{
const SUPABASE_URL='https://dfxdkkemltukxaklhcpo.supabase.co';
const SUPABASE_KEY='sb_publishable_H7iIBiJTxY77lBAcpJn2VQ_u2hAG2CN';
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let settings={rosters:{},freeAgency:{mons:[]}};
let allRosters={};
// Cache: normalized pokemon name -> ['fire','flying'] etc.
const typeCache={};

const $=id=>document.getElementById(id);
const esc=s=>String(s??''). replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const key=s=>String(s||''). trim().toLowerCase()
  .replace(/[\u2018\u2019']/g,'')
  .replace(/[♀]/g,'-f')
  .replace(/[♂]/g,'-m')
  .replace(/[\s_]+/g,'-')
  .replace(/[^a-z0-9-]/g,'')
  .replace(/-+/g,'-')
  .replace(/^-|-$/g,'');

// --- filter state ---
let filterName='';
let filterTypes=new Set();   // empty = all types
let filterPoints='';         // '' = any, or exact number string
let filterAvail='all';       // 'all' | 'available' | 'taken'

const ALL_TYPES=['normal','fire','water','electric','grass','ice','fighting','poison',
  'ground','flying','psychic','bug','rock','ghost','dragon','dark','steel','fairy'];

function normalizeRosters(raw){
  const out={};
  for(const [team,list] of Object.entries(raw||{})){
    if(!Array.isArray(list))continue;
    out[team]=list.map(x=>typeof x==='string'
      ?{name:x,points:null}
      :{name:String(x?.name??x?.species??''),points:x?.points??null}
    ).filter(x=>x.name);
  }
  return out;
}

function owner(name){
  const k=key(name);
  for(const [team,list] of Object.entries(allRosters))
    for(const mon of list) if(key(mon.name)===k) return team;
  return null;
}

function toShowdownId(name){
  return String(name||''). trim().split('-')
    .map(seg=>seg.toLowerCase().replace(/[^a-z0-9]/g,''))
    .filter(Boolean).join('-');
}

function sprite(name){
  const id=toShowdownId(name);
  const compact=id.replace(/-/g,'');
  const urls=JSON.stringify([
    'https://play.pokemonshowdown.com/sprites/gen5/'+id+'.png',
    'https://play.pokemonshowdown.com/sprites/gen5/'+compact+'.png',
    'https://play.pokemonshowdown.com/sprites/gen5/0.png'
  ]);
  return `<img src="https://play.pokemonshowdown.com/sprites/gen5/${id}.png" alt="${esc(name)}" `+
    `data-sprite-urls="${esc(urls)}" data-sprite-idx="0" `+
    `onerror="(function(i){var us=JSON.parse(i.dataset.spriteUrls||'[]');var nx=Number(i.dataset.spriteIdx||0)+1;if(nx<us.length){i.dataset.spriteIdx=nx;i.src=us[nx];}else{i.onerror=null;i.style.opacity='.25';}})(this)">`;
}

// Fetch types from PokeAPI. Results are cached in typeCache so each mon is
// only fetched once per session.
//
// Previously this stripped forme suffixes (Therian, Dusk-Mane, Wellspring, …)
// using a fixed, hand-maintained list of known suffix words before calling
// the API. Any name whose forme wasn't in that list (or names with gender
// symbols, punctuation, etc.) would 404, and the failure was cached as a
// permanent empty type list — silently and permanently dropping that mon out
// of every type-filter result, even though it does have that type.
//
// Instead, try the full name first, then progressively fall back to shorter
// prefixes (dropping one trailing hyphen-segment at a time) until PokeAPI
// resolves something. This mirrors the sprite-fallback approach used
// elsewhere in the app and doesn't depend on an exhaustive suffix list.
async function fetchTypes(name){
  const k=key(name);
  if(typeCache[k]) return typeCache[k];

  const candidates=[];
  const add=id=>{ if(id && !candidates.includes(id)) candidates.push(id); };
  add(k);
  let parts=k.split('-');
  while(parts.length>1){
    parts=parts.slice(0,-1);
    add(parts.join('-'));
  }

  for(const apiName of candidates){
    try{
      const r=await fetch('https://pokeapi.co/api/v2/pokemon/'+apiName);
      if(!r.ok) continue;
      const d=await r.json();
      const types=d.types.map(t=>t.type.name);
      typeCache[k]=types;
      return types;
    }catch{
      // network hiccup — try the next, shorter candidate
    }
  }
  typeCache[k]=[];
  return [];
}

// Kick off type fetches only for mons we don't already have cached, non-blocking.
// render() checks typeCache synchronously; types appear as they load.
// Skips entirely (no render calls at all) once everything is cached, so the
// periodic refresh below doesn't rebuild the whole grid for no reason.
async function prefetchTypes(mons){
  const pending=mons.filter(m=>!typeCache[key(m.name)]);
  if(!pending.length) return;
  const batch=8; // parallel requests
  for(let i=0;i<pending.length;i+=batch){
    await Promise.allSettled(pending.slice(i,i+batch).map(m=>fetchTypes(m.name)));
    render(); // re-render as each batch completes so type badges appear progressively
  }
}

function typeBadge(t){
  return `<span class="mon-type-badge type-${t}">${esc(t)}</span>`;
}

function openSelection(mon){
  const types=typeCache[key(mon.name)]||[];
  const modal=document.createElement('div');
  modal.className='modal';
  modal.innerHTML=`<div class="modalbox">
    <h2>${esc(mon.name)}</h2>
    <div class="note">${mon.points} points · Undrafted</div>
    <div class="modal-types">${types.map(typeBadge).join('')||''}</div>
    <p class="note">This Pokémon is available — it does not appear on any currently published roster.</p>
    <div class="actions"><button class="btn" id="modalClose">Close</button></div>
  </div>`;
  document.body.appendChild(modal);
  modal.querySelector('#modalClose').onclick=()=>modal.remove();
  modal.onclick=e=>{if(e.target===modal)modal.remove();};
}

let lastDataSignature=null;

async function load(){
  const res=await db.from('replays').select('replay_id,replay_data')
    .in('replay_id',['__dashboard_state__','__rosters__']);
  if(res.error) throw res.error;
  for(const r of res.data||[]){
    if(r.replay_id==='__dashboard_state__') settings=r.replay_data?.settings||settings;
    if(r.replay_id==='__rosters__') allRosters=normalizeRosters(r.replay_data?.rosters||{});
  }
  if(!Object.keys(allRosters).length) allRosters=normalizeRosters(settings.rosters||{});
  const mons=Array.isArray(settings.freeAgency?.mons)?settings.freeAgency.mons:[];

  // Skip the (expensive, focus-stealing) re-render on the periodic 5s poll
  // unless the pool or rosters actually changed since last time.
  const signature=JSON.stringify({mons,allRosters});
  const changed=signature!==lastDataSignature;
  lastDataSignature=signature;
  if(changed) render();

  prefetchTypes(mons); // non-blocking, re-renders as new types load
}

function applyFilters(mons){
  return mons.filter(m=>{
    // name
    if(filterName && !String(m.name).toLowerCase().includes(filterName)) return false;
    // points
    if(filterPoints!=='' && String(Number(m.points))!==filterPoints) return false;
    // availability
    const taken=!!owner(m.name);
    if(filterAvail==='available' && taken) return false;
    if(filterAvail==='taken' && !taken) return false;
    // type — check cache; if not loaded yet, include by default
    if(filterTypes.size>0){
      const types=typeCache[key(m.name)];
      if(!types) return true; // not loaded yet, show optimistically
      if(!types.some(t=>filterTypes.has(t))) return false;
    }
    return true;
  });
}

function render(){
  // Preserve focus/cursor position across the DOM rebuild below, so a
  // background refresh or filter click doesn't interrupt someone mid-type.
  const active=document.activeElement;
  const hadFocus=active && active.id==='searchName';
  const selStart=hadFocus?active.selectionStart:null;
  const selEnd=hadFocus?active.selectionEnd:null;

  const allMons=Array.isArray(settings.freeAgency?.mons)?settings.freeAgency.mons:[];
  const visible=applyFilters(allMons);

  // point tier options for the select
  const pointValues=[...new Set(allMons.map(m=>Number(m.points)||0))].sort((a,b)=>b-a);

  // count stats from full list (respects name+type+avail filters but not points filter,
  // so the summary always reflects the full filtered pool)
  let free=0,taken=0;
  visible.forEach(m=>owner(m.name)?taken++:free++);

  // group by points tier
  const groups={};
  visible.forEach(m=>{const p=Number(m.points)||0;(groups[p]??=[]).push(m);});
  const tiers=Object.keys(groups).sort((a,b)=>Number(b)-Number(a));

  // active filter count (for clear button label)
  const activeFilters=(filterName?1:0)+(filterTypes.size>0?1:0)+(filterPoints!==''?1:0)+(filterAvail!=='all'?1:0);

  $("main").innerHTML=
    // ---- toolbar ----
    `<div class="toolbar">
      <div class="toolbar-wide">
        <label>Search by name</label>
        <input type="text" id="searchName" value="${esc(filterName)}" placeholder="e.g. Landorus, Cinderace…" autocomplete="off">
      </div>
      <div>
        <label>Points</label>
        <select class="filter-select" id="filterPoints">
          <option value="">Any points</option>
          ${pointValues.map(p=>`<option value="${p}" ${filterPoints===String(p)?'selected':''} >${p} pts</option>`).join('')}
        </select>
      </div>
      <div>
        <label>Availability</label>
        <div class="avail-toggle">
          <button class="avail-btn ${filterAvail==='all'?'active':''}" data-avail="all">All</button>
          <button class="avail-btn ${filterAvail==='available'?'active':''}" data-avail="available">Available</button>
          <button class="avail-btn ${filterAvail==='taken'?'active':''}" data-avail="taken">Taken</button>
        </div>
      </div>
      ${activeFilters>0?'<button class="clear-filters" id="clearFilters">Clear filters ('+ activeFilters +')</button>':''} 
    </div>`+
    // ---- type chips ----
    `<div style="margin-bottom:16px">
      <label style="margin-bottom:8px">Filter by type</label>
      <div class="type-chips">
        ${ALL_TYPES.map(t=>`<span class="type-chip type-${t}${filterTypes.has(t)?' active':''}" data-type="${t}">${t}</span>`).join('')}
      </div>
    </div>`+
    // ---- summary ----
    `<div class="summary">
      <div class="stat"><div class="note">Showing</div><b>${visible.length}</b></div>
      <div class="stat"><div class="note">Available</div><b>${free}</b></div>
      <div class="stat"><div class="note">Taken</div><b>${taken}</b></div>
      <div class="stat"><div class="note">Total pool</div><b>${allMons.length}</b></div>
    </div>`+
    // ---- tiers ----
    (tiers.length
      ? tiers.map(p=>{
          const label=Number(p)===1?'1 POINT':`${p} POINTS`;
          return `<section class="tier">
            <div class="tier-head"><h2>${label}</h2><span class="note">${groups[p].length} shown</span></div>
            <div class="grid">${groups[p].map(m=>{
              const o=owner(m.name);
              const types=typeCache[key(m.name)]||[];
              return `<article class="mon ${o?'taken':''}" data-name="${esc(m.name)}">
                ${sprite(m.name)}
                <div class="mon-name">${esc(m.name)}</div>
                <div class="mon-points">${m.points} pts</div>
                <div class="mon-types">${types.map(typeBadge).join('')}</div>
                <div class="mon-status ${o?'taken-status':'available'}">${o?'Taken — '+esc(o):'Available'}</div>
              </article>`;
            }).join('')}</div>
          </section>`;
        }).join('')
      : `<div class="empty">${allMons.length?'No Pokémon match your filters.':'No Free Agency pool has been published yet.'}</div>`
    );

  // ---- bind events ----
  const nameInput=$("searchName");
  nameInput.oninput=e=>{filterName=e.target.value.trim().toLowerCase();render();};

  if(hadFocus){
    nameInput.focus();
    nameInput.setSelectionRange(selStart,selEnd);
  }

  $("filterPoints").onchange=e=>{filterPoints=e.target.value;render();};

  document.querySelectorAll('[data-avail]').forEach(btn=>{
    btn.onclick=()=>{filterAvail=btn.dataset.avail;render();};
  });

  document.querySelectorAll('[data-type]').forEach(chip=>{
    chip.onclick=()=>{
      const t=chip.dataset.type;
      filterTypes.has(t)?filterTypes.delete(t):filterTypes.add(t);
      render();
    };
  });

  const clearBtn=$("clearFilters");
  if(clearBtn) clearBtn.onclick=()=>{
    filterName='';filterTypes.clear();filterPoints='';filterAvail='all';render();
  };

  document.querySelectorAll('.mon:not(.taken)').forEach(el=>el.onclick=()=>{
    const mons=Array.isArray(settings.freeAgency?.mons)?settings.freeAgency.mons:[];
    const m=mons.find(x=>key(x.name)===key(el.dataset.name));
    if(m) openSelection(m);
  });
}

$("pageNavSelect").value='free-agency.html';
$("pageNavSelect").onchange=e=>location.href=e.target.value;
load().catch(e=>$("main").innerHTML=`<div class="empty">Could not load Free Agency: ${esc(String(e?.message||e))}</div>`);
setInterval(()=>{if(!document.hidden)load().catch(()=>{});},5000);
})();
</script>
</body></html>
