<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Free Agency</title>
<style>
:root{--bg:#f6f7fb;--panel:#fff;--panel2:#f0f2f7;--border:#d9ddea;--text:#202433;--dim:#697083;--accent:#5367d8;--taken:#8a8f9d;--available:#3d8c62}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui,-apple-system,Segoe UI,sans-serif}.page-nav{position:fixed;top:14px;right:18px;z-index:20;display:flex;gap:7px;align-items:center}.page-nav label{font-size:11px;font-weight:700;color:var(--dim)}.page-nav select{padding:7px 30px 7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--panel);color:var(--text)}#app{max-width:1500px;margin:auto;padding:70px 24px 40px}header{margin-bottom:22px}h1{margin:0 0 6px;font-size:28px}.sub,.note{color:var(--dim);line-height:1.5}.toolbar{display:flex;gap:12px;align-items:end;flex-wrap:wrap;margin:18px 0}.toolbar>div{min-width:220px}label{display:block;font-size:11px;font-weight:700;color:var(--dim);text-transform:uppercase;margin-bottom:6px}input{width:100%;padding:10px;border:1px solid var(--border);border-radius:8px;background:var(--panel)}.summary{display:flex;gap:12px;flex-wrap:wrap;margin:16px 0}.stat{padding:12px 18px;background:var(--panel);border:1px solid var(--border);border-radius:10px;min-width:120px}.stat b{font-size:22px}.tier{margin:20px 0 28px}.tier-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.tier-head h2{margin:0}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:12px}.mon{position:relative;min-height:190px;padding:14px;border:1px solid var(--border);border-radius:12px;background:var(--panel);cursor:pointer;transition:.12s}.mon:hover{transform:translateY(-1px);box-shadow:0 4px 14px #0001}.mon.taken{opacity:.52;cursor:default;background:var(--panel2)}.mon img{display:block;width:90px;height:90px;object-fit:contain;margin:0 auto 5px;image-rendering:pixelated}.name{text-align:center;font-weight:800}.points{text-align:center;margin-top:5px;color:var(--accent);font-weight:800}.status{text-align:center;margin-top:8px;font-size:11px;font-weight:700}.available{color:var(--available)}.taken-status{color:var(--taken)}.empty{padding:34px;text-align:center;border:1px dashed var(--border);border-radius:12px;color:var(--dim);background:var(--panel)}.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:20px;z-index:100}.modalbox{width:min(520px,100%);background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:20px}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.btn{padding:9px 14px;border-radius:8px;border:1px solid var(--border);background:var(--panel2);cursor:pointer}@media(max-width:650px){#app{padding:60px 12px 30px}.page-nav{top:8px;right:8px}.page-nav label{display:none}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<div class="page-nav"><label for="pageNavSelect">Page</label><select id="pageNavSelect"><option value="index.html">Stats Dashboard</option><option value="rosters.html">Rosters</option><option value="team-analysis.html">Team Analysis</option><option value="free-agency.html">Free Agency</option></select></div>
<div id="app"><header><h1>Free Agency</h1><div class="sub">The DRAFT BOARD is grouped by point tier. Pokémon currently on a published roster are shown as taken; undrafted Pokémon are selectable.</div></header><div id="main"><div class="empty">Loading Free Agency…</div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(()=>{
const SUPABASE_URL='https://dfxdkkemltukxaklhcpo.supabase.co';
const SUPABASE_KEY='sb_publishable_H7iIBiJTxY77lBAcpJn2VQ_u2hAG2CN';
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let settings={rosters:{},freeAgency:{mons:[]}};
let allRosters={};
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// Normalize a Pokémon name for ownership comparison.
// Preserves hyphens so formes like Landorus-Therian match between
// the tier list and the roster. Collapses spaces/underscores to hyphens.
const key=s=>String(s||'').trim().toLowerCase()
  .replace(/['']/g,'')
  .replace(/[\s_]+/g,'-')
  .replace(/[^a-z0-9-]/g,'')
  .replace(/-+/g,'-')
  .replace(/^-|-$/g,'');

function normalizeRosters(raw){
  const out={};
  for(const [team,list] of Object.entries(raw||{})){
    if(!Array.isArray(list))continue;
    out[team]=list.map(x=>typeof x==='string'
      ?{name:x,points:null}
      :{name:String(x?.name??x?.species??''),points:x?.points??null}
    ).filter(x=>x.name);
  }
  return out;
}

function owner(name){
  const k=key(name);
  for(const [team,list] of Object.entries(allRosters)){
    for(const mon of list){ if(key(mon.name)===k) return team; }
  }
  return null;
}

// Sprite using gen5 (most reliable across all gens on Showdown's CDN).
// Mirrors the same logic as rosters.html and admin.html.
function toShowdownId(name){
  return String(name||'').trim().split('-')
    .map(seg=>seg.toLowerCase().replace(/[^a-z0-9]/g,''))
    .filter(Boolean).join('-');
}
function sprite(name){
  const id=toShowdownId(name);
  const compact=id.replace(/-/g,'');
  const urls=JSON.stringify([
    'https://play.pokemonshowdown.com/sprites/gen5/'+id+'.png',
    'https://play.pokemonshowdown.com/sprites/gen5/'+compact+'.png',
    'https://play.pokemonshowdown.com/sprites/gen5/0.png'
  ]);
  return `<img src="https://play.pokemonshowdown.com/sprites/gen5/${id}.png" alt="${esc(name)}" `+
    `data-sprite-urls="${esc(urls)}" data-sprite-idx="0" `+
    `onerror="(function(i){var us=JSON.parse(i.dataset.spriteUrls||'[]');var nx=Number(i.dataset.spriteIdx||0)+1;if(nx<us.length){i.dataset.spriteIdx=nx;i.src=us[nx];}else{i.onerror=null;i.style.opacity='.25';}})(this)">`;
}

function openSelection(mon){
  const modal=document.createElement('div');
  modal.className='modal';
  modal.innerHTML=`<div class="modalbox"><h2>${esc(mon.name)}</h2><div class="note">${mon.points} points · Undrafted</div><p class="note">This Pokémon is available — it does not appear on any currently published roster.</p><div class="actions"><button class="btn" id="close">Close</button></div></div>`;
  document.body.appendChild(modal);
  modal.querySelector('#close').onclick=()=>modal.remove();
  modal.onclick=e=>{if(e.target===modal)modal.remove();};
}

async function load(){
  const res=await db.from('replays').select('replay_id,replay_data')
    .in('replay_id',['__dashboard_state__','__rosters__']);
  if(res.error) throw res.error;
  for(const r of res.data||[]){
    if(r.replay_id==='__dashboard_state__') settings=r.replay_data?.settings||settings;
    if(r.replay_id==='__rosters__') allRosters=normalizeRosters(r.replay_data?.rosters||{});
  }
  // Fall back to rosters embedded in dashboard settings if __rosters__ row is empty
  if(!Object.keys(allRosters).length) allRosters=normalizeRosters(settings.rosters||{});
  render();
}

function render(){
  const mons=Array.isArray(settings.freeAgency?.mons)?settings.freeAgency.mons:[];
  const q=(window._faQuery||'').toLowerCase();
  const visible=mons.filter(m=>String(m.name).toLowerCase().includes(q));
  const groups={};
  visible.forEach(m=>{const p=Number(m.points)||0;(groups[p]??=[]).push(m);});
  const tiers=Object.keys(groups).sort((a,b)=>Number(b)-Number(a));
  let free=0,taken=0;
  visible.forEach(m=>owner(m.name)?taken++:free++);

  $('main').innerHTML=
    `<div class="toolbar"><div><label>Search Pokémon</label>`+
    `<input id="search" value="${esc(window._faQuery||'')}" placeholder="Search…"></div></div>`+
    `<div class="summary">`+
    `<div class="stat"><div class="note">Available</div><b>${free}</b></div>`+
    `<div class="stat"><div class="note">Taken</div><b>${taken}</b></div>`+
    `<div class="stat"><div class="note">Total</div><b>${visible.length}</b></div>`+
    `</div>`+
    (tiers.length
      ? tiers.map(p=>{
          const label=Number(p)===1?'1 POINT':`${p} POINTS`;
          return `<section class="tier">`+
            `<div class="tier-head"><h2>${label}</h2><span class="note">${groups[p].length} Pokémon</span></div>`+
            `<div class="grid">${groups[p].map(m=>{
              const o=owner(m.name);
              return `<article class="mon ${o?'taken':''}" data-name="${esc(m.name)}">`+
                sprite(m.name)+
                `<div class="name">${esc(m.name)}</div>`+
                `<div class="points">${m.points} pts</div>`+
                `<div class="status ${o?'taken-status':'available'}">${o?'Taken — '+esc(o):'Available'}</div>`+
                `</article>`;
            }).join('')}</div></section>`;
        }).join('')
      : `<div class="empty">No Free Agency pool has been published yet.</div>`
    );

  const s=$('search');
  s.oninput=e=>{
    window._faQuery=e.target.value;
    render();
    // Restore focus and cursor position after re-render
    const n=$('search');
    n.focus();
    n.setSelectionRange(n.value.length,n.value.length);
  };
  document.querySelectorAll('.mon:not(.taken)').forEach(el=>el.onclick=()=>{
    const m=mons.find(x=>key(x.name)===key(el.dataset.name));
    if(m) openSelection(m);
  });
}

$('pageNavSelect').value='free-agency.html';
$('pageNavSelect').onchange=e=>location.href=e.target.value;
load().catch(e=>$('main').innerHTML=`<div class="empty">Could not load Free Agency: ${esc(String(e?.message||e))}</div>`);
setInterval(()=>{if(!document.hidden)load().catch(()=>{});},5000);
})();
</script>
</body></html>
