<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1"
>

<title>SBL Free Agency</title>

<style>

:root{
  --bg:#07111f;
  --panel:#0c1b2e;
  --panel-alt:#12263d;
  --border:#274563;
  --text:#edf5ff;
  --text-dim:#9fb4ca;
  --accent:#6fa8dc;
  --green:#69c58a;
  --red:#d77b91;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:
    Inter,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}

#app{
  width:min(1500px, calc(100vw - 32px));
  margin:0 auto;
  padding:34px 0 60px;
}

h1{
  margin:0;
  font-size:32px;
}

h2{
  margin:0 0 10px;
}

h3{
  margin:0;
}

.sub{
  margin-top:6px;
  color:var(--text-dim);
}

.page-nav{
  position:fixed;
  top:14px;
  right:18px;
  z-index:1000;
  display:flex;
  align-items:center;
  gap:7px;
}

.page-nav label{
  font-size:11px;
  color:var(--text-dim);
  font-weight:700;
}

.page-nav select{
  font:inherit;
  font-size:12px;
  padding:7px 30px 7px 10px;
  border:1px solid var(--border);
  border-radius:8px;
  background:var(--panel);
  color:var(--text);
}

.toolbar{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:22px;
}

.toolbar input,
.toolbar select{
  background:var(--panel);
  color:var(--text);
  border:1px solid var(--border);
  border-radius:8px;
  padding:9px 11px;
}

.panel{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:14px;
  padding:20px;
  margin-top:18px;
}

.note{
  color:var(--text-dim);
  font-size:13px;
  line-height:1.5;
}

.stats{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:14px;
}

.badge{
  display:inline-flex;
  align-items:center;
  padding:4px 8px;
  border-radius:999px;
  background:var(--panel-alt);
  border:1px solid var(--border);
  color:var(--text-dim);
  font-size:11px;
}

.pool{
  display:grid;
  grid-template-columns:
    repeat(auto-fill,minmax(220px,1fr));
  gap:10px;
  margin-top:18px;
}

.mon{
  position:relative;
  display:flex;
  align-items:center;
  gap:12px;
  min-height:92px;
  padding:12px;
  border:1px solid var(--border);
  border-radius:12px;
  background:var(--panel-alt);
  transition:
    transform .12s ease,
    border-color .12s ease,
    opacity .12s ease;
}

.mon.available{
  cursor:pointer;
}

.mon.available:hover{
  transform:translateY(-2px);
  border-color:var(--accent);
}

.mon.taken{
  opacity:.38;
  filter:grayscale(.75);
}

.mon img{
  width:64px;
  height:64px;
  object-fit:contain;
  image-rendering:pixelated;
}

.mon-info{
  min-width:0;
}

.mon-name{
  font-weight:800;
  font-size:14px;
}

.mon-points{
  margin-top:6px;
  display:inline-flex;
  padding:4px 8px;
  border-radius:999px;
  background:var(--panel);
  border:1px solid var(--border);
  color:var(--accent);
  font-size:11px;
  font-weight:800;
}

.mon-owner{
  margin-top:5px;
  color:var(--text-dim);
  font-size:11px;
}

.search{
  width:280px;
  max-width:100%;
}

.empty{
  padding:40px;
  text-align:center;
  color:var(--text-dim);
  border:1px dashed var(--border);
  border-radius:12px;
}

.legend{
  display:flex;
  gap:14px;
  flex-wrap:wrap;
  margin-top:12px;
  color:var(--text-dim);
  font-size:12px;
}

.legend span{
  display:inline-flex;
  align-items:center;
  gap:6px;
}

.dot{
  width:10px;
  height:10px;
  border-radius:50%;
  display:inline-block;
}

.dot.available{
  background:var(--accent);
}

.dot.taken{
  background:#657386;
}

@media(max-width:700px){

  #app{
    width:calc(100vw - 18px);
  }

  .page-nav{
    top:8px;
    right:8px;
  }

  .page-nav label{
    display:none;
  }

}

</style>

</head>

<body>

<div class="page-nav">

  <label for="pageNavSelect">
    Page
  </label>

  <select
    id="pageNavSelect"
    aria-label="Choose page"
  >

    <option value="index.html">
      Stats Dashboard
    </option>

    <option value="rosters.html">
      Rosters
    </option>

    <option value="team-analysis.html">
      Team Analysis
    </option>

    <option value="free-agency.html">
      Free Agency
    </option>

  </select>

</div>

<div id="app">

  <h1>
    Free Agency
  </h1>

  <div class="sub">
    Season 15 Draft Board
  </div>

  <div class="panel">

    <div class="toolbar">

      <input
        id="search"
        class="search"
        type="search"
        placeholder="Search Pokémon…"
      >

      <select id="status">

        <option value="all">
          All Pokémon
        </option>

        <option value="available">
          Undrafted
        </option>

        <option value="taken">
          Drafted
        </option>

      </select>

      <select id="points">

        <option value="all">
          All point values
        </option>

      </select>

    </div>

    <div class="stats">

      <span class="badge" id="totalCount">
        Loading…
      </span>

      <span class="badge" id="availableCount"></span>

      <span class="badge" id="takenCount"></span>

    </div>

    <div class="legend">

      <span>
        <i class="dot available"></i>
        Undrafted / available
      </span>

      <span>
        <i class="dot taken"></i>
        Already on a roster
      </span>

    </div>

  </div>

  <div class="panel">

    <div id="content">
      <div class="empty">
        Loading Free Agency…
      </div>
    </div>

  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
  'https://dfxdkkemltukxaklhcpo.supabase.co';

const SUPABASE_KEY =
  'sb_publishable_H7iIBiJTxY77lBAcpJn2VQ_u2hAG2CN';

const supabase =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

const esc = s =>
  String(s ?? '')
    .replace(/[&<>'"]/g, c => ({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      "'":'&#39;',
      '"':'&quot;'
    }[c]));

function key(name){

  return String(name || '')
    .toLowerCase()
    .replace(/[’']/g,'')
    .replace(/[\s_-]+/g,'');

}

function spriteCandidates(name){

  const raw =
    String(name || '')
      .trim()
      .toLowerCase()
      .replace(/[’']/g,'')
      .replace(/♀/g,'-f')
      .replace(/♂/g,'-m')
      .replace(/\s+/g,'-')
      .replace(/-+/g,'-');

  const out = [];

  function add(x){
    if(x && !out.includes(x))
      out.push(x);
  }

  const aliases = {

    'landorus-incarnate':
      'landorus',

    'landorus-therian':
      'landorus-therian',

    'landorus-t':
      'landorus-therian',

    'mr-mime-galar':
      'mrmime-galar',

    'galarian-mr-mime':
      'mrmime-galar',

    'gouging-fire':
      'gougingfire',

    'scream-tail':
      'screamtail',

    'scovillain':
      'scovillain'

  };

  add(aliases[raw] || raw);
  add(raw.replace(/-/g,''));

  return out;

}

function sprite(name){

  const candidates =
    spriteCandidates(name);

  return `
    <img
      src="https://play.pokemonshowdown.com/sprites/gen5/${candidates[0]}.png"
      alt="${esc(name)}"
      data-sprite-candidates="${esc(JSON.stringify(candidates))}"
      onerror="tryNextSprite(this)"
    >
  `;

}

function tryNextSprite(img){

  try{

    const candidates =
      JSON.parse(
        img.dataset.spriteCandidates || '[]'
      );

    const current =
      img.dataset.spriteIndex
        ? Number(img.dataset.spriteIndex)
        : 0;

    const next = current + 1;

    if(next < candidates.length){

      img.dataset.spriteIndex = String(next);

      img.src =
        `https://play.pokemonshowdown.com/sprites/gen5/${candidates[next]}.png`;

      return;

    }

  }catch(e){}

  img.style.opacity = '.18';

}

function pageNav(){

  const select =
    document.getElementById('pageNavSelect');

  const current =
    location.pathname.split('/').pop()
    || 'free-agency.html';

  if([
    'index.html',
    'rosters.html',
    'team-analysis.html',
    'free-agency.html'
  ].includes(current)){

    select.value = current;

  }

  select.addEventListener(
    'change',
    () => {

      if(select.value)
        location.href = select.value;

    }
  );

}

async function loadSharedState(){

  const {data,error} =
    await supabase
      .from('replays')
      .select('replay_data')
      .eq(
        'replay_id',
        '__dashboard_state__'
      )
      .single();

  if(error)
    throw error;

  return data?.replay_data || {};

}

function rosterOwnership(settings){

  const rosters =
    settings?.rosters || {};

  const owners = {};

  for(const [team,mons] of
      Object.entries(rosters)){

    for(const mon of
        (Array.isArray(mons) ? mons : [])){

      const name =
        typeof mon === 'string'
          ? mon
          : mon?.name;

      if(!name) continue;

      owners[key(name)] = team;

    }

  }

  return owners;

}

function normalizePool(settings){

  const pool =
    settings?.freeAgency?.pool || [];

  return pool
    .map(mon => ({

      name:String(mon.name || '').trim(),

      points:Number(mon.points),

      key:key(mon.name)

    }))
    .filter(mon =>
      mon.name &&
      Number.isFinite(mon.points)
    );

}

function render(pool, owners){

  const search =
    document.getElementById('search')
      .value
      .trim()
      .toLowerCase();

  const status =
    document.getElementById('status').value;

  const points =
    document.getElementById('points').value;

  const filtered =
    pool.filter(mon => {

      const owner =
        owners[mon.key];

      if(search &&
         !mon.name.toLowerCase().includes(search))
        return false;

      if(status === 'available' && owner)
        return false;

      if(status === 'taken' && !owner)
        return false;

      if(points !== 'all' &&
         Number(points) !== mon.points)
        return false;

      return true;

    });

  const available =
    pool.filter(mon => !owners[mon.key]);

  const taken =
    pool.filter(mon => owners[mon.key]);

  document.getElementById(
    'totalCount'
  ).textContent =
    `${pool.length} Pokémon`;

  document.getElementById(
    'availableCount'
  ).textContent =
    `${available.length} available`;

  document.getElementById(
    'takenCount'
  ).textContent =
    `${taken.length} drafted`;

  const content =
    document.getElementById('content');

  if(!filtered.length){

    content.innerHTML =
      `<div class="empty">
        No Pokémon match the current filters.
      </div>`;

    return;

  }

  content.innerHTML = `
    <div class="pool">

      ${filtered.map(mon => {

        const owner =
          owners[mon.key];

        return `

          <article
            class="mon ${owner ? 'taken' : 'available'}"
            data-name="${esc(mon.name)}"
          >

            ${sprite(mon.name)}

            <div class="mon-info">

              <div class="mon-name">
                ${esc(mon.name)}
              </div>

              <div class="mon-points">
                ${mon.points} pts
              </div>

              <div class="mon-owner">

                ${
                  owner
                    ? `Drafted by ${esc(owner)}`
                    : 'Undrafted'
                }

              </div>

            </div>

          </article>

        `;

      }).join('')}

    </div>
  `;

}

async function init(){

  pageNav();

  try{

    const state =
      await loadSharedState();

    const pool =
      normalizePool(state.settings);

    if(!pool.length){

      document.getElementById('content')
        .innerHTML =
        `<div class="empty">
          Free Agency has not been published yet.
          Ask the administrator to import the
          DRAFT BOARD.
        </div>`;

      return;

    }

    const owners =
      rosterOwnership(state.settings);

    const points =
      [...new Set(pool.map(mon => mon.points))]
        .sort((a,b)=>b-a);

    document.getElementById('points')
      .innerHTML =
      `<option value="all">
        All point values
      </option>` +
      points.map(p =>
        `<option value="${p}">
          ${p} points
        </option>`
      ).join('');

    const redraw =
      () => render(pool, owners);

    document.getElementById('search')
      .addEventListener('input', redraw);

    document.getElementById('status')
      .addEventListener('change', redraw);

    document.getElementById('points')
      .addEventListener('change', redraw);

    redraw();

  }catch(err){

    console.error(err);

    document.getElementById('content')
      .innerHTML =
      `<div class="empty">
        Could not load Free Agency:<br>
        ${esc(err.message)}
      </div>`;

  }

}

init();

</script>

</body>
</html>
