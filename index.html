<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Team — SBL Dashboard</title>
<style>
  :root{
    --bg:#0e1218;
    --panel:#161c26;
    --panel-alt:#1c2432;
    --border:#2a3444;
    --text:#e8edf5;
    --text-dim:#8996a8;
    --amber:#ffb454;
    --amber-text:#1a1206;
    --teal:#5eead4;
    --red:#ff7a7a;
    --mono:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;
    --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0; min-height:100vh; background:
      radial-gradient(1100px 600px at 12% -10%, rgba(255,180,84,.07), transparent 60%),
      radial-gradient(900px 500px at 100% 0%, rgba(94,234,212,.06), transparent 55%),
      var(--bg);
    color:var(--text); font-family:var(--sans); -webkit-font-smoothing:antialiased;}
  #app{max-width:1280px; margin:0 auto; padding:28px 24px 72px;}

  header{margin-bottom:20px;}
  h1{font-size:22px; margin:0 0 2px; letter-spacing:.2px;}
  .sub{color:var(--text-dim); font-size:13px; margin-bottom:16px;}

  nav.tabs{display:flex; gap:4px; margin:20px 0 16px; border-bottom:1px solid var(--border); flex-wrap:wrap;}
  nav.tabs button{background:none; border:none; color:var(--text-dim); padding:10px 14px; font-size:13px; font-weight:600; cursor:pointer; border-bottom:2px solid transparent; font-family:var(--sans); transition:color .15s ease, border-color .15s ease;}
  nav.tabs button.active{color:var(--text); border-bottom-color:var(--amber);}
  nav.tabs button:hover{color:var(--text);}

  .panel{background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:18px; box-shadow:0 8px 24px rgba(0,0,0,.18);}
  .panel + .panel{margin-top:14px;}
  .panel h2{font-size:14px; margin:0 0 12px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-dim);}

  label{display:block; font-size:12px; color:var(--text-dim); margin-bottom:6px;}
  input[type=text], input[type=email], input[type=password], select{
    width:100%; background:var(--panel-alt); border:1px solid var(--border); border-radius:8px;
    color:var(--text); padding:10px 12px; font-family:var(--sans); font-size:13px;
  }
  .row{display:flex; gap:12px; flex-wrap:wrap; margin-bottom:12px;}
  .row > div{flex:1; min-width:160px;}

  button.primary{background:var(--amber); color:var(--amber-text); border:none; border-radius:8px; padding:10px 18px; font-weight:700; font-size:13px; cursor:pointer; font-family:var(--sans); transition:transform .12s ease, box-shadow .12s ease, filter .12s ease;}
  button.primary:hover:not(:disabled){filter:brightness(1.06); box-shadow:0 6px 16px rgba(255,180,84,.25); transform:translateY(-1px);}
  button.primary:disabled{opacity:.5; cursor:default;}
  button.ghost{background:none; border:1px solid var(--border); color:var(--text); border-radius:8px; padding:9px 14px; font-size:12px; cursor:pointer; font-family:var(--sans); transition:border-color .12s ease, transform .12s ease;}
  button.ghost:hover{border-color:var(--amber); transform:translateY(-1px);}
  button.small{padding:5px 10px; font-size:11px;}
  button.danger{border:1px solid var(--red); color:var(--red); background:none; border-radius:8px; padding:9px 14px; font-size:12px; cursor:pointer;}
  button.teal{background:var(--teal); color:#062521; border:none; border-radius:8px; padding:9px 14px; font-size:12px; font-weight:700; cursor:pointer;}

  .note{font-size:12px; color:var(--text-dim); margin-top:10px; line-height:1.5;}
  .note.danger{color:var(--red);}
  .note.ok{color:var(--teal);}
  .empty-state{color:var(--text-dim); font-size:13px; padding:20px 0; text-align:center;}
  .badge{display:inline-block; font-size:10px; padding:2px 7px; border-radius:20px; background:var(--panel-alt); border:1px solid var(--border); color:var(--text-dim); margin-left:6px;}
  .foot-actions{display:flex; gap:10px; margin-top:14px; flex-wrap:wrap;}

  .status-pill{display:inline-block; font-size:11px; font-weight:700; padding:3px 10px; border-radius:20px; text-transform:uppercase; letter-spacing:.04em;}
  .status-pill.pending{color:var(--amber); background:#3a2c12; border:1px solid #5a4620;}
  .status-pill.approved{color:var(--teal); background:#0f2b27; border:1px solid #1c4a43;}
  .status-pill.rejected{color:var(--red); background:#3a1414; border:1px solid #5a2020;}
  .status-pill.accepted{color:var(--teal); background:#0f2b27; border:1px solid #1c4a43;}
  .status-pill.withdrawn{color:var(--text-dim); background:var(--panel-alt); border:1px solid var(--border);}
  .status-pill.reverted{color:var(--text-dim); background:var(--panel-alt); border:1px solid var(--border);}

  .sprite{width:32px; height:32px; object-fit:contain; vertical-align:middle; image-rendering:pixelated; background:var(--panel-alt); border-radius:6px;}
  .mon-pill{display:inline-flex; align-items:center; gap:6px; background:var(--panel-alt); border:1px solid var(--border); border-radius:20px; padding:3px 10px 3px 3px; font-size:12px; margin:3px 4px 3px 0;}
  .mon-list{display:flex; flex-wrap:wrap; margin-top:4px;}
  .pts{color:var(--text-dim); font-family:var(--mono); font-size:11px;}

  /* trade picker: pokemon cards */
  .pick-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(108px,1fr)); gap:8px; margin-top:10px;}
  .pick-card{position:relative; display:flex; flex-direction:column; align-items:center; gap:5px; background:var(--panel-alt); border:1px solid var(--border); border-radius:12px; padding:10px 6px 9px; cursor:pointer; text-align:center; transition:.15s ease; user-select:none;}
  .pick-card:hover{border-color:var(--amber);}
  .pick-card:focus-visible{outline:2px solid var(--amber); outline-offset:1px;}
  .pick-card.checked{border-color:var(--amber); background:#241d0f;}
  .pick-card .sprite{width:40px; height:40px;}
  .pick-card-name{font-size:11.5px; font-weight:600; line-height:1.25;}
  .pick-card-pts{font-family:var(--mono); font-size:10px; color:var(--amber);}
  .pick-card-check{position:absolute; top:6px; right:6px; width:16px; height:16px; border-radius:50%; background:var(--amber); color:var(--amber-text); font-size:10px; font-weight:800; line-height:16px; text-align:center; opacity:0; transform:scale(.6); transition:.15s ease;}
  .pick-card.checked .pick-card-check{opacity:1; transform:scale(1);}

  .selected-row{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px;}
  .selected-row:empty{display:none; margin:0;}
  .selected-chip{display:inline-flex; align-items:center; gap:6px; background:var(--panel-alt); border:1px solid var(--amber); border-radius:20px; padding:3px 6px 3px 3px; font-size:11.5px;}
  .selected-chip .sprite{width:22px; height:22px;}
  .selected-chip button{background:none; border:none; color:var(--text-dim); cursor:pointer; font-size:14px; line-height:1; padding:0 2px; font-family:var(--sans);}
  .selected-chip button:hover{color:var(--red);}

  .fa-search-wrap{position:relative; margin-top:2px;}
  .fa-hint, .fa-empty{color:var(--text-dim); font-size:12px; padding:18px 4px; text-align:center; border:1px dashed var(--border); border-radius:10px; margin-top:10px;}

  .budget-bar{height:8px; border-radius:6px; background:var(--panel-alt); border:1px solid var(--border); overflow:hidden; margin-top:8px;}
  .budget-fill{height:100%; background:var(--amber);}
  .budget-fill.over{background:var(--red);}

  .trade-card{border:1px solid var(--border); border-radius:10px; background:var(--panel-alt); padding:14px; margin-bottom:10px;}
  .trade-head{display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:8px;}
  .trade-teams{font-weight:700; font-size:13px;}
  .trade-teams .arrow{color:var(--text-dim); margin:0 6px; font-weight:400;}
  .trade-sub{font-size:11px; color:var(--text-dim); margin-top:2px;}
  .trade-cols{display:flex; gap:16px; flex-wrap:wrap; margin-top:6px;}
  .trade-col{flex:1; min-width:180px;}
  .trade-col h4{font-size:10px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-dim); margin:0 0 4px;}
  .trade-column-grid{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:14px;align-items:start;margin-top:14px;}
  .trade-column-main,.trade-column-side{min-width:0;}
  .trade-history-mini{position:sticky;top:16px;}
  .trade-tab-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;}
  .tab-badge{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--amber);color:var(--amber-text);font-size:10px;font-family:var(--mono);vertical-align:middle;margin-left:4px;}
  @media(max-width:800px){.trade-column-grid{grid-template-columns:1fr;}.trade-history-mini{position:static;}}


  .roster-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:12px;}
  .roster-card{border:1px solid var(--border); background:var(--panel-alt); border-radius:10px; padding:12px;}
  .roster-card.mine{border-color:var(--amber);}
  .roster-card h3{margin:0 0 4px; font-size:14px;}

  .gate{max-width:420px; width:100%; margin:0 auto; text-align:center; display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:calc(100vh - 220px);}
  .gate .panel{
    text-align:left; width:100%; padding:32px 30px 28px;
    background:linear-gradient(160deg, var(--panel), var(--panel-alt));
    border:1px solid var(--border); border-radius:16px;
    box-shadow:0 24px 60px rgba(0,0,0,.35), 0 0 0 1px rgba(255,180,84,.04);
    position:relative; overflow:hidden;
  }
  .gate .panel::before{
    content:""; position:absolute; top:0; left:0; right:0; height:3px;
    background:linear-gradient(90deg, var(--amber), var(--teal));
  }
  .gate .panel h2{font-size:20px; text-transform:none; letter-spacing:0; color:var(--text); margin:0 0 4px; text-align:center;}
  .gate .panel .gate-sub{color:var(--text-dim); font-size:12.5px; text-align:center; margin:0 0 20px;}
  .gate .panel label{font-size:11.5px;}
  .gate .panel input{padding:11px 13px; font-size:14px; border-radius:9px; transition:border-color .12s ease, box-shadow .12s ease;}
  .gate .panel input:focus{outline:none; border-color:var(--amber); box-shadow:0 0 0 3px rgba(255,180,84,.14);}
  .gate .panel .foot-actions{margin-top:18px;}
  .gate-mark{width:52px; height:52px; margin:0 auto 14px; border-radius:14px; background:linear-gradient(145deg, var(--amber), #ff9d4d); display:flex; align-items:center; justify-content:center; font-size:24px; font-weight:800; color:var(--amber-text); box-shadow:0 10px 24px rgba(255,180,84,.28);}

  .page-nav{position:fixed;top:14px;right:18px;z-index:1000;display:flex;align-items:center;gap:7px}
  .page-nav label{font-size:11px;color:var(--text-dim);font-weight:700}
  .page-nav select{font-size:12px;padding:7px 30px 7px 10px;box-shadow:0 2px 8px rgba(0,0,0,.25); width:auto; transition:opacity .15s ease;}
  .page-nav select:disabled{opacity:.45;cursor:not-allowed;}
  .page-nav .lock-hint{font-size:10.5px;color:var(--text-dim);opacity:.85;}
  @media(max-width:700px){.page-nav{top:8px;right:8px}.page-nav label{display:none}.page-nav .lock-hint{display:none}}

  .hero{background:linear-gradient(135deg,#182338,#101827);border:1px solid var(--border);border-radius:18px;padding:24px;margin-bottom:18px;}
  .hero-head{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;flex-wrap:wrap;}
  .hero-title h2{margin:0;font-size:30px;}
  .hero-title p{margin:6px 0 0;color:var(--text-dim);}
  .budget-card{min-width:280px;background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:14px;padding:16px;}
  .budget-row{display:flex;justify-content:space-between;align-items:center;}
  .budget-value{font-family:var(--mono);font-weight:700;}
  .roster-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;margin-top:18px;}
  .pokemon-card{background:linear-gradient(180deg,#1b2434,#151d2b);border:1px solid var(--border);border-radius:16px;padding:18px;transition:.18s ease;}
  .pokemon-card:hover{border-color:var(--amber);transform:translateY(-2px);}
  .pokemon-head{display:flex;align-items:center;gap:14px;}
  .pokemon-head .sprite{width:64px;height:64px;border-radius:10px;}
  .pokemon-name{font-size:18px;font-weight:700;}
  .pokemon-points{display:inline-flex;margin-top:12px;padding:6px 10px;border-radius:999px;background:var(--panel);border:1px solid var(--border);font-family:var(--mono);font-size:12px;color:var(--amber);}
  .pokemon-meta{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px;}
  .meta-box{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:10px;}
  .meta-box .label{font-size:10px;text-transform:uppercase;color:var(--text-dim);}
  .meta-box .value{font-family:var(--mono);font-size:16px;font-weight:700;margin-top:4px;}
  .meta-box .value.dealt{color:var(--amber);}
  .meta-box .value.taken{color:var(--red);}
  .meta-box .value.assists{color:var(--teal);}
  .meta-box .value.kills{color:var(--teal);}
  .pokemon-sub{color:var(--text-dim);font-size:11px;margin-top:2px;}

  .theme-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; margin-top:8px;}
  .theme-swatch{display:flex; flex-direction:column; gap:8px; background:var(--panel-alt); border:1px solid var(--border); border-radius:10px; padding:10px; cursor:pointer; font-family:var(--sans); font-size:12px; color:var(--text); text-align:left;}
  .theme-swatch:hover{border-color:var(--text-dim);}
  .theme-swatch.active{border-color:var(--theme-accent,var(--amber)); box-shadow:0 0 0 1px var(--theme-accent,var(--amber));}
  .theme-swatch .preview{display:flex; height:34px; border-radius:6px; overflow:hidden; border:1px solid rgba(255,255,255,.08);}
  .theme-swatch .preview span{flex:1;}
  .theme-swatch .label-row{display:flex; align-items:center; justify-content:space-between;}
  .theme-swatch .check{color:var(--theme-accent); font-weight:800; opacity:0;}
  .theme-swatch.active .check{opacity:1;}


/* My Team redesign */
.myteam-hero{background:linear-gradient(135deg,var(--panel-alt),var(--panel));border:1px solid var(--border);border-radius:18px;padding:22px;margin-bottom:16px;position:relative;overflow:hidden}
.myteam-hero:after{content:"";position:absolute;right:-70px;top:-90px;width:220px;height:220px;border-radius:50%;background:var(--amber);opacity:.06;pointer-events:none}
.myteam-hero-grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:stretch}
.myteam-kicker{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--amber);font-weight:800}
.myteam-title{font-size:30px;font-weight:800;margin:4px 0 4px;letter-spacing:-.02em}
.myteam-sub{color:var(--text-dim);font-size:13px}
.myteam-record{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
.record-box{min-width:92px;background:rgba(255,255,255,.025);border:1px solid var(--border);border-radius:12px;padding:10px 12px}
.record-box .label{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--text-dim)}
.record-box .value{font-family:var(--mono);font-size:20px;font-weight:800;margin-top:3px}
.record-box.win .value{color:var(--teal)} .record-box.loss .value{color:var(--red)}
.myteam-budget{background:rgba(0,0,0,.12);border:1px solid var(--border);border-radius:14px;padding:16px}
.myteam-budget-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.myteam-budget-label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-dim);font-weight:800}
.myteam-budget-value{font-family:var(--mono);font-size:22px;font-weight:800}
.myteam-budget-bar{height:9px;background:var(--panel);border:1px solid var(--border);border-radius:99px;overflow:hidden;margin:12px 0 8px}
.myteam-budget-fill{height:100%;background:var(--amber);border-radius:99px}
.myteam-budget-remaining{display:flex;justify-content:space-between;font-size:11px;color:var(--text-dim)}
.myteam-section-head{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:12px}
.myteam-section-head h2{margin:0}
.myteam-section-head .note{margin:0}
.myteam-roster-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.myteam-mon{background:var(--panel-alt);border:1px solid var(--border);border-radius:14px;padding:12px;transition:.15s ease;position:relative;overflow:hidden}
.myteam-mon:hover{border-color:var(--amber);transform:translateY(-1px)}
.myteam-mon-top{display:flex;align-items:center;gap:10px}
.myteam-mon .sprite{width:52px;height:52px;margin:0;border-radius:10px}
.myteam-mon-name{font-weight:750;font-size:13px;line-height:1.2}
.myteam-mon-points{display:inline-flex;margin-top:4px;font-family:var(--mono);font-size:11px;font-weight:800;color:var(--amber);background:rgba(255,255,255,.035);border:1px solid var(--border);padding:3px 7px;border-radius:999px}
.myteam-mon-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.myteam-mon-stat{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:7px 6px}
.myteam-mon-stat .v{font-family:var(--mono);font-size:13px;font-weight:800}.myteam-mon-stat .l{font-size:9px;color:var(--text-dim);text-transform:uppercase;margin-top:2px}
.myteam-dashboard-grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(280px,.8fr);gap:14px;margin-top:14px}
.myteam-stat-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.myteam-stat-card{background:var(--panel-alt);border:1px solid var(--border);border-radius:12px;padding:12px}
.myteam-stat-card .eyebrow{font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-dim);font-weight:800}
.myteam-stat-card .big{font-size:18px;font-weight:800;margin-top:4px}.myteam-stat-card .small{font-size:11px;color:var(--text-dim);margin-top:2px}
.random-trade{background:linear-gradient(135deg,rgba(255,255,255,.025),rgba(255,255,255,.01));border:1px solid var(--border);border-radius:12px;padding:13px}
.random-trade-result{margin-top:10px;padding:10px;border-radius:10px;background:var(--panel);border:1px solid var(--border)}
.random-trade-flow{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}.random-trade-side{min-width:0}.random-trade-side .label{font-size:9px;color:var(--text-dim);text-transform:uppercase}.random-trade-mon{font-weight:800;font-size:12px;margin-top:2px}.random-trade-arrow{font-size:18px;color:var(--amber)}
@media(max-width:850px){.myteam-hero-grid,.myteam-dashboard-grid{grid-template-columns:1fr}}
@media(max-width:600px){.myteam-stat-grid{grid-template-columns:1fr}.myteam-title{font-size:25px}}
</style>
<style>
.page-nav{width:100%;display:flex;align-items:center;justify-content:center;gap:4px;flex-wrap:wrap;padding:10px 16px;margin:0 0 20px;border-bottom:1px solid var(--border,#ddd);background:var(--panel,#fff);box-sizing:border-box;position:relative;z-index:50}
.page-nav a{display:inline-flex;align-items:center;justify-content:center;padding:8px 13px;border-radius:8px;color:var(--text,#222);text-decoration:none;font-size:12px;font-weight:700;white-space:nowrap;transition:background .15s,border-color .15s,color .15s; border:1px solid transparent}
.page-nav a:hover{background:var(--panel-alt,#f4f4f4);border-color:var(--border,#ddd)}
.page-nav a.active{background:var(--panel-alt,#f4f4f4);border-color:var(--border,#ddd);color:var(--amber,var(--accent,#c98b2e))}
.page-nav.locked a{opacity:.45;cursor:not-allowed}
.page-nav.locked a:hover{background:transparent;border-color:transparent}
.page-nav .nav-lock-hint{font-size:11px;color:var(--text-dim,#777);font-weight:600;margin-left:6px}
@media(max-width:700px){.page-nav{justify-content:flex-start;overflow-x:auto;flex-wrap:nowrap;padding:8px 10px}.page-nav a{flex:0 0 auto}}
</style>
<style>
/* Auto-hiding site navigation */
body{padding-top:58px;}
.page-nav{position:fixed;top:0;left:0;right:0;width:100%;height:58px;margin:0;padding:9px 16px;box-shadow:0 6px 18px rgba(0,0,0,.18);transform:translateY(0);transition:transform .22s ease,box-shadow .22s ease;z-index:1000;}
.page-nav.nav-hidden{transform:translateY(-100%);box-shadow:none;}
.page-nav a{flex:0 0 auto;}
.nav-hover-zone{position:fixed;top:0;left:0;right:0;height:9px;z-index:1001;}
@media(max-width:700px){body{padding-top:52px}.page-nav{height:52px;padding:7px 10px;overflow-x:auto;flex-wrap:nowrap}.nav-hover-zone{height:8px}}
</style>

<style id="mobile-friendly-overrides">
/* Site-wide mobile usability pass */
html{overflow-x:hidden;-webkit-text-size-adjust:100%;}
body{overflow-x:hidden;max-width:100%;}
img,video,canvas,svg{max-width:100%;}
button,input,select,textarea{font:inherit;max-width:100%;}
button{touch-action:manipulation;}

@media (max-width: 700px){

  function themeFor(id){
    if(id==='custom'){
      const c=custom()||{};
      const base=THEMES.find(t=>t.id===(c.base||'amber'))||THEMES[0];

      if(c.enabled) Object.keys(base).forEach(k=>{if(!['id','name'].includes(k)&&c.enabled[k]===false) out[k]=base[k]});

  function applyTheme(id, persist){
    let theme;
    if(id==='custom'){
      const custom=getCustomTheme();
      const base=THEMES.find(t=>t.id===(custom?.base||'amber'))||THEMES[0];
      theme=Object.assign({},base,custom||{});
      if(custom?.enabled){ Object.keys(base).forEach(k=>{ if(['id','name'].includes(k))return; if(custom.enabled[k]===false) theme[k]=base[k]; }); }
    }else theme=THEMES.find(t=>t.id===id) || THEMES[0];
    const root = document.documentElement.style;
    ['bg','panel','panelAlt','border','text','textDim','accent','accentText'].forEach(k=>{ if(theme[k]) root.setProperty('--'+(k==='panelAlt'?'panel-alt':k==='textDim'?'text-dim':k==='accentText'?'amber-text':k),theme[k]); });
    root.setProperty('--amber', theme.accent); root.setProperty('--teal', THEME_TEAL); root.setProperty('--red', THEME_RED);

    return theme;

  // ---------- helpers ----------
  function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function toShowdownId(species){

  }
  function normalizeStoredRosters(rosters){
    const out = {};
    for(const [team, list] of Object.entries(rosters || {})){
      out[team] = (Array.isArray(list) ? list : []).map(mon => {
        if(typeof mon === 'string') return {name:mon, points:null};
        return {name:String(mon?.name ?? ''), points:mon?.points ?? null};
      }).filter(mon => mon.name);
    }
    return out;
  }
  function teamsList(){ return Object.keys(DASH.settings.rosters||{}).sort(); }

  function rosterPoints(list){ return (list||[]).reduce((s,m)=> s + (Number(m.points)||0), 0); }
  function freeAgencyMons(){
    const pool = Array.isArray(DASH.settings?.freeAgency?.mons)
      ? DASH.settings.freeAgency.mons
      : [];

    // Free Agency is only for genuinely undrafted Pokémon. The published
    // Free Agency board may still contain a Pokémon that was later drafted,
    // traded, or otherwise moved onto a team, so filter against every
    // currently published team roster before showing anything as available.
    const drafted = new Set();
    for(const roster of Object.values(DASH.settings?.rosters || {})){
      for(const mon of (Array.isArray(roster) ? roster : [])){
        const name = typeof mon === 'string' ? mon : mon?.name;
        if(name) drafted.add(pokemonMatchKey(name));
      }
    }

    return pool.filter(mon => mon?.name && !drafted.has(pokemonMatchKey(mon.name)));
  }

  // ---------- pokémon stat aggregation (mirrors stats.html) ----------
  function normName(n){
    return String(n??'').trim().toLowerCase().replace(/-/g,' ').replace(/_/g,' ').replace(/\s+/g,' ');
  }

  // Pokémon forms can be named differently between the Free Agency board,
  // published rosters, and trade records. Treat the optional "Paldea"
  // regional token as equivalent while preserving the actual stored name.
  function pokemonMatchKey(n){
    return normName(n)
      .replace(/\bpaldea\b/g)
      .replace(/\bform\b/g)
      .replace(/\s+/g,' ')
      .trim();
  }

  function pokemonSameSpeciesForm(a,b){
    const left=pokemonMatchKey(a), right=pokemonMatchKey(b);
    return !!left && !!right && left===right;
  }

  function canonicalPokemonName(name,candidates){
    const exact=String(name??'').trim();
    const exactMatch=(candidates||[]).find(c=>normName(c)===normName(exact));
    if(exactMatch) return exactMatch;
    const k=pokemonMatchKey(exact);
    return (candidates||[]).find(c=>pokemonMatchKey(c)===k) || exact;
  }

  // Pokémon forms can be named differently between the Free Agency board,
  // published rosters, and trade records. In particular, Paldean Tauros
  // forms may appear as either "Tauros Paldea Blaze" or "Tauros Blaze".
  // Build a comparison key that treats the explicit "Paldea" token as
  // optional, while preserving the actual stored roster name as canonical.
  function pokemonMatchKey(n){
    return normName(n)
      .replace(/\bpaldea\b/g)
      .replace(/\s+/g,' ')
      .trim();
  }

  function canonicalPokemonName(name, candidates){
    const target = normName(name);
    const exact = (candidates||[]).find(c => normName(c) === target);
    if(exact) return exact;

    const key = pokemonMatchKey(name);
    const match = (candidates||[]).find(c => pokemonMatchKey(c) === key);
    return match || name;
  }

  function canonicalTradePokemonName(name, roster, freeAgencyPool){
    const candidates = [
      ...(Array.isArray(roster) ? roster : []).map(m => typeof m === 'string' ? m : m?.name),
      ...(Array.isArray(freeAgencyPool) ? freeAgencyPool : []).map(m => typeof m === 'string' ? m : m?.name)
    ].filter(Boolean);
    return canonicalPokemonName(name, candidates);
  }
  function teamFor(username){
    const key = (username||'').trim().toLowerCase();
    return DASH.teamMap[key] || (username||'').trim() || 'Unknown';
  }
  // Aggregates this coach's season stats for one species across every stored
  // replay where that Pokémon appeared on the coach's side.
  function myPokemonStats(species){
    if(!profile || !profile.team_name) return null;
    const target = normName(species);
    let dealt=0, taken=0, kills=0, deaths=0, assists=0, games=0, winGames=0, wins=0;
    for(const r of Object.values(DASH.replays||{})){
      for(const k in (r.mons||{})){
        const m = r.mons[k];
        if(normName(m.species) !== target) continue;
        if(teamFor(r.players?.[m.side]) !== profile.team_name) continue;
        dealt += m.damageDealt||0;
        taken += m.damageTaken||0;
        kills += m.kills||0;
        deaths += m.deaths||0;
        assists += m.assists||0;
        const appearances = m.appearances||0;
        games += appearances;
        if(appearances > 0){
          winGames++;
          // Replays store the winner as a username (r.winner), not a per-side
          // results map, so fall back to comparing against the coach on this side.
          const result = r.results && r.results[m.side] ? r.results[m.side]
            : (r.winner && r.winner.toLowerCase()===(r.players?.[m.side]||'').toLowerCase() ? 'W' : (r.winner ? 'L' : null));
          if(result === 'W') wins++;
        }
      }
    }
    return { dealt, taken, kills, deaths, assists, games, winPct: winGames ? Math.round(100*wins/winGames) : null };
  }

  async function loadDashboardState(){
    const {data, error} = await supabase.from('replays').select('replay_id,replay_data');
    if(error) throw error;
    let sharedState = null;
    const replays = {};
    for(const row of (data||[])){
      if(row.replay_id === SUPABASE_STATE_ID){ sharedState = row.replay_data || {}; continue; }
      if(row.replay_id === '__rosters__' || row.replay_id === '__free_agency__') continue;
      if(row.replay_id) replays[row.replay_id] = row.replay_data || {};
    }
    const shared = sharedState || {};
    const snap = installSeasonPicker(shared);
    DASH.teamMap = snap.teamMap;
    DASH.settings = Object.assign({ rosters:{}, freeAgency:{mons:[]} }, snap.settings || {});
    DASH.settings.rosters = normalizeStoredRosters(DASH.settings.rosters||{});

  async function loadTrades(){
    // The active trade season is controlled by the commissioner reset, not by
    // the calendar year. This is critical after an end-of-season reset.
    const {data:seasonRow, error:seasonErr} = await supabase
      .from('trade_season_settings')
      .select('active_season')
      .eq('id', 1)
      .maybeSingle();
    if(seasonErr) throw seasonErr;
    activeTradeSeason = Number(seasonRow?.active_season) || new Date().getFullYear();

    const {data, error} = await supabase.from('trade_requests').select('*').order('created_at', {ascending:false});
    if(error) throw error;
    trades = data || [];

    const {data:limits, error:limitErr} = await supabase
      .from('franchise_trade_limits')
      .select('*')
      .eq('season', activeTradeSeason);
    if(limitErr){
      console.warn('Franchise trade limits unavailable; using 8-trade defaults:', limitErr.message);
      tradeLimits = [];
    }else{
      tradeLimits = limits || [];
    }
  }

  function tradeLimitFor(team, kind){
    const row = tradeLimits.find(x => x.team_name === team);
    if(!row) return 8;
    return kind === 'freeagency' ? Math.max(0, Number(row.free_agency_trade_limit) || 0) : Math.max(0, Number(row.team_trade_limit) || 0);
  }

  function completedTradeCount(team, kind='team'){
    const season = activeTradeSeason;
    return trades.filter(t=>
      (t.status==='accepted' || t.status==='reverted') &&
      Number(t.season ?? new Date(t.created_at).getFullYear())===season &&
      (kind==='freeagency' ? t.target_team===null && t.proposer_team===team : t.target_team!==null && (t.proposer_team===team || t.target_team===team))
    ).length;
  }

  function tradeAllowance(team, kind='team'){
    const limit=tradeLimitFor(team,kind);
    const used=completedTradeCount(team,kind);
    // Commissioner-granted credits belong to the player account. They are
    // shown on the player's dashboard and added to the normal allowance.
    // For a franchise-level display we leave the franchise limit itself intact.
    const credits = profile?.team_name === team ? Math.max(0, Number(profile?.trade_credits) || 0) : 0;
    return {limit,used,credits,remaining:Math.max(0,limit+credits-used)};
  }

  function recordAdjustKey(){ return `sbl_record_adjust_${session?.user?.id||'anonymous'}_${profile?.team_name||'team'}`; }
  function getRecordAdjustments(){
    try{ const x=JSON.parse(localStorage.getItem(recordAdjustKey())||'{}'); return {wins:Math.max(0,Number(x.wins)||0),losses:Math.max(0,Number(x.losses)||0)}; }catch(e){ return {wins:0,losses:0}; }

  function saveRecordAdjustment(kind){

  // Pull the official W/L record from the same completed match results that feed the ladder.
  // Replay rows may use either {p1,p2} or [player1,player2] for players.
  function myTeamRecord(){
    const team=String(profile?.team_name||'').trim();
    let wins=0, losses=0, games=0;
    const same=(a,b)=>String(a||'').trim().toLowerCase()===String(b||'').trim().toLowerCase();
    for(const r of Object.values(DASH.replays||{})){
      if(!r || !r.players) continue;
      const players=Array.isArray(r.players) ? r.players : [r.players.p1,r.players.p2];
      let mySide=-1;
      for(let side=0;side<2;side++){
        if(same(teamFor(players[side]),team)){ mySide=side; break; }
      }
      if(mySide<0) continue;
      const results=r.results||{};
      const direct=results[mySide] ?? results[mySide===0?'p1':'p2'];
      const v=typeof direct==='string' ? direct.trim().toLowerCase() : '';
      let result=(v==='w'||v==='win'||v==='won')?'W':(v==='l'||v==='loss'||v==='lost')?'L':'';
      if(!result && r.winner) result=same(r.winner,players[mySide])?'W':'L';
      if(!result) continue;
      games++;
      if(result==='W') wins++; else losses++;
    }
    return {wins,losses,games};
  }

  let lastRandomTradeKey = '';

  function randomTradeSuggestion(){
    const mine=myRoster();
    const myPts=rosterPoints(mine);
    const candidates=[];
    for(const team of teamsList().filter(t=>t!==profile.team_name)){
      const theirs=DASH.settings.rosters[team]||[];
      for(const give of mine){
        for(const get of theirs){
          const myAfter=myPts-(Number(give.points)||0)+(Number(get.points)||0);
          const theirAfter=rosterPoints(theirs)-(Number(get.points)||0)+(Number(give.points)||0);
          if(mine.length < 10 || theirs.length < 10) continue;
          if(myAfter>ROSTER_BUDGET || theirAfter>ROSTER_BUDGET) continue;
          candidates.push({team,give,get});
        }
      }
    }
    if(!candidates.length) return null;

    // Prefer a different suggestion when the user presses Reroll. If there is
    // only one legal trade, keep returning it rather than showing no result.
    const fresh = candidates.filter(s => `${s.team}|${s.give.name}|${s.get.name}` !== lastRandomTradeKey);
    const pool = fresh.length ? fresh : candidates;
    const picked = pool[Math.floor(Math.random()*pool.length)];
    lastRandomTradeKey = `${picked.team}|${picked.give.name}|${picked.get.name}`;
    return picked;
  }

  function useRandomTradeSuggestion(s){
    if(!s) return;
    // Pre-fill the existing trade composer; nothing is submitted automatically.
    draft.target=s.team;
    draft.offered=new Set([s.give.name]);
    draft.requested=new Set([s.get.name]);
    draft.faQuery='';
    activeTab='trades';

  function nextBattleForTeam(team){
    const rounds = Array.isArray(DASH.settings?.fixture?.rounds) ? DASH.settings.fixture.rounds : [];
    const key = v => String(v||'').trim().toLowerCase().replace(/[^a-z0-9]/g);
    const target = key(team);
    const played = (week, home, away) => Object.values(DASH.replays||{}).some(r=>{
      if(!r || (r.week||'Unassigned') !== week || !r.players) return false;
      const p1=teamFor(r.players.p1), p2=teamFor(r.players.p2), a=key(p1), b=key(p2);
      return (a===key(home)&&b===key(away)) || (a===key(away)&&b===key(home));
    });
    for(const round of rounds){
      for(const match of (round.matches||[])){
        if(key(match.home)!==target && key(match.away)!==target) continue;
        if(played(round.week,match.home,match.away)) continue;
        return {week:round.week,opponent:key(match.home)===target?match.away:match.home};
      }
    }
    return null;
  }
  function wireNextBattle(){
    const card=document.getElementById('nextBattleCard'), op=document.getElementById('nextBattleOpponent'), meta=document.getElementById('nextBattleMeta');
    if(!card||!op||!meta) return;
    const battle=nextBattleForTeam(profile.team_name);
    if(!battle){ op.textContent='No upcoming battle'; meta.textContent='Open Match Prep →'; card.href='team-analysis.html'; return; }
    op.textContent=battle.opponent; meta.textContent=`${battle.week} · Open Match Prep →`;
    card.href=`team-analysis.html?team=${encodeURIComponent(battle.opponent)}`;
  }

  function renderProposeTrade(){
    const el = document.getElementById('proposePanel');
    const roster = myRoster();
    const otherTeams = teamsList().filter(t=>t!==profile.team_name);
    const targetIsFA = draft.target === '';
    const targetRoster = targetIsFA ? null : (DASH.settings.rosters[draft.target] || []);
    const requestPool = targetIsFA ? freeAgencyMons() : (targetRoster || []);

    function pickCard(m, role){
      const set = role === 'offered' ? draft.offered : draft.requested;
      const checked = set.has(m.name);
      return `<div class="pick-card${checked?' checked':''}" data-role="${role}" data-name="${escapeHtml(m.name)}" role="button" tabindex="0" aria-pressed="${checked}">
        <span class="pick-card-check">✓</span>
        ${spriteImg(m.name,'sprite')}
        <div class="pick-card-name">${escapeHtml(m.name)}</div>
        ${m.points!=null?`<div class="pick-card-pts">${escapeHtml(m.points)} pts</div>`:''}
      </div>`;
    }

    function chipsHtml(role){
      const set = role === 'offered' ? draft.offered : draft.requested;
      const pool = role === 'offered' ? roster : requestPool;
      return Array.from(set).map(name=>{
        const m = pool.find(x=>x.name===name) || {name, points:null};
        return `<span class="selected-chip">${spriteImg(m.name,'sprite')} ${escapeHtml(m.name)}<button type="button" data-remove="${escapeHtml(name)}" data-role="${role}" aria-label="Remove ${escapeHtml(name)}">×</button></span>`;
      }).join('');
    }

    function faResultsHtml(){
      const q = (draft.faQuery||'').trim().toLowerCase();
      if(!q) return '<div class="fa-hint">Only Pokémon that are currently undrafted are available in Free Agency.</div>';
      const matches = freeAgencyMons().filter(m=>m.name.toLowerCase().includes(q)).slice(0,30);
      if(!matches.length) return `<div class="fa-empty">No free agents match “${escapeHtml(draft.faQuery)}”.</div>`;
      return matches.map(m=>pickCard(m,'requested')).join('');
    }

    el.innerHTML = `
      <h2>Propose a Trade</h2>
      <div class="note">You can offer multiple Pokémon for multiple Pokémon. Point totals do not have to match, but after the trade neither roster may exceed 115 points or fall below 10 Pokémon. Each team gets 8 completed trades per season.</div>
      <div class="row">
        <div>
          <label>Trade with</label>
          <select id="targetSelect">
            <option value="" ${targetIsFA?'selected':''}>— Free Agency —</option>
            ${otherTeams.map(t=>`<option value="${escapeHtml(t)}" ${t===draft.target?'selected':''}>${escapeHtml(t)}</option>`).join('')}
          </select>
        </div>
      </div>
      <div class="trade-cols">
        <div class="trade-col">
          <h4>You give ${targetIsFA?'(optional for a free-agency pickup)':''}</h4>
          <div class="selected-row" id="offeredSelected">${chipsHtml('offered')}</div>
          <div class="pick-grid" id="offeredPicks">
            ${roster.length ? roster.map(m=>pickCard(m,'offered')).join('') : '<div class="empty-state">Your roster is empty.</div>'}
          </div>
        </div>
        <div class="trade-col">
          <h4>You get ${targetIsFA?'(undrafted only)':''}</h4>
          <div class="selected-row" id="requestedSelected">${chipsHtml('requested')}</div>
          ${targetIsFA ? `
            <div class="fa-search-wrap">
              <input type="text" id="faSearch" placeholder="Search undrafted Pokémon…" value="${escapeHtml(draft.faQuery||'')}" autocomplete="off">
            </div>
            <div class="pick-grid" id="requestedPicks">${faResultsHtml()}</div>
          ` : `
            <div class="pick-grid" id="requestedPicks">
              ${requestPool.length ? requestPool.map(m=>pickCard(m,'requested')).join('') : '<div class="empty-state">That team has no published roster.</div>'}
            </div>
          `}
        </div>
      </div>
      <div class="note" id="tradeSummary"></div>
      <div class="foot-actions">
        <button class="ghost" id="clearTradeSelectionBtn" type="button">Clear selected</button>
        <button class="primary" id="submitTradeBtn">Send trade proposal</button>
      </div>
      <div id="tradeMsg" class="note"></div>`;

    function totalPts(role){
      const set = role === 'offered' ? draft.offered : draft.requested;
      const pool = role === 'offered' ? roster : requestPool;
      return Array.from(set).reduce((s,name)=>{ const m = pool.find(x=>x.name===name); return s + (m ? (Number(m.points)||0) : 0); }, 0);
    }

    function tradeLimitMessage(team, kind='team'){
      const a = tradeAllowance(team, kind);
      const label = kind === 'freeagency' ? 'Free Agency trades' : 'team-to-team trades';
      return `${escapeHtml(team)} has used ${a.used}/${a.limit} ${label} this season (${a.remaining} remaining)`;
    }

    function updateTradeSummary(){
      const summaryEl = document.getElementById('tradeSummary');
      if(!summaryEl) return;
      const offPts = totalPts('offered'), reqPts = totalPts('requested');
      const proposerAfter = roster.length - draft.offered.size + draft.requested.size;
      const targetAfter = targetIsFA ? null : ((targetRoster||[]).length - draft.requested.size + draft.offered.size);
      const pointDelta = reqPts - offPts;
      const bits = [`Give ${offPts} pts / Get ${reqPts} pts${pointDelta===0 ? ' — balanced' : pointDelta>0 ? ` — you gain ${pointDelta} pts` : ` — you lose ${Math.abs(pointDelta)} pts`}`];
      bits.push(`Your roster after: ${proposerAfter}${proposerAfter<10?' (below 10 minimum)':''}`);
      bits.push(`${tradeLimitMessage(profile.team_name, targetIsFA ? 'freeagency' : 'team')}`);
      if(!targetIsFA){
        bits.push(`${escapeHtml(draft.target)} roster after: ${targetAfter}${targetAfter<10?' (below 10 minimum)':''}`);
        bits.push(`${tradeLimitMessage(draft.target, 'team')}`);
      }
      summaryEl.textContent = bits.join(' · ');
    }
    updateTradeSummary();

    document.getElementById('targetSelect').onchange = (e)=>{
      draft.target = e.target.value;
      draft.requested = new Set();
      draft.faQuery = '';
      renderProposeTrade();
    };

    function bindPickCards(container){
      container.querySelectorAll('.pick-card').forEach(card=>{
        const toggle = ()=>{
          const role = card.dataset.role, name = card.dataset.name;
          const set = role === 'offered' ? draft.offered : draft.requested;
          if(set.has(name)) set.delete(name); else set.add(name);
          card.classList.toggle('checked', set.has(name));
          card.setAttribute('aria-pressed', set.has(name));
          const rowId = role === 'offered' ? 'offeredSelected' : 'requestedSelected';
          document.getElementById(rowId).innerHTML = chipsHtml(role);
          bindChipRemovers();
          updateTradeSummary();
        };
        card.addEventListener('click', toggle);
        card.addEventListener('keydown', (e)=>{
          if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); toggle(); }
        });
      });
    }

    function bindChipRemovers(){
      el.querySelectorAll('.selected-chip button[data-remove]').forEach(btn=>{
        btn.onclick = ()=>{
          const role = btn.dataset.role, name = btn.dataset.remove;
          const set = role === 'offered' ? draft.offered : draft.requested;
          set.delete(name);
          document.getElementById(role === 'offered' ? 'offeredSelected' : 'requestedSelected').innerHTML = chipsHtml(role);
          const grid = document.getElementById(role === 'offered' ? 'offeredPicks' : 'requestedPicks');
          const card = grid && Array.from(grid.querySelectorAll('.pick-card')).find(c=>c.dataset.name === name);
          if(card){ card.classList.remove('checked'); card.setAttribute('aria-pressed','false'); }
          bindChipRemovers();
          updateTradeSummary();
        };
      });
    }

    bindPickCards(el);
    bindChipRemovers();

    if(targetIsFA){
      const searchInput = document.getElementById('faSearch');
      searchInput.addEventListener('input', (e)=>{
        draft.faQuery = e.target.value;
        const grid = document.getElementById('requestedPicks');
        grid.innerHTML = faResultsHtml();
        bindPickCards(grid);
      });
    }

    document.getElementById('clearTradeSelectionBtn').onclick = ()=>{
      draft.offered = new Set();
      draft.requested = new Set();
      const msgEl = document.getElementById('tradeMsg');
      if(msgEl){ msgEl.className='note'; msgEl.textContent=''; }
      renderProposeTrade();
    };

    document.getElementById('submitTradeBtn').onclick = async ()=>{
      const msgEl = document.getElementById('tradeMsg');
      if(draft.offered.size < 1 || draft.requested.size < 1){ msgEl.className='note danger'; msgEl.textContent='Select at least one Pokémon on each side.'; return; }
      const offPts = totalPts('offered'), reqPts = totalPts('requested');
      const proposerAfter = roster.length - draft.offered.size + draft.requested.size;
      const proposerPointsAfter = rosterPoints(roster) - offPts + reqPts;

      // Each team gets 8 completed trades per season. Team trades consume a
      // slot for both teams; Free Agency trades consume a slot for the team
      // making the pickup. Pending trades do not consume a slot.
      const proposerAllowance = tradeAllowance(profile.team_name, targetIsFA ? 'freeagency' : 'team');
      if(proposerAllowance.remaining <= 0){
        msgEl.className='note danger';
        msgEl.textContent=`You don't have any ${targetIsFA ? 'Free Agency' : 'team-to-team'} trades remaining.`;
        return;
      }

      if(proposerAfter < 10){
        msgEl.className='note danger';
        msgEl.textContent=`Invalid trade: your roster would have ${proposerAfter} Pokémon. Both sides must have at least 10.`;
        return;
      }

      if(proposerPointsAfter > ROSTER_BUDGET){
        msgEl.className='note danger';
        msgEl.textContent=`Invalid trade: your roster would be ${proposerPointsAfter}/${ROSTER_BUDGET} points, which is ${proposerPointsAfter-ROSTER_BUDGET} over the limit. You give ${offPts} points and receive ${reqPts} points.`;
        return;
      }

      if(!targetIsFA){
        const targetAfter = (targetRoster||[]).length - draft.requested.size + draft.offered.size;
        const targetPointsAfter = rosterPoints(targetRoster||[]) - reqPts + offPts;
        const targetAllowance = tradeAllowance(draft.target, 'team');

        if(targetAllowance.remaining <= 0){
          msgEl.className='note danger';
          msgEl.textContent=`${draft.target} doesn't have any team-to-team trades remaining.`;
          return;
        }

        if(targetAfter < 10){
          msgEl.className='note danger';
          msgEl.textContent=`Invalid trade: ${draft.target}'s roster would have ${targetAfter} Pokémon. Both sides must have at least 10.`;
          return;
        }

        if(targetPointsAfter > ROSTER_BUDGET){
          msgEl.className='note danger';
          msgEl.textContent=`Invalid trade: ${draft.target}'s roster would be ${targetPointsAfter}/${ROSTER_BUDGET} points, which is ${targetPointsAfter-ROSTER_BUDGET} over the limit. They give ${reqPts} points and receive ${offPts} points.`;
          return;
        }
      }
      const btn = document.getElementById('submitTradeBtn'); btn.disabled = true;
      msgEl.className='note'; msgEl.textContent='Sending…';
      try{
        // Always submit the canonical Pokémon name used by the published
        // roster/Free Agency data. This prevents form-name differences such
        // as "Tauros Blaze" vs "Tauros Paldea Blaze" from breaking accept_trade.
        const canonicalOffered = Array.from(draft.offered).map(name =>
          canonicalTradePokemonName(name, roster, [])
        );
        const canonicalRequested = Array.from(draft.requested).map(name =>
          canonicalTradePokemonName(name, targetIsFA ? [] : targetRoster, targetIsFA ? freeAgencyMons() : [])
        );

        const {error} = await supabase.from('trade_requests').insert({
          proposer_team: profile.team_name,
          target_team: targetIsFA ? null : draft.target,
          mons_offered: canonicalOffered,
          mons_requested: canonicalRequested
        });
        if(error) throw error;
        draft = { target:'', offered:new Set(), requested:new Set(), faQuery:'' };
        await loadTrades();
        activeTab = 'trades';
        markTradeTabSeen('all');
        setStatus('Trade proposal sent.', false);
        renderTabs(); render();
      }catch(e){
        msgEl.className='note danger'; msgEl.textContent = e.message;
        btn.disabled = false;
      }
    };
  }

  function bindTradeActions(){
    contentEl.querySelectorAll('button[data-action]').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        const id = Number(btn.dataset.id);
        const action = btn.dataset.action;
        const errEl = document.getElementById(`tradeErr-${id}`);
        if(errEl){ errEl.className='note'; errEl.textContent=''; }
        btn.disabled = true;
        try{
          if(action === 'accept'){
            const {error} = await supabase.rpc('accept_trade', { trade_id: id });
            if(error) throw error;
          } else if(action === 'reject'){
            const {error} = await supabase.from('trade_requests')
              .update({ status:'rejected', responded_at:new Date().toISOString(), responded_by:session.user.id })
              .eq('id', id);
            if(error) throw error;

  // ---------- shell ----------
  function setStatus(msg, danger){ statusMsg = msg; }

  // ---------- trade notification / seen state ----------
  // Notifications are local to the signed-in user. Opening the Trades tab clears
  // the relevant notification bucket; switching between Pending/Completed/Free
  // Agency also marks the corresponding records as seen.
  function tradeSeenKey(){
    return `sbl_trade_seen_${session?.user?.id || 'anonymous'}`;
  }

  function getTradeSeen(){
    try{
      const raw = localStorage.getItem(tradeSeenKey());
      const parsed = raw ? JSON.parse(raw) : {};
      return {
        pending: new Set(Array.isArray(parsed.pending) ? parsed.pending.map(Number) : []),
        history: new Set(Array.isArray(parsed.history) ? parsed.history.map(Number) : [])
      };
    }catch(e){
      return {pending:new Set(), history:new Set()};
    }
  }

  function saveTradeSeen(seen){
    try{
      localStorage.setItem(tradeSeenKey(), JSON.stringify({
        pending: Array.from(seen.pending),
        history: Array.from(seen.history)
      }));
    }catch(e){}
  }

  function markTradeTabSeen(tab){
    if(!profile?.team_name) return;
    const seen = getTradeSeen();
    const mine = profile.team_name;

    if(tab === 'pending' || tab === 'all'){
      trades.filter(t => t.target_team === mine && t.status === 'pending')
        .forEach(t => seen.pending.add(Number(t.id)));
    }
    if(tab === 'history' || tab === 'all'){
      trades.filter(t => t.status !== 'pending' && (t.proposer_team === mine || t.target_team === mine))
        .forEach(t => seen.history.add(Number(t.id)));
    }
    saveTradeSeen(seen);
  }

  function unreadTradeCounts(){
    const seen = getTradeSeen();
    const myTeam = profile?.team_name;
    if(!myTeam) return {incoming:0, history:0};
    return {
      incoming: trades.filter(t => t.target_team === myTeam && t.status === 'pending' && !seen.pending.has(Number(t.id))).length,
      history: trades.filter(t => t.status !== 'pending' && (t.proposer_team === myTeam || t.target_team === myTeam) && !seen.history.has(Number(t.id))).length
    };
  }

  function renderTabs(){
    let nav = document.getElementById('tabs');
    if(!nav){
      nav = document.createElement('nav');
      nav.className = 'tabs';
      nav.id = 'tabs';
      contentEl.before(nav);
    }
    const unread = unreadTradeCounts();
    const totalUnread = unread.incoming + unread.history;
    const tabs = [
      ['myteam','My Team'],
      ['trades',`Trades${totalUnread ? ` <span class="tab-badge">${totalUnread}</span>` : ''}`],
      ['rosters','All Rosters'],
      ['account','Account']
    ];
    nav.innerHTML = tabs.map(([id,label])=>`<button data-tab="${id}" class="${activeTab===id?'active':''}">${label}</button>`).join('');
    nav.querySelectorAll('button').forEach(b=>{
      b.onclick = ()=>{
        activeTab = b.dataset.tab;
        if(activeTab === 'trades') markTradeTabSeen('all');
        renderTabs();
        render();
      };
    });
  }

  function render(){
    if(!session){ document.getElementById('tabs')?.remove(); renderAuthGate(); return; }
    if(!profile){ document.getElementById('tabs')?.remove(); contentEl.innerHTML = '<div class="empty-state">Loading…</div>'; return; }

    if(!profile.username || !profile.team_name){ document.getElementById('tabs')?.remove(); renderTeamClaim(); return; }
    if(profile.status === 'pending' || profile.status === 'rejected'){
      renderTabs();
      if(activeTab === 'rosters') return renderRosters();
      if(activeTab === 'account') return renderAccount();
      return renderPendingOrRejected();
    }

    renderTabs();
    if(activeTab === 'myteam') return renderMyTeam();
    if(activeTab === 'trades') return renderTrades();
    if(activeTab === 'rosters') return renderRosters();
    if(activeTab === 'account') return renderAccount();
  }

  async function boot(){
    contentEl.innerHTML = '<div class="empty-state">Loading…</div>';
    try{
      await refreshAll();
      render();
    }catch(e){
      contentEl.innerHTML = `<div class="panel"><div class="note danger">Could not load your dashboard: ${escapeHtml(e.message)}</div></div>`;
    }
  }

  (async function init(){
    const {data} = await supabase.auth.getSession();
    session = data.session;
    if(session){ await boot(); }
    else{ renderAuthGate(); }

    supabase.auth.onAuthStateChange((event, newSession)=>{
      if(event === 'SIGNED_OUT'){ session=null; profile=null; trades=[]; render(); }
    });
  })();
})();
</script>
<script>
(function(){
  const nav=document.getElementById('pageNav');
  if(!nav) return;
  const links=[...nav.querySelectorAll('a[data-page]')];
  const current=(location.pathname.split('/').pop()||'index.html').toLowerCase();
  const client=window.supabase?.createClient(
    'https://dfxdkkemltukxaklhcpo.supabase.co',
    'sb_publishable_H7iIBiJTxY77lBAcpJn2VQ_u2hAG2CN'
  );
  links.forEach(a=>{ if(a.dataset.page===current) a.classList.add('active'); });
  function lockNav(locked){
    nav.classList.toggle('locked',locked);
    links.forEach(a=>{
      a.setAttribute('aria-disabled',locked?'true':'false');
      if(locked) a.title='Log in to switch pages'; else a.removeAttribute('title');
    });
  }
  links.forEach(a=>a.addEventListener('click',e=>{
    if(nav.classList.contains('locked')){ e.preventDefault(); return; }
  }));
  function hidePrivilegedLinks(){
    nav.querySelectorAll('[data-admin-only]').forEach(a=>{ a.hidden=true; });
    nav.querySelectorAll('[data-draft-live-only]').forEach(a=>{ a.hidden=true; });
  }
  function showAdminLinks(){
    nav.querySelectorAll('[data-admin-only]').forEach(a=>{ a.hidden=false; });
  }
  function showDraftLink(){
    nav.querySelectorAll('[data-draft-live-only]').forEach(a=>{ a.hidden=false; });
  }
  // Commissioner status rarely changes, so we only check it against the
  // database once per login and cache the result (plus the last-seen draft
  // status) in sessionStorage. Crucially, we also paint from that cache
  // *synchronously* below, before any awaiting -- otherwise hidePrivilegedLinks()
  // hides the admin-only / draft-room links on every fresh page load, and they
  // only pop back in a tick later once getSession() resolves. That pop-in is
  // the flicker/"reload" look when swapping between pages.
  const NAV_CACHE_PREFIX='navPerms:';
  const NAV_LAST_UID_KEY='navLastUid';
  function readNavCache(uid){
    try{ const raw=sessionStorage.getItem(NAV_CACHE_PREFIX+uid); return raw?JSON.parse(raw):null; }
    catch(e){ return null; }
  }
  function writeNavCache(uid,perms){
    try{ sessionStorage.setItem(NAV_CACHE_PREFIX+uid, JSON.stringify(perms)); }catch(e){}
  }
  function readLastUid(){
    try{ return sessionStorage.getItem(NAV_LAST_UID_KEY); }catch(e){ return null; }
  }
  function writeLastUid(uid){
    try{ sessionStorage.setItem(NAV_LAST_UID_KEY, uid); }catch(e){}
  }
  function clearNavCache(){
    try{
      Object.keys(sessionStorage).forEach(k=>{ if(k.indexOf(NAV_CACHE_PREFIX)===0) sessionStorage.removeItem(k); });
      sessionStorage.removeItem(NAV_LAST_UID_KEY);
    }catch(e){}
  }
  // Paint immediately from whatever was cached on the previous page, before
  // doing any real check -- this is what removes the flash. Only falls back
  // to hiding everything when there's nothing to paint from yet (first load
  // of the session, or a signed-out visitor).
  let paintedFromCache=false;
  const lastUid=readLastUid();
  if(lastUid){
    const cached=readNavCache(lastUid);
    if(cached){
      lockNav(false);
      if(cached.isCommissioner) showAdminLinks();
      if(cached.draftLive) showDraftLink();
      paintedFromCache=true;
    }
  }
  if(!paintedFromCache) hidePrivilegedLinks();
  async function setupNav(){
    try{
      if(!client){ lockNav(true); hidePrivilegedLinks(); return; }
      const {data:{session}}=await client.auth.getSession();
      lockNav(!session?.user);
      if(!session?.user){ hidePrivilegedLinks(); return; }
      writeLastUid(session.user.id);
      let perms=readNavCache(session.user.id);
      if(!perms){
        const {data:profile,error}=await client.from('profiles').select('is_commissioner').eq('id',session.user.id).maybeSingle();
        if(error) throw error;
        perms={isCommissioner:!!profile?.is_commissioner};
      }
      if(perms.isCommissioner){
        showAdminLinks();
      }else{
        nav.querySelectorAll('[data-admin-only]').forEach(a=>{ a.hidden=true; });
      }
      // "Draft Room" is shown to any logged-in team owner, but only while a
      // draft is actually in progress -- independent of commissioner status.
      try{
        const {data:stateRow}=await client.from('replays').select('replay_data').eq('replay_id','__dashboard_state__').maybeSingle();
        perms.draftLive = stateRow?.replay_data?.settings?.draft?.status === 'live';
      }catch(draftErr){ console.warn('Draft status check failed:',draftErr); }
      if(perms.draftLive) showDraftLink();
      else nav.querySelectorAll('[data-draft-live-only]').forEach(a=>{ a.hidden=true; });
      writeNavCache(session.user.id,perms);
    }catch(err){ console.warn('Navigation check failed:',err); lockNav(true); hidePrivilegedLinks(); }
  }
  setupNav();
  client?.auth.onAuthStateChange((_event,session)=>{
    lockNav(!session?.user);
    if(_event==='SIGNED_IN'||_event==='SIGNED_OUT'){ clearNavCache(); }
    if(session?.user) setupNav(); else hidePrivilegedLinks();
  });
})();
</script>

<script>
(function(){
  const nav = document.getElementById('pageNav');
  if(!nav) return;
  let ticking = false;
  function updateNav(){
    const y = window.scrollY || document.documentElement.scrollTop || 0;

    // Keep the nav visible at the top and automatically reveal it as the
    // user approaches the top. The moment the page is scrolled away from
    // the top, hide it without requiring another interaction.
    if(y <= 140){
      nav.classList.remove('nav-hidden');
    } else {
      nav.classList.add('nav-hidden');
    }
    ticking = false;
  }
  window.addEventListener('scroll', function(){
    if(!ticking){ ticking = true; requestAnimationFrame(updateNav); }
  }, {passive:true});
  nav.addEventListener('mouseenter', function(){ nav.classList.remove('nav-hidden'); });
  document.addEventListener('mousemove', function(e){
    if(e.clientY <= 12) nav.classList.remove('nav-hidden');
  }, {passive:true});
  nav.classList.remove('nav-hidden');
})();
</script>

  const aliases={

  };
  function slug(s){
    return String(s||'').trim().toLowerCase()
      .replace(/[’']/g).replace(/[♀]/g,'-f').replace(/[♂]/g,'-m')
      .replace(/[.:]/g).replace(/\s+/g,'-').replace(/-+/g,'-').replace(/^-|-$/g);
  }
  function urlsFor(img){
    let id=slug(img.getAttribute('data-sprite-species')||img.alt||'');
    if(!id){
      const m=(img.src||'').match(/sprites\/[^/]+\/([^/?#]+)\.png/i);
      id=m?m[1].toLowerCase():'';
    }
    if(!id)return [];
    const ids=[]; const add=x=>{if(x&&!ids.includes(x))ids.push(x)};
    add(id); (aliases[id]||[]).forEach(add);
    add(id.replace(/-plumage$/)); add(id.replace(/-mask$/));
    add(id.replace(/-forme$/)); add(id.replace(/-form$/));
    add(id.replace(/-standard$/)); add(id.replace(/-normal$/));
    const parts=id.split('-');
    for(let i=parts.length-1;i>=1;i--)add(parts.slice(0,i).join('-'));
    const out=[];
    for(const x of ids){
      out.push(BASE+'gen9/'+x+'.png');
      out.push(BASE+'gen5/'+x+'.png');
      out.push(BASE+'dex/'+x+'.png');
    }
    return out;
  }
  function install(img){
    if(!(img instanceof HTMLImageElement)||img.dataset.sitewideSpriteFix)return;
    const src=img.src||'';
    if(!src.includes('/sprites/'))return;
    img.dataset.sitewideSpriteFix='1';
    img.dataset.sitewideSpriteUrls=JSON.stringify(urlsFor(img));
    img.dataset.sitewideSpriteIndex='-1';
    img.onerror=function(){
      const urls=JSON.parse(img.dataset.sitewideSpriteUrls||'[]');
      let i=Number(img.dataset.sitewideSpriteIndex||-1)+1;
      while(i<urls.length && urls[i]===img.src)i++;
      if(i<urls.length){img.dataset.sitewideSpriteIndex=String(i);img.style.opacity='';img.src=urls[i];}
      else{img.onerror=null;img.removeAttribute('src');img.style.opacity='.25';}
    };
  }
  function scan(root){
    if(root instanceof HTMLImageElement)install(root);
    else if(root&&root.querySelectorAll)root.querySelectorAll('img[src*="/sprites/"]').forEach(install);
  }
  function start(){scan(document); new MutationObserver(ms=>ms.forEach(m=>m.addedNodes.forEach(scan))).observe(document.documentElement,{subtree:true,childList:true});}
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start,{once:true}); else start();
})();
