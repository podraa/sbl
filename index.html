<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SBL Dashboard</title>
<style>
  :root{
--bg: #0b0b0c;
--panel: #141416;
--panel-alt: #1b1b1e;
--border: #29292d;

--text: #f5f5f5;
--text-dim: #96969d;

--amber: #d6a35d;
--teal: #63c7b5;
--red: #d97878;
    --mono:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;
    --sans:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:var(--sans); -webkit-font-smoothing:antialiased;
  }
  #app{width:min(1500px,calc(100% - 32px)); max-width:none; margin:0 auto; padding:26px 0 64px;}

  /* header + ticker */
  header{margin-bottom:24px;}
  h1{font-size:clamp(24px,2vw,30px); margin:0 0 2px; letter-spacing:.2px;}
  .sub{color:var(--text-dim); font-size:14px; margin-bottom:22px; line-height:1.5;}
  .ticker{
    display:flex; gap:0; overflow-x:auto; border:1px solid var(--border);
    border-radius:8px; background:linear-gradient(180deg,var(--panel-alt),var(--panel));
  }
  .tick{
    flex:1 0 220px; padding:14px 18px; border-right:1px solid var(--border);
    min-width:220px;
  }
  .tick:last-child{border-right:none;}
  .tick .lbl{font-size:10px; text-transform:uppercase; letter-spacing:.08em; color:var(--text-dim);}
  .tick .name{font-size:13px; margin:2px 0 4px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .tick .val{font-family:var(--mono); font-size:19px; color:var(--amber);}
  .tick.empty .val{color:var(--text-dim); font-size:13px;}

  /* tabs */
  nav.tabs{display:flex; gap:4px; margin:24px 0 22px; border-bottom:1px solid var(--border); flex-wrap:wrap;}
  nav.tabs button{
    background:none; border:none; color:var(--text-dim); padding:10px 14px;
    font-size:14px; font-weight:600; cursor:pointer; border-bottom:2px solid transparent;
    font-family:var(--sans);
  }
  nav.tabs button.active{color:var(--text); border-bottom-color:var(--amber);}
  nav.tabs button:hover{color:var(--text);}

  .panel{
    background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:18px;
    min-width:0;
  }
  .panel + .panel{margin-top:14px;}
  .panel h2{font-size:clamp(18px,1.35vw,21px); margin:0 0 16px; text-transform:none; letter-spacing:.01em; color:#fff; font-weight:750;}

  label{display:block; font-size:12px; color:var(--text-dim); margin-bottom:6px;}
  textarea, input[type=text]{
    width:100%; background:var(--panel-alt); border:1px solid var(--border); border-radius:8px;
    color:var(--text); padding:10px 12px; font-family:var(--mono); font-size:13px;
  }
  textarea{min-height:90px; resize:vertical;}
  .row{display:flex; gap:12px; flex-wrap:wrap; margin-bottom:12px;}
  .row > div{flex:1; min-width:160px;}

  button.primary{
    background:var(--amber); color:#1a1206; border:none; border-radius:8px;
    padding:10px 18px; font-weight:700; font-size:13px; cursor:pointer; font-family:var(--sans);
  }
  button.primary:disabled{opacity:.5; cursor:default;}
  button.ghost{
    background:none; border:1px solid var(--border); color:var(--text); border-radius:8px;
    padding:9px 14px; font-size:12px; cursor:pointer; font-family:var(--sans);
  }
  button.ghost:hover{border-color:var(--amber);}
  button.small{padding:5px 10px; font-size:11px;}
  .danger-btn{border-color:var(--red); color:var(--red);}

  .log{font-family:var(--mono); font-size:12px; white-space:pre-wrap; color:var(--text-dim); margin-top:10px; line-height:1.6;}
  .log .ok{color:var(--teal);}
  .log .err{color:var(--red);}

  table{width:100%; border-collapse:collapse; font-size:13px;}
  /* Tables stay fluid on wide screens and scroll horizontally only when their
     natural content is wider than the available viewport. */
  .panel{overflow-x:auto; overflow-y:visible;}
  .panel table{width:100%; min-width:max-content; white-space:nowrap;}
  .panel table thead,.panel table tbody{width:auto;}
  th{
    text-align:left; font-size:10px; text-transform:uppercase; letter-spacing:.06em;
    color:#fff; padding:8px 10px; border-bottom:1px solid var(--border);
  }
  td{padding:8px 10px; border-bottom:1px solid var(--border);}
  tr:last-child td{border-bottom:none;}
  td.num, th.num{text-align:right; font-family:var(--mono);}
  .rank{color:var(--text-dim); font-family:var(--mono); width:26px;}
  .pname{font-weight:600;}
  .dealt{color:var(--amber);}
  .taken{color:var(--red);}
  .kills{color:var(--teal);}

  select{
    background:var(--panel-alt); border:1px solid var(--border); color:var(--text);
    padding:8px 10px; border-radius:8px; font-family:var(--sans); font-size:13px;
  }
  .empty-state{color:var(--text-dim); font-size:13px; padding:20px 0; text-align:center;}
  .foot-actions{display:flex; gap:10px; margin-top:14px; flex-wrap:wrap;}
  .note{font-size:12px; color:var(--text-dim); margin-top:10px; line-height:1.5;}
  .map-row{display:flex; gap:10px; align-items:center; margin-bottom:8px;}
  .map-row input{flex:1;}
  .badge{
    display:inline-block; font-size:10px; padding:2px 7px; border-radius:20px;
    background:var(--panel-alt); border:1px solid var(--border); color:var(--text-dim); margin-left:6px;
  }

  /* sprites */
  .sprite{
    width:48px; height:48px; object-fit:contain; vertical-align:middle;
    image-rendering:pixelated; background:var(--panel-alt); border-radius:8px; margin-right:10px;
  }
  .pokemon-click{
    display:inline-flex; align-items:center; gap:8px; color:inherit; text-decoration:none;
    cursor:pointer; border-radius:8px; padding:2px 4px; margin:-2px -4px; transition:background .12s, transform .12s;
  }
  .pokemon-click:hover{background:var(--panel-alt); color:var(--amber); transform:translateY(-1px);}
  .pokemon-click:focus-visible{outline:2px solid var(--amber); outline-offset:2px;}
  .pokemon-click .sprite,.pokemon-click .sprite-xl{margin-right:0;}
  .pokemon-text-link{color:inherit; text-decoration:none; cursor:pointer;}
  .pokemon-text-link:hover{color:var(--amber); text-decoration:underline;}
  .sprite-xl{
    width:64px; height:64px; object-fit:contain; vertical-align:middle;
    image-rendering:pixelated; background:var(--panel-alt); border-radius:10px; margin-right:12px;
  }
  .pname-cell{display:flex; align-items:center;}

  /* wide layout (Leaderboards / Golden Fist / Franchise Stats) */
  #app.wide{width:min(1600px,calc(100% - 32px));}
  .wide .panel{padding:26px;}
  .wide table{font-size:15px;}
  .wide th{font-size:11px; padding:10px 12px;}
  .wide td{padding:12px;}

  .nav-link{
    display:inline-block; color:var(--teal); text-decoration:none; font-size:13px;
    font-weight:600; cursor:pointer; margin-top:4px;
  }
  .nav-link:hover{text-decoration:underline;}
  .section-divider{height:1px; background:var(--border); margin:18px 0;}

  #globalTable{overflow-x:auto;}
  #globalTable table{min-width:620px;}

  /* pokemon search */
  .pokemon-search-box{display:flex; gap:10px; align-items:flex-end; flex-wrap:wrap; margin-bottom:14px;}
  .pokemon-search-box .search-input-wrap{flex:1; min-width:240px;}
  .pokemon-search-box input[type=text]{font-family:var(--sans); font-size:14px;}
  .pokemon-search-hint{font-size:12px; color:var(--text-dim); margin-top:8px;}
  #pokemonSearchTable{overflow-x:auto;}
  #pokemonSearchTable table{min-width:700px;}
  .search-match{background:var(--panel-alt); border-radius:8px;}

  .type-badges{display:inline-flex;align-items:center;gap:4px;flex-wrap:wrap;margin-left:7px;vertical-align:middle;}
  .type-badge{display:inline-flex;align-items:center;justify-content:center;padding:2px 6px;border-radius:4px;border:1px solid rgba(255,255,255,.12);font:600 9px/1.1 var(--sans);letter-spacing:.03em;color:#fff;text-transform:uppercase;background:#555;}
  .type-normal{background:#777;} .type-fire{background:#b84b3e;} .type-water{background:#3f78a8;} .type-electric{background:#9a7a18;} .type-grass{background:#4f7f4d;} .type-ice{background:#5f9aa2;} .type-fighting{background:#8d4b42;} .type-poison{background:#744c83;} .type-ground{background:#8b6a43;} .type-flying{background:#687eaa;} .type-psychic{background:#a14f75;} .type-bug{background:#66843c;} .type-rock{background:#78684d;} .type-ghost{background:#62527f;} .type-dragon{background:#6651a0;} .type-dark{background:#4f4b50;} .type-steel{background:#66717b;} .type-fairy{background:#a96c88;}
  .summary-mon-main .type-badges,.gf-name .type-badges{display:flex;margin:4px 0 0;}
  .team-card-top-wrap{display:flex;flex-direction:column;align-items:center;gap:3px;}
  .team-card-top-type .type-badges{margin:0;}
  /* golden fist */
  .cause-subheading{font-size:14px;font-weight:600;color:var(--text);margin:4px 0 14px;}
  .gf-list{display:flex; flex-direction:column; gap:8px;}
  .gf-row{
    position:relative; display:grid; grid-template-columns:36px 72px minmax(0,1fr) 110px; align-items:center; gap:14px; padding:12px 16px; border-radius:12px;
    background:var(--panel-alt); border:1px solid var(--border); min-width:0;
  }
  .gf-row.top1{border-color:#ffd166; box-shadow:0 0 0 1px #ffd16655 inset;}
  .gf-row.top2{border-color:#c9c9c9;}
  .gf-row.top3{border-color:#cd7f32;}
  .gf-row.auditable-row{cursor:pointer;}
  .gf-row.auditable-row:hover{border-color:var(--amber);}
  .gf-rank{font-family:var(--mono); font-size:16px; width:28px; color:var(--text-dim); text-align:center;}
  .gf-row.top1 .gf-rank{color:#ffd166;}
  .gf-row.top2 .gf-rank{color:#c9c9c9;}
  .gf-row.top3 .gf-rank{color:#cd7f32;}
  .gf-sprite{width:64px; height:64px; object-fit:contain; image-rendering:pixelated; background:var(--panel); border-radius:10px;}
  .gf-info{min-width:0;}
  .gf-name{font-weight:750; font-size:18px; line-height:1.2;}
  .gf-sub{font-size:12px; color:var(--text-dim); margin-top:5px;}
  .gf-coach{position:absolute; left:50%; transform:translateX(-50%); width:min(30%,320px); font-size:15px; color:var(--teal); text-align:center; line-height:1.35; overflow-wrap:anywhere;}
  .gf-diff{font-family:var(--mono); font-size:22px; color:var(--teal); min-width:0; text-align:right; font-weight:700;}
  .gf-diff.neg{color:var(--red);}
  @media (max-width: 900px){
    .gf-row{grid-template-columns:32px 60px minmax(0,1fr) 90px; gap:10px; padding:10px 12px;}
    .gf-sprite{width:56px;height:56px;}
    .gf-name{font-size:16px;}
    .gf-coach{font-size:13px;}
    .gf-diff{font-size:19px;}
  }
  @media (max-width: 640px){
    .gf-row{grid-template-columns:30px 52px minmax(0,1fr) 72px; gap:8px; padding:9px 10px;}
    .gf-sprite{width:48px;height:48px;}
    .gf-name{font-size:15px;}
    .gf-sub{font-size:11px;}
    .gf-coach{font-size:12px;}
    .gf-diff{font-size:17px;}
  }


  .profile-grid{display:grid;grid-template-columns:repeat(4,minmax(120px,1fr));gap:10px;}
  .profile-grid>div{background:var(--panel-alt);border:1px solid var(--border);border-radius:8px;padding:11px 12px;}
  .profile-grid span{display:block;font-size:10px;text-transform:uppercase;color:var(--text-dim);letter-spacing:.05em;margin-bottom:4px;}
  .profile-grid strong{font-family:var(--mono);font-size:17px;}
  .profile-two-col{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
  .mini-heading{font-size:12px;text-transform:uppercase;color:var(--text-dim);letter-spacing:.06em;margin:0 0 8px;}
  .selected-row{outline:1px solid var(--amber);outline-offset:-1px;background:var(--panel-alt);}
  .record-grid{display:grid;grid-template-columns:repeat(4,minmax(180px,1fr));gap:12px;}
  .record-card{background:var(--panel-alt);border:1px solid var(--border);border-radius:10px;padding:15px;min-height:92px;}
  .record-label{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-dim);}
  .record-value{font-family:var(--mono);font-size:19px;margin-top:8px;line-height:1.25;}
  .record-sub{font-size:11px;margin-top:7px;}
  @media(max-width:850px){
    #app{padding:16px 12px 44px;}
    .profile-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
    .profile-two-col{grid-template-columns:1fr}
    .record-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
    .wide .panel{padding:16px;}
    nav.tabs{gap:2px;}
    nav.tabs button{padding:9px 10px;font-size:12px;}
    .ticker{margin-right:-2px;}
    .tick{flex-basis:132px;min-width:132px;padding:10px 12px;}
  }
  @media(max-width:520px){
    h1{font-size:19px;}
    .sub{font-size:12px;}
    .panel{padding:14px;}
    .profile-grid{grid-template-columns:1fr 1fr;gap:7px;}
    .profile-grid>div{padding:9px;}
    .profile-grid strong{font-size:15px;}
    .record-grid{grid-template-columns:1fr;}
    .gf-row{grid-template-columns:28px 56px minmax(0,1fr) 60px;gap:9px;padding:10px;}
    .gf-sprite{width:56px;height:56px;}
    .gf-name{font-size:15px;}
    .gf-coach{font-size:12px;}
    .gf-diff{font-size:18px;min-width:0;}
    .summary-header h3{font-size:18px;}
    .summary-side{padding:10px;}
  }


  @media(max-width:700px){
    #app,#app.wide{width:calc(100% - 20px);padding-top:22px;}
    header{margin-bottom:22px;}
    nav.tabs{margin:22px 0 20px;}
    .gf-row{grid-template-columns:24px 50px minmax(0,1fr) 60px;}
    .gf-coach{position:absolute; left:50%; transform:translateX(-50%); width:34%; font-size:11px;}
    .gf-diff{grid-column:4;text-align:right;margin-top:0;}
  }

  .banner-controls{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin:0 0 10px;}
  .banner-controls>div{min-width:180px;}
  .banner-controls select{width:100%;}
  .team-logo{width:58px;height:58px;object-fit:contain;border-radius:12px;background:var(--panel-alt);border:1px solid var(--border);padding:5px;}
  .team-card-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;}
  .team-card{background:linear-gradient(145deg,var(--panel-alt),#11151c);border:1px solid var(--border);border-radius:14px;padding:18px 20px;cursor:pointer;transition:transform .14s,border-color .14s,box-shadow .14s;min-height:120px;}
  .team-card:hover{transform:translateY(-3px);border-color:var(--amber);box-shadow:0 14px 36px rgba(0,0,0,.28);}
  .team-card-head{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:82px;}
  .team-card-copy{flex:1;text-align:center;min-width:0;}
  .team-card-name{font-weight:800;font-size:clamp(19px,1.7vw,25px);line-height:1.15;overflow-wrap:anywhere;}
  .team-card-sub{font-size:clamp(15px,1.2vw,18px);font-family:var(--mono);color:var(--text);margin-top:8px;}
  .team-card-top-sprite{width:82px;height:82px;object-fit:contain;image-rendering:pixelated;background:transparent;flex:none;}
  .team-card-stats,.team-card-stat{display:none;}
  .banner-team-card{flex:1 0 230px;min-width:230px;padding:14px 16px;border-right:1px solid var(--border);display:flex;align-items:center;gap:12px;}
  .banner-team-card:last-child{border-right:none;}
  .banner-team-card .team-logo{width:46px;height:46px;flex:none;}
  .banner-team-card .banner-stat{font-family:var(--mono);font-size:18px;color:var(--amber);}
  .overview-modal{max-width:760px; width:min(760px,calc(100vw - 32px)); margin:0 auto;}
  .banner-pokemon{flex:1 0 210px;min-width:210px;padding:12px 16px;border-right:1px solid var(--border);display:flex;align-items:center;gap:10px;}
  .banner-pokemon:last-child{border-right:none;}

  /* Pokémon profile modal */
  .pokemon-overlay{
    position:fixed; inset:0; z-index:100; display:flex; align-items:center; justify-content:center;
    padding:24px; overflow:auto; background:rgba(4,7,12,.62);
    backdrop-filter:blur(9px); -webkit-backdrop-filter:blur(9px);
    animation:pokemonOverlayIn .16s ease-out;
  }
  .pokemon-modal{
    width:min(1100px,100%); max-height:calc(100vh - 48px); overflow:auto;
    background:var(--panel); border:1px solid var(--border); border-radius:16px;
    box-shadow:0 24px 80px rgba(0,0,0,.55); transform-origin:center;
    animation:pokemonModalIn .18s cubic-bezier(.2,.8,.2,1);
  }
  .pokemon-modal-head{
    position:sticky; top:0; z-index:2; display:flex; justify-content:space-between; align-items:center;
    gap:12px; padding:12px 16px; background:rgba(22,28,38,.94); border-bottom:1px solid var(--border);
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  }
  .pokemon-modal-head strong{font-size:13px;}
  .pokemon-modal-body{padding:16px;}
  .pokemon-modal-body>.pokemon-profile{margin:0; border:none; padding:0; background:transparent;}
  @keyframes pokemonOverlayIn{from{opacity:0}to{opacity:1}}
  @keyframes pokemonModalIn{from{opacity:0;transform:translateY(22px) scale(.97)}to{opacity:1;transform:none}}
  @media(max-width:700px){
    .pokemon-overlay{padding:8px;}
    .pokemon-modal{max-height:calc(100vh - 16px);border-radius:12px;}
    .pokemon-modal-body{padding:12px;}
    .pokemon-modal-head{padding:10px 12px;}
  }

  /* audit modal */
  td.auditable{cursor:pointer; text-decoration:underline dotted var(--text-dim); text-underline-offset:3px;}
  td.auditable:hover{color:var(--amber);}
  .audit-overlay{
    position:fixed; inset:0; background:rgba(6,9,14,.7); display:flex; align-items:flex-start;
    justify-content:center; padding:40px 16px; z-index:50; overflow-y:auto;
  }
  .audit-box{
    background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:18px;
    max-width:560px; width:100%;
  }
  .audit-box h3{margin:0 0 2px; font-size:15px;}
  .audit-box .audit-sub{font-size:12px; color:var(--text-dim); margin-bottom:12px;}
  .audit-list{list-style:none; margin:0; padding:0; max-height:50vh; overflow-y:auto;}
  .audit-list li{
    padding:8px 0; border-bottom:1px solid var(--border); font-size:12px; display:flex;
    justify-content:space-between; gap:10px;
  }
  .audit-list li:last-child{border-bottom:none;}
  .audit-list a{color:var(--teal); text-decoration:none;}
  .audit-list a:hover{text-decoration:underline;}
  .audit-cause{color:var(--text-dim);}

  .death-cause-list{display:flex;flex-direction:column;gap:10px;width:100%;}
  .death-cause-entry{display:grid;grid-template-columns:34px minmax(0,1fr);align-items:center;gap:12px;width:100%;min-width:0;padding:12px 14px;background:var(--panel-alt);border:1px solid var(--border);border-radius:8px;}
  .death-cause-rank{font-family:var(--mono);color:var(--text-dim);text-align:center;font-size:12px;}
  .death-cause-title{display:flex;align-items:center;gap:8px;font-weight:650;color:#fff;font-size:14px;margin-bottom:9px;}
  .death-cause-mons{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;}
  .death-cause-mon{display:inline-flex;align-items:center;gap:6px;min-width:145px;padding:5px 8px;background:rgba(255,255,255,.025);border:1px solid var(--border);border-radius:7px;}
  .death-cause-sprite{width:36px;height:36px;object-fit:contain;image-rendering:pixelated;background:transparent;border-radius:4px;margin-right:0;}
  .death-cause-mon .pokemon-click{gap:4px;padding:0;}
  .death-cause-mon .pokemon-click .sprite{display:none;}
  @media(max-width:700px){.death-cause-entry{grid-template-columns:26px minmax(0,1fr);padding:10px;gap:8px}.death-cause-mon{min-width:125px}.death-cause-sprite{width:32px;height:32px;}}

  /* replays by player */
  .player-group{
    border:1px solid var(--border); border-radius:8px; margin-bottom:10px; overflow:hidden;
  }
  .player-group summary{
    cursor:pointer; padding:10px 14px; background:var(--panel-alt);
    display:flex; align-items:center; gap:8px; list-style:none; font-size:13px;
  }
  .player-group summary::-webkit-details-marker{display:none;}
  .player-group summary::before{content:'▸'; color:var(--text-dim); font-size:11px; transition:transform .1s;}
  .player-group[open] summary::before{transform:rotate(90deg);}
  .player-group summary .pg-name{font-weight:700;}
  .player-group summary .pg-team{color:var(--text-dim); font-weight:400; font-size:12px;}
  .player-group .player-table-wrap{padding:4px 14px 12px;}
  .player-group table{margin-top:6px;}
  .player-filter{max-width:320px; margin-bottom:14px;}

  #adminAuth{max-width:420px;margin:90px auto;padding:24px 20px;}
  .auth-box{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:24px;}
  .auth-box h1{margin-bottom:4px;}

  @media(max-width:700px){.summary-grid{grid-template-columns:1fr}.summary-header{flex-direction:column}.summary-meta{align-items:flex-start;text-align:left}.replay-summary-box,.overview-modal{width:calc(100vw - 20px);max-width:none}.overview-modal{padding:16px}.replay-summary-box{padding:14px}}


  /* compact league overview cards */

  /* Larger, centered summary/profile overlay */
  .modal, .modal-card, .profile-modal, .summary-modal {
    margin-left:auto !important;
    margin-right:auto !important;
  }
.profile-two-col .type-badge{display:none!important;}
.pokemon-type-filter{min-width:150px;}
.pokemon-type-filter label{display:block;font-size:11px;color:var(--text-dim);margin-bottom:5px;}
.pokemon-type-filter select{width:100%;background:var(--panel-alt);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:9px 10px;font:inherit;}
  .misc-wrap{display:flex;flex-direction:column;gap:14px}.misc-row{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:12px 0;border-bottom:1px solid var(--border)}.misc-row:last-child{border-bottom:none}.misc-row b{display:block}.misc-row span{display:block;color:var(--text-dim);font-size:12px;margin-top:3px}.misc-row strong{font-family:var(--mono);color:var(--amber);white-space:nowrap}

<body data-admin="false">
<div id="app">

    <br>

<div id="auditModal"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
  const SHARED = true; // league data shared with anyone viewing this dashboard (cloud mode only)
  let STATE = { replays:{}, teamMap:{}, settings:{ caseInsensitiveNames:true, teamLogos:{}, bannerMode:'top', bannerTeam:'' } };
  let loaded = false;

  // ---------- shared Supabase storage ----------
  // Public dashboard: read-only. Admin page: authenticated writes.
  const SUPABASE_URL = 'https://dfxdkkemltukxaklhcpo.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_H7iIBiJTxY77lBAcpJn2VQ_u2hAG2CN';
  const SUPABASE_STATE_ID = '__dashboard_state__';
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  const IS_ADMIN_PAGE = document.body.dataset.admin === 'true';
  const POLL_MS = 10000;
  let adminUser = null;
  let loadingFromRemote = false;

  function requireAdmin(){
    if(!IS_ADMIN_PAGE || !adminUser) throw new Error('Admin login required to change shared data.');
  }

  async function loadState(){
    loadingFromRemote = true;
    try{
      const {data, error} = await supabase.from('replays').select('replay_id,replay_data');
      if(error) throw error;
      const replays = {};
      let sharedState = null;
      for(const row of (data || [])){
        if(row.replay_id === SUPABASE_STATE_ID) sharedState = row.replay_data || {};
        else if(row.replay_id) replays[row.replay_id] = row.replay_data || {};
      }
      STATE.replays = replays;
      STATE.teamMap = (sharedState && sharedState.teamMap) || {};
      STATE.settings = Object.assign({caseInsensitiveNames:true, teamLogos:{}, bannerMode:'top', bannerTeam:''}, (sharedState && sharedState.settings) || {});
      STATE.settings.teamLogos = STATE.settings.teamLogos || {};
      const bp=JSON.parse(localStorage.getItem('sbl-banner-preferences')||'null'); if(bp){ STATE.settings.bannerMode=bp.bannerMode||STATE.settings.bannerMode; STATE.settings.bannerTeam=bp.bannerTeam||STATE.settings.bannerTeam; }
      loaded = true;
    }catch(e){
      console.error('Supabase load failed:', e);
      if(!loaded){
        STATE.replays = {};
        STATE.teamMap = {};
        STATE.settings = {caseInsensitiveNames:true, teamLogos:{}, bannerMode:'top', bannerTeam:''};
        loaded = true;
      }
      if(IS_ADMIN_PAGE) showAdminError('Could not load shared data: ' + e.message);
    }finally{
      loadingFromRemote = false;
    }
  }

  async function saveReplays(){
    requireAdmin();
    const rows = Object.values(STATE.replays).map(r => ({
      replay_id: r.id,
      replay_data: r,
      updated_at: new Date().toISOString()
    }));
    const {data: existing, error: readErr} = await supabase.from('replays').select('replay_id');
    if(readErr) throw readErr;
    const stale = (existing || []).map(r=>r.replay_id).filter(id => id !== SUPABASE_STATE_ID && !STATE.replays[id]);
    if(stale.length){
      const {error} = await supabase.from('replays').delete().in('replay_id', stale);
      if(error) throw error;
    }
    if(rows.length){
      const {error} = await supabase.from('replays').upsert(rows, {onConflict:'replay_id'});
      if(error) throw error;
    }
    await saveSharedState();
  }

  async function saveSharedState(){
    requireAdmin();
    const {error} = await supabase.from('replays').upsert([{
      replay_id: SUPABASE_STATE_ID,
      replay_data: {teamMap: STATE.teamMap, settings: STATE.settings},
      updated_at: new Date().toISOString()
    }], {onConflict:'replay_id'});
    if(error) throw error;
  }
  async function saveTeamMap(){ await saveSharedState(); }
  async function saveSettings(){ await saveSharedState(); }

  async function deleteAllRemote(){
    requireAdmin();
    const {error} = await supabase.from('replays').delete().neq('replay_id', SUPABASE_STATE_ID);
    if(error) throw error;
  }

  async function migrateLocalData(){
    requireAdmin();
    const rawR = localStorage.getItem('league-dash:replays-data');
    const rawM = localStorage.getItem('league-dash:player-team-map');
    const rawS = localStorage.getItem('league-dash:settings');
    if(!rawR && !rawM && !rawS) throw new Error('No old local dashboard data was found in this browser.');
    if(rawR) STATE.replays = JSON.parse(rawR);
    if(rawM) STATE.teamMap = JSON.parse(rawM);
    if(rawS) STATE.settings = Object.assign({caseInsensitiveNames:true, teamLogos:{}, bannerMode:'top', bannerTeam:''}, JSON.parse(rawS));
    STATE.settings.teamLogos = STATE.settings.teamLogos || {};
    await saveReplays();
    await saveSharedState();
  }

  async function refreshSharedState(){
    if(loadingFromRemote) return;
    const before = JSON.stringify({r:Object.keys(STATE.replays).length,t:STATE.teamMap,s:STATE.settings});
    await loadState();
    const after = JSON.stringify({r:Object.keys(STATE.replays).length,t:STATE.teamMap,s:STATE.settings});
    if(before !== after){
      renderTicker();
      render();
    }
  }

  function showAdminError(msg){
    const el = document.getElementById('adminError');
    if(el){ el.textContent = msg; el.style.display = 'block'; }
  }

  function showAdminLogin(){
    if(!IS_ADMIN_PAGE) return;
    const app = document.getElementById('app');
    app.style.display = 'none';
    const existing = document.getElementById('adminAuth');
    if(existing) existing.remove();
    const wrap = document.createElement('div');
    wrap.id = 'adminAuth';
    wrap.innerHTML = `
      <div class="auth-box">
        <h1>SBL Dashboard Admin</h1>
        <div class="sub">Sign in to add replays and change shared league data.</div>
        <label>Email</label><input id="adminEmail" type="email" autocomplete="username" placeholder="you@example.com">
        <label style="margin-top:12px;">Password</label><input id="adminPassword" type="password" autocomplete="current-password" placeholder="Password">
        <button class="primary" id="adminLoginBtn" style="margin-top:14px;width:100%;">Log in</button>
        <div id="adminError" class="auth-error"></div>
      </div>`;
    document.body.prepend(wrap);
    document.getElementById('adminLoginBtn').addEventListener('click', adminLogin);
    document.getElementById('adminPassword').addEventListener('keydown', e=>{ if(e.key==='Enter') adminLogin(); });
  }

  async function adminLogin(){
    const email = document.getElementById('adminEmail').value.trim();
    const password = document.getElementById('adminPassword').value;
    if(!email || !password){ showAdminError('Enter your email and password.'); return; }
    const btn = document.getElementById('adminLoginBtn');
    btn.disabled = true; btn.textContent = 'Logging in…';
    const {data, error} = await supabase.auth.signInWithPassword({email, password});
    btn.disabled = false; btn.textContent = 'Log in';
    if(error){ showAdminError(error.message); return; }
    adminUser = data.user;
    document.getElementById('adminAuth')?.remove();
    document.getElementById('app').style.display = '';
    await loadState();
    renderTicker(); render();
  }

  async function initAdminAuth(){
    if(!IS_ADMIN_PAGE) return true;
    const {data} = await supabase.auth.getSession();
    if(data.session){
      adminUser = data.session.user;
      document.getElementById('app').style.display = '';
      return true;
    }
    showAdminLogin();
    return false;
  }

  // ---------- helpers ----------
  function normName(n){ return n.trim().toLowerCase().replace(/-/g,' ').replace(/_/g,' '); }
  function toShowdownId(species){
    // Showdown's sprite filenames keep the hyphen as a forme separator
    // (landorus-therian.png, ho-oh.png, porygon-z.png, necrozma-dusk-mane.png)
    // but collapse everything else — so each hyphen-delimited segment gets
    // lowercased and stripped of spaces/punctuation, then rejoined with '-'.
    // Stripping hyphens outright (the old behavior) turned every forme name
    // into a 404 (e.g. "landorustherian"), which just showed the mon's actual
    // name faded out behind a broken-image icon.
    return species.split('-').map(part => part.toLowerCase().replace(/[^a-z0-9]/g,'')).filter(Boolean).join('-');
  }
  function spriteUrl(species){
    return `https://play.pokemonshowdown.com/sprites/gen5/${toShowdownId(species)}.png`;
  }
  function spriteImg(species, cls){
    const safe = escapeHtml(species);
    return `<img class="${cls}" src="${spriteUrl(species)}" alt="${safe}" loading="lazy" onerror="this.onerror=null;this.src='https://play.pokemonshowdown.com/sprites/gen5/0.png';this.style.opacity='.25';">`;
  }
  // Pokémon typing is loaded from Showdown's public Pokédex and cached locally.
  // This keeps the dashboard data-driven while avoiding a huge hard-coded type table.
  let POKEDEX_TYPES = {};
  function dexKey(species){
    return String(species||'').toLowerCase().replace(/[^a-z0-9]/g,'');
  }
  function pokemonTypes(species){
    const d = POKEDEX_TYPES[dexKey(species)];
    return d?.types || [];
  }
  const TYPE_CLASS = {Normal:'normal',Fire:'fire',Water:'water',Electric:'electric',Grass:'grass',Ice:'ice',Fighting:'fighting',Poison:'poison',Ground:'ground',Flying:'flying',Psychic:'psychic',Bug:'bug',Rock:'rock',Ghost:'ghost',Dragon:'dragon',Dark:'dark',Steel:'steel',Fairy:'fairy'};
  function typeBadges(species){
    const types = pokemonTypes(species);
    if(!types.length) return '';
    return `<span class="type-badges">${types.map(t=>`<span class="type-badge type-${TYPE_CLASS[t]||'other'}">${escapeHtml(t)}</span>`).join('')}</span>`;
  }
  function pokemonLink(species, innerHtml, title, showType=true){
    const safe = escapeHtml(species);
    return `<span class="pokemon-click" role="button" tabindex="0" data-pokemon="${safe}" title="${escapeHtml(title || `Open ${species} profile`)}">${innerHtml}${showType ? typeBadges(species) : ''}</span>`;
  }
  function pokemonName(species, withSprite=true, spriteClass='sprite'){
    return pokemonLink(species, withSprite ? `${spriteImg(species,spriteClass)}<span>${escapeHtml(species)}</span>` : `<span>${escapeHtml(species)}</span>`);
  }
  function teamFor(username){
    const key = (username||'').trim().toLowerCase();
    return STATE.teamMap[key] || (username||'').trim() || 'Unknown';
  }
  // groups values that only differ by case/whitespace under one canonical label
  // (the first-seen casing) when "case-insensitive names" is on in Settings —
  // this is what keeps e.g. "Team Fire" and "team fire" from splitting into
  // two separate teams just because they were typed differently at different times.
  function groupKey(value){
    return STATE.settings.caseInsensitiveNames ? value.trim().toLowerCase() : value.trim();
  }
  function extractReplayId(url){
    url = url.trim();
    if(!url) return null;
    url = url.replace(/\.json$/,'').replace(/\/$/,'');
    const m = url.match(/replay\.pokemonshowdown\.com\/([a-z0-9-]+)/i);
    if(m) return m[1];
    // allow bare id paste
    if(/^[a-z0-9-]+$/i.test(url)) return url;
    return null;
  }
  function parseHP(token){
    if(!token) return 0;
    token = token.split(' ')[0]; // strip status tags like "tox", "fnt"
    if(token.includes('/')){
      const [a,b] = token.split('/').map(Number);
      if(!b) return 0;
      return (a/b)*100;
    }
    const v = parseFloat(token);
    return isNaN(v) ? 0 : v;
  }
  function sideOf(slot){ return slot.slice(0,2); } // 'p1' / 'p2'

  // ---------- replay parsing ----------
  function classifyIndirectCause(tags){
    const t=(tags||'').toLowerCase();
    if(t.includes('stealth rock') || t.includes('spikes') || t.includes('toxic spikes') || t.includes('sticky web')) return 'Hazard';
    if(t.includes('recoil')) return 'Recoil';
    if(t.includes('psn') || t.includes('tox') || t.includes('brn') || t.includes('poison') || t.includes('burn')) return 'Status';
    return 'Other';
  }
  function parseLog(json, replayId){
    const lines = json.log.split('\n');
    const players = {p1:'', p2:''};
    const slots = {}; // slotId -> {species, hp, side}
    const mons = {}; // "p1|species" -> stats
    const appearedThisReplay = new Set();
    let lastMove = null; // {source, target, move}
    const moveStats = {}; // normalized move -> aggregate usage/hits/misses/damage/kos
    const monMoveStats = {}; // monKey -> move -> stats
    let currentTurn = 0;
    let totalCrits = 0;
    let lastKillerKey = null;
    let currentKillStreak = 0;
    const replayStats = {
      turns: 0, crits: 0, switches: 0, hazardsSet: 0, hazardsRemoved: 0,
      statusInflicted: 0, flinches: 0, protects: 0, substitutions: 0,
      heals: 0, misses: 0, hazardDamage: 0, statusKOs: 0,
      maxConsecutiveKOs: 0, lowHpSurvivals: 0
    };
    let winner = null;
    // NOTE: these three all store direct references to a mon's *stats object*
    // (captured at the moment of the event via ensureMon), never a slot label.
    // A slot label like "p1a" gets reused by a different mon later in the game,
    // so resolving it lazily at credit-time would silently attribute damage/
    // kills to whoever happens to be standing there now instead of whoever
    // actually did it.
    let lastAttacker = {}; // targetSlot -> attacker's stats object (for kill credit)
    // Poison/burn (unlike confusion) persist through a switch — the same individual
    // keeps ticking for the same status after it returns to the field. So this is
    // keyed by the *individual mon* (monKey: side+species), not by slot, and is
    // deliberately NOT cleared on switch — only when the status actually ends.
    let statusSourceByMon = {}; // monKey -> stats object that inflicted brn/psn/tox on them
    let hazardSetter = {}; // side -> {hazardName: setter's stats object}
    // side (the side that GOT toxic-spiked) -> setter's stats object.
    // Toxic Spikes are a side-wide condition, so this survives switches/faints
    // and lets residual poison damage inherit kill credit from the setter.
    let toxicSpikesSetter = {};
    let delayedSetter = {}; // side -> {moveName: setter's stats object}, for Future Sight / Doom Desire
    let pendingDelayedHit = {}; // targetSlot -> {stats, cause}; Showdown emits the delayed hit as -end, then an untagged -damage
    const HAZARD_MOVES = ['Stealth Rock','Spikes'];
    const DELAYED_MOVES = ['Future Sight','Doom Desire'];
    const STATUS_TAGS = ['psn','tox','brn'];

    function ofSlotFromTag(tag){
      // tag like "[of] p2a: Ferrothorn" -> "p2a"
      const m = tag.match(/p[1-4][a-f]/);
      return m ? m[0] : null;
    }

    function monKey(slot){
      const s = slots[slot];
      if(!s) return null;
      return s.side + '|' + normName(s.species);
    }
    function ensureMon(slot){
      const s = slots[slot];
      if(!s) return null;
      const k = monKey(slot);
      if(!mons[k]) mons[k] = {
        side:s.side, species:s.species, damageDealt:0, damageTaken:0,
        kills:0, deaths:0, appearances:0, killLog:[], deathLog:[],
        crits:0, misses:0, lowHpSurvivals:0, hazardDamage:0, statusInflicted:0,
        statusKOs:0, consecutiveKOs:0
      };
      if(!appearedThisReplay.has(k)){
        appearedThisReplay.add(k);
        mons[k].appearances += 1;
      }
      return mons[k];
    }

    function ensureMove(move){
      const key = normName(move || '');
      if(!key) return null;
      if(!moveStats[key]) moveStats[key] = {move: move || '', uses:0, misses:0, outcomes:0, hits:0, crits:0, damage:0, maxDamage:0, kos:0};
      return moveStats[key];
    }
    function ensureMonMove(mon, move){
      if(!mon || !move) return null;
      const mk = mon.side + '|' + normName(mon.species);
      if(!monMoveStats[mk]) monMoveStats[mk] = {};
      const key = normName(move);
      if(!monMoveStats[mk][key]) monMoveStats[mk][key] = {move, uses:0, misses:0, outcomes:0, hits:0, crits:0, damage:0, maxDamage:0, kos:0};
      return monMoveStats[mk][key];
    }

    for(const raw of lines){
      if(!raw.startsWith('|')) continue;
      const parts = raw.split('|');
      const cmd = parts[1];

      if(cmd === 'poke' && parts[3]){
        const side = parts[2];
        const species = parts[3].split(',')[0].trim();
        if((side==='p1'||side==='p2') && species && !teamRoster[side].some(x=>normName(x)===normName(species))) teamRoster[side].push(species);
      } else if(cmd === 'player' && parts[3]){
        const side = parts[2];
        if(side === 'p1' || side === 'p2') players[side] = parts[3];
      } else if(cmd === 'turn'){
        const t = parseInt(parts[2], 10);
        if(!isNaN(t)) { currentTurn = t; replayStats.turns = Math.max(replayStats.turns, t); }
      } else if(cmd === 'win'){
        winner = (parts[2] || '').trim() || null;
      } else if(cmd === 'switch' || cmd === 'drag'){
        replayStats.switches += 1;
        const slotFull = parts[2]; // "p1a: Nickname"
        const slot = slotFull.split(':')[0].trim();
        const side = sideOf(slot);
        const species = parts[3].split(',')[0].trim();
        const hp = parseHP(parts[4] || '100/100');
        slots[slot] = {species, hp, side};
        // A new mon now occupies this slot — any prior *direct-hit* attacker
        // credit for this slot belonged to the mon that just left, so that must
        // not carry over. Status-source credit (poison/burn) is intentionally
        // NOT cleared here — it lives in statusSourceByMon, keyed to the
        // individual mon rather than the slot, because poison/burn persist
        // through a switch and must keep crediting the original inflictor
        // when the same mon returns and the status keeps ticking.
        delete lastAttacker[slot];
        delete pendingDelayedHit[slot];
        ensureMon(slot);
      } else if(cmd === 'move'){
        const source = parts[2] ? parts[2].split(':')[0].trim() : null;
        const target = parts[4] ? parts[4].split(':')[0].trim() : null;
        const moveName = parts[3] ? parts[3].trim() : '';
        if(source && moveName){
          const ms = ensureMove(moveName);
          const mon = ensureMon(source);
          const mms = ensureMonMove(mon, moveName);
          if(ms){ ms.uses += 1; }
          if(mms){ mms.uses += 1; }
          if(moveName === 'Protect' || moveName === 'Detect' || moveName === 'Baneful Bunker' || moveName === "King's Shield" || moveName === 'Spiky Shield' || moveName === 'Silk Trap' || moveName === 'Obstruct' || moveName === 'Burning Bulwark' || moveName === 'Endure') replayStats.protects += 1;
          if(moveName === 'Substitute') replayStats.substitutions += 1;
          if(HAZARD_MOVES.includes(moveName) || moveName === 'Toxic Spikes' || moveName === 'Sticky Web') replayStats.hazardsSet += 1;
        }
        if(source) lastMove = {source, target, move: moveName};
        if(source && HAZARD_MOVES.includes(moveName)){
          const oppSide = sideOf(source) === 'p1' ? 'p2' : 'p1';
          const setterStats = ensureMon(source);
          if(setterStats){
            if(!hazardSetter[oppSide]) hazardSetter[oppSide] = {};
            hazardSetter[oppSide][moveName] = setterStats;
          }
        }
        if(source && DELAYED_MOVES.includes(moveName)){
          const oppSide = sideOf(source) === 'p1' ? 'p2' : 'p1';
          const setterStats = ensureMon(source);
          if(setterStats){
            if(!delayedSetter[oppSide]) delayedSetter[oppSide] = {};
            delayedSetter[oppSide][moveName] = setterStats;
          }
        }
        if(source && moveName === 'Toxic Spikes'){
          // Toxic Spikes are a side-wide condition. Keep the Pokémon that most
          // recently established the Toxic Spikes on that side so a later
          // switch-in, poison tick, and eventual faint can all inherit the
          // setter's kill credit even if the setter has switched out or fainted.
          const oppSide = sideOf(source) === 'p1' ? 'p2' : 'p1';
          const setterStats = ensureMon(source);
          if(setterStats) toxicSpikesSetter[oppSide] = setterStats;
        }
      } else if(cmd === '-end'){
        // Future Sight / Doom Desire are represented by Showdown as:
        //   |-end|target|move: Future Sight
        //   |-damage|target|...
        // The -damage line is deliberately untagged, so looking for
        // 'Future Sight' in its tags will never work. Resolve the setter
        // at the -end event and carry it into the following damage event.
        const slotFull = parts[2];
        const effect = parts.slice(3).join('|');
        if(slotFull && (effect.includes('move: Future Sight') || effect.includes('move: Doom Desire'))){
          const slot = slotFull.split(':')[0].trim();
          const delayedHit = DELAYED_MOVES.find(m => effect.includes('move: ' + m));
          if(delayedHit && delayedSetter[sideOf(slot)] && delayedSetter[sideOf(slot)][delayedHit]){
            pendingDelayedHit[slot] = {
              stats: delayedSetter[sideOf(slot)][delayedHit],
              cause: delayedHit
            };
          }
        }
      } else if(cmd === '-crit'){
        totalCrits += 1;
        replayStats.crits += 1;
        if(lastMove && lastMove.move){
          const ms = ensureMove(lastMove.move);
          if(ms) ms.crits += 1;
          const mon = ensureMon(lastMove.source);
          const mms = ensureMonMove(mon, lastMove.move);
          if(mms) mms.crits += 1;
          if(mon) mon.crits = (mon.crits || 0) + 1;
        }
      } else if(cmd === '-miss'){
        replayStats.misses += 1;
        if(lastMove && lastMove.move){
          const ms = ensureMove(lastMove.move);
          if(ms){ ms.misses += 1; ms.outcomes += 1; }
          const mon = ensureMon(lastMove.source);
          const mms = ensureMonMove(mon, lastMove.move);
          if(mms){ mms.misses += 1; mms.outcomes += 1; }
          if(mon) mon.misses = (mon.misses || 0) + 1;
        }
      } else if(cmd === '-flinch'){
        replayStats.flinches += 1;
      } else if(cmd === '-status'){
        const slotFull = parts[2];
        if(!slotFull) continue;
        const slot = slotFull.split(':')[0].trim();
        const mk = monKey(slot);
        if(!mk) continue;
        const statusTags = parts.slice(3).join('|');
        let inflictorStats = null;
        if(statusTags.includes('Toxic Spikes') && toxicSpikesSetter[sideOf(slot)]){
          // Poisoned on switch-in by Toxic Spikes. There is no attacker's move
          // line for the later residual damage, so permanently associate this
          // individual Pokémon with the Toxic Spikes setter until its status
          // is cured. This is keyed by mon identity rather than slot because
          // the poisoned Pokémon can switch out and back in.
          inflictorStats = toxicSpikesSetter[sideOf(slot)];
        } else if(lastMove && lastMove.target === slot && sideOf(lastMove.source) !== sideOf(slot)){
          inflictorStats = ensureMon(lastMove.source);
        }
        if(inflictorStats) {
          statusSourceByMon[mk] = inflictorStats;
          replayStats.statusInflicted += 1;
          inflictorStats.statusInflicted = (inflictorStats.statusInflicted || 0) + 1;
        }
      } else if(cmd === '-curestatus'){
        const slotFull = parts[2];
        if(!slotFull) continue;
        const slot = slotFull.split(':')[0].trim();
        const mk = monKey(slot);
        // status is gone — clear credit so it can't be reused if this individual
        // is somehow attributed residual status damage again later
        if(mk) delete statusSourceByMon[mk];
      } else if(cmd === '-damage'){
        const slotFull = parts[2];
        if(!slotFull) continue;
        const slot = slotFull.split(':')[0].trim();
        if(!slots[slot]) continue;
        const newHp = parseHP(parts[3]);
        const oldHp = slots[slot].hp;
        const dmg = Math.max(0, oldHp - newHp);
        slots[slot].hp = newHp;
        const targetStats = ensureMon(slot);
        if(targetStats) targetStats.damageTaken += dmg;
        if(dmg <= 0) continue;

        const tags = parts.slice(4).join('|');
        const hazardHitForStats = HAZARD_MOVES.find(h => tags.includes(h));
        if(hazardHitForStats){
          replayStats.hazardDamage += dmg;
          const hs = hazardSetter[sideOf(slot)]?.[hazardHitForStats];
          if(hs) hs.hazardDamage = (hs.hazardDamage || 0) + dmg;
        }
        if(newHp > 0 && newHp <= 10){
          targetStats.lowHpSurvivals = (targetStats.lowHpSurvivals || 0) + 1;
          replayStats.lowHpSurvivals += 1;
        }
        if(lastMove && lastMove.target === slot && lastMove.move && sideOf(lastMove.source) !== sideOf(slot)){
          const ms = ensureMove(lastMove.move);
          const mon = ensureMon(lastMove.source);
          const mms = ensureMonMove(mon, lastMove.move);
          if(ms){ ms.outcomes += 1; ms.hits += 1; ms.damage += dmg; ms.maxDamage = Math.max(ms.maxDamage||0,dmg); }
          if(mms){ mms.outcomes += 1; mms.hits += 1; mms.damage += dmg; mms.maxDamage = Math.max(mms.maxDamage||0,dmg); }
        }
        let attackerStats = null;
        let cause = null;

        // 1) explicit [of] source (Leech Seed, Rocky Helmet, Rough Skin, Iron Barbs, etc.)
        //    resolved immediately off the current battle state, so it's always accurate
        if(tags.includes('[of]')){
          const ofSlot = ofSlotFromTag(tags);
          if(ofSlot && slots[ofSlot]){
            attackerStats = ensureMon(ofSlot);
            const effectM = tags.match(/\[from\]\s*([^\|\[]+)/);
            cause = effectM ? effectM[1].trim() : 'contact/held-item effect';
          }
        }
        // 2) entry hazard chip (Stealth Rock / Spikes) -> credit whoever set it
        if(!attackerStats){
          const hazardHit = HAZARD_MOVES.find(h => tags.includes(h));
          if(hazardHit && hazardSetter[sideOf(slot)] && hazardSetter[sideOf(slot)][hazardHit]){
            attackerStats = hazardSetter[sideOf(slot)][hazardHit];
            cause = hazardHit;
          }
        }
        // 3) residual status damage (burn/poison/toxic) -> credit whoever inflicted the status.
        // Looked up by the mon's own identity (monKey), not the slot, since poison/burn
        // persist through a switch and must keep crediting the original inflictor even
        // after this individual left and came back to the same or a different slot.
        // This is also what gives a Toxic Spikes setter the kill when poison damage
        // is the final damage instance before fainting.
        if(!attackerStats){
          const statusHit = STATUS_TAGS.find(s => tags.includes('[from] ' + s));
          const mk = monKey(slot);
          if(statusHit && mk && statusSourceByMon[mk]){
            attackerStats = statusSourceByMon[mk];
            const sourceWasToxicSpikes = (
              toxicSpikesSetter[sideOf(slot)] &&
              toxicSpikesSetter[sideOf(slot)] === attackerStats
            );
            cause = sourceWasToxicSpikes
              ? 'Toxic Spikes'
              : 'residual ' + statusHit;
          }
        }
        // 3b) delayed hits (Future Sight / Doom Desire).
        // Showdown puts the move name on a preceding -end event, NOT on the
        // subsequent -damage line, so use the pending source captured there.
        if(!attackerStats && pendingDelayedHit[slot]){
          attackerStats = pendingDelayedHit[slot].stats;
          cause = pendingDelayedHit[slot].cause;
          delete pendingDelayedHit[slot];
        }
        // 4) fallback: direct hit from the most recent move, if it targeted this slot.
        //    Showdown only omits [from]/[of] entirely on a -damage line for a genuine
        //    direct move hit — weather chip, confusion self-hits, recoil, etc. always
        //    carry a tag (just not one of the specific ones matched above). So this
        //    fallback must only fire on a completely untagged line, or it ends up
        //    crediting stale "last real attacker" info to indirect damage it never dealt.
        if(!attackerStats && tags === '' && lastMove && lastMove.target === slot && sideOf(lastMove.source) !== sideOf(slot)){
          attackerStats = ensureMon(lastMove.source);
          cause = lastMove.move || 'direct hit';
        }

        if(attackerStats && attackerStats.side !== slots[slot].side){
          attackerStats.damageDealt += dmg;
          lastAttacker[slot] = {stats: attackerStats, cause, turn: currentTurn};
        } else {
          // This damage instance landed but couldn't be attributed to an opposing
          // mon (environmental chip we couldn't trace, self-inflicted damage, etc.).
          // Clear any earlier attacker on file for this slot — otherwise a mon that
          // survives a real hit and later dies to something untraceable still has
          // the kill wrongly credited to whoever landed that earlier real hit.
          lastAttacker[slot] = {stats:null, cause:classifyIndirectCause(tags), turn:currentTurn};
        }
      } else if(cmd === '-heal' || cmd === '-sethp'){
        const slotFull = parts[2];
        if(!slotFull) continue;
        const slot = slotFull.split(':')[0].trim();
        if(!slots[slot]) continue;
        slots[slot].hp = parseHP(parts[3]);
      } else if(cmd === 'faint'){
        const slotFull = parts[2];
        if(!slotFull) continue;
        const slot = slotFull.split(':')[0].trim();
        if(!slots[slot]) continue;
        const deadStats = ensureMon(slot);
        const killerInfo = lastAttacker[slot];
        const killerStats = killerInfo ? killerInfo.stats : null;
        const credited = !!(killerStats && killerStats.side !== slots[slot].side);
        if(deadStats){
          deadStats.deaths += 1;
          deadStats.deathLog.push({
            replayId, turn: currentTurn,
            killer: credited ? killerStats.species : null,
            cause: credited ? killerInfo.cause : (killerInfo?.cause || 'Other')
          });
        }
        if(credited){
          killerStats.kills += 1;
          const causeText = String(killerInfo?.cause || '');
          if(/^residual |^Toxic Spikes$/i.test(causeText)){
            killerStats.statusKOs = (killerStats.statusKOs || 0) + 1;
            replayStats.statusKOs += 1;
          }
          if(lastKillerKey === killerStats.species + '|' + killerStats.side){
            currentKillStreak += 1;
          } else {
            currentKillStreak = 1;
            lastKillerKey = killerStats.species + '|' + killerStats.side;
          }
          killerStats.consecutiveKOs = Math.max(killerStats.consecutiveKOs || 0, currentKillStreak);
          replayStats.maxConsecutiveKOs = Math.max(replayStats.maxConsecutiveKOs, currentKillStreak);
          const killMove = killerInfo?.cause;
          if(killMove && !/^(Hazard|Recoil|Status|Other|Toxic Spikes|residual )/i.test(killMove)){
            const ms = ensureMove(killMove);
            if(ms) ms.kos += 1;
            const kmm = ensureMonMove(killerStats, killMove);
            if(kmm) kmm.kos += 1;
          }
          killerStats.killLog.push({
            replayId, turn: currentTurn,
            victim: deadStats ? deadStats.species : slots[slot].species,
            cause: killerInfo.cause
          });
        }
        delete lastAttacker[slot];
        delete pendingDelayedHit[slot];
      }
    }

    return { id: replayId, format: json.formatid || json.format || '', uploadtime: json.uploadtime || null,
      players, mons, winner, results, teamRoster,
      moveStats, monMoveStats, replayStats, totalCrits };
  }

  // ---------- automatic Monday-Sunday season weeks ----------
  function replayTimestampMs(replay){
    const n=Number(replay?.uploadtime||0);
    if(!n) return 0;
    return n < 1e12 ? n*1000 : n;
  }
  function mondayStartMs(ms){
    const d=new Date(ms);
    const day=d.getDay();
    const diff=(day===0?-6:1-day);
    d.setHours(0,0,0,0); d.setDate(d.getDate()+diff);
    return d.getTime();
  }
  function ensureSeasonStart(){
    if(STATE.settings.seasonStartMonday) return Number(STATE.settings.seasonStartMonday);
    const times=Object.values(STATE.replays).map(replayTimestampMs).filter(Boolean);
    if(!times.length) return null;
    const start=mondayStartMs(Math.min(...times));
    STATE.settings.seasonStartMonday=start;
    return start;
  }
  function autoWeekForReplay(replay){
    const ts=replayTimestampMs(replay);
    if(!ts) return 'Unassigned';
    let start=ensureSeasonStart();
    if(!start || mondayStartMs(ts)<start){ start=mondayStartMs(ts); STATE.settings.seasonStartMonday=start; }
    const n=Math.floor((mondayStartMs(ts)-start)/604800000)+1;
    return `Week ${n}`;
  }
  function recalculateAllWeeks(){
    const times=Object.values(STATE.replays).map(replayTimestampMs).filter(Boolean);
    if(!times.length) return;
    STATE.settings.seasonStartMonday=mondayStartMs(Math.min(...times));
    for(const r of Object.values(STATE.replays)) r.week=autoWeekForReplay(r);
  }

  async function processUrls(urlsRaw, week, logEl){
    const urls = urlsRaw.split('\n').map(s=>s.trim()).filter(Boolean);
    if(urls.length === 0){ appendLog(logEl, 'No links provided.', true); return; }
    let added = 0, skipped = 0, failed = 0;
    for(const url of urls){
      const id = extractReplayId(url);
      if(!id){ appendLog(logEl, `Could not read a replay id from: ${url}`, true); failed++; continue; }
      if(STATE.replays[id]){ appendLog(logEl, `Already processed: ${id} — skipped`, false); skipped++; continue; }
      try{
        const resp = await fetch(`https://replay.pokemonshowdown.com/${id}.json`);
        if(!resp.ok) throw new Error('replay not found (' + resp.status + ')');
        const json = await resp.json();
        const parsed = parseLog(json, id);
        parsed.week = autoWeekForReplay(parsed);
        parsed.processedAt = Date.now();
        STATE.replays[id] = parsed;
        appendLog(logEl, `✓ ${id}  (${parsed.players.p1 || '?'} vs ${parsed.players.p2 || '?'})`, false, true);
        added++;
      }catch(e){
        appendLog(logEl, `✗ ${id} — ${e.message}`, true);
        failed++;
      }
    }
    if(added > 0){ recalculateAllWeeks(); await saveReplays(); }
    appendLog(logEl, `Done. ${added} added, ${skipped} already had, ${failed} failed.`, false);
    renderTicker();
    render(); // refresh whatever tab is open
  }
  function appendLog(el, text, isErr, isOk){
    const line = document.createElement('div');
    line.className = isErr ? 'err' : (isOk ? 'ok' : '');
    line.textContent = text;
    el.appendChild(line);
    el.scrollTop = el.scrollHeight;
  }

  // ---------- aggregation ----------
  function allReplays(weekFilter){
    return Object.values(STATE.replays).filter(r => !weekFilter || weekFilter === 'ALL' || r.week === weekFilter);
  }
  function weeksList(){
    const set = new Set(Object.values(STATE.replays).map(r=>r.week || 'Unassigned'));
    return Array.from(set).sort((a,b)=>{ if(a==='Unassigned') return 1; if(b==='Unassigned') return -1; const na=parseInt(String(a).replace(/\D/g,''),10), nb=parseInt(String(b).replace(/\D/g,''),10); return (na||999999)-(nb||999999); });
  }
  function globalPokemonStats(weekFilter){
    const out = {}; // normSpecies -> {species, dealt, taken, kills, deaths, games, coaches}
    for(const r of allReplays(weekFilter)){
      for(const k in r.mons){
        const m = r.mons[k];
        const nk = normName(m.species);
        if(!out[nk]) out[nk] = {species:m.species, dealt:0, taken:0, kills:0, deaths:0, games:0, killLog:[], deathLog:[], coaches:new Set()};
        out[nk].dealt += m.damageDealt;
        out[nk].taken += m.damageTaken;
        out[nk].kills += m.kills;
        out[nk].deaths += m.deaths;
        out[nk].games += m.appearances;
        if(m.killLog) out[nk].killLog.push(...m.killLog);
        if(m.deathLog) out[nk].deathLog.push(...m.deathLog);
        out[nk].coaches.add(teamFor(r.players[m.side]));
      }
    }
    return Object.values(out).sort((a,b)=>b.dealt-a.dealt);
  }
  function teamPokemonStats(weekFilter){
    const groups = {}; // groupKey -> { label, species: {normSpecies -> stats} }
    for(const r of allReplays(weekFilter)){
      for(const side of ['p1','p2']){
        const team = teamFor(r.players[side]);
        const gk = groupKey(team);
        if(!groups[gk]) groups[gk] = { label: team, species: {} };
        const bucket = groups[gk].species;
        for(const k in r.mons){
          const m = r.mons[k];
          if(m.side !== side) continue;
          const nk = normName(m.species);
          if(!bucket[nk]) bucket[nk] = {species:m.species, dealt:0, taken:0, kills:0, deaths:0, games:0, killLog:[], deathLog:[]};
          bucket[nk].dealt += m.damageDealt;
          bucket[nk].taken += m.damageTaken;
          bucket[nk].kills += m.kills;
          bucket[nk].deaths += m.deaths;
          bucket[nk].games += m.appearances;
          if(m.killLog) bucket[nk].killLog.push(...m.killLog);
          if(m.deathLog) bucket[nk].deathLog.push(...m.deathLog);
        }
      }
    }
    const out = {};
    for(const gk in groups) out[groups[gk].label] = groups[gk].species;
    return out;
  }
  // ---------- duplicate detection (Settings) ----------
  // Normalizes a username so that things like "dossa37"/"dossa_37" (punctuation
  // difference) and "podraa"/"podrrraaa" (repeated-letter typo) collapse to the
  // same key: strip anything that isn't a letter/digit, then collapse any run of
  // the same character down to one (so "rrr"/"aaa" runs match a single r/a).
  function fuzzyKey(u){
    return (u||'').toLowerCase().replace(/[^a-z0-9]/g,'').replace(/(.)\1+/g,'$1');
  }
  function usernameGameCounts(){
    const counts = {};
    for(const r of Object.values(STATE.replays)){
      for(const side of ['p1','p2']){
        const u = (r.players[side]||'').trim();
        if(!u) continue;
        const key = u.toLowerCase();
        counts[key] = (counts[key]||0) + 1;
      }
    }
    return counts;
  }
  // returns groups of raw usernames that look like the same person typed differently
  function findDuplicatePlayerGroups(){
    const seen = {}; // lowercase username -> raw display username (first seen casing)
    for(const r of Object.values(STATE.replays)){
      for(const side of ['p1','p2']){
        const u = (r.players[side]||'').trim();
        if(!u) continue;
        const key = u.toLowerCase();
        if(!seen[key]) seen[key] = u;
      }
    }
    const counts = usernameGameCounts();
    const byFuzzy = {};
    for(const key in seen){
      const fk = fuzzyKey(key);
      if(!fk) continue;
      if(!byFuzzy[fk]) byFuzzy[fk] = [];
      byFuzzy[fk].push(seen[key]);
    }
    const groups = [];
    for(const fk in byFuzzy){
      const usernames = byFuzzy[fk];
      if(usernames.length < 2) continue;
      // skip groups that are already fully merged (all mapped to the same team)
      const teams = new Set(usernames.map(u=>teamFor(u)));
      if(teams.size <= 1) continue;
      const sorted = usernames.slice().sort((a,b)=> (counts[b.toLowerCase()]||0) - (counts[a.toLowerCase()]||0) || a.localeCompare(b));
      groups.push({ usernames: sorted, canonical: sorted[0], counts });
    }
    return groups.sort((a,b)=> a.canonical.localeCompare(b.canonical));
  }
  function mergePlayerGroup(usernames, canonicalLabel){
    for(const u of usernames){
      STATE.teamMap[u.trim().toLowerCase()] = canonicalLabel;
    }
  }
  // returns pairs of current team labels whose Pokémon rosters overlap heavily —
  // in a draft league each team's roster is fixed, so two "different" team tags
  // sharing most of the same mons are almost certainly the same team typed two ways
  function findDuplicateTeamPairs(){
    const teams = teamPokemonStats('ALL');
    const labels = Object.keys(teams);
    const rosterOf = {}; // label -> Set(normSpecies)
    const gamesOf = {}; // label -> total appearances (for picking the canonical tag)
    for(const label of labels){
      rosterOf[label] = new Set(Object.keys(teams[label]));
      gamesOf[label] = Object.values(teams[label]).reduce((sum,s)=>sum+s.games,0);
    }
    const pairs = [];
    for(let i=0;i<labels.length;i++){
      for(let j=i+1;j<labels.length;j++){
        const a = labels[i], b = labels[j];
        const ra = rosterOf[a], rb = rosterOf[b];
        if(ra.size < 2 || rb.size < 2) continue;
        let overlap = 0;
        for(const sp of ra) if(rb.has(sp)) overlap++;
        const ratio = overlap / Math.min(ra.size, rb.size);
        if(ratio >= 0.5 && overlap >= 2){
          const [bigger, smaller] = gamesOf[a] >= gamesOf[b] ? [a,b] : [b,a];
          pairs.push({ bigger, smaller, overlap, ratio, biggerGames: gamesOf[bigger], smallerGames: gamesOf[smaller] });
        }
      }
    }
    return pairs.sort((x,y)=> y.ratio - x.ratio);
  }
  // maps every raw username currently resolving to `label` back to that username,
  // so a team-roster merge can point all of them at the canonical label too
  function usernamesForTeamLabel(label){
    const out = new Set();
    for(const r of Object.values(STATE.replays)){
      for(const side of ['p1','p2']){
        const u = (r.players[side]||'').trim();
        if(u && teamFor(u) === label) out.add(u);
      }
    }
    return Array.from(out);
  }

  // ---------- CSV export ----------
  function download(filename, text){
    const blob = new Blob([text], {type:'text/csv;charset=utf-8;'});
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = filename;
    link.click();
  }
  function toCSV(rows){
    return rows.map(r => r.map(v=>{
      const s = String(v);
      return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
    }).join(',')).join('\n');
  }
  function exportGlobalCSV(weekFilter, label){
    const stats = globalPokemonStats(weekFilter);
    const rows = [['Pokemon','Total Damage Dealt','Avg Damage Dealt per Game','Games Played']];
    stats.forEach(s => rows.push([s.species, s.dealt.toFixed(2), (s.games? (s.dealt/s.games):0).toFixed(2), s.games]));
    download(`Damage Leaderboard - ${label}.csv`, toCSV(rows));
  }
  function exportTeamCSVs(weekFilter, label){
    const teams = teamPokemonStats(weekFilter);
    for(const team in teams){
      const rows = [['Pokemon','Total Damage Dealt','Total Damage Taken','Total Kills','Total Deaths','Appearances']];
      const list = Object.values(teams[team]).sort((a,b)=>b.dealt-a.dealt);
      list.forEach(s => rows.push([s.species, s.dealt.toFixed(2), s.taken.toFixed(2), s.kills, s.deaths, s.games]));
      download(`${team} - ${label}.csv`, toCSV(rows));
    }
  }
  // ---------- rendering ----------
  const contentEl = document.getElementById('content');
  const tabsEl = document.getElementById('tabs');
  let activeTab = IS_ADMIN_PAGE ? 'process' : 'overview';

  tabsEl.addEventListener('click', (e)=>{
    if(e.target.tagName !== 'BUTTON') return;
    activeTab = e.target.dataset.tab;
    [...tabsEl.children].forEach(b=>b.classList.toggle('active', b.dataset.tab===activeTab));
    render();
  });

  // Bind Pokémon profile clicks directly as well as through the document delegate.
  // This makes dynamically-rendered rows/cards clickable even after a section redraw.
  function bindPokemonClicks(root=document){
    root.querySelectorAll?.('.pokemon-click, .search-match[data-pokemon]').forEach(el=>{
      if(el.dataset.pokemonBound === '1') return;
      el.dataset.pokemonBound = '1';
      el.addEventListener('click', (e)=>{
        // Audit cells own their click behavior.
        if(e.target.closest('[data-audit]')) return;
        e.preventDefault();
        e.stopPropagation();
        openPokemonProfile(el.dataset.pokemon);

  // same payload as auditAttr but without the class="" — for elements (like the

  function auditDataAttr(species, type, list, showLink){

  }

  function openAudit(species, type, list, showLink){

            ${rows.map(r=>`<li>

              ${showLink ? `<a href="https://replay.pokemonshowdown.com/${escapeHtml(r.replayId)}" target="_blank" rel="noopener">${escapeHtml(r.replayId)}</a>` : ''}

  function miscN(v){const n=Number(v);return Number.isFinite(n)?n:0;}
  function miscPct(h,u){return u?100*h/u:0;}
  function miscData(scope){
    const rows=(REPLAYS||[]).filter(r=>scope==='all'||String(r.week)===String(scope));
    const moves={},mons={},games=[]; let hd=0,hk=0,si=0,sk=0,lh=0;
    for(const r of rows){
      for(const [name,s0] of Object.entries(r.moveStats||{})){
        const s=s0||{},a=moves[name]||(moves[name]={move:name,uses:0,hits:0,misses:0,crits:0,kos:0,damage:0,maxDamage:0});
        ['uses','hits','misses','crits','kos','damage'].forEach(k=>a[k]+=miscN(s[k]));
        a.maxDamage=Math.max(a.maxDamage,miscN(s.maxDamage));
      }
      for(const [mon,byMove] of Object.entries(r.monMoveStats||{})){
        const a=mons[mon]||(mons[mon]={name:mon,uses:0,kos:0,damage:0,damageTaken:0,crits:0,misses:0});
        for(const s of Object.values(byMove||{})){
          a.uses+=miscN(s.uses);a.kos+=miscN(s.kos);a.damage+=miscN(s.damage);
          a.crits+=miscN(s.crits);a.misses+=miscN(s.misses);
        }
      }
      for(const [k,m] of Object.entries(r.mons||{})){
        const n=m.species||k.split('|')[1]||'Unknown',a=mons[n]||(mons[n]={name:n,uses:0,kos:0,damage:0,damageTaken:0,crits:0,misses:0});
        a.kos+=miscN(m.kos||m.kills);a.damage+=miscN(m.damage||m.dealt);a.damageTaken+=miscN(m.damageTaken||m.taken);
        a.crits+=miscN(m.crits);a.misses+=miscN(m.misses);
      }
      games.push({id:r.id||'',turns:miscN(r.turns||r.turnCount),switches:miscN(r.switches||r.switchCount),kos:miscN(r.koCount||r.kos),deaths:miscN(r.deathCount||r.deaths),crits:miscN(r.crits||r.critCount),misses:miscN(r.misses||r.missCount)});
      hd+=miscN(r.hazardDamage);hk+=miscN(r.hazardKOs);si+=miscN(r.statusInflicted);sk+=miscN(r.statusKOs);lh+=miscN(r.lowHpSurvivals);
    }
    const M=Object.values(moves),P=Object.values(mons),hi=(a,k)=>a.filter(x=>miscN(x[k])>0).sort((x,y)=>miscN(y[k])-miscN(x[k]))[0]||null;
    const lo=(a,k)=>a.filter(x=>miscN(x[k])>0).sort((x,y)=>miscN(x[k])-miscN(y[k]))[0]||null;
    return {mostUsed:hi(M,'uses'),leastUsed:lo(M,'uses'),
      mostAccurate:M.filter(x=>x.uses).sort((a,b)=>miscPct(b.hits,b.uses)-miscPct(a.hits,a.uses))[0]||null,
      leastAccurate:M.filter(x=>x.uses).sort((a,b)=>miscPct(a.hits,a.uses)-miscPct(b.hits,b.uses))[0]||null,
      mostDamaging:hi(M,'damage'),highestSingle:hi(M,'maxDamage'),mostMoveKOs:hi(M,'kos'),mostMoveCrits:hi(M,'crits'),mostMoveMisses:hi(M,'misses'),
      mostMonCrits:hi(P,'crits'),mostMonKOs:hi(P,'kos'),mostMonDamage:hi(P,'damage'),mostMonTaken:hi(P,'damageTaken'),
      hd,hk,si,sk,lh,longest:games.slice().sort((a,b)=>b.turns-a.turns)[0]||null,shortest:games.filter(x=>x.turns).sort((a,b)=>a.turns-b.turns)[0]||null,
      mostKOs:games.slice().sort((a,b)=>b.kos-a.kos)[0]||null,mostDeaths:games.slice().sort((a,b)=>b.deaths-a.deaths)[0]||null,
      mostSwitches:games.slice().sort((a,b)=>b.switches-a.switches)[0]||null,mostCritsGame:games.slice().sort((a,b)=>b.crits-a.crits)[0]||null,
      mostMissesGame:games.slice().sort((a,b)=>b.misses-a.misses)[0]||null};
  }
  function renderMisc(){
    const scope=window.miscScopeValue||'all',d=miscData(scope),fmt=x=>miscN(x).toLocaleString(),name=x=>x?(x.move||x.name||x.id||'—'):'—';
    const weeks=[...new Set((REPLAYS||[]).map(r=>Number(r.week)).filter(Boolean))].sort((a,b)=>a-b);
    const row=(label,x,val)=>`<div class="misc-row"><div><b>${label}</b><span>${name(x)}</span></div><strong>${x?val(x):'—'}</strong></div>`;

      ${row('Most Accurate Move',d.mostAccurate,x=>miscPct(x.hits,x.uses).toFixed(1)+'%')}${row('Least Accurate Move',d.leastAccurate,x=>miscPct(x.hits,x.uses).toFixed(1)+'%')}
      ${row('Most Damaging Move',d.mostDamaging,x=>fmt(x.damage))}${row('Highest Single-Hit Damage',d.highestSingle,x=>fmt(x.maxDamage))}

      <div class="panel"><h2>Games</h2>${row('Longest Game',d.longest,x=>fmt(x.turns)+' turns')}${row('Shortest Game',d.shortest,x=>fmt(x.turns)+' turns')}${row('Most KOs in One Game',d.mostKOs,x=>fmt(x.kos)+' KOs')}${row('Most Deaths in One Game',d.mostDeaths,x=>fmt(x.deaths)+' deaths')}${row('Most Switches in One Game',d.mostSwitches,x=>fmt(x.switches)+' switches')}${row('Most Crits in One Game',d.mostCritsGame,x=>fmt(x.crits)+' crits')}${row('Most Misses in One Game',d.mostMissesGame,x=>fmt(x.misses)+' misses')}</div>
      <div class="panel"><h2>Fun Records</h2>${row('Most Low-HP Survivals',{name:'Survivals',v:d.lh},x=>fmt(x.v))}</div>

  async function reprocessAll(logEl){
    const ids = Object.keys(STATE.replays);
    let ok=0, failed=0;
    for(const id of ids){
      
      try{
        const resp = await fetch(`https://replay.pokemonshowdown.com/${id}.json`);
        if(!resp.ok) throw new Error('not found (' + resp.status + ')');
        const json = await resp.json();
        const parsed = parseLog(json, id);
        parsed.week = autoWeekForReplay(parsed);
        parsed.processedAt = STATE.replays[id].processedAt;
        STATE.replays[id] = parsed;
        appendLog(logEl, `✓ reprocessed ${id}`, false, true);
        ok++;
      }catch(e){
        appendLog(logEl, `✗ ${id} — ${e.message}`, true);
        failed++;
      }
    }
    recalculateAllWeeks();
    await saveReplays();
    appendLog(logEl, `Reprocess complete. ${ok} updated, ${failed} failed.`, false);
    renderTicker();
    render();
  }

  // ---------- Pokémon profile / death causes / team comparison ----------
  function pokemonProfileData(species, weekFilter){
    const target = normName(species);
    const rows = [];
    const coaches = new Set();
    for(const r of allReplays(weekFilter)){
      for(const k in r.mons){
        const m = r.mons[k];
        if(normName(m.species) !== target) continue;
        coaches.add(teamFor(r.players[m.side]));
        rows.push({replay:r, mon:m});
      }
    }
    const weeksBrought = new Map();
    const agg = {species: rows[0]?.mon?.species || species, dealt:0,taken:0,kills:0,deaths:0,games:0,killLog:[],deathLog:[],coaches,weeksBrought};
    // Record every week in which the Pokémon was on the six-mon team preview,
    // including games where it was never sent into battle.
    for(const replay of allReplays(weekFilter)){
      const week = replay.week;
      for(const k in (replay.mons||{})){
        const mon = replay.mons[k];
        if(normName(mon.species) === target){
          const key = String(week || '');
          if(key) weeksBrought.set(key, (weeksBrought.get(key)||0) + 1);
          break;
        }
      }
    }
    rows.forEach(({replay,mon})=>{
      agg.dealt += mon.damageDealt||0; agg.taken += mon.damageTaken||0;
      agg.kills += mon.kills||0; agg.deaths += mon.deaths||0; agg.games += mon.appearances||0;
      // Keep the replay timestamp with each event so profile history can be
      // ordered by when the battle was played/uploaded rather than by turn.
      const replayDate = Number(replay.uploadtime || replay.processedAt || 0);
      agg.killLog.push(...(mon.killLog||[]).map(x=>({...x, replayDate})));
      agg.deathLog.push(...(mon.deathLog||[]).map(x=>({...x, replayDate})));
    });
    return agg;
  }

  function teamComparisonData(weekFilter){
    const out={};
    for(const r of allReplays(weekFilter)){
      const sides=['p1','p2'];
      for(const side of sides){
        const team=teamFor(r.players[side]); const key=groupKey(team);
        if(!out[key]) out[key]={team,players:new Set(),games:0,wins:0,losses:0,kills:0,deaths:0,dealt:0,taken:0};
        const t=out[key]; t.games++; t.players.add(r.players[side]||'?');
        const result = r.results && r.results[side] ? r.results[side] : (r.winner && r.winner.toLowerCase()===(r.players[side]||'').toLowerCase() ? 'W' : (r.winner ? 'L' : null));
        if(result==='W') t.wins++;
        else if(result==='L') t.losses++;
        for(const k in r.mons){ const m=r.mons[k]; if(m.side===side){t.kills+=m.kills||0;t.deaths+=m.deaths||0;t.dealt+=m.damageDealt||0;t.taken+=m.damageTaken||0;} }
      }
    }
    return Object.values(out).sort((a,b)=>b.wins-a.wins || (b.kills-b.deaths)-(a.kills-a.deaths) || b.dealt-a.dealt);
  }
