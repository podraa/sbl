<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Current Rosters</title>

<style>
:root{
  --bg:#071426;
  --panel:#0d2038;
  --panel-alt:#142b47;
  --border:#2b4c70;
  --text:#eef6ff;
  --text-dim:#9db4cc;
  --amber:#69a9e8;
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font:14px 'Segoe UI',Arial,sans-serif;
}

#app{
  width:calc(100% - 40px);
  max-width:1800px;
  margin:auto;
  padding:34px 0 72px;
}

.roster-toolbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:18px;
  margin:0 0 24px;
  padding:18px 20px;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:14px;
}

.roster-toolbar label{
  display:block;
  margin-bottom:6px;
  color:var(--text-dim);
  font-size:11px;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.08em;
}

#rosterSelect{
  min-width:300px;
  width:min(520px,60vw);
  padding:11px 42px 11px 13px;
  border:1px solid var(--border);
  border-radius:9px;
  background:var(--panel-alt);
  color:var(--text);
  font:600 14px 'Segoe UI',Arial,sans-serif;
}

.roster-summary{
  color:var(--text-dim);
  font-size:12px;
  text-align:right;
}

.budget-wrap{
  display:flex;
  flex-direction:column;
  align-items:flex-end;
  gap:4px;
  margin-top:8px;
}

.budget-label{
  color:var(--text-dim);
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:.08em;
}

.budget-value{
  display:inline-flex;
  align-items:center;
  padding:6px 10px;
  border-radius:999px;
  border:1px solid var(--border);
  background:var(--panel-alt);
  color:var(--text);
  font-size:12px;
  font-weight:800;
}

.budget-value.negative{color:#ff8e9f}
.budget-value.good{color:#8fe0b2}

@media(max-width:700px){
  #app{width:calc(100% - 20px);padding-top:20px}
  .roster-toolbar{align-items:stretch;flex-direction:column}
  #rosterSelect{width:100%;min-width:0}
  .roster-summary{text-align:left}
}

h1{
  font-size:30px;
  margin:0 0 6px;
}

.sub{
  color:var(--text-dim);
  margin-bottom:24px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(360px,1fr));
  gap:20px;
}

.grid.single{
  grid-template-columns:minmax(0,1fr);
}

.grid.single .card{
  padding:24px;
}

.grid.single .mons{
  grid-template-columns:repeat(auto-fill,minmax(270px,1fr));
  gap:14px;
}

.grid.single .mon{
  min-height:92px;
  padding:14px;
}

.grid.single .mon img{
  width:72px;
  height:72px;
}

.card{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:14px;
  padding:18px;
}

.head{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:12px;
  margin-bottom:14px;
}

.head h2{
  margin:0;
  font-size:20px;
}

.count{
  font-size:11px;
  color:var(--text-dim);
  border:1px solid var(--border);
  padding:5px 9px;
  border-radius:999px;
}

.mons{
  display:grid;
  gap:10px;
}

.mon{
  display:flex;
  align-items:center;
  gap:12px;
  padding:11px;
  border:1px solid var(--border);
  border-radius:12px;
  background:var(--panel-alt);
}

.mon img{
  width:60px;
  height:60px;
  object-fit:contain;
  image-rendering:pixelated;
}

.mon-info{
  display:flex;
  flex-direction:column;
  flex:1;
}

.mon-name{
  font-size:14px;
  font-weight:700;
}

.mon-team{
  margin-top:3px;
  font-size:11px;
  color:var(--text-dim);
}

.mon-points{
  margin-top:6px;
  display:inline-flex;
  width:max-content;
  padding:4px 8px;
  border-radius:999px;
  background:var(--panel);
  border:1px solid var(--border);
  font-size:11px;
  font-weight:800;
  color:var(--amber);
}

.empty{
  padding:34px;
  text-align:center;
  color:var(--text-dim);
  border:1px dashed var(--border);
  border-radius:12px;
  background:var(--panel);
}
</style>
</head>

<body>

<style>
.page-nav{position:fixed;top:14px;right:18px;z-index:1000;display:flex;align-items:center;gap:7px}
.page-nav label{font-size:11px;color:var(--text-dim);font-weight:700}
.page-nav select{font:inherit;font-size:12px;padding:7px 30px 7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--panel);color:var(--text);box-shadow:0 2px 8px rgba(0,0,0,.08)}
@media(max-width:700px){.page-nav{top:8px;right:8px}.page-nav label{display:none}}
</style>
<div class="page-nav">
  <label for="pageNavSelect">Page</label>
  <select id="pageNavSelect" aria-label="Choose page">
    <option value="index.html">My Team</option>
    <option value="stats.html">Stats Dashboard</option>
    <option value="rosters.html">Rosters</option>
    <option value="team-analysis.html">Team Analysis</option>
    <option value="free-agency.html">Free Agency</option>
  </select>
</div>

<div id="app">
  <h1>Current Rosters</h1>
  <p class="sub">Select a franchise to view its currently published Pokémon roster.</p>

  <div id="toolbar" class="roster-toolbar" style="display:none">
    <div>
      <label for="rosterSelect">Select roster</label>
      <select id="rosterSelect" aria-label="Select roster"></select>
    </div>
    <div id="rosterSummary" class="roster-summary"></div>
  </div>

  <main id="content">
    <div class="empty">Loading rosters…</div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://dfxdkkemltukxaklhcpo.supabase.co';
const SUPABASE_KEY = 'sb_publishable_H7iIBiJTxY77lBAcpJn2VQ_u2hAG2CN';

const content = document.getElementById('content');
const toolbar = document.getElementById('toolbar');
const rosterSelect = document.getElementById('rosterSelect');
const rosterSummary = document.getElementById('rosterSummary');
let allRosters = {};
const esc = s => String(s ?? '').replace(/[&<>'"]/g, c => ({
  '&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'
}[c]));

// Pokémon Showdown sprite filenames preserve hyphens for forme/name separators.
// Keep the hyphen so names such as Ho-Oh, Porygon-Z, Landorus-Therian and
// Necrozma-Dusk-Mane resolve to their actual sprite files.
function spriteCandidates(name){
  const original = String(name || '').trim();
  const raw = original.toLowerCase()
    .replace(/[’']/g,'')
    .replace(/[♀]/g,'-f')
    .replace(/[♂]/g,'-m');

  // IMPORTANT: preserve hyphens that are actually part of the Showdown ID
  // (Ho-Oh, Porygon-Z, Mr. Mime, Landorus-Therian, etc.).
  // Spaces are a different case: Showdown commonly compacts those IDs
  // (Gouging Fire -> gougingfire, Scream Tail -> screamtail).
  const hyphenated = raw
    .replace(/\s+/g,'-')
    .replace(/[^a-z0-9-]/g,'')
    .replace(/-+/g,'-')
    .replace(/^-|-$/g,'');

  const compact = hyphenated.replace(/-/g,'');

  // A few common Showdown aliases use an abbreviated form in roster data.
  const aliases = {
    // Showdown uses compact species IDs for some names, while regional/forms
    // use a mixture of compact base names and hyphenated suffixes.
    'mr-mime':'mrmime',
    'mr-mime-galar':'mrmime-galar',
    'mrmime-galar':'mrmime-galar',
    'landorus-incarnate':'landorus',
    'landorus-therian':'landorus-therian',
    'landorus-t':'landorus-therian',
    'tornadus-incarnate':'tornadus',
    'tornadus-therian':'tornadus-therian',
    'tornadus-t':'tornadus-therian',
    'thundurus-incarnate':'thundurus',
    'thundurus-therian':'thundurus-therian',
    'thundurus-t':'thundurus-therian',
    'enamorus-incarnate':'enamorus',
    'enamorus-therian':'enamorus-therian',
    'enamorus-t':'enamorus-therian',
    'hoopa-u':'hoopa-unbound',
    'urshifu-r':'urshifu-rapid-strike',
    'urshifu-s':'urshifu-single-strike',
    'necrozma-dm':'necrozma-dusk-mane',
    'necrozma-dw':'necrozma-dawn-wings',
    'calyrex-ice':'calyrex-ice-rider',
    'calyrex-shadow':'calyrex-shadow-rider'
  };

  const candidates = [];
  const add = id => { if(id && !candidates.includes(id)) candidates.push(id); };
  add(aliases[hyphenated] || hyphenated);
  add(hyphenated);
  add(compact);
  if(aliases[hyphenated]) add(aliases[hyphenated].replace(/-/g,''));

  // Handle names written with spaces/punctuation that correspond to compact
  // Showdown IDs (e.g. Mr. Mime Galar -> mrmime-galar).
  const compactWords = raw.replace(/[^a-z0-9]+/g,'');
  if(raw.includes('mr') && raw.includes('mime') && raw.includes('galar')) add('mrmime-galar');
  if(raw.includes('landorus') && raw.includes('incarnate')) add('landorus');
  add(compactWords);

  return candidates;
}

function sprite(s){
  const candidates = spriteCandidates(s);
  const urls = candidates.map(id =>
    `https://play.pokemonshowdown.com/sprites/gen5/${id}.png`
  );
  return `<img class="sprite"
    src="${urls[0] || ''}"
    alt="${esc(s)}"
    loading="lazy"
    data-sprite-candidates="${esc(JSON.stringify(urls))}"
    data-sprite-index="0"
    onerror="spriteFallback(this)">`;
}

function spriteFallback(img){
  let urls = [];
  try { urls = JSON.parse(img.dataset.spriteCandidates || '[]'); } catch(e) {}
  const next = Number(img.dataset.spriteIndex || 0) + 1;
  if(next < urls.length){
    img.dataset.spriteIndex = String(next);
    img.src = urls[next];
    return;
  }
  img.onerror = null;
  img.src = 'https://play.pokemonshowdown.com/sprites/gen5/0.png';
  img.style.opacity = '.25';
}

function normalizeRosters(raw){
  const out = {};
  for(const [team, list] of Object.entries(raw || {})){
    if(!Array.isArray(list)) continue;
    const mons = list.map(mon => typeof mon === 'string'
      ? {name: mon, points: null}
      : {name: String(mon?.name ?? ''), points: mon?.points ?? null}
    ).filter(mon => mon.name);
    if(mons.length) out[String(team)] = mons;
  }
  return out;
}

const ROSTER_BUDGET = 120;

function rosterPoints(list){
  return (Array.isArray(list) ? list : []).reduce((sum, mon) => {
    const points = Number(mon?.points);
    return sum + (Number.isFinite(points) ? points : 0);
  }, 0);
}

function budgetMarkup(list){
  const spent = rosterPoints(list);
  const remaining = ROSTER_BUDGET - spent;
  const cls = remaining < 0 ? 'negative' : 'good';
  return `<div class="budget-wrap"><div class="budget-label">Budget remaining</div><div class="budget-value ${cls}">${remaining} pts</div></div>`;
}

function renderPokemon(team, mon){
  const points = mon.points == null || mon.points === '' ? '' : `<div class="mon-points">${esc(mon.points)} pts</div>`;
  return `<div class="mon">${sprite(mon.name)}<div class="mon-info"><div class="mon-name">${esc(mon.name)}</div><div class="mon-team">${esc(team)}</div>${points}</div></div>`;
}

function showError(message){
  content.innerHTML = `<div class="empty">${esc(message)}</div>`;
}

async function withTimeout(promise, ms, label){
  let timer;
  const timeout = new Promise((_, reject) => {
    timer = setTimeout(() => reject(new Error(label + ' timed out. Check that Supabase is reachable and try refreshing.')), ms);
  });
  try { return await Promise.race([promise, timeout]); }
  finally { clearTimeout(timer); }
}

async function loadRosters(){
  if(!window.supabase){
    showError('Roster service could not start because the Supabase library did not load.');
    return;
  }

  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  try{
    // Read dashboard state first. Admin publishes the roster there as part of
    // normal settings, so this is the most reliable source. __rosters__ remains
    // supported for compatibility with older published data.
    let rosters = {};

    const stateResult = await withTimeout(
      supabase.from('replays').select('replay_data').eq('replay_id','__dashboard_state__').maybeSingle(),
      8000,
      'Loading the roster data'
    );
    if(stateResult.error) throw stateResult.error;
    rosters = normalizeRosters(stateResult.data?.replay_data?.settings?.rosters || {});

    if(!Object.keys(rosters).length){
      const publishedResult = await withTimeout(
        supabase.from('replays').select('replay_data').eq('replay_id','__rosters__').maybeSingle(),
        8000,
        'Loading the published rosters'
      );
      if(publishedResult.error) throw publishedResult.error;
      rosters = normalizeRosters(publishedResult.data?.replay_data?.rosters || {});
    }

    const teams = Object.keys(rosters).sort((a,b)=>a.localeCompare(b));
    if(!teams.length){
      content.innerHTML = '<div class="empty">No rosters have been uploaded yet.</div>';
      return;
    }

    allRosters = rosters;
    toolbar.style.display = '';
    rosterSelect.innerHTML = [
      '<option value="__all__">All rosters</option>',
      ...teams.map(team => `<option value="${esc(team)}">${esc(team)}</option>`)
    ].join('');

    function renderSelection(team){
      const selectedTeams = team === '__all__' ? teams : [team];
      const totalMons = selectedTeams.reduce((sum, name) => sum + (allRosters[name]?.length || 0), 0);
      rosterSummary.textContent = team === '__all__'
        ? `${teams.length} franchises · ${totalMons} Pokémon`
        : `${allRosters[team]?.length || 0} Pokémon · ${rosterPoints(allRosters[team])} pts spent`;

      content.innerHTML = `<div class="grid${team === '__all__' ? '' : ' single'}">${selectedTeams.map(name => `
        <section class="card">
          <div class="head"><div><h2>${esc(name)}</h2><span class="count">${allRosters[name].length} Pokémon</span></div>${budgetMarkup(allRosters[name])}</div>
          <div class="mons">${allRosters[name].map(mon => renderPokemon(name, mon)).join('')}</div>
        </section>`).join('')}</div>`;
    }

    rosterSelect.addEventListener('change', () => renderSelection(rosterSelect.value));
    renderSelection('__all__');
  }catch(err){
    console.error('Roster load failed:', err);
    showError(`Could not load rosters: ${err?.message || err}`);
  }
}

// Never leave visitors staring at the initial loading message forever.
const hardTimeout = setTimeout(() => {
  if(content.textContent.includes('Loading rosters')){
    showError('Roster loading is taking too long. Please refresh the page.');
  }
}, 12000);

loadRosters().finally(() => clearTimeout(hardTimeout));
</script>
<script>
(function(){
  const select=document.getElementById('pageNavSelect');
  if(!select)return;
  const current=location.pathname.split('/').pop()||'index.html';
  select.value=['index.html','rosters.html','team-analysis.html','free-agency.html'].includes(current)?current:'rosters.html';
  select.addEventListener('change',()=>{ if(select.value) location.href=select.value; });
})();
</script>
</body>
</html>
