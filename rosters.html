<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Current Rosters</title>

<style>
:root{
  --bg:#160308;
  --panel:#24060d;
  --panel-alt:#310a14;
  --border:#4a1421;
  --text:#f7eef0;
  --text-dim:#b99da5;
  --amber:#c56880;
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font:14px 'Segoe UI',Arial,sans-serif;
}

#app{
  width:min(1500px,calc(100% - 32px));
  margin:auto;
  padding:28px 0 64px;
}

h1{
  font-size:30px;
  margin:0 0 6px;
}

.sub{
  color:var(--text-dim);
  margin-bottom:24px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(340px,1fr));
  gap:16px;
}

.card{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:14px;
  padding:18px;
}

.head{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:12px;
  margin-bottom:14px;
}

.head h2{
  margin:0;
  font-size:20px;
}

.count{
  font-size:11px;
  color:var(--text-dim);
  border:1px solid var(--border);
  padding:5px 9px;
  border-radius:999px;
}

.mons{
  display:grid;
  gap:10px;
}

.mon{
  display:flex;
  align-items:center;
  gap:12px;
  padding:11px;
  border:1px solid var(--border);
  border-radius:12px;
  background:var(--panel-alt);
}

.mon img{
  width:60px;
  height:60px;
  object-fit:contain;
  image-rendering:pixelated;
}

.mon-info{
  display:flex;
  flex-direction:column;
  flex:1;
}

.mon-name{
  font-size:14px;
  font-weight:700;
}

.mon-team{
  margin-top:3px;
  font-size:11px;
  color:var(--text-dim);
}

.mon-points{
  margin-top:6px;
  display:inline-flex;
  width:max-content;
  padding:4px 8px;
  border-radius:999px;
  background:var(--panel);
  border:1px solid var(--border);
  font-size:11px;
  font-weight:800;
  color:var(--amber);
}

.empty{
  padding:34px;
  text-align:center;
  color:var(--text-dim);
  border:1px dashed var(--border);
  border-radius:12px;
  background:var(--panel);
}
</style>
</head>

<body>

<div id="app">
  <h1>Current Rosters</h1>
  <p class="sub">The currently published Pokémon rosters for every franchise.</p>

  <main id="content">
    <div class="empty">Loading rosters…</div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://dfxdkkemltukxaklhcpo.supabase.co';
const SUPABASE_KEY = 'sb_publishable_H7iIBiJTxY77lBAcpJn2VQ_u2hAG2CN';

const content = document.getElementById('content');
const esc = s => String(s ?? '').replace(/[&<>'"]/g, c => ({
  '&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'
}[c]));

const sid = s => String(s || '')
  .split('-')
  .map(x => x.toLowerCase().replace(/[^a-z0-9]/g,''))
  .filter(Boolean)
  .join('-');

const sprite = s => `
  <img src="https://play.pokemonshowdown.com/sprites/gen5/${sid(s)}.png"
       alt="${esc(s)}" loading="lazy"
       onerror="this.onerror=null;this.style.opacity='.2'">`;

function normalizeRosters(raw){
  const out = {};
  for(const [team, list] of Object.entries(raw || {})){
    if(!Array.isArray(list)) continue;
    const mons = list.map(mon => typeof mon === 'string'
      ? {name: mon, points: null}
      : {name: String(mon?.name ?? ''), points: mon?.points ?? null}
    ).filter(mon => mon.name);
    if(mons.length) out[String(team)] = mons;
  }
  return out;
}

function renderPokemon(team, mon){
  const points = mon.points == null || mon.points === '' ? '' : `<div class="mon-points">${esc(mon.points)} pts</div>`;
  return `<div class="mon">${sprite(mon.name)}<div class="mon-info"><div class="mon-name">${esc(mon.name)}</div><div class="mon-team">${esc(team)}</div>${points}</div></div>`;
}

function showError(message){
  content.innerHTML = `<div class="empty">${esc(message)}</div>`;
}

async function withTimeout(promise, ms, label){
  let timer;
  const timeout = new Promise((_, reject) => {
    timer = setTimeout(() => reject(new Error(label + ' timed out. Check that Supabase is reachable and try refreshing.')), ms);
  });
  try { return await Promise.race([promise, timeout]); }
  finally { clearTimeout(timer); }
}

async function loadRosters(){
  if(!window.supabase){
    showError('Roster service could not start because the Supabase library did not load.');
    return;
  }

  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  try{
    // Read dashboard state first. Admin publishes the roster there as part of
    // normal settings, so this is the most reliable source. __rosters__ remains
    // supported for compatibility with older published data.
    let rosters = {};

    const stateResult = await withTimeout(
      supabase.from('replays').select('replay_data').eq('replay_id','__dashboard_state__').maybeSingle(),
      8000,
      'Loading the roster data'
    );
    if(stateResult.error) throw stateResult.error;
    rosters = normalizeRosters(stateResult.data?.replay_data?.settings?.rosters || {});

    if(!Object.keys(rosters).length){
      const publishedResult = await withTimeout(
        supabase.from('replays').select('replay_data').eq('replay_id','__rosters__').maybeSingle(),
        8000,
        'Loading the published rosters'
      );
      if(publishedResult.error) throw publishedResult.error;
      rosters = normalizeRosters(publishedResult.data?.replay_data?.rosters || {});
    }

    const teams = Object.keys(rosters).sort((a,b)=>a.localeCompare(b));
    if(!teams.length){
      content.innerHTML = '<div class="empty">No rosters have been uploaded yet.</div>';
      return;
    }

    content.innerHTML = `<div class="grid">${teams.map(team => `
      <section class="card">
        <div class="head"><h2>${esc(team)}</h2><span class="count">${rosters[team].length} Pokémon</span></div>
        <div class="mons">${rosters[team].map(mon => renderPokemon(team, mon)).join('')}</div>
      </section>`).join('')}</div>`;
  }catch(err){
    console.error('Roster load failed:', err);
    showError(`Could not load rosters: ${err?.message || err}`);
  }
}

// Never leave visitors staring at the initial loading message forever.
const hardTimeout = setTimeout(() => {
  if(content.textContent.includes('Loading rosters')){
    showError('Roster loading is taking too long. Please refresh the page.');
  }
}, 12000);

loadRosters().finally(() => clearTimeout(hardTimeout));
</script>

</body>
</html>
