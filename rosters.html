<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Current Rosters</title>

<style>
:root{
  --bg:#160308;
  --panel:#24060d;
  --panel-alt:#310a14;
  --border:#4a1421;
  --text:#f7eef0;
  --text-dim:#b99da5;
  --amber:#c56880;
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font:14px 'Segoe UI',Arial,sans-serif;
}

#app{
  width:min(1500px,calc(100% - 32px));
  margin:auto;
  padding:28px 0 64px;
}

h1{
  font-size:30px;
  margin:0 0 6px;
}

.sub{
  color:var(--text-dim);
  margin-bottom:24px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(340px,1fr));
  gap:16px;
}

.card{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:14px;
  padding:18px;
}

.head{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:12px;
  margin-bottom:14px;
}

.head h2{
  margin:0;
  font-size:20px;
}

.count{
  font-size:11px;
  color:var(--text-dim);
  border:1px solid var(--border);
  padding:5px 9px;
  border-radius:999px;
}

.mons{
  display:grid;
  gap:10px;
}

.mon{
  display:flex;
  align-items:center;
  gap:12px;
  padding:11px;
  border:1px solid var(--border);
  border-radius:12px;
  background:var(--panel-alt);
}

.mon img{
  width:60px;
  height:60px;
  object-fit:contain;
  image-rendering:pixelated;
}

.mon-info{
  display:flex;
  flex-direction:column;
  flex:1;
}

.mon-name{
  font-size:14px;
  font-weight:700;
}

.mon-team{
  margin-top:3px;
  font-size:11px;
  color:var(--text-dim);
}

.mon-points{
  margin-top:6px;
  display:inline-flex;
  width:max-content;
  padding:4px 8px;
  border-radius:999px;
  background:var(--panel);
  border:1px solid var(--border);
  font-size:11px;
  font-weight:800;
  color:var(--amber);
}

.empty{
  padding:34px;
  text-align:center;
  color:var(--text-dim);
  border:1px dashed var(--border);
  border-radius:12px;
  background:var(--panel);
}
</style>
</head>

<body>

<div id="app">
  <h1>Current Rosters</h1>
  <p class="sub">The currently published Pokémon rosters for every franchise.</p>

  <main id="content">
    <div class="empty">Loading rosters…</div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const supabase = window.supabase.createClient(
  'https://dfxdkkemltukxaklhcpo.supabase.co',
  'sb_publishable_H7iIBiJTxY77lBAcpJn2VQ_u2hAG2CN'
);

const esc = s => String(s ?? '').replace(/[&<>'"]/g, c => ({
  '&':'&amp;',
  '<':'&lt;',
  '>':'&gt;',
  "'":'&#39;',
  '"':'&quot;'
}[c]));

const sid = s => String(s || '')
  .split('-')
  .map(x => x.toLowerCase().replace(/[^a-z0-9]/g,''))
  .filter(Boolean)
  .join('-');

const sprite = s => `
  <img
    src="https://play.pokemonshowdown.com/sprites/gen5/${sid(s)}.png"
    alt="${esc(s)}"
    onerror="this.style.opacity='.2'"
  >`;

function renderPokemon(team, mon){
  return `
    <div class="mon">
      ${sprite(mon.name)}

      <div class="mon-info">
        <div class="mon-name">${esc(mon.name)}</div>
        <div class="mon-team">${esc(team)}</div>
        <div class="mon-points">${mon.points} pts</div>
      </div>
    </div>`;
}

(async () => {
  const content = document.getElementById('content');

  try{
    // Published rosters normally live in __rosters__. The dashboard-state
    // fallback makes the page resilient if an older admin deployment only
    // wrote settings.rosters.
    const { data: rosterRow, error: rosterError } = await supabase
      .from('replays')
      .select('replay_data')
      .eq('replay_id', '__rosters__')
      .maybeSingle();

    if(rosterError) throw rosterError;

    let rosters = rosterRow?.replay_data?.rosters || {};

    if(!Object.keys(rosters).length){
      const { data: stateRow, error: stateError } = await supabase
        .from('replays')
        .select('replay_data')
        .eq('replay_id', '__dashboard_state__')
        .maybeSingle();

      if(stateError) throw stateError;
      rosters = stateRow?.replay_data?.settings?.rosters || {};
    }

    // Accept both the current {name, points} format and older string-only
    // roster data without changing the page's display contract.
    rosters = Object.fromEntries(Object.entries(rosters).map(([team, list]) => [
      team,
      (Array.isArray(list) ? list : []).map(mon =>
        typeof mon === 'string' ? {name:mon, points:null} : {
          name:String(mon?.name ?? ''),
          points:mon?.points ?? null
        }
      ).filter(mon => mon.name)
    ]));
    const teams = Object.keys(rosters).sort();

    if(!teams.length){
      content.innerHTML = `
        <div class="empty">No rosters have been uploaded yet.</div>`;
      return;
    }

    content.innerHTML = `
      <div class="grid">
        ${teams.map(team => `
          <section class="card">
            <div class="head">
              <h2>${esc(team)}</h2>
              <span class="count">${rosters[team].length} Pokémon</span>
            </div>

            <div class="mons">
              ${rosters[team].map(mon => renderPokemon(team, mon)).join('')}
            </div>
          </section>`).join('')}
      </div>`;

  }catch(err){
    console.error(err);

    content.innerHTML = `
      <div class="empty">
        Could not load rosters:<br>${esc(err.message)}
      </div>`;
  }
})();
</script>

</body>
</html>
