
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Current Rosters</title>

<style>
:root{
  --bg:#071426;
  --panel:#0d2038;
  --panel-alt:#142b47;
  --border:#2b4c70;
  --text:#eef6ff;
  --text-dim:#9db4cc;
  --amber:#69a9e8;
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font:14px 'Segoe UI',Arial,sans-serif;
}

#app{
  width:calc(100% - 40px);
  max-width:1800px;
  margin:auto;
  padding:34px 0 72px;
}

.roster-toolbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:18px;
  margin:0 0 24px;
  padding:18px 20px;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:14px;
}

.roster-toolbar label{
  display:block;
  margin-bottom:6px;
  color:var(--text-dim);
  font-size:11px;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.08em;
}

#rosterSelect{
  min-width:300px;
  width:min(520px,60vw);
  padding:11px 42px 11px 13px;
  border:1px solid var(--border);
  border-radius:9px;
  background:var(--panel-alt);
  color:var(--text);
  font:600 14px 'Segoe UI',Arial,sans-serif;
}

.roster-summary{
  color:var(--text-dim);
  font-size:12px;
  text-align:right;
}

.budget-wrap{
  display:flex;
  flex-direction:column;
  align-items:flex-end;
  gap:4px;
  margin-top:8px;
}

.budget-label{
  color:var(--text-dim);
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:.08em;
}

.budget-value{
  display:inline-flex;
  align-items:center;
  padding:6px 10px;
  border-radius:999px;
  border:1px solid var(--border);
  background:var(--panel-alt);
  color:var(--text);
  font-size:12px;
  font-weight:800;
}

.budget-value.negative{color:#ff8e9f}
.budget-value.good{color:#8fe0b2}

@media(max-width:700px){
  #app{width:calc(100% - 20px);padding-top:20px}
  .roster-toolbar{align-items:stretch;flex-direction:column}
  #rosterSelect{width:100%;min-width:0}
  .roster-summary{text-align:left}
}

h1{
  font-size:30px;
  margin:0 0 6px;
}

.sub{
  color:var(--text-dim);
  margin-bottom:24px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(360px,1fr));
  gap:20px;
}

.grid.single{
  grid-template-columns:minmax(0,1fr);
}

.grid.single .card{
  padding:24px;
}

.grid.single .mons{
  grid-template-columns:repeat(auto-fill,minmax(270px,1fr));
  gap:14px;
}

.grid.single .mon{
  min-height:92px;
  padding:14px;
}

.grid.single .mon img{
  width:72px;
  height:72px;
}

.card{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:14px;
  padding:18px;
}

.head{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:12px;
  margin-bottom:14px;
}

.head h2{
  margin:0;
  font-size:20px;
}

.count{
  font-size:11px;
  color:var(--text-dim);
  border:1px solid var(--border);
  padding:5px 9px;
  border-radius:999px;
}

.mons{
  display:grid;
  gap:10px;
}

.mon{
  display:flex;
  align-items:center;
  gap:12px;
  padding:11px;
  border:1px solid var(--border);
  border-radius:12px;
  background:var(--panel-alt);
}

.mon img{
  width:60px;
  height:60px;
  object-fit:contain;
  image-rendering:pixelated;
}

.mon-info{
  display:flex;
  flex-direction:column;
  flex:1;
}

.mon-name{
  font-size:14px;
  font-weight:700;
}

.mon-team{
  margin-top:3px;
  font-size:11px;
  color:var(--text-dim);
}

.mon-points{
  margin-top:6px;
  display:inline-flex;
  width:max-content;
  padding:4px 8px;
  border-radius:999px;
  background:var(--panel);
  border:1px solid var(--border);
  font-size:11px;
  font-weight:800;
  color:var(--amber);
}

.empty{
  padding:34px;
  text-align:center;
  color:var(--text-dim);
  border:1px dashed var(--border);
  border-radius:12px;
  background:var(--panel);
}
</style>

const DEFAULT_SEASON='Season 15';
function seasonKey(name){return String(name||'').trim().toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'season';}
function selectedSeasonSnapshot(shared){
  const settings=shared?.settings||{},archives=settings.seasonArchives||{},requested=new URLSearchParams(location.search).get('season');
  if(requested&&archives[requested]){const a=archives[requested];return{name:a.name||requested,key:requested,settings:a.settings||{},teamMap:a.teamMap||{},replays:a.replays||{},archived:true,archives};}

// Pokémon Showdown sprite filenames preserve hyphens for forme/name separators.
// Keep the hyphen so names such as Ho-Oh, Porygon-Z, Landorus-Therian and
// Necrozma-Dusk-Mane resolve to their actual sprite files.
function toShowdownId(name){
  return String(name||''). trim().split('-')
    .map(seg=>seg.toLowerCase().replace(/[^a-z0-9]/g,''))
    .filter(Boolean).join('-');
}

function sprite(name){
  const id=toShowdownId(name);
  const compact=id.replace(/-/g,'');
  const urls=JSON.stringify([
    'https://play.pokemonshowdown.com/sprites/gen5/'+id+'.png',
    'https://play.pokemonshowdown.com/sprites/gen5/'+compact+'.png',
    'https://play.pokemonshowdown.com/sprites/gen5/0.png'
  ]);
  return `<img src="https://play.pokemonshowdown.com/sprites/gen5/${id}.png" alt="${esc(name)}" `+
    `data-sprite-urls="${esc(urls)}" data-sprite-idx="0" `+
    `onerror="(function(i){var us=JSON.parse(i.dataset.spriteUrls||'[]');var nx=Number(i.dataset.spriteIdx||0)+1;if(nx<us.length){i.dataset.spriteIdx=nx;i.src=us[nx];}else{i.onerror=null;i.style.opacity='.25';}})(this)">`;
}

function normalizeRosters(raw){
  const out = {};
  for(const [team, list] of Object.entries(raw || {})){
    if(!Array.isArray(list)) continue;
    const mons = list.map(mon => typeof mon === 'string'
      ? {name: mon, points: null}
      : {name: String(mon?.name ?? ''), points: mon?.points ?? null}
    ).filter(mon => mon.name);
    if(mons.length) out[String(team)] = mons;
  }
  return out;
}

const FALLBACK_BUDGET = 115;
let DRAFT_BUDGETS = {defaultBudget: FALLBACK_BUDGET, budgets: {}};

function teamBudget(team){
  const override = DRAFT_BUDGETS.budgets?.[team];
  return Number.isFinite(Number(override)) ? Number(override) : (Number(DRAFT_BUDGETS.defaultBudget) || FALLBACK_BUDGET);
}

function rosterPoints(list){
  return (Array.isArray(list) ? list : []).reduce((sum, mon) => {
    const points = Number(mon?.points);
    return sum + (Number.isFinite(points) ? points : 0);
  }, 0);
}

function budgetMarkup(team, list){
  const spent = rosterPoints(list);
  const remaining = teamBudget(team) - spent;
  const cls = remaining < 0 ? 'negative' : 'good';
  return `<div class="budget-wrap"><div class="budget-label">Budget remaining</div><div class="budget-value ${cls}">${remaining} pts</div></div>`;
}

function renderPokemon(team, mon){
  const points = mon.points == null || mon.points === '' ? '' : `<div class="mon-points">${esc(mon.points)} pts</div>`;
  return `<div class="mon">${sprite(mon.name)}<div class="mon-info"><div class="mon-name">${esc(mon.name)}</div><div class="mon-team">${esc(team)}</div>${points}</div></div>`;
}

function showError(message){
  content.innerHTML = `<div class="empty">${esc(message)}</div>`;
}

async function withTimeout(promise, ms, label){
  let timer;
  const timeout = new Promise((_, reject) => {
    timer = setTimeout(() => reject(new Error(label + ' timed out. Check that Supabase is reachable and try refreshing.')), ms);
  });
  try { return await Promise.race([promise, timeout]); }
  finally { clearTimeout(timer); }
}

async function loadRosters(){
  if(!window.supabase){
    showError('Roster service could not start because the Supabase library did not load.');
    return;
  }

  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  // ---- access gate: must be logged in AND have a claimed team, or bounce to login ----
  const {data:{session}} = await supabase.auth.getSession();
  if(!session){ location.replace('index.html'); return; }
  const {data:gateProfile, error:gateErr} = await supabase.from('profiles').select('team_name').eq('id', session.user.id).maybeSingle();
  if(gateErr || !gateProfile?.team_name){ location.replace('index.html'); return; }
  document.getElementById('app').style.display = '';

  try{
    // Read dashboard state first. Admin publishes the roster there as part of
    // normal settings, so this is the most reliable source. __rosters__ remains
    // supported for compatibility with older published data.
    let rosters = {};

    const stateResult = await withTimeout(
      supabase.from('replays').select('replay_data').eq('replay_id','__dashboard_state__').maybeSingle(),
      8000,
      'Loading the roster data'
    );
    if(stateResult.error) throw stateResult.error;
    const shared=stateResult.data?.replay_data||{};
    const snap=installSeasonPicker(shared);
    rosters = normalizeRosters(snap.settings?.rosters || {});
    const draftSettings = snap.settings?.draft;
    if(draftSettings && typeof draftSettings === 'object'){
      DRAFT_BUDGETS = {
        defaultBudget: Number(draftSettings.defaultBudget) || FALLBACK_BUDGET,
        budgets: (draftSettings.budgets && typeof draftSettings.budgets === 'object') ? draftSettings.budgets : {}
      };
    }

    if(!snap.archived && !Object.keys(rosters).length){
      const publishedResult = await withTimeout(
        supabase.from('replays').select('replay_data').eq('replay_id','__rosters__').maybeSingle(),
        8000,
        'Loading the published rosters'
      );
      if(publishedResult.error) throw publishedResult.error;
      rosters = normalizeRosters(publishedResult.data?.replay_data?.rosters || {});
    }

    const teams = Object.keys(rosters).sort((a,b)=>a.localeCompare(b));
    if(!teams.length){
      content.innerHTML = '<div class="empty">No rosters have been uploaded yet.</div>';
      return;
    }

    allRosters = rosters;
    toolbar.style.display = '';
    rosterSelect.innerHTML = [
      '<option value="__all__">All rosters</option>',
      ...teams.map(team => `<option value="${esc(team)}">${esc(team)}</option>`)
    ].join('');

    function renderSelection(team){
      const selectedTeams = team === '__all__' ? teams : [team];
      const totalMons = selectedTeams.reduce((sum, name) => sum + (allRosters[name]?.length || 0), 0);
      rosterSummary.textContent = team === '__all__'
        ? `${teams.length} franchises · ${totalMons} Pokémon`
        : `${allRosters[team]?.length || 0} Pokémon · ${rosterPoints(allRosters[team])} pts spent`;

      content.innerHTML = `<div class="grid${team === '__all__' ? '' : ' single'}">${selectedTeams.map(name => `
        <section class="card">
          <div class="head"><div><h2>${esc(name)}</h2><span class="count">${allRosters[name].length} Pokémon</span></div>${budgetMarkup(name, allRosters[name])}</div>
          <div class="mons">${allRosters[name].map(mon => renderPokemon(name, mon)).join('')}</div>
        </section>`).join('')}</div>`;
    }

    rosterSelect.addEventListener('change', () => renderSelection(rosterSelect.value));
    renderSelection('__all__');
  }catch(err){
    console.error('Roster load failed:', err);
    showError(`Could not load rosters: ${err?.message || err}`);
  }
}

// Never leave visitors staring at the initial loading message forever.
const hardTimeout = setTimeout(() => {
  if(content.textContent.includes('Loading rosters')){
    showError('Roster loading is taking too long. Please refresh the page.');
  }
}, 12000);

loadRosters().finally(() => clearTimeout(hardTimeout));
</script>
<script>
(function(){
  const nav=document.getElementById('pageNav');
  if(!nav) return;
  const links=[...nav.querySelectorAll('a[data-page]')];
  const current=(location.pathname.split('/').pop()||'index.html').toLowerCase();
  const client=window.supabase?.createClient(
    'https://dfxdkkemltukxaklhcpo.supabase.co',
    'sb_publishable_H7iIBiJTxY77lBAcpJn2VQ_u2hAG2CN'
  );
  links.forEach(a=>{ if(a.dataset.page===current) a.classList.add('active'); });
  function lockNav(locked){
    nav.classList.toggle('locked',locked);
    links.forEach(a=>{
      a.setAttribute('aria-disabled',locked?'true':'false');
      if(locked) a.title='Log in to switch pages'; else a.removeAttribute('title');
    });
  }
  links.forEach(a=>a.addEventListener('click',e=>{
    if(nav.classList.contains('locked')){ e.preventDefault(); return; }
  }));
  function hidePrivilegedLinks(){
    nav.querySelectorAll('[data-admin-only]').forEach(a=>{ a.hidden=true; });
    nav.querySelectorAll('[data-draft-live-only]').forEach(a=>{ a.hidden=true; });
  }
  function showAdminLinks(){
    nav.querySelectorAll('[data-admin-only]').forEach(a=>{ a.hidden=false; });
  }
  function showDraftLink(){
    nav.querySelectorAll('[data-draft-live-only]').forEach(a=>{ a.hidden=false; });
  }
  // Commissioner status rarely changes, so we only check it against the
  // database once per login and cache the result (plus the last-seen draft
  // status) in sessionStorage. Crucially, we also paint from that cache
  // *synchronously* below, before any awaiting -- otherwise hidePrivilegedLinks()
  // hides the admin-only / draft-room links on every fresh page load, and they
  // only pop back in a tick later once getSession() resolves. That pop-in is
  // the flicker/"reload" look when swapping between pages.
  const NAV_CACHE_PREFIX='navPerms:';
  const NAV_LAST_UID_KEY='navLastUid';
  function readNavCache(uid){
    try{ const raw=sessionStorage.getItem(NAV_CACHE_PREFIX+uid); return raw?JSON.parse(raw):null; }
    catch(e){ return null; }
  }
  function writeNavCache(uid,perms){
    try{ sessionStorage.setItem(NAV_CACHE_PREFIX+uid, JSON.stringify(perms)); }catch(e){}
  }
  function readLastUid(){
    try{ return sessionStorage.getItem(NAV_LAST_UID_KEY); }catch(e){ return null; }
  }
  function writeLastUid(uid){
    try{ sessionStorage.setItem(NAV_LAST_UID_KEY, uid); }catch(e){}
  }
  function clearNavCache(){
    try{
      Object.keys(sessionStorage).forEach(k=>{ if(k.indexOf(NAV_CACHE_PREFIX)===0) sessionStorage.removeItem(k); });
      sessionStorage.removeItem(NAV_LAST_UID_KEY);
    }catch(e){}
  }
  // Paint immediately from whatever was cached on the previous page, before
  // doing any real check -- this is what removes the flash. Only falls back
  // to hiding everything when there's nothing to paint from yet (first load
  // of the session, or a signed-out visitor).
  let paintedFromCache=false;
  const lastUid=readLastUid();
  if(lastUid){
    const cached=readNavCache(lastUid);
    if(cached){
      lockNav(false);
      if(cached.isCommissioner) showAdminLinks();
      if(cached.draftLive) showDraftLink();
      paintedFromCache=true;
    }
  }
  if(!paintedFromCache) hidePrivilegedLinks();
  async function setupNav(){
    try{
      if(!client){ lockNav(true); hidePrivilegedLinks(); return; }
      const {data:{session}}=await client.auth.getSession();
      lockNav(!session?.user);
      if(!session?.user){ hidePrivilegedLinks(); return; }
      writeLastUid(session.user.id);
      let perms=readNavCache(session.user.id);
      if(!perms){
        const {data:profile,error}=await client.from('profiles').select('is_commissioner').eq('id',session.user.id).maybeSingle();
        if(error) throw error;
        perms={isCommissioner:!!profile?.is_commissioner};
      }
      if(perms.isCommissioner){
        showAdminLinks();
      }else{
        nav.querySelectorAll('[data-admin-only]').forEach(a=>{ a.hidden=true; });
      }
      // "Draft Room" is shown to any logged-in team owner, but only while a
      // draft is actually in progress -- independent of commissioner status.
      try{
        const {data:stateRow}=await client.from('replays').select('replay_data').eq('replay_id','__dashboard_state__').maybeSingle();
        perms.draftLive = stateRow?.replay_data?.settings?.draft?.status === 'live';
      }catch(draftErr){ console.warn('Draft status check failed:',draftErr); }
      if(perms.draftLive) showDraftLink();
      else nav.querySelectorAll('[data-draft-live-only]').forEach(a=>{ a.hidden=true; });
      writeNavCache(session.user.id,perms);
    }catch(err){ console.warn('Navigation check failed:',err); lockNav(true); hidePrivilegedLinks(); }
  }
  setupNav();
  client?.auth.onAuthStateChange((_event,session)=>{
    lockNav(!session?.user);
    if(_event==='SIGNED_IN'||_event==='SIGNED_OUT'){ clearNavCache(); }
    if(session?.user) setupNav(); else hidePrivilegedLinks();
  });
})();
</script>

<script>
(function(){
  const nav = document.getElementById('pageNav');
  if(!nav) return;
  let ticking = false;
  function updateNav(){
    const y = window.scrollY || document.documentElement.scrollTop || 0;

    // Keep the nav visible at the top and automatically reveal it as the
    // user approaches the top. The moment the page is scrolled away from
    // the top, hide it without requiring another interaction.
    if(y <= 140){
      nav.classList.remove('nav-hidden');
    } else {
      nav.classList.add('nav-hidden');
    }
    ticking = false;
  }
  window.addEventListener('scroll', function(){
    if(!ticking){ ticking = true; requestAnimationFrame(updateNav); }
  }, {passive:true});
  nav.addEventListener('mouseenter', function(){ nav.classList.remove('nav-hidden'); });
  document.addEventListener('mousemove', function(e){
    if(e.clientY <= 12) nav.classList.remove('nav-hidden');
  }, {passive:true});
  nav.classList.remove('nav-hidden');
})();
</script>
<script id="sitewide-sprite-fix">
(function(){
  const BASE='https://play.pokemonshowdown.com/sprites/';
  const aliases={
    'ogerpon-teal-mask':['ogerpon'],
    'ogerpon-wellspring-mask':['ogerpon-wellspring'],
    'ogerpon-hearthflame-mask':['ogerpon-hearthflame'],
    'ogerpon-cornerstone-mask':['ogerpon-cornerstone'],
    'squawkabilly-green-plumage':['squawkabilly-green'],
    'squawkabilly-blue-plumage':['squawkabilly-blue'],
    'squawkabilly-yellow-plumage':['squawkabilly-yellow'],
    'squawkabilly-white-plumage':['squawkabilly-white'],
    'dudunsparce-three-segment':['dudunsparce-3'],
    'dudunsparce-two-segment':['dudunsparce-2'],
    'maushold-family-of-three':['maushold-family3'],
    'maushold-family-of-four':['maushold'],
    'zygarde-10-percent':['zygarde-10'],
    'zygarde-50-percent':['zygarde'],
    'zygarde-complete':['zygarde-complete'],
    'necrozma-dusk-mane':['necrozma-dusk'],
    'necrozma-dawn-wings':['necrozma-dawn'],
    'lycanroc-midday':['lycanroc'],
    'lycanroc-midnight':['lycanroc-midnight'],
    'lycanroc-dusk':['lycanroc-dusk'],
    'wishiwashi-school':['wishiwashi-school'],
    'eiscue-ice':['eiscue'],
    'eiscue-noice':['eiscue-noice'],
    'morpeko-hangry':['morpeko-hangry'],
    'palafin-zero':['palafin'],
    'palafin-hero':['palafin-hero'],
    'minior-red-meteor':['minior-red'],
    'minior-orange-meteor':['minior-orange'],
    'minior-yellow-meteor':['minior-yellow'],
    'minior-green-meteor':['minior-green'],
    'minior-blue-meteor':['minior-blue'],
    'minior-indigo-meteor':['minior-indigo'],
    'minior-violet-meteor':['minior-violet']
  };
  function slug(s){
    return String(s||'').trim().toLowerCase()
      .replace(/[’']/g,'').replace(/[♀]/g,'-f').replace(/[♂]/g,'-m')
      .replace(/[.:]/g,'').replace(/\s+/g,'-').replace(/-+/g,'-').replace(/^-|-$/g,'');
  }
  function urlsFor(img){
    let id=slug(img.getAttribute('data-sprite-species')||img.alt||'');
    if(!id){
      const m=(img.src||'').match(/sprites\/[^/]+\/([^/?#]+)\.png/i);
      id=m?m[1].toLowerCase():'';
    }
    if(!id)return [];
    const ids=[]; const add=x=>{if(x&&!ids.includes(x))ids.push(x)};
    add(id); (aliases[id]||[]).forEach(add);
    add(id.replace(/-plumage$/,'')); add(id.replace(/-mask$/,''));
    add(id.replace(/-forme$/,'')); add(id.replace(/-form$/,''));
    add(id.replace(/-standard$/,'')); add(id.replace(/-normal$/,''));
    const parts=id.split('-');
    for(let i=parts.length-1;i>=1;i--)add(parts.slice(0,i).join('-'));
    const out=[];
    for(const x of ids){
      out.push(BASE+'gen9/'+x+'.png');
      out.push(BASE+'gen5/'+x+'.png');
      out.push(BASE+'dex/'+x+'.png');
    }
    return out;
  }
  function install(img){
    if(!(img instanceof HTMLImageElement)||img.dataset.sitewideSpriteFix)return;
    const src=img.src||'';
    if(!src.includes('/sprites/'))return;
    img.dataset.sitewideSpriteFix='1';
    img.dataset.sitewideSpriteUrls=JSON.stringify(urlsFor(img));
    img.dataset.sitewideSpriteIndex='-1';
    img.onerror=function(){
      const urls=JSON.parse(img.dataset.sitewideSpriteUrls||'[]');
      let i=Number(img.dataset.sitewideSpriteIndex||-1)+1;
      while(i<urls.length && urls[i]===img.src)i++;
      if(i<urls.length){img.dataset.sitewideSpriteIndex=String(i);img.style.opacity='';img.src=urls[i];}
      else{img.onerror=null;img.removeAttribute('src');img.style.opacity='.25';}
    };
  }
  function scan(root){
    if(root instanceof HTMLImageElement)install(root);
    else if(root&&root.querySelectorAll)root.querySelectorAll('img[src*="/sprites/"]').forEach(install);
  }
  function start(){scan(document); new MutationObserver(ms=>ms.forEach(m=>m.addedNodes.forEach(scan))).observe(document.documentElement,{subtree:true,childList:true});}
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start,{once:true}); else start();
})();
</script>
