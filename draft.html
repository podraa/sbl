<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Draft Room</title>
<style>
  :root{
    --bg:#0e1218;
    --panel:#161c26;
    --panel-alt:#1c2432;
    --border:#2a3444;
    --text:#e8edf5;
    --text-dim:#8996a8;
    --amber:#ffb454;
    --amber-text:#1a1206;
    --teal:#5eead4;
    --red:#ff7a7a;
    --mono:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;
    --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--text); font-family:var(--sans); -webkit-font-smoothing:antialiased;}
  #app{max-width:1320px; margin:0 auto; padding:24px 20px 60px;}
  header{margin-bottom:16px;}
  h1{font-size:22px; margin:0 0 2px;}
  .sub{color:var(--text-dim); font-size:13px; margin-bottom:16px;}

  .panel{background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:18px;}
  .panel + .panel{margin-top:14px;}
  .panel h2{font-size:14px; margin:0 0 12px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-dim);}
  label{display:block; font-size:12px; color:var(--text-dim); margin-bottom:6px;}
  input[type=text], input[type=email], input[type=password], select{
    width:100%; background:var(--panel-alt); border:1px solid var(--border); border-radius:8px;
    color:var(--text); padding:10px 12px; font-family:var(--sans); font-size:13px;
  }
  .row{display:flex; gap:12px; flex-wrap:wrap; margin-bottom:12px;}
  .row > div{flex:1; min-width:160px;}
  button.primary{background:var(--amber); color:var(--amber-text); border:none; border-radius:8px; padding:10px 18px; font-weight:700; font-size:13px; cursor:pointer; font-family:var(--sans);}
  button.primary:disabled{opacity:.5; cursor:default;}
  button.ghost{background:none; border:1px solid var(--border); color:var(--text); border-radius:8px; padding:9px 14px; font-size:12px; cursor:pointer; font-family:var(--sans);}
  button.ghost:hover{border-color:var(--amber);}
  button.small{padding:5px 10px; font-size:11px;}
  .danger-btn{border-color:var(--red); color:var(--red);}
  .foot-actions{display:flex; gap:10px; margin-top:14px; flex-wrap:wrap;}
  .note{font-size:12px; color:var(--text-dim); margin-top:10px; line-height:1.5;}
  .note.danger{color:var(--red);}
  .empty-state{color:var(--text-dim); font-size:13px; padding:20px 0; text-align:center;}
  .badge{display:inline-block; font-size:10px; padding:2px 7px; border-radius:20px; background:var(--panel-alt); border:1px solid var(--border); color:var(--text-dim); margin-right:6px;}

  .clock-banner{display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap;}
  .clock-banner .who{font-size:20px; font-weight:800;}
  .clock-banner .who .amber{color:var(--amber);}
  .clock-banner .pickno{font-family:var(--mono); color:var(--text-dim); font-size:13px;}

  .budget-strip{display:flex; gap:10px; overflow-x:auto; padding-bottom:4px;}
  .budget-chip{flex:0 0 auto; min-width:150px; background:var(--panel-alt); border:1px solid var(--border); border-radius:10px; padding:10px 12px;}
  .budget-chip.oc{border-color:var(--amber); box-shadow:0 0 0 1px var(--amber) inset;}
  .budget-chip .team{font-weight:700; font-size:13px; margin-bottom:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .budget-chip .amt{font-family:var(--mono); font-size:15px;}
  .budget-chip .amt.neg{color:var(--red);}
  .budget-chip .amt.pos{color:var(--teal);}
  .section-head-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px;}
  .section-head-row h2{margin:0;}
  .roster-strip{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;}
  .roster-chip{display:flex;align-items:center;gap:9px;flex:0 0 auto;min-width:150px;background:var(--panel-alt);border:1px solid var(--border);border-radius:10px;padding:8px 10px;}
  .roster-chip img{width:42px;height:42px;object-fit:contain;image-rendering:auto;}
  .roster-name{font-weight:700;font-size:13px;white-space:nowrap;}
  .roster-points{font-family:var(--mono);font-size:11px;color:var(--text-dim);margin-top:2px;}

  .pool-toolbar{display:flex; gap:10px; align-items:center; margin-bottom:12px; flex-wrap:wrap;}
  .pool-toolbar input{flex:1; min-width:200px;}
  .tier-block{margin-bottom:16px;}
  .tier-title{font-size:12px; font-weight:700; color:var(--amber); margin:0 0 8px; text-transform:uppercase; letter-spacing:.06em;}
  .mon-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px;}
  .mon-card{
    display:flex; flex-direction:column; align-items:center; gap:6px; padding:10px;
    border:1px solid var(--border); border-radius:10px; background:var(--panel-alt);
    cursor:pointer; text-align:center;
  }
  .mon-card:hover{border-color:var(--amber);}
  .mon-card.taken{opacity:.4; cursor:default;}
  .mon-card.taken:hover{border-color:var(--border);}
  .mon-card.view-only{cursor:default;}
  .mon-card.view-only:hover{border-color:var(--border);}
  .mon-card img{width:56px; height:56px; object-fit:contain; image-rendering:pixelated;}
  .mon-card .name{font-size:12px; font-weight:700;}
  .mon-card .pts{font-size:11px; color:var(--amber); font-family:var(--mono);}
  .mon-card .taken-to{font-size:10px; color:var(--text-dim);}

  .overlay{position:fixed; inset:0; background:rgba(6,9,14,.7); display:flex; align-items:center; justify-content:center; padding:20px; z-index:100;}
  .overlay-box{background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:20px; max-width:420px; width:100%;}
  .overlay-box h3{margin:0 0 4px; font-size:16px;}
  .overlay-box .pts{color:var(--amber); font-family:var(--mono); margin-bottom:14px;}

  .page-nav{position:fixed;top:14px;right:18px;z-index:1000;display:flex;align-items:center;gap:7px}
  .page-nav label{font-size:11px;color:var(--text-dim);font-weight:700}
  .page-nav select{font:inherit;font-size:12px;padding:7px 30px 7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--panel);color:var(--text);box-shadow:0 2px 8px rgba(0,0,0,.08)}
  .page-nav select:disabled{opacity:.45;cursor:not-allowed}
  .page-nav .lock-hint{font-size:10.5px;color:var(--text-dim);opacity:.85}
  @media(max-width:700px){.page-nav{top:8px;right:8px}.page-nav label{display:none}.page-nav .lock-hint{display:none}}
</style>

<style id="mobile-friendly-overrides">
/* Site-wide mobile usability pass */
html{overflow-x:hidden;-webkit-text-size-adjust:100%;}
body{overflow-x:hidden;max-width:100%;}
img,video,canvas,svg{max-width:100%;}
button,input,select,textarea{font:inherit;max-width:100%;}
button{touch-action:manipulation;}

@media (max-width: 700px){
  body{font-size:14px;}
  #app{width:100%;max-width:none;box-sizing:border-box;padding-left:12px !important;padding-right:12px !important;}
  header{padding-left:0 !important;padding-right:0 !important;}
  header h1,h1{font-size:clamp(22px,7vw,32px);line-height:1.12;overflow-wrap:anywhere;}
  h2{font-size:clamp(18px,5.5vw,24px);}
  h3{font-size:17px;}
  .sub,.note,.panel-desc{overflow-wrap:anywhere;}

  /* Public header navigation */
  .page-nav{max-width:100vw;box-sizing:border-box;}
  .page-nav a{min-height:36px;padding:8px 11px;font-size:12px;}
  .page-nav::-webkit-scrollbar{height:3px;}

  /* Admin's dropdown navigation */
  body[data-admin="true"] .page-nav{max-width:calc(100vw - 16px);}
  body[data-admin="true"] .page-nav select{max-width:calc(100vw - 32px);}

  /* Stacked controls instead of cramped horizontal rows */
  .toolbar,.toolbar-wide,.banner-controls,.section-head-row,.trade-tab-head,.summary-header,
  .franchise-header,.franchise-card-head,.team-card-head,.team-card-top,.speed-header,
  .replay-teams,.replay-row,.compare-team,.trade-filter-panel{max-width:100%;}
  .toolbar,.toolbar-wide,.banner-controls{flex-wrap:wrap !important;gap:8px !important;}
  .toolbar > *, .toolbar-wide > *, .banner-controls > *{min-width:0 !important;max-width:100%;}

  /* Form controls become comfortable touch targets */
  input:not([type="checkbox"]):not([type="radio"]),
  select,textarea{min-height:40px;box-sizing:border-box;}
  input:not([type="checkbox"]):not([type="radio"]),select,textarea{width:100%;}
  input[type="checkbox"],input[type="radio"]{width:auto;min-height:auto;}
  button{min-height:40px;}
  .foot-actions,.actions,.franchise-actions{flex-wrap:wrap !important;gap:8px !important;}
  .foot-actions button,.actions button,.franchise-actions button{flex:1 1 auto;}

  /* Panels/cards */
  .panel,.card,.budget-card,.trade-card,.pokemon-card,.mon-card,.opponent-card,.set-card,
  .franchise-card,.team-card,.commissioner-budget-card{min-width:0 !important;max-width:100%;box-sizing:border-box;}
  .panel{padding:14px !important;}
  .grid,.roster-grid,.roster-cards,.pokemon-grid,.team-card-grid,.franchise-cards,
  .comparison-grid,.conference-standings,.mon-grid,.theme-grid{grid-template-columns:1fr !important;}
  .trade-cols,.trade-column-grid,.profile-two-col,.summary-grid,.record-grid{grid-template-columns:1fr !important;}
  .pick-grid{grid-template-columns:repeat(2,minmax(0,1fr)) !important;}
  .theme-grid{grid-template-columns:repeat(2,minmax(0,1fr)) !important;}

  /* Don't let long Pokémon/team names force horizontal scrolling */
  .pokemon-name,.team-name,.team-card-name,.standings-team-name,.pick-card-name,
  .mon-name,.opponent-name,.compare-team-name{overflow-wrap:anywhere;word-break:break-word;}

  /* Tables: preserve all columns, allow deliberate horizontal swipe */
  table{max-width:none;}
  .table-wrap,.franchise-table-wrap,#globalTable,#pokemonSearchTable,.player-table-wrap,
  .speed-table,.type-count-table{width:100%;max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .table-wrap table,.franchise-table-wrap table,#globalTable table,#pokemonSearchTable table,
  .player-table-wrap table,.speed-table table,.type-count-table table{min-width:max-content;}
  th,td{white-space:nowrap;}

  /* Modals fit inside a phone viewport */
  .modal,.modalbox,.overview-modal,.replay-summary-box,.pokemon-modal,.audit-modal,
  .modal-content{width:calc(100vw - 20px) !important;max-width:calc(100vw - 20px) !important;
    max-height:calc(100vh - 24px);box-sizing:border-box;}
  .modal-body,.pokemon-modal-body{overflow:auto;max-height:calc(100vh - 150px);}

  /* Stat/analysis rows stack cleanly */
  .gf-row{max-width:100%;}
  .death-cause-entry{max-width:100%;box-sizing:border-box;}
  .statbox{min-width:0 !important;}
  .speed-row{min-width:560px;}

  /* Draft / admin tab bars can scroll rather than squish buttons */
  .tabs{max-width:100%;overflow-x:auto;flex-wrap:nowrap !important;-webkit-overflow-scrolling:touch;}
  .tabs button{flex:0 0 auto;white-space:nowrap;}

  /* Make auth/login cards comfortable */
  #adminAuth,.gate{width:100%;max-width:420px;box-sizing:border-box;margin-left:auto;margin-right:auto;}
}

@media (max-width: 480px){
  #app{padding-left:9px !important;padding-right:9px !important;}
  .page-nav a{padding:7px 10px;font-size:11px;}
  .panel{padding:12px !important;}
  .pick-grid{grid-template-columns:repeat(2,minmax(0,1fr)) !important;}
  .theme-grid{grid-template-columns:1fr 1fr !important;}
  .sprite{max-width:44px;}
  .pokemon-head .sprite,.team-card-top-sprite{width:56px !important;height:56px !important;}
  .foot-actions button,.actions button,.franchise-actions button{width:100%;flex-basis:100%;}
  .section-head-row{align-items:flex-start !important;}
}
</style>

<body>

<div id="app" style="display:none">
  <header>
    <h1>Draft Room</h1>
    <div class="sub"><span id="draftSubText">Live draft board.</span> <span id="seasonLabel" class="badge">Current season</span></div>
  </header>
  <div id="content"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
  const SUPABASE_URL = 'https://dfxdkkemltukxaklhcpo.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_H7iIBiJTxY77lBAcpJn2VQ_u2hAG2CN';
  const SUPABASE_STATE_ID = '__dashboard_state__';
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  let adminUser = null;
  let STATE = { teamMap:{}, settings:{ rosters:{}, draft:null } };
  let PROFILES = [];
  let loaded = false;
  let poolFilter = '';
  let poolTypeFilter = 'all';
  let isCommissioner = false;
  let myTeamName = null;
  const contentEl = document.getElementById('content');

  const esc = s => String(s ?? '').replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));

  function requireAdmin(){ if(!isCommissioner) throw new Error('Only commissioners can make draft picks.'); }

  function defaultDraftState(){
    return { status:'setup', mode:'manual', defaultBudget:120, budgets:{}, pool:[], order:[], currentPick:0, picks:[], updatedAt:null };
  }
  function normalizeDraftState(draft){
    const d = Object.assign(defaultDraftState(), draft || {});
    d.budgets = d.budgets && typeof d.budgets === 'object' ? d.budgets : {};
    d.pool = Array.isArray(d.pool) ? d.pool.map(m => ({
      id: String(m?.id ?? ''), name: String(m?.name ?? '').trim(), points: Number(m?.points) || 0,
      types: Array.isArray(m?.types) ? m.types.map(t => String(t).trim()).filter(Boolean) : [],
      drafted: !!m?.drafted, draftedBy: m?.draftedBy || null, pickNumber: m?.pickNumber ?? null
    })).filter(m => m.id && m.name) : [];
    d.order = Array.isArray(d.order) ? d.order.map(String) : [];
    d.picks = Array.isArray(d.picks) ? d.picks : [];
    d.currentPick = Number.isFinite(Number(d.currentPick)) ? Number(d.currentPick) : 0;
    if(d.status !== 'live' && d.status !== 'complete') d.status = 'setup';
    if(d.mode !== 'ordered') d.mode = 'manual';
    return d;
  }
  function normalizeStoredRosters(rosters){
    const out = {};
    for(const [team, list] of Object.entries(rosters || {})){
      out[team] = (Array.isArray(list) ? list : []).map(mon => typeof mon === 'string'
        ? {name:mon, points:null}
        : {name:String(mon?.name ?? ''), points:mon?.points ?? null}
      ).filter(mon => mon.name);
    }
    return out;
  }

  async function loadState(){
    const [{data, error}, {data:profilesData, error:profErr}] = await Promise.all([
      supabase.from('replays').select('replay_id,replay_data').eq('replay_id', SUPABASE_STATE_ID).maybeSingle(),
      supabase.from('profiles').select('id,team_name,status').eq('status','approved')
    ]);
    if(error) throw error;
    if(profErr) throw profErr;
    const shared = data?.replay_data || {};
    STATE.teamMap = shared.teamMap || {};
    STATE.settings = Object.assign({rosters:{}}, shared.settings || {});
    STATE.settings.rosters = normalizeStoredRosters(STATE.settings.rosters);
    STATE.settings.draft = normalizeDraftState(STATE.settings.draft);
    const seasonLabel=document.getElementById('seasonLabel'); if(seasonLabel) seasonLabel.textContent=STATE.settings.activeSeason || 'Current season';
    PROFILES = (profilesData || []).filter(p => p.team_name);
    loaded = true;
  }

  async function saveSharedState(){
    requireAdmin();
    const {error} = await supabase.from('replays').upsert([{
      replay_id: SUPABASE_STATE_ID,
      replay_data: {teamMap: STATE.teamMap, settings: STATE.settings},
      updated_at: new Date().toISOString()
    }], {onConflict:'replay_id'});
    if(error) throw error;
  }
  async function savePublishedRosters(){
    requireAdmin();
    const {error} = await supabase.from('replays').upsert([{
      replay_id: '__rosters__',
      replay_data: {rosters: STATE.settings.rosters},
      updated_at: new Date().toISOString()
    }], {onConflict:'replay_id'});
    if(error) throw error;
  }
  async function persist(){
    await saveSharedState();
    await savePublishedRosters();
  }

  function franchises(){
    const fromProfiles = PROFILES.map(p => p.team_name);
    const fromOrder = STATE.settings.draft.order || [];
    return [...new Set([...fromProfiles, ...fromOrder])].sort();
  }
  function draftBudget(team){
    const d = STATE.settings.draft;
    const b = d.budgets[team];
    return Number.isFinite(Number(b)) ? Number(b) : Number(d.defaultBudget) || 0;
  }
  function draftSpent(team){
    return STATE.settings.draft.picks.filter(p => p.team === team).reduce((s,p) => s + (Number(p.points) || 0), 0);
  }
  function currentTeam(){
    const d = STATE.settings.draft;
    if(d.mode !== 'ordered') return null;
    return d.order[d.currentPick] || null;
  }

  // ---------- sprites ----------
  // Pokémon Showdown sprite filenames don't always match the names
  // used in the league draft list. Resolve the common competitive
  // / alternate-form names here, then let the <img> element try each
  // candidate until one actually loads.
  const SPRITE_ALIASES = {
    'aegislash':'aegislash-shield',
    'darmanitan':'darmanitan',
    'darmanitan-galar':'darmanitan-galar',
    'darmanitan-galar-zen':'darmanitan-galar-zen',
    'terapagos-middle':'terapagos-terastal',
    'terapagos':'terapagos',
    'keldeo':'keldeo-ordinary',
    'zygarde':'zygarde-50',
    'mimikyu':'mimikyu',
    'meloetta':'meloetta-aria',
    'shaymin':'shaymin-land',
    'maushold':'maushold-four',
    'maushold-four':'maushold-four',
    'maushold-three':'maushold-three',
    'tauros-paldea-combat':'tauros-paldea-combat',
    'tauros-paldea-blaze':'tauros-paldea-blaze',
    'tauros-paldea-aqua':'tauros-paldea-aqua',
    'toxtricity':'toxtricity-amped',
    'toxtricity-amped':'toxtricity-amped',
    'toxtricity-low-key':'toxtricity-low-key',
    'dudunsparce':'dudunsparce-two-segment',
    'oricorio':'oricorio-baile',
    'oricorio-baile':'oricorio-baile',
    'oricorio-pom-pom':'oricorio-pom-pom',
    'oricorio-pau':'oricorio-pau',
    'oricorio-sensu':'oricorio-sensu',
    'minior':'minior-red-meteor',
    'tatsugiri':'tatsugiri-curly',
    'wishiwashi':'wishiwashi-solo',
    'eiscue':'eiscue-ice',
    'morpeko':'morpeko-full-belly',
    'squawkabilly-b':'squawkabilly-blue',
    'squawkabilly-w':'squawkabilly-white',
    'squawkabilly-y':'squawkabilly-yellow',
    'squawkabilly-g':'squawkabilly-green',
    'ogerpon':'ogerpon',
    'ogerpon-teal':'ogerpon',
    'ogerpon-hearthflame':'ogerpon-hearthflame',
    'ogerpon-wellspring':'ogerpon-wellspring',
    'ogerpon-cornerstone':'ogerpon-cornerstone',
    'palafin':'palafin-zero',
    'palafin-hero':'palafin-hero',
    'basculegion':'basculegion-male',
    'basculegion-m':'basculegion-male',
    'basculegion-f':'basculegion-female',
    'indeedee-m':'indeedee-male',
    'indeedee-f':'indeedee-female',
    'meowstic-m':'meowstic-male',
    'meowstic-f':'meowstic-female',
    'frillish-m':'frillish',
    'frillish-f':'frillish',
    'jellicent-m':'jellicent',
    'jellicent-f':'jellicent',
    'indeedee-male':'indeedee-male',
    'indeedee-female':'indeedee-female'
  };

  function spriteKey(name){
    return String(name || '')
      .trim().toLowerCase()
      .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
      .replace(/[’']/g,'')
      .replace(/[♀]/g,'-f')
      .replace(/[♂]/g,'-m')
      .replace(/[_\s]+/g,'-')
      .replace(/[^a-z0-9-]/g,'')
      .replace(/-+/g,'-')
      .replace(/^-|-$/g,'');
  }

  function spriteCandidates(name){
    const key = spriteKey(name);
    const candidates = [];
    const add = id => {
      if(id && !candidates.includes(id)) candidates.push(id);
    };

    add(SPRITE_ALIASES[key]);
    add(key);

    // Common form-name variants.
    if(key.endsWith('-galar')) add(key);
    if(key.endsWith('-hisui')) add(key);
    if(key.endsWith('-alola')) add(key);
    if(key.endsWith('-paldea')) add(key);

    // For league shorthand forms, fall back to the base Pokémon rather
    // than displaying a broken image.
    const base = key
      .replace(/-paldea-(combat|blaze|aqua)$/,'')
      .replace(/-galar(?:-zen)?$/,'')
      .replace(/-hisui$/,'')
      .replace(/-alola$/,'')
      .replace(/-hearthflame$/,'')
      .replace(/-wellspring$/,'')
      .replace(/-cornerstone$/,'');
    add(base);

    return candidates;
  }

  function spriteUrl(name, index=0){
    const candidates = spriteCandidates(name);
    const slug = candidates[index] || candidates[0] || '';
    return `https://play.pokemonshowdown.com/sprites/gen5/${slug}.png`;
  }

  function spriteFallback(img, name){
    const next = Number(img.dataset.spriteAttempt || 0) + 1;
    const candidates = spriteCandidates(name);

    if(next < candidates.length){
      img.dataset.spriteAttempt = String(next);
      img.src = spriteUrl(name, next);
      return;
    }

    // Last resort: use a generic base sprite from Showdown's gen5 set
    // if a form-specific sprite isn't available.
    if(!img.dataset.spriteGeneric){
      img.dataset.spriteGeneric = '1';
      img.src = 'https://play.pokemonshowdown.com/sprites/gen5/substitute.png';
      return;
    }

    img.style.opacity = '0';
  }

  // ---------- pick flow ----------
  async function makePick(mon, team){
    requireAdmin();
    const d = STATE.settings.draft;
    mon.drafted = true;
    mon.draftedBy = team;
    mon.pickNumber = d.picks.length + 1;
    d.picks.push({poolId: mon.id, name: mon.name, points: mon.points, team, pickNumber: mon.pickNumber, ts: new Date().toISOString()});
    STATE.settings.rosters[team] = STATE.settings.rosters[team] || [];
    STATE.settings.rosters[team].push({name: mon.name, points: mon.points});
    if(d.mode === 'ordered'){
      d.currentPick += 1;
      if(d.currentPick >= d.order.length) d.status = 'complete';
    }
    d.updatedAt = new Date().toISOString();
    await persist();
  }

  async function undoLastPick(){
    requireAdmin();
    const d = STATE.settings.draft;
    const last = d.picks.pop();
    if(!last) return;
    const mon = d.pool.find(m => m.id === last.poolId);
    if(mon){ mon.drafted = false; mon.draftedBy = null; mon.pickNumber = null; }
    const list = STATE.settings.rosters[last.team] || [];
    const idx = [...list].reverse().findIndex(m => m.name === last.name && m.points === last.points);
    if(idx >= 0) list.splice(list.length - 1 - idx, 1);
    if(d.mode === 'ordered' && d.currentPick > 0) d.currentPick -= 1;
    if(d.status === 'complete') d.status = 'live';
    d.updatedAt = new Date().toISOString();
    await persist();
  }

  // ---------- render ----------
  function updatePoolFilter(){
    const query = String(poolFilter || '').trim().toLowerCase();

    document.querySelectorAll('.tier-block').forEach(tier => {
      let anyVisible = false;

      tier.querySelectorAll('.mon-card').forEach(card => {
        const name = String(card.querySelector('.name')?.textContent || '').toLowerCase();
        const visible = !query || name.includes(query);
        card.style.display = visible ? '' : 'none';
        if(visible) anyVisible = true;
      });

      tier.style.display = anyVisible ? '' : 'none';
    });
  }

  function render(){
    if(!loaded){ contentEl.innerHTML = `<div class="empty-state">Loading…</div>`; return; }
    const d = STATE.settings.draft;

    if(d.status === 'setup'){
      contentEl.innerHTML = `<div class="panel">
        <h2>Draft not started</h2>
        <div class="note">Set up the draft board, budgets, and order in the Admin Dashboard's Draft tab, then start the draft from there.</div>
        ${isCommissioner ? `<div class="foot-actions"><a class="ghost" href="admin.html" style="text-decoration:none;display:inline-flex;align-items:center;">Go to Admin Dashboard ↗</a></div>` : ''}
      </div>`;
      return;
    }

    const teams = franchises();
    const oc = currentTeam();
    const rosterTeam = isCommissioner ? (oc || teams[0] || null) : myTeamName;
    const currentRoster = rosterTeam ? (STATE.settings.rosters[rosterTeam] || []) : [];
    const availableTypes = [...new Set(d.pool.flatMap(m => m.types || []))].sort((a,b) => a.localeCompare(b));
    const filtered = d.pool.filter(m => {
      const matchesSearch = !poolFilter || m.name.toLowerCase().includes(poolFilter.toLowerCase());
      const matchesType = poolTypeFilter === 'all' || (m.types || []).some(t => t.toLowerCase() === poolTypeFilter.toLowerCase());
      return matchesSearch && matchesType;
    });
    const groups = {};
    filtered.forEach(m => { (groups[m.points] ??= []).push(m); });
    const tiers = Object.keys(groups).map(Number).sort((a,b) => b - a);

    contentEl.innerHTML = `
      <div class="panel">
        <div class="clock-banner">
          <div>
            ${d.status === 'complete'
              ? `<div class="who">Draft complete</div>`
              : d.mode === 'ordered'
                ? `<div class="who">Current Pick: <span class="amber">${oc ? esc(oc) : '—'}</span></div><div class="pickno">Pick #${d.currentPick + 1} of ${d.order.length}</div>`
                : `<div class="who">Current Pick: <span class="amber">Manual</span></div><div class="pickno">Pick a Pokémon, then choose the franchise</div>`}
          </div>
          <div class="foot-actions" style="margin-top:0">
            ${isCommissioner && d.picks.length ? `<button class="ghost danger-btn" id="undoBtn">Undo last pick</button>` : ''}
            ${isCommissioner ? `<a class="ghost" href="admin.html" style="text-decoration:none;display:inline-flex;align-items:center;">Draft setup ↗</a>` : ''}
          </div>
        </div>
      </div>

      ${rosterTeam ? `
      <div class="panel">
        <div class="section-head-row">
          <h2>${isCommissioner ? 'Current roster' : 'My roster'}</h2>
          <span class="badge">${esc(rosterTeam)}</span>
        </div>
        ${currentRoster.length ? `
          <div class="roster-strip">
            ${currentRoster.map(mon => `
              <div class="roster-chip">
                <img src="${spriteUrl(mon.name)}" alt="${esc(mon.name)}" loading="lazy" data-sprite-attempt="0" onerror="spriteFallback(this, '${esc(mon.name).replace("'","\\'")}')">
                <div>
                  <div class="roster-name">${esc(mon.name)}</div>
                  ${mon.points != null ? `<div class="roster-points">${Number(mon.points) || 0} pts</div>` : ''}
                </div>
              </div>`).join('')}
          </div>
        ` : `<div class="empty-state">No Pokémon drafted yet.</div>`}
      </div>` : ''}

      <div class="panel">
        <h2>${isCommissioner ? 'Budgets' : 'My budget'}</h2>
        <div class="budget-strip">
          ${(() => {
            const budgetTeams = isCommissioner ? teams : (myTeamName ? [myTeamName] : []);
            return budgetTeams.length ? budgetTeams.map(t => {
              const spent = draftSpent(t), budget = draftBudget(t), remain = budget - spent;
              return `<div class="budget-chip ${t === oc ? 'oc' : ''}">
                <div class="team">${esc(t)}</div>
                <div class="amt ${remain < 0 ? 'neg' : 'pos'}">${remain} / ${budget} pts</div>
              </div>`;
            }).join('') : '<div class="empty-state">No franchise assigned.</div>';
          })()}
        </div>
      </div>

      <div class="panel">
        <h2>Draft board</h2>
        <div class="pool-toolbar">
          <input type="text" id="poolSearch" placeholder="Search Pokémon…" value="${esc(poolFilter)}">
          <select id="poolTypeFilter" style="max-width:180px">
            <option value="all">All Types</option>
            ${availableTypes.map(type => `<option value="${esc(type)}" ${poolTypeFilter.toLowerCase() === type.toLowerCase() ? 'selected' : ''}>${esc(type)}</option>`).join('')}
          </select>
          <span class="badge">${d.pool.filter(m=>!m.drafted).length} available</span>
          <span class="badge">${d.pool.filter(m=>m.drafted).length} drafted</span>
        </div>
        ${tiers.length ? tiers.map(pts => `
          <div class="tier-block">
            <div class="tier-title">${pts} points</div>
            <div class="mon-grid">
              ${groups[pts].sort((a,b)=>a.name.localeCompare(b.name)).map(m => `
                <div class="mon-card ${m.drafted ? 'taken' : ''} ${!isCommissioner ? 'view-only' : ''}" ${m.drafted || !isCommissioner ? '' : `data-pick="${esc(m.id)}"`}>
                  <img src="${spriteUrl(m.name)}" alt="${esc(m.name)}" loading="lazy" data-sprite-attempt="0" onerror="spriteFallback(this, '${esc(m.name).replace("'","\\'")}')">
                  <div class="name">${esc(m.name)}</div>
                  <div class="pts">${m.points} pts</div>
                  ${m.types?.length ? `<div class="note" style="margin:0;font-size:10px">${m.types.map(esc).join(' / ')}</div>` : ''}
                  ${m.drafted ? `<div class="taken-to">→ ${esc(m.draftedBy || '')}</div>` : ''}
                </div>`).join('')}
            </div>
          </div>`).join('') : '<div class="empty-state">No Pokémon match your search.</div>'}
      </div>
    `;

    document.getElementById('undoBtn')?.addEventListener('click', async () => {
      if(!confirm('Undo the most recent pick? This removes it from the board, budgets, and the roster.')) return;
      try{ await undoLastPick(); render(); }
      catch(e){ alert(e.message); }
    });
    document.getElementById('poolSearch')?.addEventListener('input', (e) => {
      // Keep the existing input element alive while filtering. Re-rendering
      // here replaces the input DOM node and resets the caret, which makes
      // normal typing appear backwards.
      poolFilter = e.target.value;
      updatePoolFilter();
    });
    document.getElementById('poolTypeFilter')?.addEventListener('change', (e) => {
      poolTypeFilter = e.target.value;
      render();
    });
    contentEl.querySelectorAll('[data-pick]').forEach(card => {
      card.addEventListener('click', () => openPickModal(card.dataset.pick));
    });
  }

  function openPickModal(monId){
    const d = STATE.settings.draft;
    const mon = d.pool.find(m => m.id === monId);
    if(!mon || mon.drafted) return;
    const teams = franchises();
    const oc = currentTeam();
    const overlay = document.createElement('div');
    overlay.className = 'overlay';
    overlay.innerHTML = `<div class="overlay-box">
      <h3>${esc(mon.name)}</h3>
      <div class="pts">${mon.points} points</div>
      <label>Assign to franchise</label>
      <select id="pickTeamSelect">
        ${teams.map(t => `<option value="${esc(t)}" ${t === oc ? 'selected' : ''}>${esc(t)}${t===oc?' (on the clock)':''}</option>`).join('')}
      </select>
      <div class="note" id="pickBudgetNote"></div>
      <div class="foot-actions">
        <button class="primary" id="confirmPickBtn">Confirm pick</button>
        <button class="ghost" id="cancelPickBtn">Cancel</button>
      </div>
      <div class="note danger" id="pickErr"></div>
    </div>`;
    document.body.appendChild(overlay);

    const sel = overlay.querySelector('#pickTeamSelect');
    const note = overlay.querySelector('#pickBudgetNote');
    function updateNote(){
      const t = sel.value;
      const remain = draftBudget(t) - draftSpent(t);
      note.textContent = `${t} has ${remain} pts remaining before this pick.` + (remain - mon.points < 0 ? ' This pick would put them over budget.' : '');
      note.className = 'note' + (remain - mon.points < 0 ? ' danger' : '');
    }
    sel?.addEventListener('change', updateNote);
    updateNote();

    overlay.querySelector('#cancelPickBtn').addEventListener('click', () => overlay.remove());
    overlay.addEventListener('click', (e) => { if(e.target === overlay) overlay.remove(); });
    overlay.querySelector('#confirmPickBtn').addEventListener('click', async () => {
      const err = overlay.querySelector('#pickErr');
      const team = sel.value;
      if(!team){ err.textContent = 'Choose a franchise.'; return; }
      try{
        await makePick(mon, team);
        overlay.remove();
        render();
      }catch(e){ err.textContent = e.message; }
    });
  }

  // ---------- auth ----------
  function showAdminError(msg){
    let el = document.getElementById('adminError');
    if(!el){
      el = document.createElement('div');
      el.id = 'adminError';
      el.style.cssText = 'position:fixed;top:12px;right:12px;z-index:1000;max-width:420px;padding:10px 14px;border:1px solid var(--red);border-radius:8px;background:var(--panel);color:var(--red);font-size:12px;';
      document.body.appendChild(el);
    }
    el.textContent = msg;
    el.style.display = 'block';
  }
  function showAdminLogin(){
    // Not logged in (or no assigned team) — bounce to the login page instead of
    // rendering an inline form here.
    location.replace('index.html');
    return;
  }
  async function initAuth(){
    const {data, error} = await supabase.auth.getSession();
    if(error) throw error;
    if(!data.session){
      showAdminLogin();
      return false;
    }
    const {data:profile, error:profErr} = await supabase.from('profiles').select('team_name,is_commissioner').eq('id', data.session.user.id).maybeSingle();
    if(profErr) throw profErr;
    if(!profile?.team_name){
      // Logged in but hasn't claimed/been assigned a team yet — no access to the
      // rest of the site until that's done from the login page.
      showAdminLogin();
      return false;
    }
    adminUser = data.session.user;
    myTeamName = profile.team_name;
    isCommissioner = profile.is_commissioner === true;
    const sub = document.getElementById('draftSubText');
    if(sub) sub.textContent = isCommissioner ? 'Make picks live. Every pick updates budgets and published rosters immediately.' : 'Live draft board. Search and filter Pokémon by type; drafting is commissioner-only.';
    document.getElementById('app').style.display = '';
    return true;
  }

  (async function init(){
    try{
      const authed = await initAuth();
      if(!authed) return;
      await loadState();
      render();
    }catch(e){
      console.error(e);
      showAdminError('Could not start the Draft Room: ' + e.message);
    }
  })();
})();
</script>
</body>
</html>
